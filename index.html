ar de forma unívoca, datos relativos a la salud, a la vida sexual o a la orientación sexual — su tratamiento está prohibido en principio, con excepciones tasadas (consentimiento explícito, obligaciones del orden laboral y de la Seguridad Social, intereses vitales, fines de salud pública, etc.). <strong>Datos de menores</strong>: el tratamiento basado en el consentimiento en servicios de la sociedad de la información solo es lícito si el menor es mayor de 14 años (art. 8 RGPD, desarrollado por el art. 7 LOPDGDD); por debajo de esa edad, el consentimiento corresponde a los titulares de la patria potestad.</p>\n<h3 id=\"principios-del-tratamiento-art-5-rgpd\">Principios del tratamiento (art. 5 RGPD)</h3>\n<p>Licitud, lealtad y transparencia; limitación de la finalidad; minimización de datos (adecuados, pertinentes y limitados a lo necesario); exactitud; limitación del plazo de conservación; integridad y confidencialidad; y responsabilidad proactiva (accountability): el responsable debe poder demostrar el cumplimiento. <strong>Bases de licitud del tratamiento (art. 6 RGPD)</strong>: consentimiento del interesado, ejecución de un contrato, cumplimiento de una obligación legal, protección de intereses vitales, cumplimiento de una misión realizada en interés público o en el ejercicio de poderes públicos (base habitual de las Administraciones Públicas) e interés legítimo del responsable.</p>\n<h3 id=\"derechos-de-los-interesados-arts-15-22-rgpd-título-iii-lopdgdd\">Derechos de los interesados (arts. 15-22 RGPD, Título III LOPDGDD)</h3>\n<p>Derecho de acceso (art. 15), rectificación (art. 16), supresión o \"derecho al olvido\" (art. 17), limitación del tratamiento (art. 18), portabilidad (art. 20), oposición (art. 21) y derecho a no ser objeto de decisiones basadas únicamente en el tratamiento automatizado, incluida la elaboración de perfiles (art. 22). Plazo general de respuesta: 1 mes desde la recepción de la solicitud, prorrogable 2 meses más en casos complejos (art. 12.3 RGPD). En España se añaden: derecho a la supresión en redes sociales y servicios equivalentes (art. 85 LOPDGDD), derecho al olvido en búsquedas de internet (art. 93 LOPDGDD) y en redes sociales (art. 94 LOPDGDD).</p>\n<h3 id=\"obligaciones-del-responsable-y-del-encargado\">Obligaciones del responsable y del encargado</h3>\n<ul>\n<li><strong>Registro de actividades de tratamiento</strong> (art. 30 RGPD), con excepción para empresas de menos de 250 trabajadores salvo que el tratamiento sea ocasional, afecte a categorías especiales o pueda afectar a los derechos y libertades de los interesados.</li>\n<li><strong>Evaluación de impacto relativa a la protección de datos</strong> (EIPD) cuando el tratamiento entrañe alto riesgo (art. 35 RGPD).</li>\n<li><strong>Delegado de Protección de Datos (DPO/DPD)</strong>: obligatorio para autoridades y organismos públicos (art. 37.1.a RGPD y art. 34 LOPDGDD, que lo extiende a colegios profesionales, universidades, entidades que traten datos a gran escala, etc.).</li>\n<li><strong>Notificación de violaciones de seguridad</strong> a la autoridad de control en el plazo de 72 horas (art. 33 RGPD) y comunicación a los interesados cuando la violación entrañe un alto riesgo (art. 34).</li>\n<li><strong>Privacidad desde el diseño y por defecto</strong> (art. 25 RGPD): protección de datos incorporada en el diseño de los tratamientos y limitada por defecto.</li>\n<li><strong>Encargado del tratamiento</strong> (art. 28 RGPD): solo trata conforme a instrucciones documentadas del responsable y bajo un contrato u otro acto jurídico.</li>\n</ul>\n<h3 id=\"régimen-sancionador\">Régimen sancionador</h3>\n<p>El RGPD (art. 83) distingue dos escalones: sanciones de hasta 10 millones de euros o el 2% del volumen de negocio anual (art. 83.4) y de hasta 20 millones o el 4% (art. 83.5, para vulneración de los principios, los derechos de los interesados o las transferencias internacionales). La LOPDGDD (arts. 70-76) tipifica las infracciones como muy graves, graves y leves (con cuantías propias: hasta 20 M€ o el 4% las muy graves; hasta 2 M€ o el 2% las graves; hasta 40.000 € las leves) y fija la prescripción: las infracciones muy graves prescriben a los 3 años, las graves a los 2 años y las leves al año. La autoridad de control estatal es la <strong>Agencia Española de Protección de Datos (AEPD)</strong>, autoridad administrativa independiente que se relaciona con el Gobierno a través del Ministerio de Justicia (art. 44 LOPDGDD), con funciones de control, asesoramiento, resolución de reclamaciones y potestad sancionadora.</p>\n<h3 id=\"derechos-digitales-título-x-lopdgdd-arts-79-97\">Derechos digitales (Título X LOPDGDD, arts. 79-97)</h3>\n<p>El Título X (\"Garantía de los derechos digitales\") reconoce, en el marco de la Constitución y del RGPD, los siguientes derechos, entre otros: derecho a la neutralidad de Internet (art. 80); derecho al acceso universal a Internet (art. 81); derecho a la seguridad digital (art. 82); derecho a la educación digital (art. 83); protección de los menores en Internet (art. 84); derecho a la supresión en redes sociales y servicios equivalentes (art. 85); derecho a la intimidad frente al uso de dispositivos de videovigilancia y de grabación de sonidos en el lugar de trabajo (art. 86); derecho a la intimidad ante la utilización de sistemas de geolocalización en el ámbito laboral (art. 87); derecho a la desconexión digital en el ámbito laboral (art. 88); derecho a la conciliación y a los derechos digitales en el trabajo a distancia (art. 89); derecho al olvido en búsquedas de internet (art. 93) y en redes sociales (art. 94); y derecho al testamento digital (art. 96), que permite designar un albacea digital para decidir sobre el destino de los datos y contenidos tras el fallecimiento.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>RGPD aplicable desde el 25 de mayo de 2018</strong> (no desde 2016, año de publicación del Reglamento). La LOPDGDD, de 5 de diciembre de 2018, deroga la LO 15/1999.</li>\n<li><strong>Edad de consentimiento digital en España: 14 años</strong> (art. 7 LOPDGDD).</li>\n<li><strong>Plazo de respuesta a los derechos: 1 mes + 2 meses de prórroga</strong> (no 10 ni 15 días).</li>\n<li><strong>Notificación de brechas: 72 horas</strong> ante la autoridad de control (no 24 horas).</li>\n<li><strong>Sanciones RGPD</strong>: 20 M€ o 4% (art. 83.5) / 10 M€ o 2% (art. 83.4); la LOPDGDD añade las infracciones leves (hasta 40.000 €).</li>\n<li><strong>DPO obligatorio en todas las Administraciones Públicas</strong> (art. 34 LOPDGDD).</li>\n<li><strong>Derechos digitales</strong>: desconexión digital, art. 88; videovigilancia en el trabajo, art. 86; geolocalización, art. 87; testamento digital, art. 96.</li>\n<li><strong>Categorías especiales (art. 9 RGPD)</strong>: prohibidas con excepciones tasadas; no confundir con los datos meramente identificativos.</li>\n</ul>\n"}, {"num": 8, "title": "Acceso electrónico a los servicios públicos. Gestión electrónica de procedimientos. ENS y ENI.", "html": "<h3 id=\"marco-normativo\">Marco normativo</h3>\n<p>La Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP) y la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público (LRJSP) sustituyeron a la Ley 30/1992 (LRJPAC) y a la Ley 11/2007, de acceso electrónico de los ciudadanos a los servicios públicos, consagrando la tramitación electrónica como la actuación habitual de las Administraciones. La LPACAP entró en vigor el 2 de octubre de 2016; las previsiones relativas a registro electrónico de apoderamientos, registro electrónico, registro de empleados públicos habilitados, punto de acceso general electrónico y archivo electrónico único produjeron efectos a los dos años, el 2 de octubre de 2018 (DA 9ª). El desarrollo reglamentario común es el RD 203/2021, de 30 de marzo, por el que se aprueba el Reglamento de actuación y funcionamiento del sector público por medios electrónicos.</p>\n<h3 id=\"derechos-de-las-personas-arts-13-y-53-lpacap\">Derechos de las personas (arts. 13 y 53 LPACAP)</h3>\n<p>Derecho a comunicarse con las Administraciones por medios electrónicos, a la asistencia en el uso de los mismos, a obtener copias, a conocer el estado de tramitación de los procedimientos, a no presentar datos y documentos que ya obren en poder de las Administraciones (art. 28.2: se verifican por medios electrónicos, salvo oposición expresa del interesado) y a no presentar documentos originales salvo excepciones legales (copias auténticas, art. 27).</p>\n<h3 id=\"registros-art-16-lpacap\">Registros (art. 16 LPACAP)</h3>\n<p>Cada Administración dispone de un Registro Electrónico General (y registros electrónicos de cada organismo, plenamente interoperables), que permite presentar documentos todos los días del año durante las 24 horas, emitiendo automáticamente un recibo acreditativo con número de registro, fecha y hora de presentación, con validez de justificante (art. 16.3). La presentación en un día inhábil a efectos de cómputo se entiende realizada en la primera hora del primer día hábil siguiente (art. 31.2). Se admite la presentación presencial en las oficinas de asistencia en materia de registros, con digitalización del documento y remisión al registro electrónico, devolviéndose el original al interesado. Completamente el sistema: Registro Electrónico de Apoderamientos (art. 6 LPACAP, para otorgar y revocar poderes de representación) y Registro de Empleados Públicos Habilitados (para la asistencia en el uso de medios electrónicos, desarrollado en el RD 203/2021).</p>\n<h3 id=\"notificaciones-arts-40-46-lpacap\">Notificaciones (arts. 40-46 LPACAP)</h3>\n<p>Las notificaciones se practican preferentemente por medios electrónicos y son obligatorias por esta vía para las personas jurídicas, las entidades sin personalidad jurídica, quienes ejerzan una actividad profesional para la que se requiera colegiación obligatoria y los empleados públicos en actuaciones derivadas de su condición (art. 14.2). Se practican mediante comparecencia en la sede electrónica de la Administración, a través de la Dirección Electrónica Habilitada única (DEHú) o por ambos sistemas (art. 41.2). Se entienden practicadas en el momento del acceso a su contenido; transcurridos 10 días naturales desde su puesta a disposición sin que se acceda, se entiende rechazada (arts. 41.5 y 43), salvo que el interesado acredite la imposibilidad técnica de acceso (art. 41.5). La notificación en papel se practica en el domicilio del interesado, con el régimen de rechazo del art. 42.2.</p>\n<h3 id=\"plazos-silencio-y-actos\">Plazos, silencio y actos</h3>\n<p>Plazo máximo de resolución: 3 meses si la norma reguladora no fija otro (art. 21.3 LPACAP). Silencio administrativo (art. 24): regla general positiva (estimatorio) en los procedimientos iniciados a solicitud del interesado, con excepciones en las que el silencio es desestimatorio (ejercicio de derechos frente a la Administración, obtención de facultades contra el ordenamiento, ejercicio del derecho de petición del art. 29 CE, etc.); en los procedimientos iniciados de oficio, el vencimiento del plazo produce la caducidad (art. 25). La obligación de resolver y notificar es una obligación legal (art. 21), con responsabilidad por incumplimiento y la posibilidad de denuncia de mora (art. 29).</p>\n<p><strong>Acto administrativo.</strong> Requisitos (arts. 34-36: contenido y motivación — art. 35 para los actos que limiten derechos —, forma escrita o electrónica); eficacia (art. 39) y notificación (art. 40). Nulidad de pleno derecho (art. 47: actos que lesionen los derechos y libertades fundamentales, dictados por órgano manifiestamente incompetente, de contenido imposible, dictados prescindiendo total y absolutamente del procedimiento, etc.) y anulabilidad (art. 48); convalidación (art. 52) y revisión de oficio (arts. 106-110). Recursos: recurso de alzada (arts. 121-122: ante el órgano superior jerárquico, plazo de interposición de 1 mes, resolución en 3 meses, silencio negativo), recurso de reposición potestativo (arts. 123-124: ante el mismo órgano, 1 mes, resolución en 1 mes, silencio negativo) y recurso extraordinario de revisión (arts. 125-126: contra actos firmes en supuestos tasados; plazo de 3 meses desde el conocimiento de la causa, salvo el supuesto de error de hecho, que es de 4 años desde la notificación del acto).</p>\n<h3 id=\"esquema-nacional-de-seguridad-ens\">Esquema Nacional de Seguridad (ENS)</h3>\n<p>Regulado por el Real Decreto 311/2022, de 3 de mayo (que deroga el RD 3/2010), tiene por objeto establecer la política de seguridad en la utilización de los medios electrónicos por el sector público: principios básicos (seguridad integral, gestión de riesgos, prevención, proporcionalidad, defensa en profundidad, mejora continua), categorías de los sistemas (BÁSICA, MEDIA o ALTA) según la valoración de las dimensiones de seguridad —disponibilidad, autenticidad, integridad, confidencialidad y trazabilidad (DAIC+T, Anexo I)— y niveles de seguridad (bajo, medio, alto) asignados según el impacto de un incidente. Medidas de seguridad (Anexo II) organizadas en tres marcos: organizativo (política de seguridad, análisis de riesgos, gestión de personal), operacional (protección de instalaciones, gestión de activos, adquisición de productos, gestión de incidentes) y de protección (protección de servicios, de las comunicaciones y de los datos). Requisitos mínimos: análisis de riesgos, plan de adecuación y declaración de conformidad (sistemas de categoría básica y media) o certificación de conformidad (categoría alta). Auditoría periódica: cada 2 años en categoría básica y media, anual en categoría alta. Coordinación y supervisión: <strong>CCN-CERT</strong> (Centro Criptológico Nacional, adscrito al CNI), centro de respuesta a incidentes del sector público. El ENS se aplica también, con matices, a los proveedores de servicios TIC del sector público.</p>\n<h3 id=\"esquema-nacional-de-interoperabilidad-eni-y-normas-técnicas-de-interoperabilidad-nti\">Esquema Nacional de Interoperabilidad (ENI) y Normas Técnicas de Interoperabilidad (NTI)</h3>\n<p>Aprobado por el Real Decreto 4/2010, de 8 de enero, establece los criterios y recomendaciones de seguridad, normalización y conservación de la información, formatos y aplicaciones que las Administraciones deben tener en cuenta para garantizar el ejercicio de derechos y el cumplimiento de deberes por medios electrónicos, en cuatro dimensiones: organizativa (interoperabilidad de las organizaciones y sus procesos), semántica (intercambio de datos con significado compartido), técnica (estándares y protocolos) y temporal (conservación de la información, archivo y gestión documental). Se desarrolla mediante Normas Técnicas de Interoperabilidad (NTI), aprobadas por Resolución de la Secretaría de Estado, que regulan aspectos concretos: documento electrónico, expediente electrónico, digitalización, copiado auténtico y conversión, catálogo de estándares, política de firma y sello electrónicos, modelo de datos para el intercambio de asientos entre entidades registrales y protocolos de intermediación de datos.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>LPACAP (Ley 39/2015) vs LRJSP (Ley 40/2015)</strong>: ambas de 1 de octubre de 2015. La 39 regula el procedimiento administrativo común; la 40, el régimen jurídico del sector público, las sedes electrónicas (art. 38) y la organización. Confundir cuál regula qué es el error más frecuente.</li>\n<li><strong>Notificaciones electrónicas</strong>: 10 días naturales desde la puesta a disposición sin acceso = rechazada (no 10 días hábiles ni 15 días).</li>\n<li><strong>Silencio positivo como regla general</strong>, con excepciones tasadas; en procedimientos iniciados de oficio, caducidad.</li>\n<li><strong>Plazo general de resolución: 3 meses</strong> (art. 21.3 LPACAP).</li>\n<li><strong>ENS</strong>: RD 311/2022 (deroga el RD 3/2010); dimensiones DAIC+T; categorías básica/media/alta; auditoría cada 2 años (anual en alta); CCN-CERT.</li>\n<li><strong>ENI</strong>: RD 4/2010; cuatro dimensiones (organizativa, semántica, técnica, temporal); se desarrolla mediante NTI.</li>\n<li><strong>Registro electrónico</strong>: 24 horas todos los días del año; presentación en día inhábil → primer día hábil siguiente (art. 31.2).</li>\n</ul>\n"}, {"num": 9, "title": "Instrumentos para el acceso electrónico. Sedes electrónicas. Infraestructuras y servicios comunes.", "html": "<h3 id=\"sedes-electrónicas-art-38-lrjsp-desarrollado-por-el-rd-2032021\">Sedes electrónicas (art. 38 LRJSP, desarrollado por el RD 203/2021)</h3>\n<p>La sede electrónica es la dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones, cuya titularidad, gestión y administración corresponde a una Administración Pública, órgano o entidad administrativa en el ejercicio de sus competencias. Características:</p>\n<ul>\n<li><strong>Creación</strong>: mediante resolución u orden publicada en el diario oficial correspondiente (en la AGE, por el titular del Departamento u órgano directivo).</li>\n<li><strong>Contenido mínimo garantizado</strong>: identificación del titular, integridad, veracidad y actualización de la información y servicios, fecha y hora oficial, disponibilidad, accesibilidad y sistemas de firma electrónica del órgano.</li>\n<li><strong>Sede electrónica asociada</strong>: para los organismos que carecen de sede propia, que se integran en la sede de la Administración de la que dependen.</li>\n<li><strong>Punto de Acceso General electrónico de la AGE</strong> (art. 39 LRJSP, administracion.gob.es): actúa como portal de acceso, informativo y transaccional, que permite acceder a las sedes electrónicas y a los servicios más demandados.</li>\n</ul>\n<h3 id=\"canales-y-puntos-de-acceso\">Canales y puntos de acceso</h3>\n<p>La normativa admite el acceso multicanal: canal electrónico (sedes electrónicas, aplicaciones móviles, punto de acceso general, Carpeta Ciudadana), canal presencial (oficinas de asistencia en materia de registros — OAR — y oficinas de registro) y canal telefónico (servicios de información y atención al ciudadano). El RD 203/2021 regula las sedes electrónicas, las sedes asociadas, los canales de acceso a los servicios y el Punto de Acceso General de la AGE.</p>\n<h3 id=\"identificación-y-autenticación\">Identificación y autenticación</h3>\n<p>Se distingue entre la <strong>identificación de los interesados</strong> (art. 9 LPACAP: certificado electrónico cualificado y DNIe; sistemas de clave concertada como Cl@ve; y otros sistemas que las Administraciones consideren válidos) y la <strong>firma de los interesados</strong> (art. 10 LPACAP: firma electrónica cualificada, sistemas de sello electrónico, firma electrónica del personal al servicio de la Administración y código seguro de verificación — CSV —, además de los sistemas del art. 9). Para las Administraciones se regula la <strong>identificación de la sede y la autenticación de las actuaciones administrativas automatizadas</strong> (arts. 40-42 LRJSP): sello electrónico de Administración Pública, órgano, organismo público o entidad de derecho público (basado en certificado electrónico cualificado). Las actuaciones administrativas automatizadas (art. 41 LRJSP) son las producidas por una herramienta informática, de forma total o parcialmente automática, en el marco de un procedimiento administrativo; requieren resolución de creación publicada, órgano responsable y, cuando proceda, evaluación de impacto relativa a la protección de datos. Sistemas de firma de estas actuaciones (art. 42 LRJSP): sello electrónico de actuación automatizada, código seguro de verificación (CSV) y firma electrónica del personal al servicio de la Administración (art. 43 LRJSP).</p>\n<p><strong>Cl@ve.</strong> Sistema de identificación y firma electrónica en clave concertada de la AGE, gestionado por la Secretaría General de Administración Digital (SGAD) del Ministerio para la Transformación Digital y de la Función Pública, con el apoyo del Instituto Nacional de Estadística y la Dirección General de la Policía. Modalidades: <strong>Cl@ve PIN</strong> (identificación con un PIN temporal generado por SMS, nivel bajo), <strong>Cl@ve Permanente</strong> (contraseña estable, nivel medio) y <strong>Cl@ve Firma</strong> (firma electrónica con contraseña y, en su caso, SMS o certificado). Es utilizado también por numerosas CCAA y EELL mediante acuerdos de adhesión.</p>\n<h3 id=\"infraestructuras-y-servicios-comunes-de-administración-electrónica\">Infraestructuras y servicios comunes de administración electrónica</h3>\n<p>La SGAD presta servicios horizontales compartidos por toda la AGE, reutilizables por otras Administraciones conforme a los principios de interoperabilidad y cooperación (art. 157 LRJSP) y de reutilización de sistemas y aplicaciones (art. 158 LRJSP):</p>\n<table>\n<thead>\n<tr>\n<th>Servicio</th>\n<th>Función</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Cl@ve</strong></td>\n<td>Identificación y firma electrónica de los ciudadanos (sistema de clave concertada)</td>\n</tr>\n<tr>\n<td><strong>DEHú</strong> (Dirección Electrónica Habilitada única)</td>\n<td>Sistema de notificaciones electrónicas por comparecencia en sede (art. 43 LPACAP)</td>\n</tr>\n<tr>\n<td><strong>SIR</strong> (Sistema de Interconexión de Registros)</td>\n<td>Intercambio de asientos registrales entre los registros electrónicos de las AAPP</td>\n</tr>\n<tr>\n<td><strong>PID</strong> (Plataforma de Intermediación de Datos)</td>\n<td>Verificación electrónica de datos que obran en poder de las AAPP (evita aportar documentos, art. 28.2 LPACAP)</td>\n</tr>\n<tr>\n<td><strong>@Firma</strong></td>\n<td>Plataforma de validación y verificación de firma electrónica (servicios de validación y confianza)</td>\n</tr>\n<tr>\n<td><strong>ARCHIVE</strong></td>\n<td>Archivo electrónico único de la AGE (conservación de documentos electrónicos con valor probatorio)</td>\n</tr>\n<tr>\n<td><strong>Carpeta Ciudadana</strong></td>\n<td>Punto único de acceso del ciudadano al estado de sus trámites con cualquier Administración</td>\n</tr>\n<tr>\n<td><strong>INSIDE</strong></td>\n<td>Gestor de expedientes electrónicos (Interoperable e Integrado de Gestión de Expedientes)</td>\n</tr>\n<tr>\n<td><strong>Registro Electrónico General</strong></td>\n<td>Registro de entrada y salida de documentos de la AGE (art. 31 LPACAP)</td>\n</tr>\n<tr>\n<td><strong>Notifica / Notific@</strong></td>\n<td>Gestión de notificaciones electrónicas</td>\n</tr>\n</tbody>\n</table>\n<p>El conjunto materializa el principio de \"solo una vez\" (once-only) y la interoperabilidad del ENI: el ciudadano no debe aportar datos que la Administración ya posee ni documentos elaborados por otras Administraciones.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>Identificación vs firma de los interesados</strong>: art. 9 LPACAP (identificación: certificados, DNIe, clave concertada) y art. 10 LPACAP (firma: incluye CSV y sello). La identificación de sedes y Administraciones: arts. 40-42 LRJSP.</li>\n<li><strong>Sede electrónica vs Punto de Acceso General</strong>: la sede es de cada órgano u organismo (art. 38 LRJSP); el PAG es único de la AGE (art. 39 LRJSP, administracion.gob.es).</li>\n<li><strong>CSV</strong>: código seguro de verificación — no es un sistema de identificación del ciudadano, sino de verificación de documentos y actuaciones automatizadas (art. 42.b LRJSP).</li>\n<li><strong>Actuación administrativa automatizada</strong> (art. 41 LRJSP): total o parcialmente automática; requiere resolución de creación y, si procede, EIPD.</li>\n<li><strong>Sede electrónica asociada</strong>: para organismos sin sede propia (trampa: \"todo organismo debe tener su propia sede\" → falso).</li>\n<li><strong>Servicios comunes</strong>: distinguir qué hace cada uno — SIR interconecta registros, PID verifica datos, DEHú notifica, @Firma valida firmas, ARCHIVE archiva documentos, INSIDE gestiona expedientes.</li>\n</ul>\n"}]}, {"key": "b2", "title": "Bloque II — Tecnología básica", "temas": [{"num": 1, "title": "Informática básica. Representación y comunicación de la información: elementos constitutivos de un sistema de información. Características y funciones. Arquitectura de ordenadores. Componentes internos de los equipos microinformáticos.", "html": "<h3 id=\"representación-de-la-información\">Representación de la información</h3>\n<p>Los sistemas digitales representan cualquier tipo de información mediante dígitos binarios (bits), agrupados en bytes (8 bits). La codificación numérica emplea sistemas posicionales: binario (base 2), octal (base 8) y hexadecimal (base 16), este último muy utilizado para representar direcciones de memoria y valores de color por su correspondencia directa con grupos de 4 bits (nibbles). Para números con signo se emplea habitualmente el complemento a 2, que permite realizar restas mediante sumas y evita la ambigüedad del cero con signo: en n bits el rango va de -2^(n-1) a 2^(n-1)-1 (en 8 bits, de -128 a +127). Los números reales se representan en coma flotante según el estándar IEEE 754, que distingue signo, exponente y mantisa: precisión simple (32 bits: 1 de signo + 8 de exponente + 23 de mantisa) y precisión doble (64 bits: 1 + 11 + 52).</p>\n<p>La representación de caracteres ha evolucionado desde ASCII (7 bits, 128 caracteres) hasta Unicode, que asigna un punto de código único a cada carácter de cualquier alfabeto; su codificación más extendida en transmisión y almacenamiento es UTF-8, de longitud variable (1 a 4 bytes) y compatible con ASCII. Otros códigos relevantes: EBCDIC (mainframes IBM), BCD (decimal codificado en binario) y mecanismos de detección de errores (bit de paridad, checksum, CRC).</p>\n<p><strong>Unidades de medida.</strong> En informática se emplean potencias de 2: 1 KiB = 1024 bytes (convención JEDEC: KB, MB, GB), mientras que el sistema SI usa potencias de 10 (1 kB = 1000 bytes). La RAM se mide en base 2 y los discos comerciales anuncian capacidad en base 10, lo que explica la discrepancia de capacidad \"real\" (un disco de 500 GB muestra ~465 GiB).</p>\n<h3 id=\"elementos-constitutivos-de-un-sistema-de-información\">Elementos constitutivos de un sistema de información</h3>\n<p>Un sistema de información se compone de: hardware (soporte físico), software (programas de sistema y de aplicación), datos, procedimientos y personas. Sus funciones básicas son entrada, proceso, almacenamiento, salida y comunicación de la información, articuladas para dar soporte a los procesos de una organización, garantizando integridad, disponibilidad y confidencialidad.</p>\n<h3 id=\"arquitectura-de-ordenadores-von-neumann-y-harvard\">Arquitectura de ordenadores: Von Neumann y Harvard</h3>\n<p>La mayoría de los ordenadores actuales siguen el modelo de Von Neumann, caracterizado por almacenar programa y datos en la misma memoria y ejecutar instrucciones secuencialmente mediante el ciclo de instrucción: captación (fetch), decodificación (decode), ejecución (execute) y escritura del resultado (writeback). Este modelo presenta la limitación conocida como \"cuello de botella de Von Neumann\", pues la CPU y la memoria comparten un único bus, limitando el paralelismo. Frente a ella, la arquitectura Harvard emplea memorias y buses separados para instrucciones y datos, habitual en microcontroladores y DSP.</p>\n<p><strong>CISC vs RISC.</strong> CISC (x86) ofrece muchas instrucciones complejas ejecutadas mediante microcódigo; RISC (ARM, MIPS, RISC-V) usa un conjunto reducido de instrucciones simples, de ejecución en un ciclo, con más registros y segmentación eficiente.</p>\n<p><strong>CPU.</strong> Integra la ALU (unidad aritmético-lógica), la unidad de control (UC, que decodifica y secuencia las instrucciones) y los registros: PC/IP (contador de programa), IR (registro de instrucción), MAR (dirección de memoria), MBR (datos de memoria) y acumulador. Los procesadores actuales incorporan varios núcleos, memoria caché (L1, L2, L3), segmentación (pipelining) y ejecución fuera de orden (out-of-order) para mejorar el rendimiento.</p>\n<h3 id=\"buses-del-sistema\">Buses del sistema</h3>\n<p>El bus es el conjunto de líneas físicas que permiten la comunicación entre componentes. Se distinguen tres tipos funcionales: bus de direcciones (unidireccional, indica la posición de memoria o dispositivo a acceder; el número de líneas determina la memoria direccionable: 2^n posiciones), bus de datos (bidireccional, transporta la información) y bus de control (señales de sincronización, lectura/escritura, interrupciones). A nivel de expansión, los sistemas actuales usan buses serie de alta velocidad como PCI Express (organizado en lanes x1/x4/x8/x16), sustituyendo a los antiguos buses paralelos ISA y PCI.</p>\n<h3 id=\"memoria\">Memoria</h3>\n<p><strong>Jerarquía de memoria:</strong> se organiza en niveles según velocidad y coste: registros, caché (L1, L2, L3), memoria principal (RAM), memoria secundaria (SSD/HDD) y almacenamiento externo, aplicando el principio de localidad temporal y espacial para optimizar el acceso.</p>\n<p><strong>RAM (volátil):</strong> la DRAM necesita refresco periódico y es más barata (memoria principal); la SRAM es más rápida y cara, sin refresco, usada en caché. Predominan los módulos DDR SDRAM (DDR3, DDR4, DDR5), con doble transferencia de datos por ciclo.</p>\n<p><strong>ROM y variantes (no volátiles):</strong> ROM (grabada en fabricación), PROM (programable una vez), EPROM (borrable por luz ultravioleta), EEPROM (borrable eléctricamente) y memoria flash (SSD, pendrives, firmware). Almacenan el firmware, incluida la BIOS/UEFI, encargada del arranque (POST, Power-On Self-Test) y la inicialización del hardware.</p>\n<h3 id=\"componentes-internos-de-los-equipos-microinformáticos\">Componentes internos de los equipos microinformáticos</h3>\n<p><strong>Placa base:</strong> integra el chipset (puente norte y puente sur, o su equivalente unificado en procesadores modernos), los zócalos de CPU y memoria (DIMM), y los conectores de expansión y almacenamiento (SATA, M.2/NVMe).</p>\n<p><strong>Fuente de alimentación:</strong> convierte corriente alterna en las tensiones continuas requeridas por los componentes (norma ATX: 3,3 V, 5 V y 12 V).</p>\n<p><strong>Otros componentes:</strong> tarjeta gráfica (GPU, con memoria dedicada VRAM), tarjeta de red, sistema de refrigeración (disipadores, ventiladores, refrigeración líquida) y chasis.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>Complemento a 2</strong>: en n bits el rango va de -2^(n-1) a 2^(n-1)-1; en 8 bits, de -128 a +127 (no -127 a +127). Existe un solo cero.</li>\n<li><strong>IEEE 754 simple</strong>: 1+8+23 bits (no 1+8+24); doble: 1+11+52.</li>\n<li><strong>ASCII = 7 bits / 128 caracteres</strong> (no 8 bits/256, eso es el ASCII extendido o Latin-1).</li>\n<li><strong>Unidades</strong>: KiB (1024) vs kB (1000) — la RAM se mide en base 2, los discos en base 10.</li>\n<li><strong>Bus de direcciones unidireccional vs bus de datos bidireccional</strong>: el examen invierte con frecuencia la dirección de los buses.</li>\n<li><strong>Von Neumann</strong>: programa y datos en la misma memoria y un único bus (cuello de botella); Harvard: memorias y buses separados.</li>\n<li><strong>CISC vs RISC</strong>: ARM es RISC (no CISC); x86 es CISC. RISC = instrucciones simples en un ciclo.</li>\n<li><strong>SRAM vs DRAM</strong>: SRAM en caché (rápida, cara, sin refresco); DRAM en memoria principal (requiere refresco periódico).</li>\n</ul>\n"}, {"num": 2, "title": "Periféricos: conectividad y administración. Elementos de impresión. Elementos de almacenamiento. Elementos de visualización y digitalización.", "html": "<h3 id=\"concepto-y-clasificación-de-periféricos\">Concepto y clasificación de periféricos</h3>\n<p>Los periféricos son dispositivos que permiten la comunicación entre el ordenador y el exterior. Se clasifican en periféricos de entrada (teclado, ratón, escáner, lector biométrico, lector de código de barras), de salida (monitor, impresora, altavoces), de entrada/salida (pantallas táctiles, módems, unidades de almacenamiento) y de almacenamiento (discos, unidades flash).</p>\n<h3 id=\"conectividad\">Conectividad</h3>\n<p>La conexión de periféricos se realiza mediante interfaces estandarizadas.</p>\n<p><strong>USB (Universal Serial Bus)</strong> es la más extendida, con versiones que evolucionan en velocidad: USB 2.0 (hasta 480 Mbps), USB 3.0/3.1 Gen1 (5 Gbps), USB 3.1 Gen2/3.2 Gen2 (10 Gbps), USB 3.2 Gen2x2 (20 Gbps) y USB4 (hasta 40 Gbps, convergiendo con Thunderbolt 3/4). El conector Tipo C es reversible y admite suministro de energía mediante USB Power Delivery.</p>\n<p><strong>Almacenamiento interno:</strong> SATA (Serial ATA; SATA III hasta 6 Gbps) y, con mayor ancho de banda, NVMe sobre bus PCIe (con colas de comandos masivas); en el ámbito empresarial, SAS (Serial Attached SCSI, full-duplex).</p>\n<p><strong>Inalámbrico:</strong> Bluetooth (comunicación de corto alcance entre dispositivos personales) y Wi-Fi (conectividad de red local).</p>\n<p><strong>Vídeo:</strong> HDMI (audio y vídeo digital, estándar doméstico) y DisplayPort (mayor ancho de banda, soporte multi-stream), que sustituyen a interfaces analógicas como VGA; Thunderbolt combina datos, vídeo y energía sobre USB-C.</p>\n<p><strong>Administración de periféricos.</strong> El sistema operativo gestiona los dispositivos mediante controladores (drivers), programas que traducen las órdenes genéricas del sistema a las instrucciones específicas del dispositivo. El sistema Plug and Play (PnP) permite la detección y configuración automática; el gestor de dispositivos (Windows) o los subsistemas udev/sysfs (Linux) permiten consultar el estado, actualizar drivers y resolver conflictos de recursos (IRQ, direcciones de E/S, canales DMA).</p>\n<h3 id=\"elementos-de-impresión\">Elementos de impresión</h3>\n<p>Las impresoras se clasifican según su tecnología:</p>\n<ul>\n<li><strong>Inyección de tinta</strong>: proyectan gotas mediante cabezales térmicos o piezoeléctricos; adecuadas para color y bajo volumen.</li>\n<li><strong>Láser</strong>: emplean un tambor fotosensible cargado electrostáticamente que fija el tóner mediante calor y presión (fusor); mayor velocidad y coste por copia inferior en grandes volúmenes.</li>\n<li><strong>Matriciales o de impacto</strong>: agujas que golpean una cinta entintada; aún usadas para impresión multicopia (formularios).</li>\n<li><strong>Térmicas</strong>: por transferencia o sublimación térmica, típicas de tickets y etiquetas.</li>\n</ul>\n<p>Las impresoras 3D (FDM, SLA) constituyen una categoría creciente (fabricación aditiva capa a capa). Los lenguajes de descripción de página como PostScript o PCL, y el protocolo IPP (Internet Printing Protocol), gestionan la comunicación entre el sistema y el dispositivo en entornos de red.</p>\n<h3 id=\"elementos-de-almacenamiento\">Elementos de almacenamiento</h3>\n<ul>\n<li><strong>Magnético (HDD):</strong> platos giratorios y cabezales de lectura/escritura; velocidad de giro 5.400/7.200/10.000/15.000 RPM; tiempo de acceso = tiempo de búsqueda (seek) + latencia rotacional; menor coste por GB.</li>\n<li><strong>Óptico:</strong> CD, DVD, Blu-ray, que codifican información mediante variaciones reflectantes leídas por láser.</li>\n<li><strong>Estado sólido (SSD):</strong> memoria flash NAND, sin partes móviles, menor latencia y mayor velocidad de acceso aleatorio; requieren TRIM para mantener el rendimiento; mayor coste por GB.</li>\n</ul>\n<p>Los parámetros técnicos relevantes incluyen capacidad, tiempo de acceso, velocidad de transferencia y fiabilidad (MTBF). Para configuraciones redundantes se emplean sistemas RAID:</p>\n<ul>\n<li><strong>RAID 0 (striping):</strong> datos repartidos en bloques; solo rendimiento, sin redundancia (un fallo pierde todo).</li>\n<li><strong>RAID 1 (mirroring):</strong> copia íntegra en dos discos; tolera 1 fallo; la mitad de la capacidad útil.</li>\n<li><strong>RAID 5:</strong> paridad distribuida; tolera 1 fallo; mínimo 3 discos.</li>\n<li><strong>RAID 6:</strong> doble paridad; tolera 2 fallos; mínimo 4 discos.</li>\n<li><strong>RAID 10 (1+0):</strong> espejo de bandas; rendimiento y tolerancia; mínimo 4 discos.</li>\n</ul>\n<h3 id=\"elementos-de-visualización-y-digitalización\">Elementos de visualización y digitalización</h3>\n<p>Los monitores actuales utilizan mayoritariamente tecnología LCD/LED (cristal líquido con retroiluminación), con variantes IPS (mejor fidelidad de color y ángulo de visión) y OLED (píxeles autoemisivos, mayor contraste y negros puros, sin retroiluminación). Los parámetros clave son resolución, tasa de refresco (Hz), tiempo de respuesta y relación de aspecto.</p>\n<p>En digitalización, los escáneres (de sobremesa, de rodillo o de mano) capturan imágenes mediante sensores CCD o CIS, convirtiendo la señal analógica en una matriz de píxeles digital, cuya calidad depende de la resolución (ppp, puntos por pulgada) y la profundidad de color. Las cámaras de documentos y los sistemas OCR (reconocimiento óptico de caracteres) complementan la digitalización, transformando imágenes de texto en texto editable, funcionalidad clave en la gestión documental de la Administración.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>USB 2.0 = 480 Mbps</strong> (no 480 MB/s); USB 3.0 = 5 Gbps; USB 3.1 Gen2 = 10 Gbps; USB4 = 40 Gbps (converge con Thunderbolt).</li>\n<li><strong>RAID</strong>: RAID 0 no da redundancia (solo rendimiento); RAID 1 tolera 1 fallo; RAID 5 tolera 1 fallo (mínimo 3 discos); RAID 6 tolera 2 (mínimo 4); RAID 10 = espejo de bandas (mínimo 4).</li>\n<li><strong>HDD vs SSD</strong>: HDD tiene partes móviles (platos y cabezales); SSD no. TRIM es una operación de SSD, no de HDD.</li>\n<li><strong>HDMI vs DisplayPort</strong>: DisplayPort tiene mayor ancho de banda y multi-stream; HDMI es el estándar doméstico (audio+vídeo).</li>\n<li><strong>SATA III = 6 Gbps</strong>; NVMe va sobre PCIe (mucho mayor ancho de banda y profundidad de cola que SATA).</li>\n<li><strong>Monitor OLED</strong>: píxeles autoemisivos, sin retroiluminación; el LCD/LED la necesita.</li>\n<li><strong>Impresora láser</strong>: tambor + tóner + fusor (calor y presión); la matricial es de impacto (impresión multicopia).</li>\n</ul>\n"}, {"num": 3, "title": "Tipos abstractos y Estructuras de datos. Organizaciones de ficheros. Algoritmos. Formatos de información y ficheros.", "html": "<h3 id=\"tipos-abstractos-de-datos-tad\">Tipos abstractos de datos (TAD)</h3>\n<p>Un tipo abstracto de datos define un conjunto de valores y las operaciones aplicables sobre ellos, independientemente de su implementación concreta. Esta separación entre interfaz (especificación) y representación interna constituye la base de la abstracción y el encapsulamiento en programación. Ejemplos clásicos de TAD son pila, cola, lista, conjunto y diccionario (o mapa clave-valor).</p>\n<h3 id=\"estructuras-de-datos-lineales\">Estructuras de datos lineales</h3>\n<p><strong>Pila (stack):</strong> estructura LIFO (Last In, First Out) con operaciones push (inserción) y pop (extracción) restringidas a un extremo (la cima). Se emplea en la gestión de llamadas a funciones (pila de ejecución), evaluación de expresiones, algoritmos de recorrido en profundidad (DFS) y deshacer/rehacer (undo/redo).</p>\n<p><strong>Cola (queue):</strong> estructura FIFO (First In, First Out), con inserción por un extremo (encolar/enqueue) y extracción por el opuesto (desencolar/dequeue). Variantes destacadas: la cola de prioridad, donde cada elemento se extrae según una prioridad asociada (implementada típicamente con un heap), y la cola circular, que reutiliza el espacio del array de forma eficiente.</p>\n<p><strong>Listas enlazadas:</strong> secuencias de nodos donde cada uno contiene un dato y un puntero al siguiente (y al anterior en las doblemente enlazadas; circulares si el último apunta al primero). Frente a los arrays, permiten inserción y borrado en tiempo constante O(1) sin desplazamiento de elementos, a costa de un acceso secuencial (sin indexación directa).</p>\n<h3 id=\"estructuras-de-datos-no-lineales\">Estructuras de datos no lineales</h3>\n<p><strong>Árboles:</strong> estructuras jerárquicas compuestas por nodos y aristas, con un nodo raíz y ausencia de ciclos. El árbol binario de búsqueda (ABB) mantiene la propiedad de que el subárbol izquierdo contiene valores menores y el derecho mayores, permitiendo búsquedas en tiempo logarítmico O(log n) en el caso medio; los árboles equilibrados (AVL, rojo-negro) garantizan esta complejidad en el peor caso mediante rebalanceo. Los árboles B y B+ (multivía) son ampliamente usados en índices de bases de datos y sistemas de ficheros por optimizar el acceso a almacenamiento secundario; en el B+ los datos residen solo en las hojas, enlazadas entre sí, lo que optimiza los recorridos en rango.</p>\n<p><strong>Grafos:</strong> conjuntos de vértices y aristas (dirigidos o no, con o sin peso) que modelan relaciones complejas. Se representan con listas o matrices de adyacencia y se recorren en anchura (BFS, con cola) o en profundidad (DFS, con pila o recursión). Problemas clásicos: camino mínimo (algoritmo de Dijkstra para pesos no negativos) y árbol de recubrimiento mínimo (Kruskal, Prim).</p>\n<p><strong>Tablas hash:</strong> estructuras que aplican una función hash para mapear claves a posiciones de un array, ofreciendo acceso en tiempo medio constante O(1); requieren estrategias de resolución de colisiones (encadenamiento separado o direccionamiento abierto: sondeo lineal, cuadrático, doble hash). No soportan búsqueda por rango de forma eficiente.</p>\n<h3 id=\"organización-de-ficheros\">Organización de ficheros</h3>\n<p>La organización secuencial almacena los registros en orden físico consecutivo, adecuada para procesamiento por lotes. La organización indexada mantiene una estructura auxiliar (habitualmente un árbol B+) que relaciona claves con posiciones físicas, permitiendo acceso directo eficiente. La organización directa o relativa (hash) calcula la dirección física a partir de la clave mediante una función de dispersión. La organización indexada-secuencial (ISAM) combina ambos enfoques, permitiendo tanto recorrido ordenado como acceso directo.</p>\n<h3 id=\"algoritmos-y-complejidad\">Algoritmos y complejidad</h3>\n<p>Un algoritmo es una secuencia finita y no ambigua de pasos que resuelve un problema. Su eficiencia se mide mediante la notación asintótica: <strong>O</strong> (cota superior, peor caso), <strong>Ω</strong> (cota inferior, mejor caso) y <strong>Θ</strong> (cota ajustada). Complejidades habituales ordenadas: O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(2ⁿ).</p>\n<p><strong>Ordenación:</strong> los algoritmos simples (burbuja, inserción, selección) son O(n²); los eficientes alcanzan O(n log n): quicksort (peor caso O(n²) con un pivote desfavorable; in-place), mergesort (estable, O(n log n) garantizado, con O(n) de espacio extra) y heapsort (in-place, O(1) de espacio extra, no estable). La búsqueda binaria sobre datos ordenados requiere O(log n) frente a la búsqueda lineal O(n).</p>\n<p><strong>Recursividad:</strong> toda función recursiva consta de caso base y caso recursivo, y es transformable a iterativa mediante una pila explícita (relación directa con el TAD pila).</p>\n<h3 id=\"formatos-de-información-y-ficheros\">Formatos de información y ficheros</h3>\n<p>Los formatos de texto estructurado como XML, JSON y YAML permiten el intercambio de información entre sistemas heterogéneos, con distinto grado de verbosidad y capacidad de tipado (XML muy verboso, JSON ligero y estándar en APIs, YAML legible y habitual en configuración). Los formatos binarios (imágenes, audio, vídeo, documentos ofimáticos) incluyen cabeceras con metadatos y, frecuentemente, compresión: sin pérdida (ZIP, PNG) o con pérdida (JPEG, MP3), en función del compromiso entre tamaño y fidelidad admisible.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>Pila LIFO vs cola FIFO</strong>: push/pop vs encolar/desencolar — el examen suele intercambiar las operaciones y el orden de extracción.</li>\n<li><strong>Ordenación</strong>: quicksort es O(n log n) en el caso medio pero O(n²) en el peor; mergesort garantiza O(n log n) con O(n) de espacio; heapsort es in-place (O(1) espacio) pero no estable.</li>\n<li><strong>Búsqueda binaria</strong>: exige datos ordenados; si no lo están, la búsqueda es lineal O(n).</li>\n<li><strong>Notación</strong>: O es cota superior (peor caso), Ω cota inferior (mejor caso), Θ cota ajustada.</li>\n<li><strong>Árbol B+</strong>: los datos están solo en las hojas (enlazadas entre sí); en el B clásico están en todos los nodos.</li>\n<li><strong>Hash</strong>: O(1) medio para igualdad exacta; no sirve para búsquedas por rango.</li>\n<li><strong>Cola de prioridad</strong>: se implementa típicamente con un heap, no con una cola normal.</li>\n<li><strong>UTF-8</strong>: longitud variable (1-4 bytes) y compatible con ASCII (los primeros 128 puntos de código ocupan 1 byte).</li>\n</ul>\n"}, {"num": 4, "title": "Sistemas operativos. Características y elementos constitutivos. Sistemas Windows. Sistemas Unix y Linux. Sistemas operativos para dispositivos móviles.", "html": "<h3 id=\"concepto-y-funciones-del-sistema-operativo\">Concepto y funciones del sistema operativo</h3>\n<p>El sistema operativo es el software que gestiona los recursos hardware y ofrece una interfaz uniforme a las aplicaciones y al usuario. Sus funciones principales son la gestión de procesos, de memoria, del sistema de archivos, de dispositivos de entrada/salida y la seguridad, además de actuar como máquina virtual que abstrae la complejidad del hardware subyacente.</p>\n<p><strong>Estructuras de los SO:</strong> monolítico (todo el núcleo en espacio de kernel, rápido pero acoplado — Linux), microkernel (mínimo en el núcleo, servicios en espacio de usuario — Minix, QNX) e híbrido (combina ambos — Windows NT, macOS/XNU).</p>\n<h3 id=\"gestión-de-procesos\">Gestión de procesos</h3>\n<p>Un proceso es un programa en ejecución, con su propio espacio de direcciones, estado y recursos asignados. Puede encontrarse en estados de nuevo, preparado (listo), en ejecución, bloqueado o terminado, transiciones gestionadas por el planificador (scheduler). Los hilos (threads) son unidades de ejecución dentro de un proceso que comparten memoria, permitiendo concurrencia con menor sobrecarga que procesos independientes.</p>\n<p><strong>Algoritmos de planificación:</strong> FCFS (orden de llegada, no apropiativo), SJF (trabajo más corto primero, óptimo en tiempo medio de espera pero con riesgo de inanición), Round Robin (quantum fijo, apropiativo, adecuado para sistemas interactivos) y por prioridades (con riesgo de inanición, mitigado con aging — aumento gradual de la prioridad con el tiempo). También existen las colas multinivel.</p>\n<p><strong>Concurrencia y sincronización:</strong> exclusión mutua, semáforos (contador con operaciones wait/signal), mutex (semáforo binario) y monitores. El interbloqueo (deadlock) requiere las cuatro condiciones de Coffman simultáneas: exclusión mutua, retención y espera, no apropiación y espera circular.</p>\n<h3 id=\"gestión-de-memoria\">Gestión de memoria</h3>\n<p>Los sistemas actuales emplean memoria virtual, que independiza el espacio de direcciones lógico del físico mediante paginación (bloques de tamaño fijo: páginas y marcos; evita la fragmentación externa pero genera interna) o segmentación (bloques de tamaño variable con significado lógico). La MMU (unidad de gestión de memoria) traduce direcciones virtuales a físicas con ayuda de la tabla de páginas y el buffer TLB (Translation Lookaside Buffer). Cuando la memoria física es insuficiente, se recurre al intercambio (swapping) con el área de paginación en disco. Algoritmos de reemplazo de página: FIFO, LRU (menos usada recientemente, la mejor aproximación práctica) y el óptimo (teórico, usado como referencia de comparación).</p>\n<h3 id=\"sistemas-de-archivos\">Sistemas de archivos</h3>\n<p>El sistema de archivos organiza el almacenamiento persistente en una estructura jerárquica de directorios y ficheros, gestionando metadatos (permisos, fechas, propietario) e implementando mecanismos de asignación de espacio (contigua, enlazada o indexada) y de recuperación ante fallos mediante journaling, que registra las operaciones antes de aplicarlas para garantizar la consistencia. Sistemas representativos: <strong>FAT32</strong> (límite de 4 GB por archivo, sin journaling, máxima compatibilidad), <strong>exFAT</strong> (sin límite práctico de tamaño de archivo, para dispositivos extraíbles), <strong>NTFS</strong> (Windows: permisos ACL, compresión, cifrado EFS y journaling) y <strong>ext4</strong> (Linux: journaling, extents, soporte de volúmenes grandes).</p>\n<h3 id=\"sistemas-windows\">Sistemas Windows</h3>\n<p>Windows es un sistema operativo propietario de Microsoft con arquitectura híbrida (núcleo con componentes en espacio de kernel y de usuario). Su sistema de archivos principal es NTFS, que soporta permisos ACL, compresión, cifrado (EFS) y journaling. La gestión de usuarios y equipos en entornos corporativos se realiza mediante Active Directory (AD), que centraliza la autenticación (protocolo Kerberos) y las políticas de grupo (GPO, Group Policy Objects). El registro de Windows (registry) almacena la configuración del sistema y las aplicaciones en una base de datos jerárquica. Herramientas administrativas: Administrador de tareas, visor de eventos, administrador de dispositivos, administración de discos y PowerShell.</p>\n<h3 id=\"sistemas-unix-y-linux\">Sistemas Unix y Linux</h3>\n<p>Unix, desarrollado en Bell Labs en los años setenta, estableció principios como \"todo es un fichero\", la composición de utilidades simples mediante tuberías (pipes) y un sistema de permisos basado en propietario, grupo y otros (rwx). Linux es un núcleo de código abierto inspirado en Unix (creado por Linus Torvalds en 1991), sobre el que se construyen distribuciones (Debian/Ubuntu, Red Hat/Fedora, openSUSE) que integran gestores de paquetes (APT con paquetes .deb, DNF/YUM con .rpm), sistemas de ficheros como ext4, XFS o Btrfs, y el sistema de inicio systemd, que gestiona servicios y dependencias de arranque (systemctl). La administración remota se realiza habitualmente mediante SSH, y la shell (bash u otras) permite la automatización mediante scripts.</p>\n<h3 id=\"sistemas-operativos-para-dispositivos-móviles\">Sistemas operativos para dispositivos móviles</h3>\n<p>Android, basado en el núcleo Linux, emplea la máquina virtual ART (Android Runtime) para ejecutar aplicaciones y organiza los componentes en actividades, servicios y proveedores de contenido, con un modelo de permisos granular y ciclo de vida de aplicación gestionado por el propio sistema para optimizar batería y memoria. iOS, de Apple, se basa en un núcleo derivado de Unix (Darwin/XNU) y aplica un modelo de aislamiento estricto entre aplicaciones (sandboxing), distribución controlada mediante App Store y una gestión de memoria basada en conteo automático de referencias (ARC). Ambos sistemas comparten características frente a los de escritorio: mayor restricción de recursos, gestión activa del consumo energético y modelos de permisos orientados a la privacidad del usuario.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>Proceso vs hilo</strong>: el proceso tiene espacio de memoria propio; los hilos lo comparten (cambio de contexto más barato).</li>\n<li><strong>Estados del proceso</strong>: nuevo → preparado → ejecución → bloqueado → terminado. El estado \"bloqueado\" espera un evento (p. ej. E/S), no es por agotamiento del quantum.</li>\n<li><strong>Round Robin</strong>: apropiativo con quantum fijo, bueno para interactivos; SJF es óptimo en tiempo medio de espera pero causa inanición en su forma pura.</li>\n<li><strong>Deadlock</strong>: las 4 condiciones de Coffman deben darse a la vez (exclusión mutua, retención y espera, no apropiación, espera circular).</li>\n<li><strong>Paginación vs segmentación</strong>: paginación = bloques fijos (fragmentación interna); segmentación = bloques lógicos variables (fragmentación externa).</li>\n<li><strong>Reemplazo de página</strong>: LRU es la mejor aproximación práctica; el óptimo es teórico (requiere conocer el futuro).</li>\n<li><strong>FAT32</strong>: límite de 4 GB por archivo y sin journaling; NTFS con ACL y EFS; exFAT para extraíbles sin límite práctico.</li>\n<li><strong>Active Directory</strong>: autenticación Kerberos y GPO; no confundir con el registro de Windows (configuración local del sistema).</li>\n<li><strong>Android vs iOS</strong>: Android usa ART sobre el kernel Linux; iOS usa XNU/Darwin (Unix) con sandboxing y ARC.</li>\n</ul>\n"}, {"num": 5, "title": "Sistemas de gestión de bases de datos relacionales, orientados a objetos y NoSQL: características y componentes.", "html": "<h3 id=\"concepto-y-componentes-de-un-sgbd\">Concepto y componentes de un SGBD</h3>\n<p>Un sistema de gestión de bases de datos (SGBD) es el software que permite definir, crear, mantener y controlar el acceso a una base de datos. Sus componentes principales son el motor de almacenamiento, el procesador de consultas (parser, optimizador y ejecutor), el gestor de transacciones, el catálogo o diccionario de datos (metadatos) y los módulos de seguridad y control de concurrencia. Ofrece independencia entre los datos y las aplicaciones que los utilizan, evitando la redundancia y garantizando su integridad. Funciones: definición de datos (DDL), manipulación (DML), control de acceso (DCL), gestión de transacciones, copias de seguridad y recuperación.</p>\n<h3 id=\"modelo-relacional\">Modelo relacional</h3>\n<p>Propuesto por E.F. Codd (1970), organiza los datos en relaciones (tablas), formadas por tuplas (filas) y atributos (columnas), cada uno definido sobre un dominio de valores válidos. La integridad se garantiza mediante claves primarias (identificación única de cada tupla, no nulas), claves ajenas o foráneas (referencias entre tablas, que materializan la integridad referencial) y restricciones de dominio.</p>\n<p><strong>Álgebra relacional:</strong> operaciones fundamentales: selección (σ, filtra filas), proyección (π, filtra columnas), unión, intersección, diferencia, producto cartesiano y join (combinación de tablas: inner, left/right/full outer, natural).</p>\n<p><strong>Normalización:</strong> el proceso, a través de las formas normales, elimina redundancias y anomalías de actualización, inserción y borrado, descomponiendo las relaciones según las dependencias funcionales: 1FN (atributos atómicos, sin grupos repetidos), 2FN (sin dependencias parciales de la clave), 3FN (sin dependencias transitivas) y FNBC (toda determinante es clave candidata).</p>\n<p><strong>SQL:</strong> el lenguaje estándar, con sentencias DDL (CREATE, ALTER, DROP), DML (SELECT, INSERT, UPDATE, DELETE), DCL (GRANT, REVOKE) y TCL (COMMIT, ROLLBACK, SAVEPOINT).</p>\n<p><strong>Índices:</strong> estructuras que aceleran el acceso a los datos: B-tree/B+tree (búsqueda por rango y por orden, uso general) e índices hash (igualdad exacta, O(1) medio, no sirven para rangos).</p>\n<h3 id=\"propiedades-acid\">Propiedades ACID</h3>\n<p>Las transacciones en un SGBD relacional cumplen las propiedades ACID: Atomicidad (una transacción se ejecuta completa o no se ejecuta — todo o nada), Consistencia (las restricciones de integridad se mantienen antes y después), Aislamiento (las transacciones concurrentes no interfieren entre sí, con niveles como read uncommitted, read committed, repeatable read y serializable) y Durabilidad (los cambios confirmados persisten ante fallos, típicamente mediante un log de transacciones — WAL). Ejemplos de SGBD relacionales: Oracle, SQL Server, PostgreSQL y MySQL/MariaDB.</p>\n<h3 id=\"modelo-orientado-a-objetos\">Modelo orientado a objetos</h3>\n<p>Los SGBD orientados a objetos almacenan directamente objetos, con su estado (atributos) y comportamiento (métodos), soportando herencia, encapsulamiento y polimorfismo, evitando el desajuste de impedancia (impedance mismatch) que se produce al mapear objetos de un lenguaje de programación a tablas relacionales. Existe también el enfoque objeto-relacional, que extiende el modelo relacional con tipos de datos complejos, herencia de tablas y métodos almacenados, adoptado parcialmente por motores como PostgreSQL u Oracle.</p>\n<h3 id=\"bases-de-datos-nosql\">Bases de datos NoSQL</h3>\n<p>Surgen para dar respuesta a requisitos de escalabilidad horizontal, esquemas flexibles y grandes volúmenes de datos no necesariamente estructurados (Big Data), habitualmente relajando las garantías ACID a favor del modelo BASE (Basically Available, Soft state, Eventually consistent), que prioriza la disponibilidad y la consistencia eventual frente a la consistencia inmediata, conforme describe el teorema CAP (Consistencia, Disponibilidad y tolerancia a Particiones): un sistema distribuido solo puede garantizar plenamente dos de esas tres propiedades simultáneamente, de modo que ante una partición de red debe elegirse entre consistencia fuerte (CP) o disponibilidad (AP).</p>\n<p>Se distinguen cuatro categorías principales:</p>\n<p><strong>Clave-valor:</strong> la estructura más simple, almacena pares identificador-valor sin esquema fijo, con acceso muy eficiente por clave (Redis, DynamoDB), habitual en caché y sesiones.</p>\n<p><strong>Documentales:</strong> almacenan documentos semiestructurados, típicamente en formato JSON o BSON, permitiendo estructuras anidadas y esquemas variables entre documentos de una misma colección (MongoDB, CouchDB).</p>\n<p><strong>Orientadas a columnas (columnares):</strong> organizan los datos por familias de columnas en lugar de por filas, optimizando la lectura de grandes volúmenes analíticos y la escalabilidad distribuida de escritura (Cassandra, HBase).</p>\n<p><strong>De grafos:</strong> modelan explícitamente entidades (nodos) y sus relaciones (aristas), optimizadas para consultas de recorrido y de relaciones complejas, como redes sociales o sistemas de recomendación (Neo4j).</p>\n<h3 id=\"consideraciones-de-selección\">Consideraciones de selección</h3>\n<p>La elección entre modelo relacional y NoSQL depende de los requisitos del sistema: el modelo relacional resulta idóneo cuando se requiere integridad transaccional estricta y relaciones complejas bien definidas (ACID), mientras que las soluciones NoSQL se orientan a escenarios de alta escalabilidad horizontal, esquemas cambiantes o grandes volúmenes de datos semiestructurados (BASE). Es frecuente en arquitecturas actuales la coexistencia de ambos paradigmas (polyglot persistence) según la naturaleza de cada componente del sistema de información.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>ACID vs BASE</strong>: relacional = ACID (consistencia inmediata); NoSQL = BASE (consistencia eventual).</li>\n<li><strong>CAP</strong>: solo 2 de 3 (Consistencia, Disponibilidad, tolerancia a Particiones); ante una partición de red se elige CP o AP — ningún sistema garantiza las tres a la vez.</li>\n<li><strong>Formas normales</strong>: 1FN atributos atómicos; 2FN sin dependencias parciales (requiere clave compuesta); 3FN sin dependencias transitivas; FNBC toda determinante es clave candidata.</li>\n<li><strong>Join</strong>: inner (solo coincidencias), left/right outer (conserva todos los de un lado), full outer (todos).</li>\n<li><strong>Índices</strong>: B-tree/B+ para rangos y orden; hash solo para igualdad exacta.</li>\n<li><strong>SQL</strong>: DDL (definición), DML (manipulación), DCL (control de acceso: GRANT/REVOKE), TCL (transacciones: COMMIT/ROLLBACK) — no confundir GRANT/REVOKE con COMMIT/ROLLBACK.</li>\n<li><strong>NoSQL por categoría</strong>: MongoDB = documental; Redis/DynamoDB = clave-valor; Cassandra/HBase = columnar; Neo4j = grafos.</li>\n<li><strong>Niveles de aislamiento</strong> (de menor a mayor garantía): read uncommitted, read committed, repeatable read, serializable.</li>\n</ul>\n"}]}, {"key": "b3", "title": "Bloque III — Desarrollo de sistemas", "temas": [{"num": 1, "title": "Modelado de datos, metodologías y reglas. Entidades, atributos y relaciones. Diseño de bases de datos. Diseño lógico y físico. El modelo lógico relacional. Normalización.", "html": "<p>El modelado de datos es el proceso de representar la información de un dominio de forma abstracta para su posterior implementación en un sistema de bases de datos. Se desarrolla habitualmente en tres niveles: <strong>conceptual</strong>, <strong>lógico</strong> y <strong>físico</strong>.</p>\n<p><strong>Nivel conceptual.</strong> Se emplea el modelo Entidad-Relación (E/R) de Chen, ampliado posteriormente con notación Peter Chen o Crow's Foot. Sus elementos básicos son:</p>\n<ul>\n<li><strong>Entidad</strong>: objeto del mundo real con existencia independiente (EMPLEADO, DEPARTAMENTO).</li>\n<li><strong>Atributo</strong>: propiedad de una entidad (simple, compuesto, monovaluado, multivaluado, derivado).</li>\n<li><strong>Relación</strong>: asociación entre entidades, con cardinalidad (1:1, 1:N, N:M) y grado (binaria, ternaria).</li>\n<li><strong>Clave primaria</strong>: atributo o conjunto de atributos que identifica de forma única cada instancia.</li>\n</ul>\n<p><strong>Diseño lógico.</strong> Se transforma el modelo E/R en un esquema relacional siguiendo reglas de paso:</p>\n<ul>\n<li>Entidad fuerte → tabla con su clave primaria.</li>\n<li>Relación 1:N → la clave primaria del lado \"1\" se propaga como clave ajena en el lado \"N\".</li>\n<li>Relación N:M → se crea una tabla intermedia con ambas claves ajenas, que normalmente forman la clave primaria compuesta.</li>\n<li>Atributo multivaluado → tabla independiente relacionada por clave ajena.</li>\n</ul>\n<p><strong>Diseño físico.</strong> Consiste en decidir la implementación concreta: tipos de datos del SGBD, índices, particionado, espacios de tablas, estrategias de almacenamiento y parámetros de rendimiento (tablespaces en Oracle, filegroups en SQL Server).</p>\n<h3 id=\"el-modelo-relacional\">El modelo relacional</h3>\n<p>Propuesto por E.F. Codd (1970), se basa en el álgebra relacional y la lógica de predicados. Una <strong>relación</strong> (tabla) es un conjunto de tuplas (filas) sobre un conjunto de atributos (columnas), cada uno con un dominio. Reglas fundamentales:</p>\n<ul>\n<li>Cada tabla tiene una clave primaria (PK) que garantiza la integridad de entidad (no nulos, no duplicados).</li>\n<li>Las claves ajenas (FK) garantizan la integridad referencial.</li>\n<li>Las restricciones de dominio (CHECK, NOT NULL) garantizan la integridad de dominio.</li>\n</ul>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">TABLE</span> DEPARTAMENTO (</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    id_dept     <span class=\"dt\">INT</span> <span class=\"kw\">PRIMARY</span> <span class=\"kw\">KEY</span>,</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    nombre      <span class=\"dt\">VARCHAR</span>(<span class=\"dv\">50</span>) <span class=\"kw\">NOT</span> <span class=\"kw\">NULL</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>);</span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">TABLE</span> EMPLEADO (</span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>    id_emp      <span class=\"dt\">INT</span> <span class=\"kw\">PRIMARY</span> <span class=\"kw\">KEY</span>,</span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a>    nombre      <span class=\"dt\">VARCHAR</span>(<span class=\"dv\">50</span>) <span class=\"kw\">NOT</span> <span class=\"kw\">NULL</span>,</span>\n<span id=\"cb1-9\"><a href=\"#cb1-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>    salario     <span class=\"dt\">DECIMAL</span>(<span class=\"dv\">10</span>,<span class=\"dv\">2</span>) <span class=\"kw\">CHECK</span> (salario <span class=\"op\">&gt;</span> <span class=\"dv\">0</span>),</span>\n<span id=\"cb1-10\"><a href=\"#cb1-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>    id_dept     <span class=\"dt\">INT</span>,</span>\n<span id=\"cb1-11\"><a href=\"#cb1-11\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">CONSTRAINT</span> fk_dept <span class=\"kw\">FOREIGN</span> <span class=\"kw\">KEY</span> (id_dept)</span>\n<span id=\"cb1-12\"><a href=\"#cb1-12\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"kw\">REFERENCES</span> DEPARTAMENTO(id_dept)</span>\n<span id=\"cb1-13\"><a href=\"#cb1-13\" aria-hidden=\"true\" tabindex=\"-1\"></a>);</span></code></pre></div>\n<h3 id=\"normalización\">Normalización</h3>\n<p>La normalización es un proceso de descomposición de tablas para eliminar redundancias y anomalías de inserción, actualización y borrado, basado en dependencias funcionales.</p>\n<p><strong>Primera Forma Normal (1FN):</strong> todos los atributos deben ser atómicos (indivisibles) y no debe haber grupos repetitivos.</p>\n<pre><code>NO 1FN:  Pedido(id, cliente, productos=&quot;lápiz,goma,folio&quot;)\n1FN:     PedidoLinea(id_pedido, producto)</code></pre>\n<p><strong>Segunda Forma Normal (2FN):</strong> debe estar en 1FN y todo atributo no clave debe depender funcionalmente de la clave primaria <strong>completa</strong> (elimina dependencias parciales, aplicable con claves compuestas).</p>\n<pre><code>NO 2FN: LineaPedido(id_pedido, id_producto, cant, nombre_producto)\n        -- nombre_producto depende solo de id_producto, no de la clave completa\n2FN:    LineaPedido(id_pedido, id_producto, cant)\n        Producto(id_producto, nombre_producto)</code></pre>\n<p><strong>Tercera Forma Normal (3FN):</strong> debe estar en 2FN y ningún atributo no clave debe depender de otro atributo no clave (elimina dependencias transitivas).</p>\n<pre><code>NO 3FN: Empleado(id_emp, id_dept, nombre_dept)\n        -- nombre_dept depende de id_dept, no de id_emp\n3FN:    Empleado(id_emp, id_dept)\n        Departamento(id_dept, nombre_dept)</code></pre>\n<p>Existen formas superiores (FNBC, 4FN, 5FN) que resuelven dependencias multivaluadas y de proyección-unión, aunque en la práctica profesional la 3FN o FNBC suele ser suficiente. En sistemas de alto rendimiento se aplica en ocasiones <strong>desnormalización</strong> controlada para reducir joins costosos, a cambio de asumir cierta redundancia gestionada.</p>\n<h3 id=\"metodologías-de-modelado\">Metodologías de modelado</h3>\n<p>Las metodologías estructuradas (Métrica v3, en la Administración española) definen fases: Estudio de Viabilidad, Análisis, Diseño, Construcción, Implantación y Mantenimiento, con el modelo E/R como artefacto central del subproceso de Diseño de Datos. Métrica v3 distingue el <strong>Diseño Lógico de Datos</strong> (paso a tablas, normalización) del <strong>Diseño Físico de Datos</strong> (elección de estructuras de almacenamiento, índices).</p>\n"}, {"num": 2, "title": "Lenguajes de programación. Representación de tipos de datos. Operadores. Instrucciones condicionales. Bucles y recursividad. Procedimientos, funciones y parámetros. Vectores y registros. Estructura de un programa.", "html": "<h3 id=\"clasificación-de-lenguajes\">Clasificación de lenguajes</h3>\n<p>Los lenguajes de programación se clasifican por su nivel de abstracción (máquina, ensamblador, alto nivel), por su paradigma (imperativo, orientado a objetos, funcional, declarativo/lógico) y por su forma de ejecución (compilados: C, C++; interpretados: Python, JavaScript; híbridos con máquina virtual: Java, C#). Un <strong>compilador</strong> traduce todo el código fuente a código máquina antes de ejecutarlo; un <strong>intérprete</strong> traduce y ejecuta instrucción a instrucción; los lenguajes como Java compilan a bytecode intermedio ejecutado por una JVM.</p>\n<h3 id=\"tipos-de-datos\">Tipos de datos</h3>\n<ul>\n<li><strong>Primitivos/simples</strong>: enteros (<code>int</code>, <code>long</code>), reales (<code>float</code>, <code>double</code>), carácter (<code>char</code>), booleano (<code>bool</code>), en coma flotante representados según IEEE 754.</li>\n<li><strong>Compuestos/estructurados</strong>: cadenas, vectores (arrays), registros (struct), uniones, punteros/referencias.</li>\n<li><strong>Abstractos (TDA)</strong>: pilas, colas, listas, árboles, definidos por su comportamiento, no por su representación interna.</li>\n</ul>\n<h3 id=\"operadores\">Operadores</h3>\n<ul>\n<li><strong>Aritméticos</strong>: <code>+ - * / % (módulo)</code>.</li>\n<li><strong>Relacionales</strong>: <code>== != &lt; &gt; &lt;= &gt;=</code>.</li>\n<li><strong>Lógicos</strong>: <code>AND OR NOT</code> (evaluación cortocircuito <code>&amp;&amp;</code>, <code>||</code>).</li>\n<li><strong>Asignación</strong>: <code>= += -= *=</code>.</li>\n<li><strong>Bit a bit</strong>: <code>&amp; | ^ ~ &lt;&lt; &gt;&gt;</code>.</li>\n</ul>\n<h3 id=\"estructuras-de-control\">Estructuras de control</h3>\n<pre><code>SI (edad &gt;= 18) ENTONCES\n    ESCRIBIR &quot;Mayor de edad&quot;\nSINO\n    ESCRIBIR &quot;Menor de edad&quot;\nFIN SI\n\nMIENTRAS (i &lt; 10) HACER\n    ESCRIBIR i\n    i &lt;- i + 1\nFIN MIENTRAS\n\nREPETIR\n    ESCRIBIR i\n    i &lt;- i + 1\nHASTA (i &gt;= 10)\n\nPARA i &lt;- 1 HASTA 10 HACER\n    ESCRIBIR i\nFIN PARA</code></pre>\n<h3 id=\"recursividad\">Recursividad</h3>\n<p>Una función recursiva se llama a sí misma, requiriendo siempre un <strong>caso base</strong> (condición de parada) y un <strong>caso recursivo</strong>.</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">int</span> <span class=\"fu\">factorial</span><span class=\"op\">(</span><span class=\"dt\">int</span> n<span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"cf\">if</span> <span class=\"op\">(</span>n <span class=\"op\">&lt;=</span> <span class=\"dv\">1</span><span class=\"op\">)</span> <span class=\"cf\">return</span> <span class=\"dv\">1</span><span class=\"op\">;</span>          <span class=\"co\">// caso base</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"cf\">return</span> n <span class=\"op\">*</span> <span class=\"fu\">factorial</span><span class=\"op\">(</span>n <span class=\"op\">-</span> <span class=\"dv\">1</span><span class=\"op\">);</span>   <span class=\"co\">// caso recursivo</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<h3 id=\"procedimientos-funciones-y-parámetros\">Procedimientos, funciones y parámetros</h3>\n<p>Un <strong>procedimiento</strong> ejecuta una acción sin devolver valor; una <strong>función</strong> devuelve un valor. Los parámetros pueden pasarse <strong>por valor</strong> (se copia, no se modifica el original) o <strong>por referencia</strong> (se pasa la dirección de memoria, permitiendo modificar el original).</p>\n<h3 id=\"vectores-y-registros\">Vectores y registros</h3>\n<div class=\"sourceCode\" id=\"cb3\"><pre class=\"sourceCode c\"><code class=\"sourceCode c\"><span id=\"cb3-1\"><a href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">int</span> notas<span class=\"op\">[</span><span class=\"dv\">5</span><span class=\"op\">]</span> <span class=\"op\">=</span> <span class=\"op\">{</span><span class=\"dv\">7</span><span class=\"op\">,</span> <span class=\"dv\">8</span><span class=\"op\">,</span> <span class=\"dv\">5</span><span class=\"op\">,</span> <span class=\"dv\">9</span><span class=\"op\">,</span> <span class=\"dv\">6</span><span class=\"op\">};</span>   <span class=\"co\">// vector: homogéneo, indexado</span></span>\n<span id=\"cb3-2\"><a href=\"#cb3-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">struct</span> Empleado <span class=\"op\">{</span>                  <span class=\"co\">// registro: heterogéneo</span></span>\n<span id=\"cb3-3\"><a href=\"#cb3-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">int</span> id<span class=\"op\">;</span></span>\n<span id=\"cb3-4\"><a href=\"#cb3-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">char</span> nombre<span class=\"op\">[</span><span class=\"dv\">50</span><span class=\"op\">];</span></span>\n<span id=\"cb3-5\"><a href=\"#cb3-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">float</span> salario<span class=\"op\">;</span></span>\n<span id=\"cb3-6\"><a href=\"#cb3-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">};</span></span></code></pre></div>\n<h3 id=\"estructura-de-un-programa\">Estructura de un programa</h3>\n<p>Cabecera/importación de librerías, declaración de constantes y tipos, variables globales, subprogramas, bloque principal, organizado en paquetes/módulos para favorecer la modularidad.</p>\n"}, {"num": 3, "title": "Lenguajes de interrogación de bases de datos. Estándar ANSI SQL. Procedimientos almacenados. Eventos y disparadores.", "html": "<p>SQL (Structured Query Language) es el lenguaje estándar (ISO/IEC 9075, originalmente ANSI SQL-86) para la gestión de bases de datos relacionales, subdividido en:</p>\n<p><strong>DDL</strong> (define estructura): <code>CREATE TABLE</code>, <code>ALTER TABLE</code>, <code>DROP TABLE</code>, <code>CREATE INDEX</code>.</p>\n<p><strong>DML</strong> (manipula datos): <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>, <code>SELECT</code> con <code>JOIN</code> (INNER, LEFT, RIGHT, FULL), <code>GROUP BY</code>/<code>HAVING</code>, subconsultas y funciones de ventana (<code>OVER (PARTITION BY ...)</code>).</p>\n<p><strong>DCL</strong> (permisos y transacciones): <code>GRANT</code>, <code>REVOKE</code>, <code>BEGIN TRANSACTION</code> / <code>COMMIT</code> / <code>ROLLBACK</code>.</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span> <span class=\"kw\">TRANSACTION</span>;</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">UPDATE</span> CUENTA <span class=\"kw\">SET</span> saldo <span class=\"op\">=</span> saldo <span class=\"op\">-</span> <span class=\"dv\">100</span> <span class=\"kw\">WHERE</span> <span class=\"kw\">id</span> <span class=\"op\">=</span> <span class=\"dv\">1</span>;</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">UPDATE</span> CUENTA <span class=\"kw\">SET</span> saldo <span class=\"op\">=</span> saldo <span class=\"op\">+</span> <span class=\"dv\">100</span> <span class=\"kw\">WHERE</span> <span class=\"kw\">id</span> <span class=\"op\">=</span> <span class=\"dv\">2</span>;</span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">COMMIT</span>;</span></code></pre></div>\n<p>Las transacciones cumplen ACID, con niveles de aislamiento (READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE).</p>\n<p><strong>Procedimientos almacenados</strong>: bloques compilados en el servidor (PL/SQL en Oracle, T-SQL en SQL Server) que encapsulan lógica de negocio.</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">PROCEDURE</span> ActualizarSalario @id_emp <span class=\"dt\">INT</span>, @porcentaje <span class=\"dt\">DECIMAL</span>(<span class=\"dv\">5</span>,<span class=\"dv\">2</span>)</span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">AS</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">UPDATE</span> EMPLEADO <span class=\"kw\">SET</span> salario <span class=\"op\">=</span> salario <span class=\"op\">*</span> (<span class=\"dv\">1</span> <span class=\"op\">+</span> @porcentaje<span class=\"op\">/</span><span class=\"dv\">100</span>) <span class=\"kw\">WHERE</span> id_emp <span class=\"op\">=</span> @id_emp;</span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">END</span>;</span></code></pre></div>\n<p><strong>Triggers</strong>: se ejecutan automáticamente ante un evento DML/DDL, sin invocación explícita.</p>\n<div class=\"sourceCode\" id=\"cb3\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb3-1\"><a href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">TRIGGER</span> trg_AuditoriaSalario <span class=\"kw\">ON</span> EMPLEADO <span class=\"kw\">AFTER</span> <span class=\"kw\">UPDATE</span></span>\n<span id=\"cb3-2\"><a href=\"#cb3-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">AS</span></span>\n<span id=\"cb3-3\"><a href=\"#cb3-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span></span>\n<span id=\"cb3-4\"><a href=\"#cb3-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"cf\">IF</span> <span class=\"kw\">UPDATE</span>(salario)</span>\n<span id=\"cb3-5\"><a href=\"#cb3-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"kw\">INSERT</span> <span class=\"kw\">INTO</span> AUDITORIA_SALARIO (id_emp, salario_anterior, fecha)</span>\n<span id=\"cb3-6\"><a href=\"#cb3-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"kw\">SELECT</span> d.id_emp, d.salario, GETDATE() <span class=\"kw\">FROM</span> deleted d;</span>\n<span id=\"cb3-7\"><a href=\"#cb3-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">END</span>;</span></code></pre></div>\n<p>Se clasifican por momento (<code>BEFORE</code>/<code>AFTER</code>/<code>INSTEAD OF</code>) y ámbito (por fila o por sentencia). Uso típico: auditoría, validación de reglas complejas, integridad referencial personalizada.</p>\n"}, {"num": 4, "title": "Diseño y programación orientada a objetos. Elementos y componentes software: objetos, clases, herencia, métodos, sobrecarga. Ventajas e inconvenientes. Patrones de diseño y lenguaje de modelado unificado (UML).", "html": "<h3 id=\"fundamentos-de-la-poo\">Fundamentos de la POO</h3>\n<p>La POO organiza el software en <strong>objetos</strong>, instancias de <strong>clases</strong>. Sus cuatro pilares: <strong>encapsulamiento</strong>, <strong>abstracción</strong>, <strong>herencia</strong> y <strong>polimorfismo</strong>.</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"
