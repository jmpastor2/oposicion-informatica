></a><span class=\"kw\">public</span> <span class=\"kw\">abstract</span> <span class=\"kw\">class</span> Vehiculo <span class=\"op\">{</span></span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">protected</span> <span class=\"bu\">String</span> matricula<span class=\"op\">;</span></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">protected</span> <span class=\"dt\">int</span> velocidad<span class=\"op\">;</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"fu\">Vehiculo</span><span class=\"op\">(</span><span class=\"bu\">String</span> matricula<span class=\"op\">)</span> <span class=\"op\">{</span> <span class=\"kw\">this</span><span class=\"op\">.</span><span class=\"fu\">matricula</span> <span class=\"op\">=</span> matricula<span class=\"op\">;</span> <span class=\"op\">}</span></span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"kw\">abstract</span> <span class=\"dt\">void</span> <span class=\"fu\">acelerar</span><span class=\"op\">();</span></span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"dt\">void</span> <span class=\"fu\">frenar</span><span class=\"op\">()</span> <span class=\"op\">{</span> velocidad <span class=\"op\">=</span> <span class=\"dv\">0</span><span class=\"op\">;</span> <span class=\"op\">}</span></span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb1-9\"><a href=\"#cb1-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> Coche <span class=\"kw\">extends</span> Vehiculo <span class=\"op\">{</span>          <span class=\"co\">// herencia</span></span>\n<span id=\"cb1-10\"><a href=\"#cb1-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"fu\">Coche</span><span class=\"op\">(</span><span class=\"bu\">String</span> matricula<span class=\"op\">)</span> <span class=\"op\">{</span> <span class=\"kw\">super</span><span class=\"op\">(</span>matricula<span class=\"op\">);</span> <span class=\"op\">}</span></span>\n<span id=\"cb1-11\"><a href=\"#cb1-11\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"at\">@Override</span></span>\n<span id=\"cb1-12\"><a href=\"#cb1-12\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"dt\">void</span> <span class=\"fu\">acelerar</span><span class=\"op\">()</span> <span class=\"op\">{</span> velocidad <span class=\"op\">+=</span> <span class=\"dv\">20</span><span class=\"op\">;</span> <span class=\"op\">}</span>   <span class=\"co\">// polimorfismo/sobreescritura</span></span>\n<span id=\"cb1-13\"><a href=\"#cb1-13\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"dt\">void</span> <span class=\"fu\">acelerar</span><span class=\"op\">(</span><span class=\"dt\">int</span> incremento<span class=\"op\">)</span> <span class=\"op\">{</span> velocidad <span class=\"op\">+=</span> incremento<span class=\"op\">;</span> <span class=\"op\">}</span>  <span class=\"co\">// sobrecarga</span></span>\n<span id=\"cb1-14\"><a href=\"#cb1-14\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p>La <strong>sobrecarga (overloading)</strong> define varios métodos con el mismo nombre y distinta firma, resuelta en compilación. La <strong>sobreescritura (overriding)</strong> redefine un método heredado, resuelta en ejecución.</p>\n<p><strong>Ventajas</strong>: reutilización, mantenibilidad, modelado natural, extensión sin modificar código existente. <strong>Inconvenientes</strong>: curva de aprendizaje, sobrecarga en tiempo de ejecución, riesgo de jerarquías mal diseñadas.</p>\n<p><strong>Principios SOLID</strong>: Responsabilidad única, Abierto/cerrado, Sustitución de Liskov, Segregación de interfaces, Inversión de dependencias.</p>\n<p><strong>Patrones de diseño</strong> (Gang of Four, 1994): creacionales (Singleton, Factory Method, Builder), estructurales (Adapter, Decorator, Facade), de comportamiento (Observer, Strategy, Command).</p>\n<p><strong>UML</strong>: diagrama de clases (atributos, métodos, relaciones: asociación, agregación ◇, composición ◆, herencia △), diagrama de casos de uso (actores, <code>&lt;&lt;include&gt;&gt;</code>/<code>&lt;&lt;extend&gt;&gt;</code>), diagrama de secuencia (interacción temporal entre objetos).</p>\n"}, {"num": 5, "title": "Arquitectura Java EE/Jakarta EE y plataforma .NET: componentes, persistencia y seguridad. Características, elementos, lenguajes y funciones en ambos entornos. Desarrollo de interfaces.", "html": "<h3 id=\"jakarta-ee-antes-java-ee\">Jakarta EE (antes Java EE)</h3>\n<p>Conjunto de especificaciones sobre la JVM, ejecutado sobre servidor de aplicaciones (WildFly, GlassFish, WebSphere Liberty). Componentes: <strong>Servlets</strong>, <strong>JSP/JSF</strong>, <strong>EJB</strong> (lógica de negocio con soporte transaccional), <strong>CDI</strong> (inyección de dependencias), <strong>JPA</strong> (ORM, implementado por Hibernate), <strong>JAX-RS/JAX-WS</strong> (REST/SOAP).</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">@Entity</span></span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> Empleado <span class=\"op\">{</span></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"at\">@Id</span> <span class=\"at\">@GeneratedValue</span> <span class=\"kw\">private</span> <span class=\"bu\">Long</span> id<span class=\"op\">;</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">private</span> <span class=\"bu\">String</span> nombre<span class=\"op\">;</span></span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">@Path</span><span class=\"op\">(</span><span class=\"st\">&quot;/empleados&quot;</span><span class=\"op\">)</span></span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> EmpleadoResource <span class=\"op\">{</span></span>\n<span id=\"cb1-9\"><a href=\"#cb1-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"at\">@GET</span> <span class=\"at\">@Path</span><span class=\"op\">(</span><span class=\"st\">&quot;/{id}&quot;</span><span class=\"op\">)</span></span>\n<span id=\"cb1-10\"><a href=\"#cb1-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> Empleado <span class=\"fu\">obtener</span><span class=\"op\">(</span><span class=\"at\">@PathParam</span><span class=\"op\">(</span><span class=\"st\">&quot;id&quot;</span><span class=\"op\">)</span> <span class=\"bu\">Long</span> id<span class=\"op\">)</span> <span class=\"op\">{</span> <span class=\"cf\">return</span> entityManager<span class=\"op\">.</span><span class=\"fu\">find</span><span class=\"op\">(</span>Empleado<span class=\"op\">.</span><span class=\"fu\">class</span><span class=\"op\">,</span> id<span class=\"op\">);</span> <span class=\"op\">}</span></span>\n<span id=\"cb1-11\"><a href=\"#cb1-11\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p>Seguridad: Jakarta Security (<code>@RolesAllowed</code>), realms del servidor de aplicaciones.</p>\n<h3 id=\"plataforma-net\">Plataforma .NET</h3>\n<p>Multiplataforma desde .NET 5. Lenguajes: C#, F#, VB.NET, compilados a CIL/MSIL ejecutado por el CLR (garbage collector, JIT). Componentes: <strong>ASP.NET Core</strong> (MVC, Web API), <strong>Entity Framework Core</strong> (ORM), <strong>ASP.NET Core Identity</strong> (autenticación).</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode csharp\"><code class=\"sourceCode cs\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">[</span>ApiController<span class=\"op\">][</span><span class=\"fu\">Route</span><span class=\"op\">(</span><span class=\"st\">&quot;api/[controller]&quot;</span><span class=\"op\">)]</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> EmpleadosController <span class=\"op\">:</span> ControllerBase <span class=\"op\">{</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"op\">[</span><span class=\"fu\">HttpGet</span><span class=\"op\">(</span><span class=\"st\">&quot;{id}&quot;</span><span class=\"op\">)][</span><span class=\"fu\">Authorize</span><span class=\"op\">(</span>Roles <span class=\"op\">=</span> <span class=\"st\">&quot;Administrador&quot;</span><span class=\"op\">)]</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> async Task<span class=\"op\">&lt;</span>ActionResult<span class=\"op\">&lt;</span>Empleado<span class=\"op\">&gt;&gt;</span> <span class=\"fu\">Obtener</span><span class=\"op\">(</span><span class=\"dt\">int</span> id<span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"dt\">var</span> emp <span class=\"op\">=</span> await _context<span class=\"op\">.</span><span class=\"fu\">Empleados</span><span class=\"op\">.</span><span class=\"fu\">FindAsync</span><span class=\"op\">(</span>id<span class=\"op\">);</span></span>\n<span id=\"cb2-6\"><a href=\"#cb2-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"kw\">return</span> emp <span class=\"kw\">is</span> <span class=\"kw\">null</span> <span class=\"op\">?</span> <span class=\"fu\">NotFound</span><span class=\"op\">()</span> <span class=\"op\">:</span> <span class=\"fu\">Ok</span><span class=\"op\">(</span>emp<span class=\"op\">);</span></span>\n<span id=\"cb2-7\"><a href=\"#cb2-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"op\">}</span></span>\n<span id=\"cb2-8\"><a href=\"#cb2-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<h3 id=\"comparativa\">Comparativa</h3>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Java EE/Jakarta EE</th>\n<th>.NET</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ORM</td>\n<td>JPA (Hibernate)</td>\n<td>Entity Framework Core</td>\n</tr>\n<tr>\n<td>DI</td>\n<td>CDI</td>\n<td>Contenedor DI integrado</td>\n</tr>\n<tr>\n<td>Servidor</td>\n<td>Externo (WildFly, Tomcat)</td>\n<td>Kestrel embebido</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"desarrollo-de-interfaces\">Desarrollo de interfaces</h3>\n<p>Ambos entornos desacoplan presentación de backend: Java EE con JSF/PrimeFaces o frontend SPA (Angular/React) consumiendo REST; .NET con Razor Pages/Blazor o igualmente un frontend SPA independiente. Convergen en la arquitectura desacoplada backend-API / frontend-SPA.</p>\n"}, {"num": 6, "title": "Arquitectura de sistemas cliente/servidor y multicapas: componentes y operación. Arquitecturas de servicios web y protocolos asociados.", "html": "<h3 id=\"clienteservidor\">Cliente/servidor</h3>\n<ul>\n<li><strong>2 capas</strong>: cliente con presentación+negocio, acceso directo a BD. Acoplamiento fuerte.</li>\n<li><strong>3 capas</strong>: separa presentación, lógica de negocio y datos.</li>\n<li><strong>N capas</strong>: añade capas adicionales (servicios, integración, caché).</li>\n</ul>\n<pre><code>[Cliente/Navegador] --HTTP--&gt; [Servidor de Aplicaciones] --SQL--&gt; [Servidor de BD]</code></pre>\n<p><strong>SOA</strong>: servicios débilmente acoplados coordinados por un bus (ESB). <strong>Microservicios</strong>: servicios pequeños y autónomos con BD propia, desplegados en contenedores (Docker/Kubernetes), comunicados vía REST o mensajería asíncrona (Kafka, RabbitMQ).</p>\n<h3 id=\"servicios-web\">Servicios web</h3>\n<p><strong>SOAP</strong>: basado en XML, contrato formal en WSDL, catalogado en UDDI, soporta WS-Security y transacciones — usado en banca y Administración Pública.</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode xml\"><code class=\"sourceCode xml\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a>&lt;<span class=\"kw\">soap:Envelope</span> <span class=\"ot\">xmlns:soap=</span><span class=\"st\">&quot;http://www.w3.org/2003/05/soap-envelope&quot;</span>&gt;</span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>  &lt;<span class=\"kw\">soap:Body</span>&gt;&lt;<span class=\"kw\">ObtenerEmpleado</span>&gt;&lt;<span class=\"kw\">id</span>&gt;5&lt;/<span class=\"kw\">id</span>&gt;&lt;/<span class=\"kw\">ObtenerEmpleado</span>&gt;&lt;/<span class=\"kw\">soap:Body</span>&gt;</span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>&lt;/<span class=\"kw\">soap:Envelope</span>&gt;</span></code></pre></div>\n<p><strong>REST</strong>: estilo arquitectónico (Roy Fielding), recursos por URI, verbos HTTP, sin estado, JSON.</p>\n<pre class=\"http\"><code>GET /api/empleados/5 HTTP/1.1\nAccept: application/json</code></pre>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>SOAP</th>\n<th>REST</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Formato</td>\n<td>XML estricto</td>\n<td>JSON típico</td>\n</tr>\n<tr>\n<td>Contrato</td>\n<td>WSDL formal</td>\n<td>OpenAPI/Swagger opcional</td>\n</tr>\n<tr>\n<td>Estado</td>\n<td>Puede ser stateful</td>\n<td>Stateless</td>\n</tr>\n</tbody>\n</table>\n<p>Otros: GraphQL (consultas flexibles), gRPC (RPC sobre HTTP/2 con Protocol Buffers), AMQP/MQTT (mensajería asíncrona).</p>\n"}, {"num": 7, "title": "Aplicaciones web. Desarrollo web front-end y en servidor, multiplataforma y multidispositivo. Lenguajes: HTML, XML y sus derivaciones. Navegadores y lenguajes de programación web. Lenguajes de script.", "html": "<h3 id=\"arquitectura-de-una-aplicación-web\">Arquitectura de una aplicación web</h3>\n<p><strong>Front-end</strong>: HTML, CSS, JavaScript ejecutados en el navegador. <strong>Back-end/server-side</strong>: Java, C#, PHP, Node.js, Python, responsable de lógica de negocio. Renderizado: SSR, CSR (SPA React/Angular/Vue), o híbrido (Next.js).</p>\n<h3 id=\"html5\">HTML5</h3>\n<p>Etiquetas semánticas (<code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;article&gt;</code>), APIs nativas (Canvas, geolocalización, WebSockets), multimedia sin plugins (<code>&lt;video&gt;</code>, <code>&lt;audio&gt;</code>).</p>\n<h3 id=\"xml-y-derivaciones\">XML y derivaciones</h3>\n<p>Metalenguaje jerárquico autodescriptivo. Tecnologías asociadas: <strong>XSD</strong> (esquemas), <strong>XSLT</strong> (transformación), <strong>XPath</strong> (navegación), <strong>DTD</strong>. Frente a XML, <strong>JSON</strong> es más ligero y de mapeo directo a estructuras de programación, aunque XML se mantiene donde se requiere validación estricta (SOAP, facturación electrónica, interoperabilidad Administración).</p>\n<h3 id=\"navegadores\">Navegadores</h3>\n<p>Motores de renderizado: Blink (Chrome/Edge), Gecko (Firefox), WebKit (Safari). Motores JavaScript: V8, SpiderMonkey.</p>\n<h3 id=\"lenguajes-de-script-y-css\">Lenguajes de script y CSS</h3>\n<p><strong>JavaScript</strong>: dinámico, débilmente tipado, basado en prototipos, bucle de eventos (<code>Promise</code>, <code>async/await</code>).</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode javascript\"><code class=\"sourceCode javascript\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">async</span> <span class=\"kw\">function</span> <span class=\"fu\">obtenerEmpleado</span>(id) {</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">const</span> respuesta <span class=\"op\">=</span> <span class=\"cf\">await</span> <span class=\"fu\">fetch</span>(<span class=\"vs\">`/api/empleados/</span><span class=\"sc\">${</span>id<span class=\"sc\">}</span><span class=\"vs\">`</span>)<span class=\"op\">;</span></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">const</span> datos <span class=\"op\">=</span> <span class=\"cf\">await</span> respuesta<span class=\"op\">.</span><span class=\"fu\">json</span>()<span class=\"op\">;</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>}</span></code></pre></div>\n<p><strong>TypeScript</strong>: tipado estático opcional sobre JavaScript. <strong>CSS3</strong>: Flexbox, Grid, media queries, base del diseño responsive.</p>\n<h3 id=\"multiplataforma-y-multidispositivo\">Multiplataforma y multidispositivo</h3>\n<p>Responsive design (mobile first) + frameworks CSS (Bootstrap, Tailwind). Para nativas/híbridas: React Native, Flutter, Ionic.</p>\n"}, {"num": 8, "title": "Accesibilidad, diseño universal y usabilidad. Acceso y usabilidad de las tecnologías, productos y servicios relacionados con la sociedad de la información. Confidencialidad y disponibilidad de la información en puestos de usuario final. Conceptos de seguridad en el desarrollo de los sistemas.", "html": "<h3 id=\"accesibilidad-y-diseño-universal\">Accesibilidad y diseño universal</h3>\n<p>Garantiza que personas con discapacidad puedan percibir, entender, navegar e interactuar con un sistema. Normativa española: RDLeg 1/2013 y RD 1112/2018 (accesibilidad web y apps móviles del sector público).</p>\n<h3 id=\"wcag-pour\">WCAG (POUR)</h3>\n<p><strong>Perceptible, Operable, Comprensible, Robusto.</strong> Niveles A, AA (exigido por normativa), AAA.</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode html\"><code class=\"sourceCode html\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;</span><span class=\"kw\">img</span><span class=\"ot\"> src</span><span class=\"op\">=</span><span class=\"st\">&quot;grafico.png&quot;</span><span class=\"ot\"> alt</span><span class=\"op\">=</span><span class=\"st\">&quot;Gráfico de ventas trimestrales 2025&quot;</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;</span><span class=\"kw\">label</span><span class=\"ot\"> for</span><span class=\"op\">=</span><span class=\"st\">&quot;dni&quot;</span><span class=\"dt\">&gt;</span>DNI:<span class=\"dt\">&lt;/</span><span class=\"kw\">label</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;</span><span class=\"kw\">input</span><span class=\"ot\"> type</span><span class=\"op\">=</span><span class=\"st\">&quot;text&quot;</span><span class=\"ot\"> id</span><span class=\"op\">=</span><span class=\"st\">&quot;dni&quot;</span><span class=\"ot\"> aria-required</span><span class=\"op\">=</span><span class=\"st\">&quot;true&quot;</span><span class=\"dt\">&gt;</span></span></code></pre></div>\n<h3 id=\"usabilidad\">Usabilidad</h3>\n<p>ISO 9241-11: eficacia, eficiencia y satisfacción. Heurísticas de Nielsen: visibilidad del estado, coherencia, prevención de errores.</p>\n<h3 id=\"confidencialidad-y-disponibilidad-en-el-puesto-de-usuario-final\">Confidencialidad y disponibilidad en el puesto de usuario final</h3>\n<p>Tríada <strong>CID</strong>: confidencialidad (cifrado de disco, bloqueo de sesión, MFA), integridad (firmas digitales, hash), disponibilidad (backups, SAI, redundancia). Marco normativo: <strong>ENS</strong> (RD 311/2022).</p>\n<h3 id=\"seguridad-en-el-desarrollo-owasp-top-10\">Seguridad en el desarrollo (OWASP Top 10)</h3>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">-- Vulnerable a inyección SQL</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ot\">&quot;SELECT * FROM usuarios WHERE nombre = &#39;&quot;</span> <span class=\"op\">+</span> nombreUsuario <span class=\"op\">+</span> <span class=\"ot\">&quot;&#39;&quot;</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">-- Correcto: parametrizada</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">SELECT</span> <span class=\"op\">*</span> <span class=\"kw\">FROM</span> usuarios <span class=\"kw\">WHERE</span> nombre <span class=\"op\">=</span> @nombreUsuario;</span></code></pre></div>\n<p>Mitigaciones: consultas parametrizadas (SQLi), codificación de salida + CSP (XSS), tokens anti-CSRF, hash con sal bcrypt/PBKDF2 (contraseñas), JWT firmados con expiración, cookies <code>HttpOnly</code>/<code>Secure</code>/<code>SameSite</code>.</p>\n"}, {"num": 9, "title": "Repositorios: estructura y actualización. Generación de código y documentación. Metodologías de desarrollo. Pruebas. Programas para control de versiones. Plataformas de desarrollo colaborativo de software.", "html": "<h3 id=\"control-de-versiones\">Control de versiones</h3>\n<p><strong>Centralizados</strong> (SVN, CVS) vs <strong>distribuidos</strong> (Git). Git: commit, branch, merge, remote, pull/merge request.</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> init</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> add archivo.java</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> commit <span class=\"at\">-m</span> <span class=\"st\">&quot;Añade validación de entrada&quot;</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> branch feature/login</span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> push origin feature/login</span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> merge feature/login</span></code></pre></div>\n<p>Estrategias: Git Flow (<code>main</code>/<code>develop</code>/<code>feature</code>/<code>release</code>/<code>hotfix</code>), GitHub Flow, Trunk-Based Development.</p>\n<h3 id=\"plataformas-colaborativas\">Plataformas colaborativas</h3>\n<p>GitHub, GitLab, Bitbucket: issues, pull/merge requests, CI/CD (<code>.gitlab-ci.yml</code>, GitHub Actions), wikis, tableros Kanban.</p>\n<h3 id=\"generación-de-código-y-documentación\">Generación de código y documentación</h3>\n<p>Herramientas CASE, scaffolding. Documentación desde comentarios estructurados: Javadoc, Doxygen, Swagger/OpenAPI.</p>\n<h3 id=\"metodologías-de-desarrollo\">Metodologías de desarrollo</h3>\n<p><strong>Cascada</strong>: fases secuenciales estrictas, sin retroceso. <strong>Ágiles</strong> (Manifiesto Ágil 2001): iterativo e incremental.</p>\n<ul>\n<li><strong>Scrum</strong>: sprints, roles (Product Owner, Scrum Master, equipo), Product/Sprint Backlog, Daily/Planning/Review/Retrospectiva.</li>\n<li><strong>Kanban</strong>: flujo continuo, límites WIP.</li>\n<li><strong>XP</strong>: programación en parejas, integración continua, TDD.</li>\n</ul>\n<h3 id=\"pruebas-de-software\">Pruebas de software</h3>\n<p>Pirámide de testing: unitarias (JUnit), integración, sistema, aceptación.</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">@Test</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">void</span> <span class=\"fu\">debeCalcularSalarioNetoCorrectamente</span><span class=\"op\">()</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    Empleado emp <span class=\"op\">=</span> <span class=\"kw\">new</span> <span class=\"fu\">Empleado</span><span class=\"op\">(</span><span class=\"fl\">2000.0</span><span class=\"op\">);</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"fu\">assertEquals</span><span class=\"op\">(</span><span class=\"fl\">1600.0</span><span class=\"op\">,</span> emp<span class=\"op\">.</span><span class=\"fu\">calcularNeto</span><span class=\"op\">(),</span> <span class=\"fl\">0.01</span><span class=\"op\">);</span></span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p><strong>TDD</strong>: ciclo red-green-refactor. <strong>CI/CD</strong>: integración y despliegue continuo automatizados en cada cambio.</p>\n"}]}, {"key": "b4", "title": "Bloque IV — Sistemas y comunicaciones", "temas": [{"num": 1, "title": "Administración del Sistema operativo y software de base. Actualización, mantenimiento y reparación del sistema operativo.", "html": "<p>La administración del sistema operativo constituye la base operativa sobre la que se sustentan los servicios de cualquier organización. En el contexto de la Administración General del Estado, esta labor está condicionada por el Esquema Nacional de Seguridad (ENS, Real Decreto 311/2022), que exige gestión de vulnerabilidades, trazabilidad de cambios y disponibilidad de los sistemas críticos.</p>\n<h3 id=\"administración-de-sistemas-linux-gestores-de-paquetes\">Administración de sistemas Linux: gestores de paquetes</h3>\n<p>Cada familia de distribuciones implementa su propio sistema de gestión de paquetes, con una capa de bajo nivel (instala/desinstala paquetes individuales) y una capa de alto nivel (resuelve dependencias y repositorios).</p>\n<p><strong>Debian/Ubuntu — dpkg y APT.</strong> <code>dpkg</code> es la herramienta de bajo nivel que instala ficheros <code>.deb</code>:</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">dpkg</span> <span class=\"at\">-i</span> paquete.deb</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">dpkg</span> <span class=\"at\">-l</span> <span class=\"kw\">|</span> <span class=\"fu\">grep</span> openssh</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">dpkg</span> <span class=\"at\">-L</span> openssh-server        <span class=\"co\"># lista ficheros instalados por el paquete</span></span></code></pre></div>\n<p>APT resuelve dependencias y repositorios (<code>/etc/apt/sources.list</code> y <code>/etc/apt/sources.list.d/</code>):</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">apt</span> update <span class=\"kw\">&amp;&amp;</span> <span class=\"ex\">apt</span> list <span class=\"at\">--upgradable</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">apt</span> full-upgrade <span class=\"at\">-y</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">apt</span> install nginx=1.18.0-6ubuntu14.4</span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">apt-mark</span> hold nginx            <span class=\"co\"># evita que se actualice en upgrades futuros</span></span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">apt</span> autoremove <span class=\"at\">--purge</span></span></code></pre></div>\n<p><strong>RedHat/CentOS/Fedora — RPM y DNF/YUM.</strong> <code>rpm</code> es el equivalente de bajo nivel a dpkg; <code>dnf</code> (sucesor de <code>yum</code> desde RHEL 8) resuelve dependencias:</p>\n<div class=\"sourceCode\" id=\"cb3\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb3-1\"><a href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">rpm</span> <span class=\"at\">-qa</span> <span class=\"kw\">|</span> <span class=\"fu\">grep</span> httpd</span>\n<span id=\"cb3-2\"><a href=\"#cb3-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">rpm</span> <span class=\"at\">-qi</span> kernel</span>\n<span id=\"cb3-3\"><a href=\"#cb3-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">dnf</span> check-update</span>\n<span id=\"cb3-4\"><a href=\"#cb3-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">dnf</span> update <span class=\"at\">--security</span>          <span class=\"co\"># solo parches de seguridad</span></span>\n<span id=\"cb3-5\"><a href=\"#cb3-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">dnf</span> history                    <span class=\"co\"># traza transacciones, permite dnf history undo &lt;id&gt;</span></span>\n<span id=\"cb3-6\"><a href=\"#cb3-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">dnf</span> versionlock add nginx</span></code></pre></div>\n<p><strong>SUSE — zypper.</strong> Similar filosofía, con gestión de patrones y \"patches\" diferenciados de paquetes normales:</p>\n<div class=\"sourceCode\" id=\"cb4\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb4-1\"><a href=\"#cb4-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">zypper</span> refresh</span>\n<span id=\"cb4-2\"><a href=\"#cb4-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">zypper</span> list-updates</span>\n<span id=\"cb4-3\"><a href=\"#cb4-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">zypper</span> patch                   <span class=\"co\"># instala solo los parches oficiales del vendor</span></span>\n<span id=\"cb4-4\"><a href=\"#cb4-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">zypper</span> install <span class=\"at\">-t</span> pattern kvm_server</span></code></pre></div>\n<p><strong>Arch — pacman.</strong> Modelo rolling release, sincronización y caché local:</p>\n<div class=\"sourceCode\" id=\"cb5\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb5-1\"><a href=\"#cb5-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">pacman</span> <span class=\"at\">-Syu</span></span>\n<span id=\"cb5-2\"><a href=\"#cb5-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">pacman</span> <span class=\"at\">-Qdt</span>                    <span class=\"co\"># paquetes huérfanos (dependencias no reclamadas)</span></span>\n<span id=\"cb5-3\"><a href=\"#cb5-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">pacman</span> <span class=\"at\">-Sc</span>                     <span class=\"co\"># limpia caché de paquetes descargados</span></span></code></pre></div>\n<h3 id=\"systemd-unidades-systemctl-y-journalctl\">systemd: unidades, systemctl y journalctl</h3>\n<p><code>systemd</code> es el sistema de inicio (init) y gestor de servicios de la práctica totalidad de distribuciones modernas (sustituye a SysVinit/Upstart). Organiza el sistema en <strong>unidades</strong>, ficheros de texto ubicados en <code>/etc/systemd/system/</code> (administrador), <code>/usr/lib/systemd/system/</code> (paquetes) y <code>/run/systemd/system/</code> (runtime), con precedencia decreciente en ese orden.</p>\n<ul>\n<li><strong><code>.service</code></strong>: define un proceso demonio. Secciones típicas <code>[Unit]</code> (metadatos, dependencias <code>Requires=</code>, <code>After=</code>), <code>[Service]</code> (<code>ExecStart=</code>, <code>Restart=on-failure</code>, <code>Type=notify|simple|forking</code>) y <code>[Install]</code> (<code>WantedBy=multi-user.target</code>).</li>\n<li><strong><code>.timer</code></strong>: sustituye a cron para tareas programadas, con <code>OnCalendar=</code> o <code>OnBootSec=</code>; siempre va emparejado a un <code>.service</code> homónimo.</li>\n<li><strong><code>.mount</code></strong> / <strong><code>.automount</code></strong>: puntos de montaje gestionados declarativamente (alternativa a <code>/etc/fstab</code>).</li>\n<li><strong><code>.socket</code></strong>: activación por socket (systemd escucha el puerto y arranca el servicio bajo demanda, patrón usado por <code>sshd.socket</code> o <code>cups.socket</code>).</li>\n</ul>\n<p>Comandos habituales:</p>\n<div class=\"sourceCode\" id=\"cb6\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb6-1\"><a href=\"#cb6-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">systemctl</span> status sshd</span>\n<span id=\"cb6-2\"><a href=\"#cb6-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">systemctl</span> enable <span class=\"at\">--now</span> nginx.service</span>\n<span id=\"cb6-3\"><a href=\"#cb6-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">systemctl</span> daemon-reload                  <span class=\"co\"># tras editar un unit file</span></span>\n<span id=\"cb6-4\"><a href=\"#cb6-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">systemctl</span> mask bluetooth.service         <span class=\"co\"># bloquea el arranque incluso manual</span></span>\n<span id=\"cb6-5\"><a href=\"#cb6-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">systemctl</span> list-units <span class=\"at\">--type</span><span class=\"op\">=</span>timer <span class=\"at\">--all</span></span>\n<span id=\"cb6-6\"><a href=\"#cb6-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">systemctl</span> edit nginx.service             <span class=\"co\"># crea un &quot;drop-in&quot; en /etc/systemd/system/nginx.service.d/</span></span></code></pre></div>\n<p><code>journalctl</code> consulta el diario binario de systemd (<code>journald</code>):</p>\n<div class=\"sourceCode\" id=\"cb7\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb7-1\"><a href=\"#cb7-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">journalctl</span> <span class=\"at\">-u</span> nginx.service <span class=\"at\">--since</span> <span class=\"st\">&quot;2026-08-27 08:00&quot;</span> <span class=\"at\">--until</span> now</span>\n<span id=\"cb7-2\"><a href=\"#cb7-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">journalctl</span> <span class=\"at\">-k</span> <span class=\"at\">-b</span> <span class=\"at\">-1</span>              <span class=\"co\"># mensajes de kernel del arranque anterior</span></span>\n<span id=\"cb7-3\"><a href=\"#cb7-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">journalctl</span> <span class=\"at\">-f</span>                    <span class=\"co\"># seguimiento en tiempo real, equivalente a tail -f</span></span>\n<span id=\"cb7-4\"><a href=\"#cb7-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">journalctl</span> <span class=\"at\">--disk-usage</span></span>\n<span id=\"cb7-5\"><a href=\"#cb7-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">journalctl</span> <span class=\"at\">--vacuum-time</span><span class=\"op\">=</span>7d      <span class=\"co\"># purga entradas de más de 7 días</span></span></code></pre></div>\n<h3 id=\"gestión-de-logs-logrotate-rsyslog-y-journald\">Gestión de logs: logrotate, rsyslog y journald</h3>\n<p>Existen dos modelos convivientes en Linux. <strong>journald</strong> almacena logs en formato binario indexado (<code>/var/log/journal/</code> si es persistente, configurable en <code>/etc/systemd/journald.conf</code> con <code>Storage=persistent</code>), con retención controlada por <code>SystemMaxUse=</code>. <strong>rsyslog</strong> (o syslog-ng) es el demonio syslog clásico, que escribe texto plano en <code>/var/log/</code> según reglas de <code>/etc/rsyslog.conf</code> (facility.priority → destino, p. ej. <code>mail.* /var/log/maillog</code>) y puede reenviar logs a un colector centralizado (SIEM) vía TCP/UDP 514 o RELP.</p>\n<p><code>logrotate</code> (ejecutado vía <code>.timer</code>/cron diario) rota los ficheros de texto plano que genera rsyslog para evitar que crezcan indefinidamente, según reglas en <code>/etc/logrotate.d/</code>:</p>\n<pre><code>/var/log/nginx/*.log {\n    daily\n    rotate 14\n    compress\n    delaycompress\n    missingok\n    notifempty\n    sharedscripts\n    postrotate\n        systemctl reload nginx &gt; /dev/null 2&gt;&amp;1 || true\n    endscript\n}</code></pre>\n<p>journald no necesita logrotate porque autogestiona su propio espacio, pero en entornos regulados por el ENS suele configurarse forwarding a rsyslog (<code>ForwardToSyslog=yes</code>) para centralizar la trazabilidad exigida en auditoría.</p>\n<h3 id=\"administración-de-windows-server\">Administración de Windows Server</h3>\n<p><strong>Windows Update y WSUS.</strong> Windows Server Update Services permite desplegar un punto central que descarga actualizaciones de Microsoft Update y las distribuye internamente, con aprobación manual por grupos de equipos (evita que un parche defectuoso se despliegue sin control). Se gestiona vía consola WSUS o PowerShell (<code>Get-WsusUpdate</code>, <code>Approve-WsusUpdate</code>). El cliente se apunta mediante GPO (<code>Configurar el servicio de Windows Update</code>, ruta del servidor de intranet).</p>\n<p><strong>PowerShell DSC (Desired State Configuration).</strong> Modelo declarativo idempotente para forzar el estado de un servidor (roles instalados, ficheros, servicios en ejecución):</p>\n<div class=\"sourceCode\" id=\"cb9\"><pre class=\"sourceCode powershell\"><code class=\"sourceCode powershell\"><span id=\"cb9-1\"><a href=\"#cb9-1\" aria-hidden=\"true\" tabindex=\"-1\"></a>Configuration WebServerConfig <span class=\"op\">{</span></span>\n<span id=\"cb9-2\"><a href=\"#cb9-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    Node <span class=\"st\">&quot;SRV-WEB01&quot;</span> <span class=\"op\">{</span></span>\n<span id=\"cb9-3\"><a href=\"#cb9-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>        WindowsFeature IIS <span class=\"op\">{</span></span>\n<span id=\"cb9-4\"><a href=\"#cb9-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>            Ensure <span class=\"op\">=</span> <span class=\"st\">&quot;Present&quot;</span></span>\n<span id=\"cb9-5\"><a href=\"#cb9-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>            Name   <span class=\"op\">=</span> <span class=\"st\">&quot;Web-Server&quot;</span></span>\n<span id=\"cb9-6\"><a href=\"#cb9-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"op\">}</span></span>\n<span id=\"cb9-7\"><a href=\"#cb9-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>        Service W3SVC <span class=\"op\">{</span></span>\n<span id=\"cb9-8\"><a href=\"#cb9-8\" aria-hidden=\"true\" tabindex=\"-1\"></a>            Name  <span class=\"op\">=</span> <span class=\"st\">&quot;W3SVC&quot;</span></span>\n<span id=\"cb9-9\"><a href=\"#cb9-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>            State <span class=\"op\">=</span> <span class=\"st\">&quot;Running&quot;</span></span>\n<span id=\"cb9-10\"><a href=\"#cb9-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>            DependsOn <span class=\"op\">=</span> <span class=\"st\">&quot;[WindowsFeature]IIS&quot;</span></span>\n<span id=\"cb9-11\"><a href=\"#cb9-11\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"op\">}</span></span>\n<span id=\"cb9-12\"><a href=\"#cb9-12\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"op\">}</span></span>\n<span id=\"cb9-13\"><a href=\"#cb9-13\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span>\n<span id=\"cb9-14\"><a href=\"#cb9-14\" aria-hidden=\"true\" tabindex=\"-1\"></a>WebServerConfig <span class=\"op\">-</span>OutputPath <span class=\"st\">&quot;.\\DSC&quot;</span></span>\n<span id=\"cb9-15\"><a href=\"#cb9-15\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">Start-DscConfiguration</span> <span class=\"op\">-</span>Path <span class=\"st\">&quot;.\\DSC&quot;</span> <span class=\"op\">-</span>Wait <span class=\"op\">-</span>Verbose</span></code></pre></div>\n<p><strong>Server Manager</strong> centraliza la instalación de roles y características (Add Roles and Features Wizard), equivalente por PowerShell a:</p>\n<div class=\"sourceCode\" id=\"cb10\"><pre class=\"sourceCode powershell\"><code class=\"sourceCode powershell\"><span id=\"cb10-1\"><a href=\"#cb10-1\" aria-hidden=\"true\" tabindex=\"-1\"></a>Install-WindowsFeature <span class=\"op\">-</span>Name AD-Domain-Services<span class=\"op\">,</span> DNS <span class=\"op\">-</span>IncludeManagementTools</span>\n<span id=\"cb10-2\"><a href=\"#cb10-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>Get-WindowsFeature <span class=\"op\">|</span> <span class=\"fu\">Where-Object</span> Installed</span></code></pre></div>\n<h3 id=\"automatización-de-infraestructura\">Automatización de infraestructura</h3>\n<p>La gestión manual de flotas de servidores no escala; las herramientas de configuration management aplican el principio de infraestructura como código (IaC).</p>\n<div class=\"sourceCode\" id=\"cb11\"><pre class=\"sourceCode yaml\"><code class=\"sourceCode yaml\"><span id=\"cb11-1\"><a href=\"#cb11-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"pp\">---</span></span>\n<span id=\"cb11-2\"><a href=\"#cb11-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">-</span><span class=\"at\"> </span><span class=\"fu\">hosts</span><span class=\"kw\">:</span><span class=\"at\"> webservers</span></span>\n<span id=\"cb11-3\"><a href=\"#cb11-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">become</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"ch\">yes</span></span>\n<span id=\"cb11-4\"><a href=\"#cb11-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">tasks</span><span class=\"kw\">:</span></span>\n<span id=\"cb11-5\"><a href=\"#cb11-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"kw\">-</span><span class=\"at\"> </span><span class=\"fu\">name</span><span class=\"kw\">:</span><span class=\"at\"> Instalar nginx</span></span>\n<span id=\"cb11-6\"><a href=\"#cb11-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"fu\">apt</span><span class=\"kw\">:</span></span>\n<span id=\"cb11-7\"><a href=\"#cb11-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">        </span><span class=\"fu\">name</span><span class=\"kw\">:</span><span class=\"at\"> nginx</span></span>\n<span id=\"cb11-8\"><a href=\"#cb11-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">        </span><span class=\"fu\">state</span><span class=\"kw\">:</span><span class=\"at\"> latest</span></span>\n<span id=\"cb11-9\"><a href=\"#cb11-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">        </span><span class=\"fu\">update_cache</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"ch\">yes</span></span>\n<span id=\"cb11-10\"><a href=\"#cb11-10\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"kw\">-</span><span class=\"at\"> </span><span class=\"fu\">name</span><span class=\"kw\">:</span><span class=\"at\"> Copiar configuración</span></span>\n<span id=\"cb11-11\"><a href=\"#cb11-11\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"fu\">template</span><span class=\"kw\">:</span></span>\n<span id=\"cb11-12\"><a href=\"#cb11-12\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">        </span><span class=\"fu\">src</span><span class=\"kw\">:</span><span class=\"at\"> nginx.conf.j2</span></span>\n<span id=\"cb11-13\"><a href=\"#cb11-13\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">        </span><span class=\"fu\">dest</span><span class=\"kw\">:</span><span class=\"at\"> /etc/nginx/nginx.conf</span></span>\n<span id=\"cb11-14\"><a href=\"#cb11-14\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"fu\">notify</span><span class=\"kw\">:</span><span class=\"at\"> reload nginx</span></span>\n<span id=\"cb11-15\"><a href=\"#cb11-15\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">handlers</span><span class=\"kw\">:</span></span>\n<span id=\"cb11-16\"><a href=\"#cb11-16\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"kw\">-</span><span class=\"at\"> </span><span class=\"fu\">name</span><span class=\"kw\">:</span><span class=\"at\"> reload nginx</span></span>\n<span id=\"cb11-17\"><a href=\"#cb11-17\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"fu\">service</span><span class=\"kw\">:</span></span>\n<span id=\"cb11-18\"><a href=\"#cb11-18\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">        </span><span class=\"fu\">name</span><span class=\"kw\">:</span><span class=\"at\"> nginx</span></span>\n<span id=\"cb11-19\"><a href=\"#cb11-19\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">        </span><span class=\"fu\">state</span><span class=\"kw\">:</span><span class=\"at\"> reloaded</span></span></code></pre></div>\n<table>\n<thead>\n<tr>\n<th>Característica</th>\n<th>Ansible</th>\n<th>Puppet</th>\n<th>Chef</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Arquitectura</td>\n<td>Sin agente (SSH/WinRM)</td>\n<td>Agente-maestro (o agentless con Bolt)</td>\n<td>Agente-servidor</td>\n</tr>\n<tr>\n<td>Lenguaje</td>\n<td>YAML declarativo</td>\n<td>DSL propio (Puppet Manifest)</td>\n<td>Ruby (DSL interno)</td>\n</tr>\n<tr>\n<td>Modelo</td>\n<td>Push</td>\n<td>Pull (agente consulta periódicamente)</td>\n<td>Pull</td>\n</tr>\n<tr>\n<td>Curva de aprendizaje</td>\n<td>Baja</td>\n<td>Media</td>\n<td>Alta</td>\n</tr>\n<tr>\n<td>Idempotencia</td>\n<td>Sí (módulos)</td>\n<td>Sí (nativa, motor de convergencia)</td>\n<td>Sí (recursos)</td>\n</tr>\n<tr>\n<td>Caso de uso típico</td>\n<td>Despliegues puntuales, orquestación</td>\n<td>Gestión continua de flotas grandes</td>\n<td>Entornos DevOps complejos, Cloud-native</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"ciclo-de-gestión-de-parches\">Ciclo de gestión de parches</h3>\n<p>El ciclo formal comprende: <strong>1) Inventario</strong> de activos (SO, versión, paquetes instalados) mediante CMDB o herramientas como Lansweeper/OCS Inventory; <strong>2) Identificación de vulnerabilidades</strong> contra bases CVE (Common Vulnerabilities and Exposures) mediante escáneres (Nessus, OpenVAS); <strong>3) Priorización</strong> con CVSS (Common Vulnerability Scoring System), que asigna una puntuación de 0.0 a 10.0 según vectores de ataque, complejidad, privilegios requeridos e impacto en confidencialidad/integridad/disponibilidad — rangos: 0.1–3.9 Bajo, 4.0–6.9 Medio, 7.0–8.9 Alto, 9.0–10.0 Crítico; <strong>4) Ventana de mantenimiento</strong>, franja horaria planificada y comunicada (habitualmente fuera de horario productivo) para minimizar el impacto; <strong>5) Despliegue</strong> controlado, primero en entorno de pre-producción; <strong>6) Verificación</strong> post-parcheo; <strong>7) Rollback</strong> si el parche introduce regresiones, mediante snapshots de VM, puntos de restauración, o desinstalación dirigida (<code>dnf history undo</code>, <code>apt remove &lt;paquete&gt;=&lt;versión_anterior&gt;</code>, o <code>wusa /uninstall /kb:XXXXXXX</code> en Windows).</p>\n<h3 id=\"proceso-de-arranque\">Proceso de arranque</h3>\n<p>El arranque tradicional BIOS/MBR ejecuta el <strong>POST</strong> (Power-On Self-Test), localiza el dispositivo de arranque, lee el <strong>MBR</strong> (512 bytes, primer sector del disco: 446 bytes de código de arranque, tabla de particiones de 64 bytes con máximo 4 particiones primarias, firma 0x55AA) y ejecuta el bootloader de primera etapa. El esquema moderno <strong>UEFI/GPT</strong> sustituye la BIOS por un firmware con su propio entorno de ejecución, lee la <strong>ESP</strong> (EFI System Partition, FAT32) y ejecuta directamente el gestor de arranque (<code>.efi</code>), sin límite práctico de particiones (GPT usa GUID y tabla replicada al final del disco para redundancia).</p>\n<p>En Linux, <strong>GRUB2</strong> es el bootloader dominante, configurado en <code>/etc/default/grub</code> y generado en <code>/boot/grub2/grub.cfg</code> (BIOS) o <code>/boot/efi/EFI/&lt;distro&gt;/grub.cfg</code> (UEFI) mediante <code>grub2-mkconfig</code> / <code>update-grub</code>. <strong>systemd-boot</strong> (antes gummiboot) es una alternativa minimalista solo-UEFI, sin scripting, con entradas en <code>/boot/loader/entries/*.conf</code>.</p>\n<p>En Windows, el <strong>Windows Boot Manager</strong> (<code>bootmgr</code>/<code>bootmgfw.efi</code>) lee la <strong>BCD</strong> (Boot Configuration Data, sustituye a <code>boot.ini</code> desde Vista), gestionable con <code>bcdedit</code>:</p>\n<div class=\"sourceCode\" id=\"cb12\"><pre class=\"sourceCode powershell\"><code class=\"sourceCode powershell\"><span id=\"cb12-1\"><a href=\"#cb12-1\" aria-hidden=\"true\" tabindex=\"-1\"></a>bcdedit <span class=\"op\">/</span>enum</span>\n<span id=\"cb12-2\"><a href=\"#cb12-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>bcdedit <span class=\"op\">/</span><span class=\"fu\">set</span> <span class=\"op\">{</span>default<span class=\"op\">}</span> bootstatuspolicy ignoreallfailures</span>\n<span id=\"cb12-3\"><a href=\"#cb12-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>bcdedit <span class=\"op\">/</span>timeout <span class=\"dv\">10</span></span></code></pre></div>\n<h3 id=\"reparación-de-arranque\">Reparación de arranque</h3>\n<p><strong>Linux</strong>: si GRUB o el kernel fallan, se accede a <strong>modo rescate</strong> (single-user, <code>systemd.unit=rescue.target</code> como parámetro de arranque) o se arranca desde un live-USB para hacer <strong>chroot</strong> al sistema instalado:</p>\n<div class=\"sourceCode\" id=\"cb13\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb13-1\"><a href=\"#cb13-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">mount</span> /dev/sda2 /mnt</span>\n<span id=\"cb13-2\"><a href=\"#cb13-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">mount</span> /dev/sda1 /mnt/boot/efi</span>\n<span id=\"cb13-3\"><a href=\"#cb13-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">for</span> d <span class=\"kw\">in</span> proc sys dev<span class=\"kw\">;</span> <span class=\"cf\">do</span> <span class=\"fu\">mount</span> <span class=\"at\">--bind</span> /<span class=\"va\">$d</span> /mnt/<span class=\"va\">$d</span><span class=\"kw\">;</span> <span class=\"cf\">done</span></span>\n<span id=\"cb13-4\"><a href=\"#cb13-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">chroot</span> /mnt /bin/bash</span>\n<span id=\"cb13-5\"><a href=\"#cb13-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">grub2-install</span> /dev/sda</span>\n<span id=\"cb13-6\"><a href=\"#cb13-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">grub2-mkconfig</span> <span class=\"at\">-o</span> /boot/grub2/grub.cfg</span>\n<span id=\"cb13-7\"><a href=\"#cb13-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">dracut</span> <span class=\"at\">--force</span> <span class=\"at\">--regenerate-all</span>   <span class=\"co\"># reconstruye el initramfs si falta un módulo/driver</span></span></code></pre></div>\n<p>El <strong>initramfs</strong>, generado por <code>dracut</code> (RHEL/SUSE) o <code>update-initramfs</code> (Debian), es un sistema de ficheros temporal cargado en RAM que monta el root real y carga los módulos necesarios (LVM, RAID, cifrado) antes del <code>pivot_root</code>.</p>\n<p><strong>Windows</strong>: el <strong>WinRE</strong> (Windows Recovery Environment) se invoca con tres fallos de arranque consecutivos o <code>shutdown /r /o</code>. Desde el símbolo del sistema de WinRE:</p>\n<div class=\"sourceCode\" id=\"cb14\"><pre class=\"sourceCode powershell\"><code class=\"sourceCode powershell\"><span id=\"cb14-1\"><a href=\"#cb14-1\" aria-hidden=\"true\" tabindex=\"-1\"></a>bootrec <span class=\"op\">/</span>fixmbr</span>\n<span id=\"cb14-2\"><a href=\"#cb14-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>bootrec <span class=\"op\">/</span>fixboot</span>\n<span id=\"cb14-3\"><a href=\"#cb14-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>bootrec <span class=\"op\">/</span>scanos</span>\n<span id=\"cb14-4\"><a href=\"#cb14-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>bootrec <span class=\"op\">/</span>rebuildbcd</span>\n<span id=\"cb14-5\"><a href=\"#cb14-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>sfc <span class=\"op\">/</span>scannow                       <span class=\"co\"># verifica y repara ficheros de sistema protegidos</span></span>\n<span id=\"cb14-6\"><a href=\"#cb14-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>DISM <span class=\"op\">/</span>Online <span class=\"op\">/</span>Cleanup-Image <span class=\"op\">/</span>RestoreHealth   <span class=\"co\"># repara la imagen WIM subyacente que usa sfc</span></span></code></pre></div>\n<p><code>DISM</code> repara el almacén de componentes (<code>WinSxS</code>) del que depende <code>sfc</code>; si <code>sfc</code> falla por corrupción de la imagen base, hay que ejecutar primero <code>DISM /RestoreHealth</code>.</p>\n<h3 id=\"firmware-drivers-imágenes-doradas-y-packer\">Firmware, drivers, imágenes doradas y Packer</h3>\n<p>La actualización de <strong>firmware</strong> (BIOS/UEFI, controladoras RAID, BMC/iLO/iDRAC) y <strong>drivers</strong> debe gestionarse con el mismo rigor que el SO: versión certificada por el fabricante, ventana de mantenimiento y plan de rollback (firmware dual-bank en servidores empresariales). Las <strong>imágenes doradas</strong> (golden images) son plantillas de VM/contenedor pre-configuradas, parcheadas y hardenizadas que sirven de base estándar para despliegues, reduciendo drift de configuración. <strong>Packer</strong> (HashiCorp) automatiza la construcción reproducible de estas imágenes a partir de una plantilla declarativa (HCL/JSON) que define el builder (VMware, AWS AMI, Azure, QEMU) y los provisioners (scripts shell, Ansible) que instalan el software base.</p>\n<h3 id=\"eoleosl-y-su-relación-con-el-ens\">EOL/EOSL y su relación con el ENS</h3>\n<p><strong>EOL</strong> (End of Life) marca el fin del desarrollo de nuevas funcionalidades; <strong>EOSL</strong> (End of Service Life / soporte extendido) marca el fin de los parches de seguridad. Mantener sistemas EOSL en producción constituye un incumplimiento directo del ENS, cuya medida <code>op.exp.4</code> (mantenimiento) exige aplicar actualizaciones de seguridad y <code>op.exp.2</code> exige gestión de configuración segura; un sistema sin soporte no puede parchearse frente a CVE nuevos, lo que en la categorización del ENS (Básica/Media/Alta) obliga a planes de migración documentados y, frecuentemente, a medidas compensatorias (segmentación de red, WAF) mientras se ejecuta la migración.</p>\n<h3 id=\"monitorización-proactiva\">Monitorización proactiva</h3>\n<p><strong>Nagios</strong> (y su fork Icinga) usa un modelo de <em>checks</em> activos/pasivos con plugins que devuelven estados OK/WARNING/CRITICAL/UNKNOWN, orientado a alertar sobre disponibilidad. <strong>Zabbix</strong> añade recolección de métricas históricas, triggers con expresiones complejas y descubrimiento automático de red. <strong>Prometheus</strong> usa un modelo de <em>pull</em> sobre HTTP, con <strong>Node Exporter</strong> exponiendo métricas del SO en <code>:9100/metrics</code>:</p>\n<pre><code>node_filesystem_avail_bytes{device=&quot;/dev/sda1&quot;,mountpoint=&quot;/&quot;} 8.4e+09\nnode_load1 0.42\nnode_memory_MemAvailable_bytes 3.1e+09</code></pre>\n<p>Estas métricas se consultan con PromQL (<code>rate(node_cpu_seconds_total[5m])</code>) y se visualizan típicamente en Grafana, con alertas gestionadas por Alertmanager.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong><code>apt</code> vs <code>dpkg</code></strong> y <strong><code>dnf</code>/<code>yum</code> vs <code>rpm</code></strong>: dpkg/rpm operan sobre un paquete individual sin resolver dependencias; apt/dnf gestionan repositorios y dependencias. Confundir cuál \"resuelve dependencias\" es el error más frecuente.</li>\n<li><strong>journald vs rsyslog</strong>: journald es binario, indexado y propio de systemd; rsyslog es texto plano y syslog clásico. <code>logrotate</code> rota ficheros de texto (rsyslog), <strong>no</strong> el journal, que se autogestiona con <code>--vacuum-*</code>.</li>\n<li><strong>sfc /scannow vs DISM</strong>: sfc repara ficheros de sistema contra la caché local (<code>WinSxS</code>); si esa caché está corrupta, sfc no puede repararse a sí mismo y hace falta <code>DISM /RestoreHealth</code> primero. El examen suele plantear el orden correcto.</li>\n<li><strong>MBR/BIOS vs GPT/UEFI</strong>: MBR limita a 4 particiones primarias y discos de 2 TiB; GPT no tiene esa limitación y requiere partición ESP FAT32. <code>bootrec /fixmbr</code> no tiene sentido en un sistema UEFI puro.</li>\n<li><strong>EOL vs EOSL</strong>: EOL es fin de desarrollo funcional; EOSL es fin de soporte de seguridad. Un producto puede estar en EOL pero seguir recibiendo parches críticos durante su fase EOSL extendida — el examen explota esta distinción temporal.</li>\n<li><strong>CVSS</strong>: puntuación de severidad de una vulnerabilidad (0–10), no debe confundirse con CVE, que es solo el identificador/catálogo de la vulnerabilidad en sí.</li>\n</ul>\n"}, {"num": 2, "title": "Administración de bases de datos. Sistemas de almacenamiento y su virtualización. Políticas, sistemas y procedimientos de backup y su recuperación. Backup de sistemas físicos y virtuales. Virtualización de sistemas y virtualización de puestos de usuario.", "html": "<h3 id=\"administración-de-bases-de-datos-tuning-y-planes-de-ejecución\">Administración de bases de datos: tuning y planes de ejecución</h3>\n<p>El ajuste de rendimiento (tuning) actúa sobre tres capas: parámetros del motor (memoria de buffer, work_mem, checkpoints), estadísticas del optimizador y diseño físico (índices, particionado). Sin estadísticas actualizadas (ANALYZE en PostgreSQL, UPDATE STATISTICS en SQL Server, DBMS_STATS en Oracle) el optimizador basado en costes (CBO) estima cardinalidades erróneas y elige planes subóptimos, típicamente un escaneo completo (Seq Scan/Table Scan) donde cabría un acceso por índice.</p>\n<p>El plan de ejecución es la herramienta de diagnóstico principal. EXPLAIN muestra el plan estimado; EXPLAIN ANALYZE lo ejecuta y añade tiempos y filas reales, permitiendo detectar desviaciones de estimación:</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">EXPLAIN</span> (<span class=\"kw\">ANALYZE</span>, BUFFERS)</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">SELECT</span> c.nombre, <span class=\"fu\">SUM</span>(f.importe)</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">FROM</span> facturas f <span class=\"kw\">JOIN</span> clientes c <span class=\"kw\">ON</span> c.<span class=\"kw\">id</span> <span class=\"op\">=</span> f.cliente_id</span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">WHERE</span> f.fecha <span class=\"op\">&gt;=</span> <span class=\"st\">&#39;2026-01-01&#39;</span></span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">GROUP</span> <span class=\"kw\">BY</span> c.nombre;</span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">-- Salida relevante:</span></span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">-- Hash Join (cost=120.5..980.2 rows=3200 width=48)</span></span>\n<span id=\"cb1-9\"><a href=\"#cb1-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">--   (actual time=1.2..15.8 rows=3150 loops=1)</span></span>\n<span id=\"cb1-10\"><a href=\"#cb1-10\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">--   Buffers: shared hit=210 read=45</span></span>\n<span id=\"cb1-11\"><a href=\"#cb1-11\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">--   -&gt; Seq Scan on facturas f (cost=0.00..820.0 rows=3200 ...)</span></span></code></pre></div>\n<p>En Oracle el equivalente es <code>EXPLAIN PLAN FOR &lt;sql&gt;; SELECT * FROM TABLE(DBMS_XPLAN.DISPLAY);</code>; en SQL Server, <code>SET STATISTICS PROFILE ON</code> o el plan de ejecución real gráfico (Actual Execution Plan). Un plan con \"rows estimadas\" muy alejadas de \"rows reales\" indica estadísticas obsoletas o falta de histogramas.</p>\n<h3 id=\"gestión-de-índices-y-particionado-de-tablas\">Gestión de índices y particionado de tablas</h3>\n<p>Los índices B-tree son el tipo por defecto para igualdad y rangos; los bitmap son eficientes en columnas de baja cardinalidad con consultas OLAP; los hash solo sirven para igualdad exacta. Un índice cubriente (covering index) incluye en sus columnas todo lo que necesita la consulta, evitando el acceso a la tabla (index-only scan). La fragmentación de índices por escrituras intensivas se corrige con REBUILD (reconstrucción completa, bloqueante u online según motor) o REORGANIZE (desfragmentación incremental).</p>\n<p>El particionado divide una tabla grande en segmentos físicos manteniendo una interfaz lógica única, habilitando el \"partition pruning\": el optimizador descarta particiones que no pueden contener filas relevantes.</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">TABLE</span> facturas (</span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">id</span> BIGINT, cliente_id <span class=\"dt\">INT</span>, fecha <span class=\"dt\">DATE</span>, importe <span class=\"dt\">NUMERIC</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>) <span class=\"kw\">PARTITION</span> <span class=\"kw\">BY</span> <span class=\"kw\">RANGE</span> (fecha);</span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">TABLE</span> facturas_2025 <span class=\"kw\">PARTITION</span> <span class=\"kw\">OF</span> facturas</span>\n<span id=\"cb2-6\"><a href=\"#cb2-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"cf\">FOR</span> <span class=\"kw\">VALUES</span> <span class=\"kw\">FROM</span> (<span class=\"st\">&#39;2025-01-01&#39;</span>) <span class=\"kw\">TO</span> (<span class=\"st\">&#39;2026-01-01&#39;</span>);</span>\n<span id=\"cb2-7\"><a href=\"#cb2-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">TABLE</span> facturas_2026 <span class=\"kw\">PARTITION</span> <span class=\"kw\">OF</span> facturas</span>\n<span id=\"cb2-8\"><a href=\"#cb2-8\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"cf\">FOR</span> <span class=\"kw\">VALUES</span> <span class=\"kw\">FROM</span> (<span class=\"st\">&#39;2026-01-01&#39;</span>) <span class=\"kw\">TO</span> (<span class=\"st\">&#39;2027-01-01&#39;</span>);</span></code></pre></div>\n<p>Existen también particionado por lista (valores discretos, ej. país) y por hash (distribución uniforme sin criterio natural de rango).</p>\n<h3 id=\"replicación-de-bases-de-datos\">Replicación de bases de datos</h3>\n<p>En maestro-esclavo (master-slave) las escrituras solo se aceptan en el nodo maestro y se propagan de forma asíncrona a réplicas de solo lectura, útil para escalar lecturas y como base de un failover manual. En maestro-maestro (multi-master) varios nodos aceptan escrituras simultáneas, lo que exige resolución de conflictos (last-write-wins, vectores de versión) y complica la consistencia.</p>\n<p>Always On Availability Groups (SQL Server) agrupa bases de datos en un grupo de disponibilidad sobre un clúster de failover de Windows (WSFC), con réplicas en modo síncrono (compromiso garantizado, cero pérdida, mayor latencia) o asíncrono (menor latencia, posible pérdida de las últimas transacciones); el quórum del clúster decide el failover automático.</p>\n<p>La streaming replication de PostgreSQL envía continuamente el WAL (Write-Ahead Log) del primario a los standbys:</p>\n<div class=\"sourceCode\" id=\"cb3\"><pre class=\"sourceCode ini\"><code class=\"sourceCode ini\"><span id=\"cb3-1\"><a href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\"># postgresql.conf en el primario</span></span>\n<span id=\"cb3-2\"><a href=\"#cb3-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">wal_level </span><span class=\"ot\">=</span><span class=\"st\"> replica</span></span>\n<span id=\"cb3-3\"><a href=\"#cb3-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">max_wal_senders </span><span class=\"ot\">=</span><span class=\"st\"> </span><span class=\"dv\">10</span></span>\n<span id=\"cb3-4\"><a href=\"#cb3-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">wal_keep_size </span><span class=\"ot\">=</span><span class=\"st\"> 1GB</span></span>\n<span id=\"cb3-5\"><a href=\"#cb3-5\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb3-6\"><a href=\"#cb3-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\"># pg_hba.conf en el primario</span></span>\n<span id=\"cb3-7\"><a href=\"#cb3-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">host replication replicador 10.0.0.0/24 scram-sha-256</span></span>\n<span id=\"cb3-8\"><a href=\"#cb3-8\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb3-9\"><a href=\"#cb3-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\"># En el standby: standby.signal presente y postgresql.conf:</span></span>\n<span id=\"cb3-10\"><a href=\"#cb3-10\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">primary_conninfo </span><span class=\"ot\">=</span><span class=\"st\"> &#39;host=10.0.0.1 port=5432 user=replicador password=***&#39;</span></span></code></pre></div>\n<p>Los replication slots evitan que el primario purgue WAL que un standby aún no ha consumido.</p>\n<h3 id=\"niveles-de-aislamiento-transaccional\">Niveles de aislamiento transaccional</h3>\n<ul>\n<li><strong>Read Uncommitted</strong>: permite dirty read. T1 actualiza el saldo de una cuenta sin confirmar; T2 lee ese saldo modificado; T1 hace ROLLBACK; T2 ha basado su decisión en un dato que nunca existió realmente.</li>\n<li><strong>Read Committed</strong>: evita dirty read pero permite non-repeatable read. T1 lee el precio de un producto (10 €); T2 lo actualiza a 12 € y confirma; T1 vuelve a leer el mismo producto dentro de su misma transacción y obtiene 12 €.</li>\n<li><strong>Repeatable Read</strong>: fija los valores ya leídos pero permite phantom read. T1 ejecuta <code>SELECT COUNT(*) FROM pedidos WHERE cliente_id=5</code> y obtiene 3; T2 inserta un nuevo pedido de ese cliente y confirma; T1 repite la misma consulta y obtiene 4 filas \"fantasma\".</li>\n<li><strong>Serializable</strong>: equivale a ejecutar las transacciones en serie mediante bloqueo de rango o detección de conflictos; evita las tres anomalías al coste de más abortos por serialización y menor concurrencia.</li>\n</ul>\n<h3 id=\"sistemas-de-almacenamiento-das-nas-y-san\">Sistemas de almacenamiento: DAS, NAS y SAN</h3>\n<table>\n<thead>\n<tr>\n<th>Característica</th>\n<th>DAS</th>\n<th>NAS</th>\n<th>SAN</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Conexión</td>\n<td>Directa al servidor (SATA/SAS/USB)</td>\n<td>Red Ethernet, IP</td>\n<td>Red dedicada (Fibre Channel o Ethernet iSCSI)</td>\n</tr>\n<tr>\n<td>Protocolo</td>\n<td>Bus de almacenamiento local</td>\n<td>NFS, SMB/CIFS</td>\n<td>FC (FCP), iSCSI</td>\n</tr>\n<tr>\n<td>Nivel de acceso</td>\n<td>Bloque</td>\n<td>Archivo</td>\n<td>Bloque</td>\n</tr>\n<tr>\n<td>Compartición entre hosts</td>\n<td>No (o muy limitada)</td>\n<td>Sí, nativa</td>\n<td>Sí, mediante LUNs</td>\n</tr>\n<tr>\n<td>Latencia</td>\n<td>Muy baja</td>\n<td>Media (depende de red IP)</td>\n<td>Baja (FC dedicada)</td>\n</tr>\n<tr>\n<td>Escalabilidad</td>\n<td>Baja</td>\n<td>Alta</td>\n<td>Muy alta</td>\n</tr>\n<tr>\n<td>Coste</td>\n<td>Bajo</td>\n<td>Medio</td>\n<td>Alto</td>\n</tr>\n<tr>\n<td>Caso de uso típico</td>\n<td>Servidor único, BD local de alto I/O</td>\n<td>Ficheros compartidos, perfiles, backups</td>\n<td>Clústeres, VMs, bases de datos críticas</td>\n</tr>\n</tbody>\n</table>\n<p>Una LUN (Logical Unit Number) es el volumen lógico que la cabina SAN presenta a un host como si fuera un disco físico. El zoning segmenta la red FC restringiendo qué HBA (iniciador) puede ver qué puerto de la cabina (destino): zoning por puerto (hard zoning, más seguro, ligado físicamente) o por WWN (soft zoning, más flexible). El multipathing (MPIO) mantiene varias rutas físicas redundantes entre host y cabina, aportando tolerancia a fallos de cable/HBA/switch y balanceo de carga de I/O.</p>\n<h3 id=\"raid\">RAID</h3>\n<table>\n<thead>\n<tr>\n<th>Nivel</th>\n<th>Mecanismo</th>\n<th>Discos mín.</th>\n<th>Capacidad útil</th>\n<th>Tolerancia a fallos</th>\n<th>Ejemplo (discos de 1 TB)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>RAID 0</td>\n<td>Striping</td>\n<td>2</td>\n<td>n × T</td>\n<td>Ninguna</td>\n<td>4 discos → 4 TB, sin redundancia</td>\n</tr>\n<tr>\n<td>RAID 1</td>\n<td>Mirroring</td>\n<td>2</td>\n<td>(n/2) × T</td>\n<td>1 disco por par</td>\n<td>2 discos → 1 TB útil</td>\n</tr>\n<tr>\n<td>RAID 5</td>\n<td>Striping + paridad distribuida</td>\n<td>3</td>\n<td>(n−1) × T</td>\n<td>1 disco</td>\n<td>4 discos → 3 TB</td>\n</tr>\n<tr>\n<td>RAID 6</td>\n<td>Striping + doble paridad</td>\n<td>4</td>\n<td>(n−2) × T</td>\n<td>2 discos</td>\n<td>6 discos → 4 TB</td>\n</tr>\n<tr>\n<td>RAID 10</td>\n<td>Mirror + stripe</td>\n<td>4</td>\n<td>(n/2) × T</td>\n<td>1 por cada par espejado</td>\n<td>4 discos → 2 TB</td>\n</tr>\n<tr>\n<td>RAID 50</td>\n<td>RAID 5 en stripe</td>\n<td>6</td>\n<td>(n−g) × T (g = nº grupos)</td>\n<td>1 disco por grupo</td>\n<td>2 grupos de 4 discos (8 total) → 6 TB</td>\n</tr>\n<tr>\n<td>RAID 60</td>\n<td>RAID 6 en stripe</td>\n<td>8</td>\n<td>(n−2g) × T</td>\n<td>2 discos por grupo</td>\n<td>2 grupos de 6 discos (12 total) → 8 TB</td>\n</tr>\n</tbody>\n</table>\n<p>RAID 5/6 penalizan la escritura por el cálculo de paridad (write penalty) y sufren mayor riesgo durante el rebuild con discos grandes (posibilidad de segundo fallo antes de terminar); RAID 10 evita ese problema a costa de aprovechamiento del 50%.</p>\n<h3 id=\"virtualización-del-almacenamiento\">Virtualización del almacenamiento</h3>\n<p>El thin provisioning asigna espacio bajo demanda: el volumen se presenta con capacidad \"X\" pero solo consume físicamente lo escrito, con riesgo de sobreaprovisionamiento (overcommit) del pool si no se monitoriza. El thick provisioning reserva toda la capacidad desde la creación, eager zeroed (cero-rellenado inmediato, mejor rendimiento inicial) o lazy zeroed (cero-rellenado bajo demanda en la primera escritura).</p>\n<p>Un storage pool agrupa discos físicos heterogéneos en un espacio lógico del que se reparten LUNs o volúmenes virtuales. En Linux, LVM (Logical Volume Manager) implementa esta capa:</p>\n<div class=\"sourceCode\" id=\"cb4\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb4-1\"><a href=\"#cb4-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">pvcreate</span> /dev/sdb /dev/sdc</span>\n<span id=\"cb4-2\"><a href=\"#cb4-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">vgcreate</span> vg_datos /dev/sdb /dev/sdc</span>\n<span id=\"cb4-3\"><a href=\"#cb4-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">lvcreate</span> <span class=\"at\">-L</span> 500G <span class=\"at\">-n</span> lv_bbdd vg_datos</span>\n<span id=\"cb4-4\"><a href=\"#cb4-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">mkfs.xfs</span> /dev/vg_datos/lv_bbdd</span>\n<span id=\"cb4-5\"><a href=\"#cb4-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">lvextend</span> <span class=\"at\">-L</span> +200G /dev/vg_datos/lv_bbdd <span class=\"kw\">&amp;&amp;</span> <span class=\"ex\">xfs_growfs</span> /dev/vg_datos/lv_bbdd</span></code></pre></div>\n<h3 id=\"backup-rpo-rto-y-tipos-de-copia\">Backup: RPO, RTO y tipos de copia</h3>\n<p>RPO (Recovery Point Objective) es la cantidad máxima de datos, medida en tiempo, que la organización asume perder. RTO (Recovery Time Objective) es el tiempo máximo aceptable de indisponibilidad tras el desastre. Ejemplo: backup completo diario a las 02:00; el fallo ocurre a las 14:00 → se pierden 12 horas de transacciones (RPO real = 12 h). Si el SLA exige RPO ≤ 1 h, un backup diario no basta: se requiere replicación continua o backups de log cada hora. Para el RTO, restaurar 2 TB a 100 MB/s tarda ≈ 5,5 horas; si el SLA exige RTO ≤ 1 h, se necesita un sitio en caliente o failover automático, no solo restauración desde cinta/backup.</p>\n<p>Con una base de datos de 500 GB que cambia un 5 %/día (25 GB):</p>\n<ul>\n<li><strong>Completo diario</strong>: 500 GB/día × 7 = 3,5 TB/semana; restauración = leer 500 GB (rápida, un único set).</li>\n<li><strong>Incremental</strong> (respecto al último backup, sea completo o incremental): domingo 500 GB + 6 × 25 GB = 650 GB/semana; restaurar el viernes exige el completo + 5 incrementales encadenados (mayor tiempo y riesgo: si un incremental intermedio está corrupto, se pierde la cadena).</li>\n<li><strong>Diferencial</strong> (respecto al último completo): domingo 500 GB + (25+50+75+100+125+150) = 1.025 GB/semana; restaurar el viernes exige solo completo + último diferencial (500+150 GB), más rápido que el incremental aunque ocupa más espacio en disco.</li>\n</ul>\n<h3 id=\"regla-3-2-1-y-protección-frente-a-ransomware\">Regla 3-2-1 y protección frente a ransomware</h3>\n<p>La regla 3-2-1 exige 3 copias de los datos (el original + 2 backups), en 2 soportes distintos, con 1 copia fuera de las instalaciones (offsite). La extensión 3-2-1-1-0 añade 1 copia offline o inmutable y 0 errores, es decir, verificación periódica mediante pruebas de restauración reales. La inmutabilidad WORM (Write Once Read Many, ej. S3 Object Lock, retención en cintas o snapshots inmutables) impide modificar o eliminar el backup durante el periodo de retención aunque un atacante obtenga credenciales de administrador, siendo la defensa clave frente a ransomware que cifra o borra deliberadamente las copias de seguridad accesibles en red.</p>\n<h3 id=\"backup-de-sistemas-virtuales\">Backup de sistemas virtuales</h3>\n<p>Un snapshot captura el estado del disco virtual en un instante mediante ficheros delta que registran los cambios posteriores; no constituye backup por sí solo porque reside en el mismo almacenamiento físico que el original. CBT (Changed Block Tracking) es una funcionalidad del hipervisor (VMware) que mantiene un mapa de bloques modificados desde el último backup, permitiendo backups incrementales sin escanear el disco completo. VADP (vStorage APIs for Data Protection) permite a soluciones de terceros (Veeam, Commvault) acceder directamente a los snapshots a nivel de imagen sin agente dentro de la VM.</p>\n<p>La consistencia de aplicación se logra mediante VSS (Volume Shadow Copy Service) en Windows, que coordina con SQL Server/Exchange el volcado de buffers y truncado de logs antes de capturar el snapshot, garantizando una copia restaurable sin corrupción. La consistencia de crash captura el disco \"tal cual\", equivalente a un corte de energía; la aplicación debe recuperarse por sus propios mecanismos (redo logs, journaling) al arrancar, con mayor riesgo de pérdida de transacciones en vuelo.</p>\n<h3 id=\"virtualización-de-sistemas\">Virtualización de sistemas</h3>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Tipo 1 (bare-metal)</th>\n<th>Tipo 2 (hosted)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ejecución</td>\n<td>Directa sobre el hardware</td>\n<td>Sobre un SO anfitrión</td>\n</tr>\n<tr>\n<td>Ejemplos</td>\n<td>ESXi, Hyper-V, KVM, Xen</td>\n<td>VMware Workstation, VirtualBox</td>\n</tr>\n<tr>\n<td>Rendimiento</td>\n<td>Alto, baja sobrecarga</td>\n<td>Menor, doble capa de abstracción</td>\n</tr>\n<tr>\n<td>Uso típico</td>\n<td>Producción, datacenter</td>\n<td>Escritorio, desarrollo, pruebas</td>\n</tr>\n</tbody>\n</table>\n<p>vMotion / Live Migration traslada una VM en ejecución entre hosts físicos sin interrupción de servicio, copiando iterativamente la memoria RAM mientras la VM sigue activa y conmutando en milisegundos; requiere almacenamiento compartido (o Storage vMotion si también se mueve el disco). El overcommit asigna a las VMs más vCPU/vRAM de los físicamente disponibles asumiendo que no todas alcanzan pico simultáneo (ratios típicos de CPU 4:1 a 8:1); en memoria se gestiona con ballooning, compresión de páginas y swap a disco cuando el overcommit es agresivo. Las reglas de afinidad fuerzan a que ciertas VMs corran siempre en el mismo host (ej. por latencia entre nodos de un mismo clúster de aplicación); las de anti-afinidad las separan siempre en hosts distintos (ej. nodos de un clúster de alta disponibilidad, para evitar un punto único de fallo).</p>\n<h3 id=\"vdi-virtualización-de-puestos-de-usuario\">VDI: virtualización de puestos de usuario</h3>\n<p>Los protocolos de escritorio remoto difieren en su gestión de banda ancha y compresión: RDP (Microsoft, estándar, buena compresión con codificación H.264/AVC en versiones recientes), PCoIP (Teradici/VMware Horizon, orientado a compresión de imagen, robusto en WAN de banda limitada), Blast Extreme (VMware, adaptativo H.264, mejor aprovechamiento de CPU cliente y ancho de banda variable) e ICA/HDX (Citrix, alta eficiencia de compresión y canales virtuales para USB/audio/impresión).</p>\n<p>El \"boot storm\" ocurre cuando un gran número de escritorios virtuales arrancan simultáneamente (ej. al inicio de la jornada laboral), generando un pico masivo de IOPS de lectura sobre el almacenamiento compartido que puede saturar la SAN/NAS y degradar el servicio. Se mitiga con imágenes doradas (golden imag
