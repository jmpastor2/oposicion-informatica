e) más clones enlazados o instant clones que comparten una base de solo lectura reduciendo I/O redundante, caché de lectura en el host (View Storage Accelerator/CBRC), almacenamiento todo-flash y escalonando los arranques fuera de la hora punta.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ol type=\"1\">\n<li><strong>RPO vs RTO</strong>: RPO mide cuántos datos se pueden perder (mirando hacia atrás, desde el último punto recuperable); RTO mide cuánto se tarda en volver a estar operativo (mirando hacia delante, el tiempo de parada).</li>\n<li><strong>Incremental vs diferencial</strong>: el incremental copia cambios desde el último backup de cualquier tipo (cadena larga en restauración); el diferencial copia cambios desde el último completo (restauración con solo dos backups, más rápida pero mayor volumen por copia).</li>\n<li><strong>Snapshot no es backup</strong>: comparte el mismo almacenamiento físico que el original; si falla el datastore, se pierden ambos a la vez.</li>\n<li><strong>RAID no sustituye al backup</strong>: protege frente a fallo físico de disco, no frente a borrado accidental, corrupción lógica o ransomware, que se replican igualmente en todos los discos del array.</li>\n<li><strong>NAS vs SAN</strong>: NAS trabaja a nivel de archivo (NFS/SMB) y SAN a nivel de bloque (el host ve un disco crudo que debe formatear), independientemente de que ambos puedan viajar sobre red Ethernet (NAS siempre, SAN solo si es iSCSI).</li>\n</ol>\n"}, {"num": 3, "title": "Administración de servidores de correo electrónico y sus protocolos. Administración de contenedores y microservicios.", "html": "<h3 id=\"1-arquitectura-del-correo-electrónico\">1. Arquitectura del correo electrónico</h3>\n<p>El sistema de correo electrónico se basa en cuatro roles funcionales, no siempre coincidentes con software distinto:</p>\n<ul>\n<li><strong>MUA (Mail User Agent)</strong>: cliente que usa el usuario (Outlook, Thunderbird, webmail). Compone y lee mensajes.</li>\n<li><strong>MSA (Mail Submission Agent)</strong>: recibe el mensaje del MUA, típicamente en el puerto 587 con autenticación obligatoria, y valida que el remitente esté autorizado a enviar.</li>\n<li><strong>MTA (Mail Transfer Agent)</strong>: transporta el mensaje entre servidores mediante SMTP (Postfix, Exim, Sendmail). Puede actuar como relay.</li>\n<li><strong>MDA (Mail Delivery Agent)</strong>: entrega el mensaje al buzón final del destinatario (Dovecot, Procmail), donde queda accesible vía POP3/IMAP.</li>\n</ul>\n<p>Flujo completo de un mensaje:</p>\n<pre><code>[Emisor MUA] --SMTP:587(auth)--&gt; [MSA]\n                                   |\n                                   v  SMTP:25\n                             [MTA origen] --DNS MX lookup--&gt; [MTA destino]\n                                   |                              |\n                                   v (relay si aplica)            v\n                             [MTA intermedio] -------------&gt; [MDA destino]\n                                                                    |\n                                                                    v\n                                                            [Buzón / Maildir]\n                                                                    |\n                                                       POP3:110/995 o IMAP:143/993\n                                                                    |\n                                                                    v\n                                                          [Receptor MUA]</code></pre>\n<p>El MTA origen resuelve el dominio del destinatario consultando los registros <strong>MX</strong> en el DNS, ordenados por prioridad (a menor número, mayor prioridad), y establece conexión SMTP saliente contra el MTA de mayor prioridad disponible.</p>\n<h3 id=\"2-el-protocolo-smtp-en-detalle\">2. El protocolo SMTP en detalle</h3>\n<p>SMTP (Simple Mail Transfer Protocol, RFC 5321) es un protocolo de texto plano orientado a línea, con diálogo cliente-servidor por comandos y códigos de respuesta numéricos.</p>\n<p><strong>Puertos:</strong></p>\n<ul>\n<li><strong>25</strong>: MTA-a-MTA (relay entre servidores). Muchos ISP lo bloquean en salida para evitar spam desde equipos comprometidos.</li>\n<li><strong>587 (submission)</strong>: MUA-a-MSA, con STARTTLS y autenticación (SMTP AUTH) obligatoria.</li>\n<li><strong>465 (SMTPS)</strong>: submission con TLS implícito desde el inicio de la conexión (no STARTTLS), reintroducido formalmente en RFC 8314.</li>\n</ul>\n<p><strong>Sesión SMTP típica:</strong></p>\n<pre><code>S: 220 mail.dominio.es ESMTP Postfix\nC: EHLO cliente.dominio.es\nS: 250-mail.dominio.es\nS: 250-PIPELINING\nS: 250-SIZE 10485760\nS: 250-STARTTLS\nS: 250 AUTH LOGIN PLAIN\nC: MAIL FROM:&lt;emisor@dominio.es&gt;\nS: 250 2.1.0 Ok\nC: RCPT TO:&lt;destino@otrodominio.es&gt;\nS: 250 2.1.5 Ok\nC: DATA\nS: 354 End data with &lt;CR&gt;&lt;LF&gt;.&lt;CR&gt;&lt;LF&gt;\nC: Subject: Prueba\nC: \nC: Cuerpo del mensaje.\nC: .\nS: 250 2.0.0 Ok: queued as A1B2C3D4\nC: QUIT\nS: 221 2.0.0 Bye</code></pre>\n<p><code>HELO</code> es el saludo básico (RFC 821); <code>EHLO</code> es su extensión (ESMTP) que anuncia capacidades del servidor (STARTTLS, AUTH, tamaño máximo, pipelining).</p>\n<p><strong>Códigos de respuesta:</strong></p>\n<ul>\n<li><strong>2xx (éxito)</strong>: <code>250</code> operación aceptada; <code>220</code> servidor listo; <code>221</code> cierre de conexión.</li>\n<li><strong>3xx (información intermedia)</strong>: <code>354</code> esperando el cuerpo tras <code>DATA</code>.</li>\n<li><strong>4xx (error transitorio)</strong>: <code>421</code> servicio no disponible, <code>450</code> buzón temporalmente no accesible (p. ej. locked), <code>451</code> error de procesamiento local; el mensaje queda en cola para reintento.</li>\n<li><strong>5xx (error permanente)</strong>: <code>550</code> buzón inexistente o rechazado por política, <code>552</code> excede cuota, <code>554</code> transacción fallida (frecuentemente por filtros antispam); el mensaje se devuelve como rebote (bounce, NDR).</li>\n</ul>\n<h3 id=\"3-pop3-frente-a-imap\">3. POP3 frente a IMAP</h3>\n<p>Ambos son protocolos de acceso al buzón, radicalmente distintos en filosofía.</p>\n<p><strong>POP3</strong> (puerto 110 / 995 con SSL) descarga los mensajes al cliente y, por defecto, los elimina del servidor. Comandos básicos: <code>USER</code>, <code>PASS</code>, <code>STAT</code> (número y tamaño de mensajes), <code>LIST</code>, <code>RETR n</code> (recuperar mensaje n), <code>DELE n</code> (marcar borrado), <code>QUIT</code> (confirma borrados).</p>\n<p><strong>IMAP</strong> (puerto 143 / 993 con SSL) mantiene el estado en el servidor, permite gestionar carpetas y sincronizar múltiples dispositivos. Tiene tres estados definidos por RFC 3501:</p>\n<ol type=\"1\">\n<li><strong>No autenticado</strong>: conexión establecida, pendiente <code>LOGIN</code>/<code>AUTHENTICATE</code>.</li>\n<li><strong>Autenticado</strong>: credenciales válidas, aún sin carpeta seleccionada; permite <code>LIST</code>, <code>CREATE</code>, <code>SELECT</code>.</li>\n<li><strong>Seleccionado</strong>: tras <code>SELECT INBOX</code>, permite operar sobre mensajes: <code>FETCH</code>, <code>STORE</code>, <code>SEARCH</code>, <code>EXPUNGE</code>.</li>\n</ol>\n<p>Flags de mensaje IMAP (definidos, gestionables con <code>STORE</code>): <code>\\Seen</code>, <code>\\Answered</code>, <code>\\Flagged</code>, <code>\\Deleted</code> (marcado, se elimina físicamente con <code>EXPUNGE</code>), <code>\\Draft</code>, <code>\\Recent</code>.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>POP3</th>\n<th>IMAP</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ubicación del mensaje</td>\n<td>Se descarga y borra del servidor</td>\n<td>Permanece en servidor</td>\n</tr>\n<tr>\n<td>Multidispositivo</td>\n<td>No sincroniza</td>\n<td>Sincroniza estado (leído, carpetas)</td>\n</tr>\n<tr>\n<td>Estructura de carpetas</td>\n<td>No soporta</td>\n<td>Sí, jerárquica</td>\n</tr>\n<tr>\n<td>Consumo de red</td>\n<td>Bajo tras descarga</td>\n<td>Requiere conexión frecuente</td>\n</tr>\n<tr>\n<td>Puerto sin cifrar / cifrado</td>\n<td>110 / 995</td>\n<td>143 / 993</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"4-autenticación-de-dominio-anti-phishing-spf-dkim-y-dmarc\">4. Autenticación de dominio anti-phishing: SPF, DKIM y DMARC</h3>\n<p><strong>SPF (Sender Policy Framework)</strong>: registro TXT en el DNS del dominio que enumera qué servidores están autorizados a enviar correo en su nombre. El MTA receptor comprueba la IP del emisor contra esta lista.</p>\n<pre><code>dominio.es. IN TXT &quot;v=spf1 ip4:203.0.113.10 include:spf.protection.outlook.com -all&quot;</code></pre>\n<p><code>-all</code> (fail estricto) rechaza cualquier IP no listada; <code>~all</code> (softfail) la marca como sospechosa sin rechazar.</p>\n<p><strong>DKIM (DomainKeys Identified Mail)</strong>: firma criptográfica del mensaje. El MTA emisor firma con una <strong>clave privada</strong> ciertas cabeceras y el cuerpo (hash), y publica la <strong>clave pública</strong> en un registro TXT bajo <code>selector._domainkey.dominio.es</code>. El receptor recalcula el hash y lo valida con la clave pública.</p>\n<pre><code>DKIM-Signature: v=1; a=rsa-sha256; c=relaxed/relaxed; d=dominio.es;\n s=selector1; t=1735000000;\n h=from:to:subject:date;\n bh=47DEQpj8HBSa+/TImW+5JCeuQeR...=;\n b=T5jK8mQpL2n9xR4vC1sD7fH3gA6wE...=</code></pre>\n<p><strong>DMARC (Domain-based Message Authentication, Reporting and Conformance)</strong>: define qué hacer cuando SPF y/o DKIM fallan, y exige <strong>alineación</strong>: el dominio del <code>From:</code> visible debe coincidir (exacta o parcialmente, según <code>aspf</code>/<code>adkim</code>) con el dominio autenticado por SPF/DKIM.</p>\n<pre><code>_dmarc.dominio.es. IN TXT &quot;v=DMARC1; p=quarantine; rua=mailto:dmarc-reports@dominio.es; pct=100; adkim=s; aspf=r&quot;</code></pre>\n<p>Políticas: <code>p=none</code> (solo monitoriza, no actúa), <code>p=quarantine</code> (marca como sospechoso/spam), <code>p=reject</code> (rechaza directamente). La progresión recomendada es <code>none</code> → <code>quarantine</code> → <code>reject</code>, tras analizar los informes agregados (<code>rua</code>) para evitar falsos positivos.</p>\n<h3 id=\"5-administración-operativa-del-servidor\">5. Administración operativa del servidor</h3>\n<p><strong>Colas de correo</strong> (Postfix): los mensajes pendientes de entrega (por diferimiento, error temporal o congestión) residen en <code>/var/spool/postfix</code>. Comandos clave:</p>\n<div class=\"sourceCode\" id=\"cb6\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb6-1\"><a href=\"#cb6-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">mailq</span>                    <span class=\"co\"># lista mensajes en cola (alias de postqueue -p)</span></span>\n<span id=\"cb6-2\"><a href=\"#cb6-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">postqueue</span> <span class=\"at\">-p</span>             <span class=\"co\"># equivalente</span></span>\n<span id=\"cb6-3\"><a href=\"#cb6-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">postqueue</span> <span class=\"at\">-f</span>             <span class=\"co\"># fuerza el reenvío inmediato de toda la cola</span></span>\n<span id=\"cb6-4\"><a href=\"#cb6-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">postsuper</span> <span class=\"at\">-d</span> ID          <span class=\"co\"># elimina un mensaje concreto de la cola</span></span>\n<span id=\"cb6-5\"><a href=\"#cb6-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ex\">postsuper</span> <span class=\"at\">-d</span> ALL deferred  <span class=\"co\"># purga todos los diferidos</span></span></code></pre></div>\n<p><strong>DNSBL (DNS Blackhole Lists)</strong>: listas negras consultadas en tiempo real (Spamhaus, SORBS) contra la IP emisora; Postfix las integra mediante <code>smtpd_recipient_restrictions</code> con <code>reject_rbl_client zen.spamhaus.org</code>.</p>\n<p><strong>Filtrado antispam — SpamAssassin</strong>: analiza cada mensaje asignando una puntuación mediante reglas heurísticas (cabeceras sospechosas, palabras clave, DNSBL) combinadas con un <strong>filtro bayesiano</strong> entrenado por el usuario (<code>sa-learn --spam</code>/<code>--ham</code>), que ajusta probabilísticamente la puntuación según el histórico de correo clasificado. Se define un umbral (<code>required_score</code>, típicamente 5.0) por encima del cual el mensaje se marca o rechaza.</p>\n<p><strong>Antivirus — ClamAV</strong>: se integra en el flujo SMTP mediante <code>amavisd-new</code> o <code>clamav-milter</code>, escaneando adjuntos antes de la entrega y rechazando o poniendo en cuarentena mensajes infectados.</p>\n<h3 id=\"6-alta-disponibilidad-de-correo\">6. Alta disponibilidad de correo</h3>\n<p>Se publican varios registros <strong>MX</strong> con distinta <strong>prioridad</strong> (número menor = mayor preferencia):</p>\n<pre><code>dominio.es. IN MX 10 mx1.dominio.es.\ndominio.es. IN MX 20 mx2.dominio.es.</code></pre>\n<p>Si <code>mx1</code> no responde, el MTA emisor reintenta contra <code>mx2</code> (MX secundario), que puede aceptar el correo en cola (backup MX) o simplemente balancear carga si ambos tienen igual prioridad.</p>\n<hr />\n<h3 id=\"7-contenedores-namespaces-y-cgroups-de-linux\">7. Contenedores: namespaces y cgroups de Linux</h3>\n<p>Un contenedor no es una máquina virtual: es un proceso Linux normal al que el kernel aísla mediante dos mecanismos independientes.</p>\n<p><strong>Namespaces</strong> (aíslan la <em>visibilidad</em>, \"qué ve\" el proceso):</p>\n<ul>\n<li><strong>pid</strong>: el proceso ve su propio árbol de PIDs; dentro del contenedor es PID 1, aunque en el host tenga otro PID real.</li>\n<li><strong>net</strong>: pila de red propia (interfaces, tablas de rutas, puertos); permite que dos contenedores usen el mismo puerto 80 sin colisión.</li>\n<li><strong>mnt</strong>: árbol de puntos de montaje propio; el contenedor ve su propio filesystem raíz.</li>\n<li><strong>uts</strong>: hostname y dominio NIS independientes del host.</li>\n<li><strong>ipc</strong>: colas de mensajes, semáforos y memoria compartida System V aisladas.</li>\n<li><strong>user</strong>: mapea UIDs/GIDs del contenedor a un rango distinto en el host (p. ej. root dentro del contenedor = UID 100000 fuera), reduciendo el impacto de un escape.</li>\n</ul>\n<p><strong>cgroups</strong> (limitan y contabilizan <em>recursos</em>, \"cuánto\" puede consumir):</p>\n<ul>\n<li><strong>cgroups v1</strong>: jerarquías independientes por controlador (cpu, memory, blkio...), cada una montada por separado; más flexible pero más complejo de gestionar coherentemente.</li>\n<li><strong>cgroups v2</strong>: jerarquía unificada única, todos los controladores bajo el mismo árbol; modelo más simple, adoptado por defecto en distribuciones modernas (systemd, Docker reciente, Kubernetes).</li>\n</ul>\n<p>Ejemplo: limitar memoria de un contenedor a 512 MB usa el controlador <code>memory</code> de cgroups; aislar que no vea los procesos de otros contenedores usa el namespace <code>pid</code>. Son ortogonales: se puede limitar CPU sin aislar red, y viceversa.</p>\n<h3 id=\"8-docker-en-profundidad\">8. Docker en profundidad</h3>\n<p><strong>Dockerfile comentado:</strong></p>\n<div class=\"sourceCode\" id=\"cb8\"><pre class=\"sourceCode dockerfile\"><code class=\"sourceCode dockerfile\"><span id=\"cb8-1\"><a href=\"#cb8-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">FROM</span> node:20-alpine            <span class=\"co\"># imagen base minimalista (Alpine ~5MB)</span></span>\n<span id=\"cb8-2\"><a href=\"#cb8-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">WORKDIR</span> /app                   <span class=\"co\"># directorio de trabajo dentro del contenedor</span></span>\n<span id=\"cb8-3\"><a href=\"#cb8-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">COPY</span> package*.json ./          <span class=\"co\"># copia solo manifiestos primero (cachea la capa)</span></span>\n<span id=\"cb8-4\"><a href=\"#cb8-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">RUN</span> <span class=\"ex\">npm</span> ci <span class=\"at\">--omit</span><span class=\"op\">=</span>dev          <span class=\"co\"># instala dependencias en capa separada y cacheable</span></span>\n<span id=\"cb8-5\"><a href=\"#cb8-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">COPY</span> . .                       <span class=\"co\"># copia el resto del código (invalida caché si cambia)</span></span>\n<span id=\"cb8-6\"><a href=\"#cb8-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">RUN</span> <span class=\"ex\">addgroup</span> <span class=\"at\">-S</span> app <span class=\"kw\">&amp;&amp;</span> <span class=\"ex\">adduser</span> <span class=\"at\">-S</span> app <span class=\"at\">-G</span> app   <span class=\"co\"># usuario no privilegiado</span></span>\n<span id=\"cb8-7\"><a href=\"#cb8-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">USER</span> app                       <span class=\"co\"># evita ejecutar el proceso como root</span></span>\n<span id=\"cb8-8\"><a href=\"#cb8-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">EXPOSE</span> 3000                    <span class=\"co\"># documenta el puerto (no lo publica)</span></span>\n<span id=\"cb8-9\"><a href=\"#cb8-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">HEALTHCHECK</span> <span class=\"op\">--interval=30s</span> <span class=\"kw\">CMD</span> <span class=\"fu\">wget</span> <span class=\"at\">-qO-</span> http://localhost:3000/health <span class=\"kw\">||</span> <span class=\"bu\">exit</span> 1</span>\n<span id=\"cb8-10\"><a href=\"#cb8-10\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CMD</span> [<span class=\"st\">&quot;node&quot;</span>, <span class=\"st\">&quot;server.js&quot;</span>]      <span class=\"co\"># proceso principal (PID 1 del contenedor)</span></span></code></pre></div>\n<p>Cada instrucción genera una <strong>capa</strong> (layer) inmutable superpuesta mediante un filesystem <strong>copy-on-write</strong> (overlay2 en Docker moderno): las capas se comparten entre imágenes que las tienen en común, ahorrando espacio, y solo se copia (y modifica) un bloque cuando un proceso escribe sobre él. El orden de las instrucciones importa: colocar lo que cambia con menos frecuencia (dependencias) antes que el código fuente maximiza el aprovechamiento de la caché de build.</p>\n<p><strong>docker-compose.yml</strong> (orquestación local multicontenedor):</p>\n<div class=\"sourceCode\" id=\"cb9\"><pre class=\"sourceCode yaml\"><code class=\"sourceCode yaml\"><span id=\"cb9-1\"><a href=\"#cb9-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">version</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"st\">&quot;3.9&quot;</span></span>\n<span id=\"cb9-2\"><a href=\"#cb9-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">services</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-3\"><a href=\"#cb9-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">web</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-4\"><a href=\"#cb9-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">build</span><span class=\"kw\">:</span><span class=\"at\"> .</span></span>\n<span id=\"cb9-5\"><a href=\"#cb9-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">ports</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-6\"><a href=\"#cb9-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"kw\">-</span><span class=\"at\"> </span><span class=\"st\">&quot;3000:3000&quot;</span></span>\n<span id=\"cb9-7\"><a href=\"#cb9-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">environment</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-8\"><a href=\"#cb9-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"kw\">-</span><span class=\"at\"> DB_HOST=db</span></span>\n<span id=\"cb9-9\"><a href=\"#cb9-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">depends_on</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-10\"><a href=\"#cb9-10\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"kw\">-</span><span class=\"at\"> db</span></span>\n<span id=\"cb9-11\"><a href=\"#cb9-11\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">db</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-12\"><a href=\"#cb9-12\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">image</span><span class=\"kw\">:</span><span class=\"at\"> postgres:16-alpine</span></span>\n<span id=\"cb9-13\"><a href=\"#cb9-13\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">volumes</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-14\"><a href=\"#cb9-14\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"kw\">-</span><span class=\"at\"> dbdata:/var/lib/postgresql/data</span></span>\n<span id=\"cb9-15\"><a href=\"#cb9-15\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">environment</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-16\"><a href=\"#cb9-16\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"kw\">-</span><span class=\"at\"> POSTGRES_PASSWORD_FILE=/run/secrets/db_password</span></span>\n<span id=\"cb9-17\"><a href=\"#cb9-17\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">secrets</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-18\"><a href=\"#cb9-18\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"kw\">-</span><span class=\"at\"> db_password</span></span>\n<span id=\"cb9-19\"><a href=\"#cb9-19\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">volumes</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-20\"><a href=\"#cb9-20\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">dbdata</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-21\"><a href=\"#cb9-21\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">secrets</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-22\"><a href=\"#cb9-22\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">db_password</span><span class=\"kw\">:</span></span>\n<span id=\"cb9-23\"><a href=\"#cb9-23\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">file</span><span class=\"kw\">:</span><span class=\"at\"> ./db_password.txt</span></span></code></pre></div>\n<p><strong>Registros de imágenes</strong>: Docker Hub (público, por defecto), o registros privados como <strong>Harbor</strong> (self-hosted, con escaneo de vulnerabilidades integrado, control de acceso RBAC y replicación entre instancias), útiles en entornos corporativos donde no se puede depender de un registro externo.</p>\n<h3 id=\"9-kubernetes-en-profundidad\">9. Kubernetes en profundidad</h3>\n<p><strong>Control plane:</strong></p>\n<ul>\n<li><strong>kube-apiserver</strong>: punto de entrada único; expone la API REST, valida y persiste peticiones.</li>\n<li><strong>etcd</strong>: base de datos clave-valor distribuida que almacena todo el estado del clúster.</li>\n<li><strong>kube-scheduler</strong>: decide en qué nodo se ejecuta cada Pod nuevo según recursos disponibles y afinidades.</li>\n<li><strong>kube-controller-manager</strong>: ejecuta bucles de control (ReplicaSet, Node, Endpoints) que reconcilian el estado real con el deseado.</li>\n</ul>\n<p><strong>Nodos (worker):</strong></p>\n<ul>\n<li><strong>kubelet</strong>: agente que garantiza que los contenedores descritos en los Pods asignados a ese nodo estén ejecutándose.</li>\n<li><strong>kube-proxy</strong>: gestiona reglas de red (iptables/IPVS) para el enrutamiento de Services.</li>\n<li><strong>container runtime</strong>: containerd o CRI-O, motor que efectivamente crea y ejecuta los contenedores vía la interfaz CRI.</li>\n</ul>\n<p><strong>Objetos principales</strong>: <strong>Pod</strong> (unidad mínima desplegable, uno o más contenedores que comparten red y almacenamiento), <strong>Deployment</strong> (gestiona ReplicaSets, despliegues rolling update), <strong>Service</strong> (IP virtual estable que balancea tráfico hacia Pods mediante selector de labels), <strong>Ingress</strong> (enrutamiento HTTP/HTTPS externo hacia Services), <strong>ConfigMap</strong> (configuración no sensible desacoplada de la imagen), <strong>Secret</strong> (datos sensibles, codificados en base64, montables como volumen o variable de entorno), <strong>PersistentVolume/PersistentVolumeClaim</strong> (abstracción de almacenamiento persistente independiente del ciclo de vida del Pod).</p>\n<div class=\"sourceCode\" id=\"cb10\"><pre class=\"sourceCode yaml\"><code class=\"sourceCode yaml\"><span id=\"cb10-1\"><a href=\"#cb10-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">apiVersion</span><span class=\"kw\">:</span><span class=\"at\"> apps/v1</span></span>\n<span id=\"cb10-2\"><a href=\"#cb10-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">kind</span><span class=\"kw\">:</span><span class=\"at\"> Deployment</span></span>\n<span id=\"cb10-3\"><a href=\"#cb10-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">metadata</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-4\"><a href=\"#cb10-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">name</span><span class=\"kw\">:</span><span class=\"at\"> api-deployment</span></span>\n<span id=\"cb10-5\"><a href=\"#cb10-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">spec</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-6\"><a href=\"#cb10-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">replicas</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"dv\">3</span></span>\n<span id=\"cb10-7\"><a href=\"#cb10-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">selector</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-8\"><a href=\"#cb10-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">matchLabels</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-9\"><a href=\"#cb10-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"fu\">app</span><span class=\"kw\">:</span><span class=\"at\"> api</span></span>\n<span id=\"cb10-10\"><a href=\"#cb10-10\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">template</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-11\"><a href=\"#cb10-11\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">metadata</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-12\"><a href=\"#cb10-12\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"fu\">labels</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-13\"><a href=\"#cb10-13\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">        </span><span class=\"fu\">app</span><span class=\"kw\">:</span><span class=\"at\"> api</span></span>\n<span id=\"cb10-14\"><a href=\"#cb10-14\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">spec</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-15\"><a href=\"#cb10-15\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"fu\">containers</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-16\"><a href=\"#cb10-16\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">        </span><span class=\"kw\">-</span><span class=\"at\"> </span><span class=\"fu\">name</span><span class=\"kw\">:</span><span class=\"at\"> api</span></span>\n<span id=\"cb10-17\"><a href=\"#cb10-17\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">          </span><span class=\"fu\">image</span><span class=\"kw\">:</span><span class=\"at\"> registro.interno/api:1.4.2</span></span>\n<span id=\"cb10-18\"><a href=\"#cb10-18\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">          </span><span class=\"fu\">ports</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-19\"><a href=\"#cb10-19\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">            </span><span class=\"kw\">-</span><span class=\"at\"> </span><span class=\"fu\">containerPort</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"dv\">8080</span></span>\n<span id=\"cb10-20\"><a href=\"#cb10-20\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">          </span><span class=\"fu\">resources</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-21\"><a href=\"#cb10-21\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">            </span><span class=\"fu\">requests</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"kw\">{</span><span class=\"at\"> </span><span class=\"fu\">cpu</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"st\">&quot;100m&quot;</span><span class=\"kw\">,</span><span class=\"at\"> </span><span class=\"fu\">memory</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"st\">&quot;128Mi&quot;</span><span class=\"at\"> </span><span class=\"kw\">}</span></span>\n<span id=\"cb10-22\"><a href=\"#cb10-22\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">            </span><span class=\"fu\">limits</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"kw\">{</span><span class=\"at\"> </span><span class=\"fu\">cpu</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"st\">&quot;500m&quot;</span><span class=\"kw\">,</span><span class=\"at\"> </span><span class=\"fu\">memory</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"st\">&quot;256Mi&quot;</span><span class=\"at\"> </span><span class=\"kw\">}</span></span>\n<span id=\"cb10-23\"><a href=\"#cb10-23\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"pp\">---</span></span>\n<span id=\"cb10-24\"><a href=\"#cb10-24\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">apiVersion</span><span class=\"kw\">:</span><span class=\"at\"> v1</span></span>\n<span id=\"cb10-25\"><a href=\"#cb10-25\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">kind</span><span class=\"kw\">:</span><span class=\"at\"> Service</span></span>\n<span id=\"cb10-26\"><a href=\"#cb10-26\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">metadata</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-27\"><a href=\"#cb10-27\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">name</span><span class=\"kw\">:</span><span class=\"at\"> api-service</span></span>\n<span id=\"cb10-28\"><a href=\"#cb10-28\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">spec</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-29\"><a href=\"#cb10-29\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">selector</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-30\"><a href=\"#cb10-30\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"fu\">app</span><span class=\"kw\">:</span><span class=\"at\"> api</span></span>\n<span id=\"cb10-31\"><a href=\"#cb10-31\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">ports</span><span class=\"kw\">:</span></span>\n<span id=\"cb10-32\"><a href=\"#cb10-32\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">    </span><span class=\"kw\">-</span><span class=\"at\"> </span><span class=\"fu\">port</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"dv\">80</span></span>\n<span id=\"cb10-33\"><a href=\"#cb10-33\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">      </span><span class=\"fu\">targetPort</span><span class=\"kw\">:</span><span class=\"at\"> </span><span class=\"dv\">8080</span></span>\n<span id=\"cb10-34\"><a href=\"#cb10-34\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">  </span><span class=\"fu\">type</span><span class=\"kw\">:</span><span class=\"at\"> ClusterIP</span></span></code></pre></div>\n<h3 id=\"10-vm-vs-contenedor-y-seguridad\">10. VM vs contenedor, y seguridad</h3>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Máquina virtual</th>\n<th>Contenedor</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Aislamiento</td>\n<td>Hipervisor, kernel propio por VM</td>\n<td>Namespaces/cgroups, kernel compartido con el host</td>\n</tr>\n<tr>\n<td>Arranque</td>\n<td>Minutos (boot de SO completo)</td>\n<td>Segundos o milisegundos</td>\n</tr>\n<tr>\n<td>Tamaño</td>\n<td>GB (SO completo)</td>\n<td>MB (solo dependencias de la app)</td>\n</tr>\n<tr>\n<td>Densidad por host</td>\n<td>Baja-media</td>\n<td>Alta</td>\n</tr>\n<tr>\n<td>Seguridad de aislamiento</td>\n<td>Fuerte (frontera de hardware)</td>\n<td>Más débil (comparte kernel)</td>\n</tr>\n<tr>\n<td>Caso de uso típico</td>\n<td>Cargas heterogéneas, multi-SO</td>\n<td>Microservicios, despliegue rápido</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Seguridad de contenedores</strong>: escaneo de imágenes en el pipeline CI/CD (Trivy, Clair, o el escáner integrado de Harbor) para detectar CVEs en las capas antes de publicar; ejecución con <strong>usuario no root</strong> dentro del contenedor (como en el Dockerfile anterior) para limitar el impacto de un escape; <strong>Network Policies</strong> en Kubernetes, que restringen mediante selectores de labels qué Pods pueden comunicarse entre sí (deny-by-default más reglas explícitas de permiso), evitando movimiento lateral tras un compromiso.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li>No confundir <strong>MSA</strong> (puerto 587, con autenticación, entre MUA y servidor) con <strong>MTA</strong> (puerto 25, entre servidores, sin autenticación de usuario).</li>\n<li>El código SMTP <code>550</code> es un rechazo <strong>permanente</strong> (no se reintenta); <code>450</code>/<code>451</code> son <strong>transitorios</strong> (Postfix reintenta según su política de colas). Confundirlos en un supuesto práctico es error típico.</li>\n<li>SPF valida el dominio del sobre (<code>MAIL FROM</code>, envelope sender), no necesariamente el <code>From:</code> visible; DMARC es quien exige la <strong>alineación</strong> entre ambos, de ahí que un mensaje pueda pasar SPF y aun así fallar DMARC.</li>\n<li>Un <strong>namespace</strong> aísla visibilidad (qué recursos \"ve\" el proceso); un <strong>cgroup</strong> limita y contabiliza consumo de recursos. No son intercambiables ni resuelven el mismo problema.</li>\n<li>En Kubernetes, un <strong>Service</strong> no es un balanceador físico: es una regla de red gestionada por kube-proxy que redirige hacia Pods vivos según <code>selector</code>; el <strong>Ingress</strong> opera en capa HTTP y necesita un controlador (nginx-ingress, Traefik) que sí implemente el objeto.</li>\n</ul>\n"}, {"num": 4, "title": "Administración de redes de área local. Gestión de usuarios. Gestión de dispositivos. Monitorización y control de tráfico.", "html": "<h3 id=\"1-diseño-jerárquico-de-la-red\">1. Diseño jerárquico de la red</h3>\n<p>El modelo jerárquico clásico divide la LAN en tres capas funcionales que evitan mezclar en un mismo equipo tareas de conmutación masiva, enrutamiento entre VLAN y conectividad de usuario final:</p>\n<ul>\n<li><strong>Núcleo (core):</strong> backbone de alta velocidad, baja latencia y máxima disponibilidad. No realiza filtrado ni políticas complejas; su única misión es conmutar tráfico entre bloques de distribución lo más rápido posible. Se diseña redundante (doble enlace, doble switch) para tolerar fallos sin punto único de fallo.</li>\n<li><strong>Distribución:</strong> frontera entre capas de acceso y núcleo. Aquí se realiza el enrutamiento inter-VLAN, la agregación de enlaces de los switches de acceso, la aplicación de ACL y políticas de QoS, y la sumarización de rutas hacia el núcleo. Es el punto natural para implementar redundancia con HSRP/VRRP.</li>\n<li><strong>Acceso:</strong> capa de conexión directa con el usuario final (PC, teléfono IP, impresora, punto de acceso Wi-Fi). Aplica seguridad de puerto (port-security, 802.1X), asignación de VLAN por puerto y PoE.</li>\n</ul>\n<p>En redes pequeñas, distribución y núcleo pueden colapsarse en un único par de switches (\"collapsed core\"), pero el razonamiento por capas sigue siendo la base para justificar decisiones de diseño en el supuesto práctico.</p>\n<h3 id=\"2-segmentación-lógica-vlan-y-8021q\">2. Segmentación lógica: VLAN y 802.1Q</h3>\n<p>Una VLAN (Virtual LAN) segmenta un dominio de broadcast a nivel de capa 2 sin necesidad de segmentación física. El estándar <strong>IEEE 802.1Q</strong> define el etiquetado de trama que permite a un enlace transportar tráfico de varias VLAN.</p>\n<p>El tag 802.1Q ocupa <strong>4 bytes</strong> insertados entre la dirección MAC origen y el campo EtherType/Longitud original:</p>\n<table>\n<thead>\n<tr>\n<th>Campo</th>\n<th>Tamaño</th>\n<th>Contenido</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>TPID (Tag Protocol Identifier)</td>\n<td>2 bytes</td>\n<td>Valor fijo <code>0x8100</code>, indica que sigue una etiqueta 802.1Q</td>\n</tr>\n<tr>\n<td>PCP (Priority Code Point)</td>\n<td>3 bits</td>\n<td>Prioridad 802.1p (0-7), usada para QoS en capa 2</td>\n</tr>\n<tr>\n<td>DEI/CFI (Drop Eligible Indicator)</td>\n<td>1 bit</td>\n<td>Elegibilidad de descarte en congestión</td>\n</tr>\n<tr>\n<td>VLAN ID</td>\n<td>12 bits</td>\n<td>Identificador de VLAN (0 y 4095 reservados; rango útil 1-4094)</td>\n</tr>\n</tbody>\n</table>\n<p>Un <strong>puerto access</strong> pertenece a una única VLAN y entrega tramas sin etiquetar al host; un <strong>puerto trunk</strong> transporta múltiples VLAN etiquetadas entre switches (o hacia un router/firewall para enrutamiento inter-VLAN, \"router-on-a-stick\"). La <strong>VLAN nativa</strong> de un trunk es la única que circula sin etiquetar; si no coincide en ambos extremos se produce un salto de VLAN (VLAN hopping) o pérdida de conectividad, por lo que buenas prácticas recomiendan moverla a una VLAN no usada distinta de la VLAN 1.</p>\n<pre><code>vlan 10\n name VENTAS\nvlan 20\n name IT\n!\ninterface GigabitEthernet0/1\n switchport mode access\n switchport access vlan 10\n!\ninterface GigabitEthernet0/24\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n switchport trunk native vlan 99</code></pre>\n<h3 id=\"3-asignación-dinámica-de-direcciones-dhcp\">3. Asignación dinámica de direcciones: DHCP</h3>\n<p>DHCP (Dynamic Host Configuration Protocol, RFC 2131) automatiza la asignación de IP, máscara, puerta de enlace y demás parámetros. El proceso de arranque se conoce como <strong>DORA</strong>:</p>\n<pre><code>Cliente                                   Servidor DHCP\n   |---- DISCOVER (broadcast, UDP 68-&gt;67) ----&gt;|\n   |&lt;--- OFFER (propone IP + parámetros) ------|\n   |---- REQUEST (broadcast, confirma oferta) -&gt;|\n   |&lt;--- ACK (concede la IP, envía opciones) ---|</code></pre>\n<p>Opciones DHCP relevantes: <strong>opción 1</strong> (máscara de subred), <strong>opción 3</strong> (router/puerta de enlace), <strong>opción 6</strong> (servidores DNS), <strong>opción 51</strong> (tiempo de concesión o lease time), <strong>opción 53</strong> (tipo de mensaje DHCP) y <strong>opción 82</strong> (información del agente de retransmisión).</p>\n<p>Como DHCP se basa en broadcast de capa 2, un cliente en una subred sin servidor local necesita un <strong>DHCP relay / IP helper</strong>: el router de esa subred convierte el broadcast en unicast hacia el servidor real.</p>\n<pre><code>interface GigabitEthernet0/0\n ip helper-address 192.168.1.10</code></pre>\n<p>Para alta disponibilidad existe el <strong>DHCP failover</strong> entre dos servidores: modo <strong>load balance</strong> (ambos activos, se reparten las peticiones según un ratio configurado por hash) y modo <strong>hot standby</strong> (uno activo, otro pasivo que solo responde si el principal cae). El parámetro clave es el <strong>MCLT (Maximum Client Lead Time)</strong>: margen de seguridad que un servidor debe esperar antes de poder extender unilateralmente una concesión cuando pierde contacto con su pareja, evitando que ambos asignen la misma IP.</p>\n<h3 id=\"4-resolución-de-nombres-dns\">4. Resolución de nombres: DNS</h3>\n<p>DNS es una base de datos distribuida y jerárquica. La jerarquía consta de <strong>servidores raíz</strong> (root, identificados lógicamente de la A a la M), <strong>servidores de dominio de nivel superior (TLD)</strong> (.com, .es, .org) y <strong>servidores autoritativos</strong> de cada dominio, que contienen los registros reales.</p>\n<p>Tipos de registro principales: <strong>A</strong> (nombre a IPv4), <strong>AAAA</strong> (nombre a IPv6), <strong>CNAME</strong> (alias hacia otro nombre canónico), <strong>MX</strong> (servidor de correo, con prioridad numérica), <strong>PTR</strong> (resolución inversa, zona <code>in-addr.arpa</code>), <strong>NS</strong> (delegación de servidores de nombres), <strong>SOA</strong> (autoridad de la zona: serie, refresh, retry, expire, TTL mínimo) y <strong>TXT</strong> (texto libre, usado para SPF/DKIM/verificaciones).</p>\n<pre><code>$TTL 3600\n@       IN  SOA  ns1.ejemplo.es. admin.ejemplo.es. (\n                 2026082701 ; serial\n                 3600       ; refresh\n                 900        ; retry\n                 604800     ; expire\n                 3600 )     ; minimo\n        IN  NS   ns1.ejemplo.es.\n        IN  MX   10 mail.ejemplo.es.\nwww     IN  A    192.168.10.10\nmail    IN  A    192.168.10.20\nftp     IN  CNAME www\n        IN  TXT  &quot;v=spf1 mx -all&quot;</code></pre>\n<p>La <strong>resolución recursiva</strong> ocurre cuando el cliente delega todo el trabajo en su resolver (normalmente el del proveedor o un servidor caché interno), que a su vez realiza consultas <strong>iterativas</strong> contra raíz, TLD y autoritativo hasta obtener la respuesta final. Cada registro se <strong>cachea</strong> durante su <strong>TTL</strong>; existe también caché negativa (RFC 2308) basada en el campo mínimo del SOA, para respuestas de tipo \"no existe\".</p>\n<h3 id=\"5-gestión-de-usuarios-active-directory-ldap-y-kerberos\">5. Gestión de usuarios: Active Directory, LDAP y Kerberos</h3>\n<p>Active Directory organiza los objetos en <strong>bosque</strong> (frontera de seguridad máxima, comparte esquema y catálogo global), <strong>dominio</strong> (frontera administrativa y de replicación) y <strong>unidad organizativa (OU)</strong> (contenedor para delegar administración y aplicar directivas de grupo).</p>\n<p>La autenticación se basa en <strong>Kerberos</strong>. El <strong>KDC (Key Distribution Center)</strong>, que reside en cada controlador de dominio, integra dos servicios: <strong>AS (Authentication Server)</strong> y <strong>TGS (Ticket Granting Service)</strong>.</p>\n<ol type=\"1\">\n<li>El cliente se autentica ante el AS con una clave derivada de su contraseña y recibe un <strong>TGT (Ticket Granting Ticket)</strong> cifrado con la clave de la cuenta <code>krbtgt</code>.</li>\n<li>Cuando necesita acceder a un servicio concreto (SPN), presenta el TGT al TGS, que lo valida y emite un <strong>ticket de servicio</strong> cifrado con la clave de la cuenta del servicio destino.</li>\n<li>El cliente presenta ese ticket de servicio directamente al servidor de recursos, que lo descifra con su propia clave y autentica al usuario sin que la contraseña viaje por la red.</li>\n</ol>\n<p>Las <strong>GPO (Group Policy Objects)</strong> se aplican en el orden <strong>LSDOU</strong>: <strong>L</strong>ocal, <strong>S</strong>itio, <strong>D</strong>ominio, <strong>O</strong>U. La última en aplicarse (la OU más específica) prevalece en caso de conflicto, salvo que una directiva superior esté marcada como <strong>Enforced/No invalidar</strong>, en cuyo caso gana siempre sobre las inferiores.</p>\n<h3 id=\"6-integración-de-linux-en-el-directorio\">6. Integración de Linux en el directorio</h3>\n<p>En entornos Linux, <strong>OpenLDAP</strong> (demonio <code>slapd</code>) implementa un servidor de directorio propio compatible con el protocolo LDAP. <strong>SSSD (System Security Services Daemon)</strong> unifica el acceso a backends de autenticación (LDAP, Kerberos, AD), cachea credenciales para uso offline y centraliza NSS/PAM. La integración directa con Active Directory se realiza mediante <strong>Winbind</strong> (componente de Samba que mapea SID de Windows a UID/GID Unix) o, de forma simplificada, con <strong>realmd</strong>:</p>\n<pre><code>realm discover dominio.ejemplo.local\nrealm join --user=administrador dominio.ejemplo.local</code></pre>\n<h3 id=\"7-modelos-de-control-de-acceso-dac-mac-y-rbac\">7. Modelos de control de acceso: DAC, MAC y RBAC</h3>\n<table>\n<thead>\n<tr>\n<th>Modelo</th>\n<th>Quién decide el acceso</th>\n<th>Ejemplo típico</th>\n<th>Flexibilidad</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>DAC</strong> (Discrecional)</td>\n<td>El propietario del recurso</td>\n<td>Permisos NTFS/Unix (rwx)</td>\n<td>Alta, pero propensa a errores de propagación</td>\n</tr>\n<tr>\n<td><strong>MAC</strong> (Obligatorio)</td>\n<td>Política central del sistema, etiquetas de clasificación</td>\n<td>SELinux, niveles confidencial/secreto</td>\n<td>Baja, máxima seguridad</td>\n</tr>\n<tr>\n<td><strong>RBAC</strong> (Basado en roles)</td>\n<td>Rol asignado al usuario, no el usuario directamente</td>\n<td>Grupos de AD, roles de Azure/IAM</td>\n<td>Media-alta, escala bien en organizaciones grandes</td>\n</tr>\n</tbody>\n</table>\n<p>En DAC el propio usuario puede ceder sus permisos a otro; en MAC ni siquiera el propietario puede saltarse la política (el kernel la impone); en RBAC la gestión se centra en mantener actualizada la pertenencia a roles en lugar de permisos individuales por recurso.</p>\n<h3 id=\"8-gestión-de-dispositivos\">8. Gestión de dispositivos</h3>\n<p>El <strong>MDM/UEM</strong> (Mobile Device Management / Unified Endpoint Management) permite inscribir, configurar y proteger de forma centralizada equipos y móviles. Con <strong>Microsoft Intune</strong>, por ejemplo, se definen perfiles de configuración, directivas de cumplimiento (cifrado, PIN, versión de SO) integradas con acceso condicional, y capacidad de borrado remoto. En escenarios <strong>BYOD</strong> se recurre a directivas de protección de aplicaciones (MAM) sin inscripción completa del dispositivo, separando datos corporativos y personales mediante contenedores cifrados.</p>\n<p>La <strong>CMDB (Configuration Management Database)</strong>, dentro del marco ITIL, almacena los <strong>CI (Configuration Items)</strong> y sus relaciones (qué servidor depende de qué switch, qué aplicación corre sobre qué VM). El <strong>ITAM (IT Asset Management)</strong> gestiona el ciclo de vida completo del activo —adquisición, asignación, mantenimiento y baja—, normalmente alimentando o alimentándose de la CMDB.</p>\n<h3 id=\"9-monitorización-de-red\">9. Monitorización de red</h3>\n<p><strong>SNMP</strong> (Simple Network Management Protocol) sigue un modelo gestor-agente: la estación de gestión (NMS) consulta agentes residentes en los dispositivos. Operaciones básicas: <strong>GET</strong> (lee un OID concreto), <strong>GETNEXT</strong> (recorre el árbol MIB), <strong>SET</strong> (modifica un valor si es escribible) y <strong>TRAP</strong> (notificación asíncrona no solicitada del agente al gestor ante un evento; en v2c/v3 existe además <strong>INFORM</strong>, que sí se confirma).</p>\n<p>La <strong>MIB (Management Information Base)</strong> es un árbol jerárquico de objetos identificados por <strong>OID</strong>; por ejemplo <code>1.3.6.1.2.1.1.3.0</code> corresponde a <code>sysUpTime</code> (iso.org.dod.internet.mgmt.mib-2.system.sysUpTime.0).</p>\n<table>\n<thead>\n<tr>\n<th>Versión</th>\n<th>Autenticación</th>\n<th>Cifrado</th>\n<th>Riesgo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>SNMPv1</td>\n<td>Community string en texto claro</td>\n<td>No</td>\n<td>Alto</td>\n</tr>\n<tr>\n<td>SNMPv2c</td>\n<td>Community string en texto claro</td>\n<td>No</td>\n<td>Alto</td>\n</tr>\n<tr>\n<td>SNMPv3</td>\n<td>USM: usuario + MD5/SHA</td>\n<td>Sí, DES/AES</td>\n<td>Bajo, apto para producción</td>\n</tr>\n</tbody>\n</table>\n<p>Para análisis de tráfico a nivel de flujo se usan tres tecnologías: <strong>NetFlow</strong> (propietario de Cisco, exporta registros unidireccionales por 5-tupla; v5 con campos fijos, v9 basado en plantillas), <strong>sFlow</strong> (basado en muestreo de paquetes, menor sobrecarga en el dispositivo, neutral respecto al fabricante) e <strong>IPFIX</strong> (estándar IETF derivado de NetFlow v9, extensible mediante plantillas).</p>\n<h3 id=\"10-control-de-tráfico-qos-y-acl\">10. Control de tráfico: QoS y ACL</h3>\n<p>QoS clasifica y marca el tráfico mediante <strong>DSCP</strong> (6 bits del campo DS de la cabecera IP): <strong>EF (Expedited Forwarding, DSCP 46)</strong> para tráfico sensible a latencia como VoIP, y las clases <strong>AF (Assured Forwarding, AF11-AF43)</strong> con distinta precedencia de descarte para tráfico con garantías relativas. El <strong>shaping</strong> retiene el tráfico excedente en un buffer y lo retransmite ajustado a la tasa contratada, suavizando ráfagas sin descartar paquetes salvo saturación del buffer; el <strong>policing</strong> actúa en tiempo real descartando o remarcando el exceso sin almacenarlo, imponiendo un límite estricto de tasa.</p>\n<p>Las <strong>ACL</strong> filtran tráfico en routers/firewalls. Las <strong>estándar</strong> (numeradas 1-99 y 1300-1999 en Cisco) solo filtran por IP origen; las <strong>extendidas</strong> (100-199, 2000-2699) permiten filtrar por IP origen y destino, protocolo y puerto:</p>\n<pre><code>access-list 101 deny tcp any host 192.168.10.20 eq 23\naccess-list 101 permit ip any any</code></pre>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li>Confundir la <strong>VLAN nativa</strong> de un trunk (la que viaja sin etiquetar) con la VLAN de gestión del switch; son conceptos independientes aunque por defecto coincidan en la VLAN 1.</li>\n<li>Invertir el orden <strong>DORA</strong>: recordar que Discover y Request son broadcast del cliente, mientras que Offer y Ack los envía el servidor.</li>\n<li>Intercambiar <strong>shaping</strong> y <strong>policing</strong>: shaping retrasa y encola (no suele perder paquetes salvo desbordamiento), policing descarta o remarca de inmediato.</li>\n<li>Confundir el <strong>TGT</strong> (emitido por el AS, cifrado con la clave de <code>krbtgt</code>) con el <strong>ticket de servicio</strong> (emitido por el TGS, cifrado con la clave de la cuenta del servicio de destino).</li>\n<li>Aplicar mal la prioridad <strong>LSDOU</strong>: la OU más cercana al objeto gana normalmente, pero una directiva marcada como \"Enforced\" en un nivel superior siempre prevalece sobre las inferiores.</li>\n</ul>\n"}, {"num": 5, "title": "Conceptos de seguridad de los sistemas de información. Seguridad física. Seguridad lógica. Amenazas y vulnerabilidades. Técnicas criptográficas y protocolos seguros. Mecanismos de firma digital. Infraestructura física de un CPD: acondicionamiento y equipamiento. Sistemas de gestión de incidencias. Control remoto de puestos de usuario.", "html": "<h3 id=\"1-conceptos-fundamentales-de-seguridad-de-la-información\">1. Conceptos fundamentales de seguridad de la información</h3>\n<p>La seguridad de la información se sustenta clásicamente en la tríada <strong>CIA</strong>: <strong>Confidencialidad</strong> (la información solo es accesible a quien está autorizado), <strong>Integridad</strong> (la información no se altera de forma no autorizada, ni accidental ni intencionadamente) y <strong>Disponibilidad</strong> (los sistemas y datos son accesibles cuando se necesitan). A estos tres pilares se añaden habitualmente dos propiedades complementarias: la <strong>autenticidad</strong>, que garantiza que el origen de la información o la identidad de un sujeto es quien dice ser, y la <strong>trazabilidad</strong> (o no repudio), que permite reconstruir quién hizo qué y cuándo, e impide que un actor niegue una acción realizada.</p>\n<p>El <strong>Esquema Nacional de Seguridad</strong> (RD 311/2022) formaliza estas cinco propiedades como <strong>dimensiones de seguridad</strong>, resumidas en el acrónimo <strong>D-A-I-C-T</strong>: Disponibilidad, Autenticidad, Integridad, Confidencialidad y Trazabilidad. Cada activo de información del sistema se valora en una escala (Bajo/Medio/Alto/Muy Alto, o \"no aplica\") para cada una de estas cinco dimensiones, y el nivel más alto obtenido determina la <strong>categoría del sistema</strong> (Básica, Media o Alta), que a su vez condiciona el conjunto de medidas de seguridad exigibles del Anexo II. Esta correspondencia directa entre la tríada CIA ampliada y las dimensiones ENS es un punto que el examen suele preguntar de forma literal.</p>\n<h3 id=\"2-seguridad-física\">2. Seguridad física</h3>\n<p>La seguridad física protege el soporte tangible de la información: instalaciones, equipos y personas.</p>\n<p><strong>Control de acceso.</strong> Se articula en capas: perimetral (vallas, torniquetes), de edificio (recepción, tarjetas de proximidad RFID) y de sala técnica (doble factor). Las <strong>tarjetas</strong> (contacto o proximidad) identifican por posesión; la <strong>biometría</strong> identifica por características del propio individuo:</p>\n<ul>\n<li><strong>Huella dactilar</strong>: barata, madura, pero degradable por suciedad o heridas; tasa de falso rechazo (FRR) relativamente alta en entornos industriales.</li>\n<li><strong>Iris</strong>: muy alta precisión (patrón único e inmutable), coste elevado, requiere buena iluminación y cooperación del usuario.</li>\n<li><strong>Facial</strong>: cómoda y sin contacto, pero más vulnerable a spoofing (fotos, mascarillas 3D) si no incorpora detección de vida (<em>liveness detection</em>).</li>\n</ul>\n<p>El acceso a los CPD suele combinar tarjeta + biometría (dos factores) y emplear una <strong>esclusa de seguridad o mantrap</strong>: una cámara con dos puertas enclavadas eléctricamente de forma que nunca puedan estar ambas abiertas a la vez, evitando el <em>tailgating</em> (colarse tras una persona autorizada).</p>\n<p><strong>Videovigilancia (CCTV).</strong> Cámaras IP con grabación en NVR, retención mínima habitual de 30-90 días, y cobertura obligatoria de puntos críticos: accesos, pasillos de CPD y zona de SAI/generador.</p>\n<p><strong>Sistemas de extinción de incendios.</strong> En salas técnicas se descarta el agua y la espuma porque dañan irreversiblemente el hardware energizado y no son eléctricamente seguras; se emplean <strong>agentes gaseosos limpios</strong>:</p>\n<ul>\n<li><strong>FM-200 (HFC-227ea)</strong>: extingue por absorción química del calor, no deja residuo, actúa en segundos, pero es un gas de efecto invernadero con vida atmosférica relativamente larga.</li>\n<li><strong>Novec 1230</strong>: fluorocetona con impacto ambiental mucho menor (GWP casi nulo) y margen de seguridad amplio para ocupación humana; alternativa \"verde\" a FM-200.</li>\n<li><strong>IG-541 (y gases inertes similares, IG-55, IG-100)</strong>: mezcla de nitrógeno, argón y CO₂ que extingue por dilución de oxígeno (lo reduce hasta ~12,5%, insuficiente para la combustión pero aún respirable); requiere más volumen de almacenamiento que los agentes químicos pero es totalmente inocuo ambientalmente.</li>\n</ul>\n<p>Todos estos sistemas son no conductores, no dejan residuo corrosivo sobre placas y componentes, y se activan con preaviso audible/visual para permitir evacuación antes de la descarga.</p>\n<h3 id=\"3-seguridad-lógica\">3. Seguridad lógica</h3>\n<p>La seguridad lógica protege el acceso a datos y sistemas mediante software y configuración.</p>\n<p><strong>Autenticación multifactor (MFA).</strong> Combina al menos dos de tres factores: <strong>algo que se sabe</strong> (contraseña, PIN), <strong>algo que se tiene</strong> (token físico, móvil, tarjeta) y <strong>algo que se es</strong> (biometría). Los estándares más usados para el segundo factor son:</p>\n<ul>\n<li><strong>HOTP</strong> (HMAC-based One-Time Password, RFC 4226): código derivado de un contador que se incrementa en cada uso.</li>\n<li><strong>TOTP</strong> (Time-based One-Time Password, RFC 6238): variante de HOTP que sustituye el contador por la marca de tiempo actual (ventanas típicas de 30 segundos), es la base de apps como Google Authenticator o Microsoft Authenticator.</li>\n</ul>\n<p><strong>Listas de control de acceso (ACL).</strong> Estructuras asociadas a un recurso (fichero, carpeta, objeto de red) que enumeran sujetos y los permisos concretos que tienen sobre él (lectura, escritura, ejecución, borrado), complementando o sustituyendo a los modelos de permisos más simples tipo Unix (propietario/grupo/otros).</p>\n<p><strong>Cifrado en reposo vs. en tránsito.</strong> El cifrado <strong>en reposo</strong> protege los datos almacenados (disco, base de datos, backup) frente a acceso físico o robo del soporte, típicamente con AES a nivel de volumen (BitLocker, LUKS) o de campo en BD (<em>Transparent Data Encryption</em>). El cifrado <strong>en tránsito</strong> protege los datos mientras viajan por la red (TLS, IPsec, SSH), evitando su captura o alteración en el camino. Ambos son complementarios: cifrar solo en tránsito deja expuesto el dato en el disco del servidor destino, y viceversa.</p>\n<h3 id=\"4-amenazas-y-vulnerabilidades\">4. Amenazas y vulnerabilidades</h3>\n<p><strong>Malware.</strong> Taxonomía por comportamiento:</p>\n<ul>\n<li><strong>Virus</strong>: código que se adjunta a un programa anfitrión y necesita ejecución de ese anfitrión para propagarse.</li>\n<li><strong>Gusano (worm)</strong>: se propaga de forma autónoma por la red explotando vulnerabilidades, sin necesitar anfitrión ni intervención del usuario.</li>\n<li><strong>Troyano</strong>: se presenta como software legítimo pero oculta funcionalidad maliciosa; no se autorreplica.</li>\n<li><strong>Ransomware</strong>: cifra los datos de la víctima y exige rescate para la clave de descifrado; combina a menudo exfiltración previa (doble extorsión).</li>\n<li><strong>Spyware</strong>: recopila información del usuario (pulsaciones, navegación, credenciales) sin consentimiento.</li>\n<li><strong>Rootkit</strong>: se instala con privilegios de sistema para ocultar su propia presencia y la de otro malware, manipulando el propio kernel o las herramientas de administración.</li>\n</ul>\n<p><strong>Ingeniería social.</strong> Explota factores humanos en lugar de fallos técnicos:</p>\n<ul>\n<li><strong>Phishing</strong>: correo masivo fraudulento que suplanta una entidad de confianza.</li>\n<li><strong>Spear-phishing</strong>: phishing dirigido a una persona u organización concreta, con información contextual que aumenta la credibilidad.</li>\n<li><strong>Whaling</strong>: spear-phishing dirigido a directivos o altos cargos.</li>\n<li><strong>Vishing</strong>: ingeniería social por voz/teléfono.</li>\n<li><strong>Smishing</strong>: ingeniería social por SMS.</li>\n</ul>\n<p><strong>Ataques de red.</strong></p>\n<ul>\n<li><strong>MITM (Man in the Middle)</strong>: el atacante se interpone entre dos partes y puede leer o alterar el tráfico sin que ninguna lo perciba.</li>\n<li><strong>DoS/DDoS</strong>: agotamiento de recursos (ancho de banda, conexiones, CPU) para impedir el servicio legítimo; distribuido cuando procede de múltiples orígenes coordinados (botnet).</li>\n<li><strong>ARP spoofing</strong>: el atacante envía respuestas ARP falsas para asociar su MAC a la IP de la puerta de enlace u otro host, desviando tráfico hacia sí (habilita MITM en redes locales).</li>\n<li><strong>DNS spoofing</strong>: envenena la resolución de nombres para redirigir a un dominio legítimo hacia una IP maliciosa.</li>\n</ul>\n<p><strong>Gestión de vulnerabilidades.</strong> Cada vulnerabilidad pública se identifica con un <strong>CVE</strong> (Common Vulnerabilities and Exposures), un identificador único que referencia el fallo de forma estandarizada. Su gravedad se mide con <strong>CVSS</strong> (Common Vulnerability Scoring System), calculado a partir de un vector de métricas base:</p>\n<table>\n<thead>\n<tr>\n<th>Métrica</th>\n<th>Significado</th>\n<th>Valores típicos</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>AV (Attack Vector)</td>\n<td>Vía de explotación</td>\n<td>Network / Adjacent / Local / Physical</td>\n</tr>\n<tr>\n<td>AC (Attack Complexity)</td>\n<td>Dificultad técnica</td>\n<td>Low / High</td>\n</tr>\n<tr>\n<td>PR (Privileges Required)</td>\n<td>Privilegios previos necesarios</td>\n<td>None / Low / High</td>\n</tr>\n<tr>\n<td>UI (User Interaction)</td>\n<td>Requiere acción del usuario</td>\n<td>None / Required</td>\n</tr>\n<tr>\n<td>S (Scope)</td>\n<td>Si afecta a componentes fuera del vulnerable</td>\n<td>Unchanged / Changed</td>\n</tr>\n<tr>\n<td>C / I / A</td>\n<td>Impacto en Confidencialidad / Integridad / Disponibilidad</td>\n<td>None / Low / High</td>\n</tr>\n</tbody>\n</table>\n<p>La puntuación resultante va de <strong>0 a 10</strong>:</p>\n<table>\n<thead>\n<tr>\n<th>Rango</th>\n<th>Severidad</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0.0</td>\n<td>Ninguna</td>\n</tr>\n<tr>\n<td>0.1 – 3.9</td>\n<td>Baja</td>\n</tr>\n<tr>\n<td>4.0 – 6.9</td>\n<td>Media</td>\n</tr>\n<tr>\n<td>7.0 – 8.9</td>\n<td>Alta</td>\n</tr>\n<tr>\n<td>9.0 – 10.0</td>\n<td>Crítica</td>\n</tr>\n</tbody>\n</table>\n<p>Los escáneres de vulnerabilidades más habituales en administración pública son <strong>Nessus</strong> (comercial, muy extendido, con plugins actualizados diariamente) y <strong>OpenVAS/Greenbone</strong> (open source), que auditan sistemas contra bases de CVE conocidas y generan informes priorizados por CVSS.</p>\n<h3 id=\"5-criptografía-simétrica-y-asimétrica\">5. Criptografía simétrica y asimétrica</h3>\n<p><strong>Simétrica.</strong> Usa la misma clave para cifrar y descifrar. <strong>DES</strong> (clave de 56 bits efectivos) quedó obsoleto por fuerza bruta; <strong>3DES</strong> lo mitigó aplicando DES tres veces (clave efectiva ~112 bits) pero es lento y también en retirada. El estándar actual es <strong>AES</strong> (Advanced Encryption Standard), con claves de 128, 192 o 256 bits. El <strong>modo de operación</strong> es tan importante como el algoritmo:</p>\n<ul>\n<li><strong>ECB</strong> (Electronic Codebook): cifra cada bloque de forma independiente e idéntica; es <strong>inseguro</strong> porque bloques de texto plano iguales producen bloques cifrados iguales, revelando patrones estructurales (el ejemplo clásico es una imagen cuyo contorno sigue siendo reconocible tras cifrarla en ECB).</li>\n<li><strong>CBC</strong> (Cipher Block Chaining): cada bloque se combina (XOR) con el cifrado del bloque anterior antes de cifrarse, eliminando el patrón, pero requiere IV aleatorio y no ofrece autenticación por sí mismo.</li>\n<li><strong>GCM</strong> (Galois/Counter Mode): modo autenticado (AEAD) que cifra y genera simultáneamente una etiqueta de integridad, es el preferido en TLS moderno por combinar rendimiento (paralelizable) y protección frente a manipulación.</li>\n</ul>\n<p><strong>Asimétrica.</strong> Usa un par de claves matemáticamente relacionadas: una pública (distribuible) y una privada (secreta). <strong>RSA</strong> se basa en la dificultad computacional de factorizar el producto de dos números primos muy grandes: es fácil multiplicarlos para obtener la clave pública, pero inviable en tiempo razonable recuperar los factores originales a partir del producto. <strong>ECC</strong> (criptografía de curva elíptica) se basa en el problema del logaritmo discreto sobre curvas elípticas y ofrece el mismo nivel de seguridad que RSA con claves mucho más cortas (una clave ECC de 256 bits equivale aproximadamente a una RSA de 3072 bits), lo que la hace más eficiente en CPU y ancho de banda, muy usada en dispositivos móviles y TLS moderno. <strong>Diffie-Hellman</strong> no cifra datos: es un protocolo de <strong>intercambio de claves</strong> que permite a dos partes acordar un secreto compartido a través de un canal inseguro sin haberlo transmitido nunca, combinando valores públicos y privados de forma que ambos lados llegan al mismo resultado por separado.</p>\n<p><strong>Funciones hash.</strong> Generan una huella de longitud fija a partir de una entrada de longitud variable, de forma determinista y (idealmente) sin colisiones prácticas. <strong>MD5</strong> (128 bits) está roto: se han demostrado colisiones prácticas en segundos, no debe usarse para integridad ni firma. <strong>SHA-1</strong> (160 bits) también se considera roto tras demostrarse colisiones prácticas (ataque SHAttered, 2017); navegadores y CA lo han retirado. El estándar actual es <strong>SHA-256</strong> (familia SHA-2) o <strong>SHA-3</strong> (familia con diseño interno distinto, esponja Keccak, como alternativa estructural independiente por si apareciera un fallo en SHA-2). <strong>HMAC</strong> combina una función hash con una clave secreta para producir un código de autenticación de mensaje que verifica simultáneamente integridad y autenticidad del origen.</p>\n<h3 id=\"6-firma-digital-y-pki\">6. Firma digital y PKI</h3>\n<p>La firma digital garantiza integridad, autenticidad y no repudio de un documento. El proceso es:</p>\n<ol type=\"1\">\n<li>Se calcula el <strong>hash</strong> del documento original.</li>\n<li>Ese hash se <strong>cifra con la clave privada</strong> del firmante (esta operación es la firma propiamente dicha).</li>\n<li>El destinatario recalcula el hash del documento recibido y lo compara con el que resulta de <strong>descifrar la firma con la clave pública</strong> del firmante.</li>\n<li>Si ambos hashes coinciden, se confirma que el documento no se alteró y que fue firmado por el poseedor de esa clave privada.</li>\n</ol>\n<p>Esto requiere confiar en que la clave pública pertenece realmente a quien dice ser, lo que resuelve la <strong>PKI</strong> (Infraestructura de Clave Pública) mediante certificados. Una <strong>CA raíz</strong> (autoridad de certificación) firma certificados de <strong>CA subordinadas</strong>, que a su vez emiten certificados de usuario/servidor, formando una <strong>cadena de confianza</strong>: el verificador confía en la CA raíz (preinstalada en el sistema operativo o navegador) y de ahí desciende la confianza hasta el certificado final. Un <strong>certificado X.509</strong> contiene, entre otros campos: sujeto (<em>subject</em>), emisor (<em>issuer</em>), clave pública, período de validez, número de serie, algoritmo de firma y extensiones (uso de clave, nombres alternativos). La revocación de certificados comprometidos se comprueba con <strong>CRL</strong> (Certificate Revocation List, lista completa descargable y periódica) u <strong>OCSP</strong> (Online Certificate Status Protocol, consulta puntual en tiempo real sobre un certificado concreto, más ágil y con menor huella).</p>\n<h3 id=\"7-protocolos-seguros\">7. Protocolos seguros</h3>\n<p><strong>TLS</strong> (Transport Layer Security) sustituyó a <strong>SSL</strong>, obsoleto por vulnerabilidades estructurales (POODLE en SSLv3, cifrados débiles); las versiones vigentes son TLS 1.2 y TLS 1.3, esta última simplifica el <em>handshake</em>, elimina algoritmos débiles y reduce la latencia de negociación. <strong>SSH</strong> (Secure Shell) permite administración remota cifrada y soporta <strong>autenticación por clave pública</strong> (el cliente demuestra posesión de la clave privada sin transmitirla, más segura que contraseña) además de <strong>port forwarding</strong>, que permite tunelizar tráfico de otro servicio a través de la conexión SSH cifrada (local, remoto o dinámico/SOCKS). <strong>IPsec</strong> protege tráfico IP a nivel de red mediante dos cabeceras: <strong>AH</strong> (Authentication Header) garantiza integridad y autenticidad pero no confidencialidad; <strong>ESP</strong> (Encapsulating Security Payload) añade cifrado además de integridad, por lo que es la opción mayoritaria en VPN. Puede operar en <strong>modo transporte</strong> (cifra solo el payload, extremos son los propios hosts, típico en comunicaciones host-a-host) o <strong>modo túnel</strong> (encapsula el paquete IP completo dentro de otro, típico en VPN sitio-a-sitio entre pasarelas).</p>\n<h3 id=\"8-infraestructura-física-de-un-cpd\">8. Infraestructura física de un CPD</h3>\n<p>La clasificación de referencia del Uptime Institute define cuatro <strong>niveles TIER</strong>:</p>\n<table>\n<thead>\n<tr>\n<th>Nivel</th>\n<th>Disponibilidad</th>\n<th>Downtime/año aprox.</th>\n<th>Redundancia</th>\n<th>Mantenimiento concurrente</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>TIER I</td>\n<td>99,671%</td>\n<td>~28,8 h</td>\n<td>Ninguna (ruta única)</td>\n<td>No</td>\n</tr>\n<tr>\n<td>TIER II</td>\n<td>99,741%</td>\n<td>~22,0 h</td>\n<td>Componentes N+1</td>\n<td>No</td>\n</tr>\n<tr>\n<td>TIER III</td>\n<td>99,982%</td>\n<td>~1,6 h</td>\n<td>N+1, múltiples rutas (una activa)</td>\n<td>Sí</td>\n</tr>\n<tr>\n<td>TIER IV</td>\n<td>99,995%</td>\n<td>~0,4 h</td>\n<td>2N o 2(N+1), tolerante a fallos</td>\n<td>Sí, y tolera fallo simultáneo</td>\n</tr>\n</tbody>\n</table>\n<p>El <strong>PUE</strong> (Power Usage Effectiveness) mide la eficiencia energética: PUE = Energía total de la instalación / Energía consumida por el equipamiento TI. Un PUE de <strong>1,5</strong> significa que por cada vatio consumido por los servidores se gastan 0,5 W adicionales en refrigeración, distribución eléctrica y pérdidas; un PUE de <strong>2,0</strong> indica que el consumo auxiliar iguala al de TI, señal de baja eficiencia. El valor ideal teórico es 1,0.</p>\n<p>La distribución en <strong>pasillos fríos/calientes</strong> (<em>hot aisle/cold aisle</em>) alterna filas de racks enfrentando sus tomas de aire frío entre sí (pasillo frío, alimentado por el suelo técnico o unidades CRAC) y sus salidas de aire caliente entre sí (pasillo caliente, evacuado hacia el retorno de climatización), evitando la recirculación de aire caliente y mejorando la eficiencia frente a una disposición uniforme.</p>\n<p>Los <strong>SAI/UPS</strong> protegen frente a cortes y fluctuaciones eléctricas en tres arquitecturas: <strong>standby</strong> (el equipo funciona con red normalmente y conmuta a batería solo ante fallo, con un breve corte de transferencia), <strong>línea interactiva</strong> (regula la tensión sin pasar siempre por el inversor, mejor respuesta que standby), y <strong>online (doble conversión)</strong>: la corriente pasa siempre por rectificador-batería-inversor, de forma que la salida es permanentemente generada desde la batería sin ningún tiempo de conmutación ante un corte, es el estándar en CPD por su protección total frente a variaciones. Los <strong>generadores diésel</strong> cubren cortes prolongados que exceden la autonomía del SAI (minutos), arrancando automáticamente y asumiendo la carga en segundos mientras el SAI cubre el hueco de arranque.</p>\n<h3 id=\"9-sistemas-de-gestión-de-incidencias-itil\">9. Sistemas de gestión de incidencias (ITIL)</h3>\n<p>ITIL distingue con precisión tres conceptos que el examen suele confundir deliberadamente: un <strong>incidente</strong> es una interrupción no planificada o degradación de un servicio; un <strong>problema</strong> es la causa raíz subyacente a uno o varios incidentes (puede no tener aún solución conocida); una <strong>petición de servicio</strong> es una solicitud estándar y planificada (alta de usuario, instalación de software) que no implica que algo esté fallando. El <strong>SLA</strong> (Service Level Agreement) es el compromiso de nivel de servicio pactado con el cliente/usuario final; el <strong>OLA</strong> (Operational Level Agreement) es el acuerdo interno entre equipos de la propia organización que sustenta el cumplimiento de ese SLA. El <strong>ciclo de vida de un ticket</strong> típico recorre: registro → clasificación y priorización → asignación → diagnóstico → resolución → cierre, con escalados funcional (a un nivel técnico superior) o jerárquico (a un responsable) cuando se incumplen los tiempos. La <strong>CMDB</strong> (Configuration Management Database) almacena los elementos de configuración (CI) del sistema y sus relaciones, permitiendo analizar el impacto de un cambio o incidencia sobre el resto de la infraestructura.</p>\n<h3 id=\"10-control-remoto-de-puestos-de-usuario\">10. Control remoto de puestos de usuario</h3>\n<p><strong>RDP</strong> (Remote Desktop Protocol) es el protocolo propietario de Microsoft, funciona sobre el puerto TCP 3389, cifra la sesión (TLS o cifrado propio RDP) y desde Windows Server 2012/8 incorpora <strong>NLA</strong> (Network Level Authentication), que obliga a autenticarse antes de establecer la sesión gráfica completa, reduciendo la superficie de ataque frente a exploits que antes se lanzaban contra la pantalla de login sin autenticar. <strong>VNC</strong> (Virtual Network Computing) se basa en el protocolo <strong>RFB</strong> (Remote Framebuffer), de diseño más simple y multiplataforma: transmite directamente las actualizaciones del framebuffer del servidor y los eventos de teclado/ratón del cliente; históricamente no cifra por defecto (depende de la implementación) y suele requerir tunelizarse sobre SSH o VPN para uso seguro. En ambos casos, las buenas prácticas de seguridad exigen: restringir el acceso por IP o VPN, exigir MFA, registrar y auditar cada sesión (quién, cuándo, qué máquina), limitar los privilegios de la cuenta remota y cerrar sesiones inactivas automáticamente.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li>Confundir <strong>AH</strong> (solo integridad/autenticidad) con <strong>ESP</strong> (integridad + cifrado) en IPsec, y <strong>modo transporte</strong> (extremos son los hosts) con <strong>modo túnel</strong> (encapsula el paquete completo, típico de VPN sitio-a-sitio).</li>\n<li>Asignar mal las dimensiones ENS: el acrónimo correcto es <strong>D-A-I-C-T</strong>, y la categoría del sistema la marca la dimensión con el <strong>valor más alto</strong>, no una media.</li>\n<li>Creer que <strong>CRL</strong> y <strong>OCSP</strong> son intercambiables: CRL es una lista completa descargada periódicamente, OCSP es una consulta puntual en tiempo real; OCSP es más ágil pero depende de disponibilidad del respondedor.</li>\n<li>Invertir la definición TIER: TIER III es \"concurrentemente mantenible\" (se puede intervenir sin parar servicio), TIER IV añade además <strong>tolerancia a fallos</strong> (soporta un fallo no planificado simultáneo a una intervención).</li>\n<li>Confundir <strong>PUE bajo con mala eficiencia</strong>: cuanto más cercano a 1,0, mejor; un PUE de 2,0 es peor (más ineficiente) que uno de 1,5, no al revés.</li>\n<li>Mezclar <strong>incidente, problema y petición de servicio</strong> en ITIL, o pensar que un SLA es lo mismo que un OLA (el SLA es externo/con el cliente, el OLA es interno entre equipos).</li>\n</ul>\n"}, {"num": 6, "title": "Comunicaciones. Medios de transmisión. Modos de comunicación. Equipos terminales y equipos de interconexión y conmutación. Redes de comunicaciones. Redes de conmutación y redes de difusión. Comunicaciones móviles e inalámbricas.", "html": "<h3 id=\"1-medios-de-transmisión-guiados\">1. Medios de transmisión guiados</h3>\n<p>El par trenzado transporta señales eléctricas por conductores de cobre trenzados entre sí para reducir la diafonía (crosstalk) inducida entre pares adyacentes. Existe en variantes UTP (sin blindaje), STP (blindaje por par) y S/FTP (blindaje por par más pantalla global), siendo el blindaje imprescindible a partir de categoría 7 para alcanzar sus frecuencias de trabajo sin interferencia.</p>\n<table>\n<thead>\n<tr>\n<th>Categoría</th>\n<th>Frecuencia máx.</th>\n<th>Velocidad soportada</th>\n<th>Distancia máx.</th>\n<th>Observaciones</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Cat 5e</td>\n<td>100 MHz</td>\n<td>1 Gbps (1000BASE-T)</td>\n<td>100 m</td>\n<td>Aún desplegada en LAN heredadas</td>\n</tr>\n<tr>\n<td>Cat 6</td>\n<td>250 MHz</td>\n<td>1 Gbps (10 Gbps a ≤55 m)</td>\n<td>100 m</td>\n<td>Limitación de 10GBASE-T por alien crosstalk</td>\n</tr>\n<tr>\n<td>Cat 6a</td>\n<td>500 MHz</td>\n<td>10 Gbps</td>\n<td>100 m</td>\n<td>UTP o STP, elimina el alien crosstalk</td>\n</tr>\n<tr>\n<td>Cat 7</td>\n<td>600 MHz</td>\n<td>10 Gbps</td>\n<td>100 m</td>\n<td>S/FTP obligatorio, conectores GG45/TERA</td>\n</tr>\n<tr>\n<td>Cat 8</td>\n<td>2000 MHz</td>\n<td>25/40 Gbps</td>\n<td>30 m</td>\n<td>Uso en racks de datacenter, no en horizontal de campus</td>\n</tr>\n</tbody>\n</table>\n<p>La fibra óptica transmite pulsos de luz por un núcleo de vidrio o plástico, siendo inmune a interferencias electromagnéticas y, a diferencia del cobre, <strong>no sufre diafonía</strong>: no existe acoplamiento eléctrico entre fibras porque no circula corriente ni campo eléctrico fuera del núcleo, solo confinamiento óptico por reflexión total interna. Se distinguen dos familias: la <strong>multimodo (MMF)</strong>, con núcleo ancho (50 o 62,5 micras) que permite múltiples modos de propagación, fuente LED o VCSEL, longitudes de onda de 850 y 1300 nm, y alcance limitado por dispersión modal (OM1 ≈33 m a 10 Gbps, OM2 ≈82 m, OM3 optimizada a láser ≈300 m, OM4 ≈550 m, OM5 orientada a WDM de banda ancha con varias longitudes de onda simultáneas sobre la misma fibra); y la <strong>monomodo (SMF, OS1/OS2)</strong>, con núcleo estrecho (~9 micras) que fuerza un único modo de propagación, fuente láser, longitudes de onda de 1310 y 1550 nm, y alcances de decenas de kilómetros gracias a su baja atenuación (~0,3-0,4 dB/km frente a 2-3 dB/km de la multimodo). Los conectores más habituales son SC (push-pull, cuadrado), LC (formato reducido, estándar en transceptores SFP), ST (bayoneta, en desuso) y MPO/MTP (multifibra, 12 o 24 hilos en un único conector, propio de troncales de datacenter).</p>\n<h3 id=\"2-medios-de-transmisión-no-guiados\">2. Medios de transmisión no guiados</h3>\n<p>La radiofrecuencia se propaga por el aire sin confinamiento físico, es omnidireccional o direccional según la antena, y base de Wi-Fi, redes móviles y radioenlaces. Las microondas terrestres exigen visión directa (line of sight) y se emplean en enlaces punto a punto entre repetidores separados por la curvatura terrestre (típicamente cada 40-50 km). Las microondas por satélite dependen de la órbita: <strong>GEO</strong> (36 000 km, sincronizada con la rotación terrestre, latencia de ida de ~120-140 ms, ~240-280 ms de ida y vuelta, usada en televisión y banda ancha rural con pocos satélites); <strong>MEO</strong> (2000-35 786 km, ejemplo GPS a ~20 200 km, latencia ~50-150 ms); <strong>LEO</strong> (160-2000 km, ejemplo constelaciones tipo Starlink a ~550 km, latencia ~20-40 ms, pero requiere gran número de sat
