 100BASE-TX): agrupa 4 bits de datos y los codifica en un símbolo de 5 bits de un conjunto que garantiza un máximo de transiciones nulas consecutivas, mejorando la eficiencia frente a Manchester (80% de eficiencia frente al 50%).</li>\n<li><strong>8B/10B</strong> (Gigabit Ethernet 1000BASE-X sobre fibra, y otros buses serie de alta velocidad): codifica 8 bits en 10, garantizando balance DC y densidad mínima de transiciones; eficiencia del 80%, con mejor control de disparidad que 4B/5B.</li>\n</ul>\n<p><strong>Transmisión en banda ancha (broadband).</strong> Divide el ancho de banda del medio en múltiples canales de frecuencia independientes mediante <strong>FDM</strong> (Frequency Division Multiplexing), permitiendo transmitir varias señales analógicas o digitales moduladas simultáneamente por el mismo cable, cada una en su propia sub-banda separada por bandas de guarda. Es la técnica empleada en redes de <strong>CATV/HFC</strong> (Hybrid Fiber-Coaxial), donde en un mismo cable coaxial conviven canales de televisión, telefonía y datos (DOCSIS), cada servicio ocupando un rango de frecuencias reservado.</p>\n<h3 id=\"5-evolución-de-ethernet\">5. Evolución de Ethernet</h3>\n<table>\n<thead>\n<tr>\n<th>Estándar</th>\n<th>Velocidad</th>\n<th>Medio</th>\n<th>Distancia máxima</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>10BASE-T</td>\n<td>10 Mbps</td>\n<td>Par trenzado UTP Cat3/Cat5</td>\n<td>100 m</td>\n</tr>\n<tr>\n<td>100BASE-TX (Fast Ethernet)</td>\n<td>100 Mbps</td>\n<td>UTP Cat5 (2 pares)</td>\n<td>100 m</td>\n</tr>\n<tr>\n<td>1000BASE-T (Gigabit Ethernet)</td>\n<td>1000 Mbps</td>\n<td>UTP Cat5e/Cat6 (4 pares)</td>\n<td>100 m</td>\n</tr>\n<tr>\n<td>1000BASE-SX/LX</td>\n<td>1000 Mbps</td>\n<td>Fibra multimodo/monomodo</td>\n<td>550 m / 5 km</td>\n</tr>\n<tr>\n<td>10GBASE-T</td>\n<td>10 Gbps</td>\n<td>UTP Cat6a/Cat7</td>\n<td>100 m (55 m en Cat6)</td>\n</tr>\n<tr>\n<td>40GBASE-T / 40GbE fibra</td>\n<td>40 Gbps</td>\n<td>Cat8 / fibra OM4</td>\n<td>30 m / 100–400 m</td>\n</tr>\n<tr>\n<td>100GBASE-SR4/LR4</td>\n<td>100 Gbps</td>\n<td>Fibra multimodo/monomodo</td>\n<td>100 m / 10 km</td>\n</tr>\n</tbody>\n</table>\n<p>La tendencia constante es que cada salto de velocidad exige medios de mayor calidad (más pares aprovechados, categorías superiores de cable o migración a fibra) al acortarse el margen de ruido disponible por bit.</p>\n<h3 id=\"6-formato-de-la-trama-ethernet-ieee-8023\">6. Formato de la trama Ethernet (IEEE 802.3)</h3>\n<table>\n<thead>\n<tr>\n<th>Campo</th>\n<th>Tamaño</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Preámbulo</td>\n<td>7 bytes (patrón 10101010… para sincronización)</td>\n</tr>\n<tr>\n<td>SFD (Start Frame Delimiter)</td>\n<td>1 byte (10101011, marca el inicio real de la trama)</td>\n</tr>\n<tr>\n<td>MAC destino</td>\n<td>6 bytes</td>\n</tr>\n<tr>\n<td>MAC origen</td>\n<td>6 bytes</td>\n</tr>\n<tr>\n<td>EtherType / Longitud</td>\n<td>2 bytes (valor ≥ 1536 = EtherType; valor ≤ 1500 = longitud de datos, IEEE 802.3 clásico)</td>\n</tr>\n<tr>\n<td>Datos (payload)</td>\n<td>46–1500 bytes (se rellena con <em>padding</em> si es menor de 46)</td>\n</tr>\n<tr>\n<td>FCS (Frame Check Sequence)</td>\n<td>4 bytes (CRC-32 para detección de errores)</td>\n</tr>\n</tbody>\n</table>\n<p>La trama mínima es de 64 bytes (sin contar preámbulo+SFD) y la máxima estándar de 1518 bytes; las tramas <em>jumbo</em> (hasta 9000 bytes de payload) son una extensión no estandarizada universalmente pero muy usada en redes de almacenamiento y datacenter.</p>\n<h3 id=\"7-direccionamiento-mac\">7. Direccionamiento MAC</h3>\n<p>Una dirección MAC tiene <strong>48 bits</strong> (6 bytes), representada habitualmente en notación hexadecimal separada por dos puntos o guiones (p. ej. <code>00:1A:2B:3C:4D:5E</code>). Los 24 bits más significativos constituyen el <strong>OUI</strong> (Organizationally Unique Identifier), asignado por el IEEE a cada fabricante, y los 24 bits restantes son un número de serie asignado libremente por el fabricante, garantizando (en teoría) unicidad global.</p>\n<p>El bit menos significativo del primer byte (bit I/G) distingue <strong>unicast</strong> (0, dirige a una única interfaz) de <strong>multicast</strong> (1, dirige a un grupo de interfaces); la dirección <strong>broadcast</strong> es el caso especial de todos los bits a 1 (<code>FF:FF:FF:FF:FF:FF</code>), dirigida a todas las estaciones del dominio de difusión. El segundo bit del primer byte (bit U/L) indica si la dirección es universal (asignada de fábrica) o administrada localmente (modificada por software).</p>\n<h3 id=\"8-métodos-de-acceso-al-medio\">8. Métodos de acceso al medio</h3>\n<p><strong>CSMA/CD</strong> (Carrier Sense Multiple Access with Collision Detection), usado en Ethernet clásico half-duplex sobre medio compartido:</p>\n<ol type=\"1\">\n<li><strong>Escuchar</strong> el medio (<em>carrier sense</em>); si está ocupado, esperar.</li>\n<li>Si el medio está libre, <strong>transmitir</strong>.</li>\n<li>Mientras se transmite, seguir escuchando para <strong>detectar colisión</strong> (superposición de señales, nivel eléctrico anómalo).</li>\n<li>Si se detecta colisión, emitir una <strong>señal de jam</strong> (32-48 bits) para asegurar que todas las estaciones implicadas la perciban.</li>\n<li>Aplicar <strong>backoff exponencial binario</strong>: cada estación espera un número aleatorio de intervalos de tiempo (<em>slot time</em>) entre 0 y 2ⁿ−1, donde n es el número de colisiones consecutivas sufridas (con tope, típicamente n≤10, tras el cual se informa de error de exceso de colisiones).</li>\n<li>Reintentar desde el paso 1.</li>\n</ol>\n<p>En redes <strong>full-duplex modernas conmutadas</strong> (switch a switch o switch a NIC) cada enlace es punto a punto con canales de transmisión y recepción independientes, por lo que <strong>no puede haber colisiones</strong> y CSMA/CD queda deshabilitado, conservándose únicamente por compatibilidad histórica del estándar.</p>\n<p><strong>CSMA/CA</strong> (Collision Avoidance), usado en redes inalámbricas (802.11) donde no es viable detectar colisiones de forma fiable (una estación no puede escuchar mientras transmite con la misma antena, y la atenuación hace que colisiones lejanas no se perciban localmente). Su principal reto es el <strong>problema del nodo oculto</strong>: dos estaciones fuera de alcance radioeléctrico mutuo, pero ambas dentro del alcance de un tercer nodo (p. ej. el punto de acceso), no se detectan entre sí y pueden transmitir simultáneamente provocando colisión en el receptor común.</p>\n<pre><code>Alcance de A:  [=====A=====B]\nAlcance de C:        [=====B=====C]\n      A ............. B ............. C\n      (A y C no se oyen entre sí; ambos oyen a B)</code></pre>\n<p>Para mitigarlo se emplea el mecanismo <strong>RTS/CTS</strong> (Request To Send / Clear To Send): antes de transmitir datos, el emisor envía una trama corta RTS; el receptor responde con CTS, audible por todos los nodos en su radio (incluidos los ocultos al emisor), que reservan el medio (<em>Network Allocation Vector</em>) durante el tiempo indicado, evitando así que un nodo oculto interfiera. Además, CSMA/CA usa <strong>espacios entre tramas (IFS)</strong> de distinta duración para priorizar el acceso: <strong>SIFS</strong> (Short IFS, el más corto, usado para ACK, CTS y fragmentos de una misma transmisión) tiene prioridad máxima; <strong>DIFS</strong> (Distributed IFS, mayor que SIFS) es el tiempo que debe esperar libre el medio antes de iniciar una transmisión de datos ordinaria. Tras el DIFS, si el medio sigue libre, cada estación elige un valor aleatorio dentro de la <strong>ventana de contención</strong> (<em>contention window</em>) y cuenta atrás mientras el medio permanece libre, transmitiendo al llegar a cero (si otra estación transmite antes, se congela el contador).</p>\n<p><strong>Paso de testigo (Token Passing)</strong>, usado en Token Ring y FDDI: una trama especial (el <em>testigo</em> o <em>token</em>) circula por el anillo; solo la estación que posee el testigo tiene derecho a transmitir, tras lo cual libera un nuevo testigo. Es un método <strong>determinista</strong>: el tiempo máximo de espera de cualquier estación para transmitir es acotado y calculable, cualidad valorada en entornos industriales o de tiempo real, a diferencia del acceso probabilístico de CSMA/CD. Ante la pérdida del testigo (por fallo de una estación o error de transmisión), se emplea una estación monitora que detecta la ausencia mediante temporizadores y <strong>regenera un nuevo testigo</strong>, evitando el bloqueo permanente del anillo.</p>\n<h3 id=\"9-dispositivos-de-interconexión\">9. Dispositivos de interconexión</h3>\n<table>\n<thead>\n<tr>\n<th>Dispositivo</th>\n<th>Capa OSI</th>\n<th>Dominio de colisión</th>\n<th>Dominio de difusión</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Repetidor</td>\n<td>1 (Física)</td>\n<td>No segmenta (uno único)</td>\n<td>No segmenta</td>\n</tr>\n<tr>\n<td>Hub</td>\n<td>1 (Física)</td>\n<td>No segmenta (uno único)</td>\n<td>No segmenta</td>\n</tr>\n<tr>\n<td>Puente (bridge)</td>\n<td>2 (Enlace)</td>\n<td>Segmenta (uno por puerto)</td>\n<td>No segmenta</td>\n</tr>\n<tr>\n<td>Switch</td>\n<td>2 (Enlace)</td>\n<td>Segmenta (uno por puerto)</td>\n<td>No segmenta (salvo VLANs)</td>\n</tr>\n<tr>\n<td>Router</td>\n<td>3 (Red)</td>\n<td>Segmenta</td>\n<td>Segmenta</td>\n</tr>\n<tr>\n<td>Gateway</td>\n<td>4–7 (Transporte a Aplicación)</td>\n<td>Segmenta</td>\n<td>Segmenta</td>\n</tr>\n<tr>\n<td>Punto de acceso inalámbrico</td>\n<td>1–2</td>\n<td>Segmenta el medio radio del cableado</td>\n<td>No segmenta (actúa como puente)</td>\n</tr>\n</tbody>\n</table>\n<p>El <strong>repetidor</strong> regenera la señal eléctrica para extender la distancia física sin interpretar direcciones. El <strong>hub</strong> es un repetidor multipuerto: retransmite por todos los puertos lo recibido por uno, manteniendo un único dominio de colisión para todo el segmento.</p>\n<p>El <strong>puente</strong> aprende dinámicamente qué direcciones MAC se encuentran tras cada puerto observando las tramas entrantes (<em>algoritmo de aprendizaje</em>): al recibir una trama, registra en su <strong>tabla de reenvío</strong> (MAC origen → puerto de entrada); para decidir el reenvío, si la MAC destino ya está en la tabla la envía solo por ese puerto (segmentando el dominio de colisión), y si no la conoce la inunda (<em>flooding</em>) por todos los puertos salvo el de entrada. El <strong>switch</strong> es esencialmente un puente multipuerto con conmutación por hardware (ASIC), y admite tres modos de reenvío: <strong>store-and-forward</strong> (recibe la trama completa, verifica el FCS y solo entonces la reenvía; máxima fiabilidad, mayor latencia), <strong>cut-through</strong> (reenvía en cuanto lee la MAC destino en la cabecera, sin esperar el resto de la trama ni comprobar el CRC; mínima latencia, puede propagar tramas erróneas) y <strong>fragment-free</strong> (variante intermedia que espera a leer los primeros 64 bytes —donde se concentran la mayoría de colisiones— antes de reenviar, equilibrando latencia y fiabilidad).</p>\n<p>El <strong>router</strong> opera en la capa de red, toma decisiones de encaminamiento basadas en direcciones IP y tablas de rutas, y <strong>segmenta tanto dominios de colisión como de difusión</strong>, siendo el elemento natural para interconectar redes IP distintas. El <strong>gateway</strong> traduce entre protocolos o pilas de comunicación heterogéneas en capas superiores (p. ej. pasarelas de correo entre distintos formatos, o pasarelas VoIP-RTC). El <strong>punto de acceso (AP)</strong> inalámbrico actúa como un puente entre el medio radio (compartido, half-duplex por naturaleza) y la red cableada.</p>\n<h3 id=\"10-spanning-tree-protocol-stp-ieee-8021d\">10. Spanning Tree Protocol (STP, IEEE 802.1D)</h3>\n<p>En topologías con redundancia física a nivel de enlace (necesaria para tolerancia a fallos), los switches pueden generar <strong>bucles de capa 2</strong>: al no existir un campo TTL en las tramas Ethernet, una trama de difusión reenviada por <em>flooding</em> puede circular indefinidamente por el bucle, multiplicándose exponencialmente con cada retransmisión y provocando una <strong>tormenta de broadcast</strong> que satura la red y agota los recursos de los switches.</p>\n<p>STP resuelve esto construyendo lógicamente un <strong>árbol libre de bucles</strong> sobre la topología física redundante: primero se elige un <strong>puente raíz</strong> (<em>root bridge</em>) comparando el <strong>Bridge ID</strong> de cada switch (prioridad configurable + dirección MAC como desempate; gana el valor numérico más bajo); después cada switch calcula el camino de menor coste hacia la raíz y determina qué puertos permanecen activos y cuáles se bloquean para eliminar bucles. Cada puerto atraviesa los estados: <strong>blocking</strong> (no reenvía tramas de datos, solo escucha BPDU), <strong>listening</strong> (participa en la elección de topología, sin aprender MACs ni reenviar), <strong>learning</strong> (aprende direcciones MAC pero aún no reenvía) y <strong>forwarding</strong> (reenvía tráfico normalmente); las transiciones entre estados están temporizadas (por defecto ~30-50 segundos en total), lo que constituye la principal crítica a 802.1D: convergencia lenta ante cambios de topología.</p>\n<p><strong>RSTP</strong> (Rapid STP, IEEE 802.1w) mejora la convergencia a orden de segundos (o milisegundos en el mejor caso) mediante mecanismos de propuesta/acuerdo (<em>proposal/agreement</em>) entre puertos vecinos, la introducción de roles de puerto adicionales (<em>alternate</em> y <em>backup</em>) que permiten una transición casi inmediata sin esperar los temporizadores clásicos, y la reducción efectiva de los estados de puerto a discarding/learning/forwarding.</p>\n<h3 id=\"11-agregación-de-enlaces-lacp-ieee-8023ad\">11. Agregación de enlaces: LACP (IEEE 802.3ad)</h3>\n<p><strong>LACP</strong> (Link Aggregation Control Protocol) permite agrupar varios enlaces físicos entre dos dispositivos en un único enlace lógico (<em>port-channel</em>/<em>EtherChannel</em>), negociando dinámicamente qué puertos participan en el grupo mediante el intercambio de PDUs LACP, y detectando automáticamente configuraciones erróneas o caídas de enlace para excluir puertos del grupo sin intervención manual. Aporta dos beneficios: <strong>mayor ancho de banda agregado</strong> (suma nominal de la capacidad de los enlaces miembro) y <strong>tolerancia a fallos</strong> (si un enlace cae, el tráfico se redistribuye automáticamente entre los restantes). El <strong>balanceo de carga</strong> entre los enlaces físicos se realiza mediante algoritmos hash sobre campos de la trama/paquete (MAC origen-destino, IP origen-destino, puertos L4), de modo que un mismo flujo se mantiene siempre en el mismo enlace físico (evitando reordenamiento de tramas), mientras que flujos distintos pueden repartirse entre los distintos enlaces del grupo.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ol type=\"1\">\n<li>Confundir <strong>dominio de colisión</strong> con <strong>dominio de difusión</strong>: el switch segmenta colisión por puerto pero <strong>no</strong> segmenta broadcast (salvo VLANs); solo el router segmenta ambos.</li>\n<li>Asignar la codificación <strong>Manchester</strong> a Fast Ethernet o Gigabit: Manchester es exclusiva de Ethernet a 10 Mbps; 100BASE-TX usa 4B/5B+MLT-3 y 1000BASE-T usa PAM-5.</li>\n<li>Pensar que CSMA/CD sigue activo en redes full-duplex modernas: en enlaces punto a punto conmutados full-duplex no hay colisiones posibles y el mecanismo se desactiva.</li>\n<li>Confundir topología <strong>física</strong> con <strong>lógica</strong> en Ethernet 10BASE-T: cableado físico en estrella, comportamiento lógico de bus compartido (a través del hub).</li>\n<li>Olvidar que el <strong>EtherType</strong> y la <strong>longitud</strong> comparten el mismo campo de 2 bytes en la trama Ethernet: valores ≤1500 se interpretan como longitud (IEEE 802.3 original) y valores ≥1536 como tipo de protocolo superior (Ethernet II/DIX), existiendo una zona no usada (1501-1535) precisamente para evitar ambigüedad.</li>\n</ol>\n"}]}], "MUR": [{"key": "comunes", "title": "Materias comunes", "temas": [{"num": 1, "title": "La Constitución española de 1978: estructura y contenido. Derechos y deberes fundamentales: garantía y suspensión. Instituciones básicas del Estado. Estatuto de Autonomía de la Región de Murcia: estructuración y contenido.", "html": "<p>La Constitución Española (CE) fue aprobada por las Cortes el 31 de octubre de 1978, ratificada en referéndum el 6 de diciembre y sancionada por el Rey el 27 de diciembre de 1978, entrando en vigor el 29 de diciembre. Consta de un Preámbulo, un Título Preliminar (arts. 1-9, que consagra a España como Estado social y democrático de Derecho, la soberanía nacional, la monarquía parlamentaria y el principio de autonomía de nacionalidades y regiones), diez Títulos (I a X, arts. 10 a 169), cuatro disposiciones adicionales, nueve transitorias, una derogatoria y una final.</p>\n<p>El Título I (\"De los derechos y deberes fundamentales\") se estructura en el art. 10 (dignidad de la persona) y cinco capítulos: Capítulo I (españoles y extranjeros), Capítulo II (derechos y libertades, con la Sección 1ª —arts. 14 a 29— de derechos fundamentales y libertades públicas, y la Sección 2ª —arts. 30 a 38— de derechos y deberes de los ciudadanos), Capítulo III (principios rectores de la política social y económica, arts. 39-52) y Capítulo IV (garantías, art. 53).</p>\n<p>Las garantías del art. 53 son: reserva de ley para regular el ejercicio de los derechos (53.1), respeto al contenido esencial, tutela judicial ordinaria preferente y sumaria y recurso de amparo ante el Tribunal Constitucional para los derechos de la Sección 1ª más el art. 14 (53.2), y mera orientación de la actuación de los poderes públicos para los principios del Capítulo III, alegables solo conforme a lo que dispongan las leyes que los desarrollen (53.3). La suspensión de derechos se regula en el art. 55: la general (55.1), aplicable durante los estados de excepción y sitio (LO 4/1981) a derechos como libertad, inviolabilidad del domicilio o secreto de las comunicaciones; y la individual (55.2), vinculada a investigaciones de bandas armadas o terrorismo, bajo control judicial y parlamentario.</p>\n<p>Las instituciones básicas del Estado son: la Corona (Título II, jefatura del Estado, simbólica y arbitral); las Cortes Generales (Título III), bicamerales —Congreso de los Diputados (300-400 diputados, actualmente 350, elección por circunscripción provincial y sistema proporcional D'Hondt) y Senado (cámara de representación territorial, mayoría de escaños por elección directa provincial y una parte designada por las Asambleas autonómicas)—; el Gobierno y la Administración (Título IV); las relaciones Gobierno-Cortes (Título V); el Poder Judicial (Título VI, con el Consejo General del Poder Judicial como órgano de gobierno); Economía y Hacienda (Título VII); la Organización Territorial del Estado (Título VIII, municipios, provincias y Comunidades Autónomas); y el Tribunal Constitucional (Título IX).</p>\n<p>El Estatuto de Autonomía de la Región de Murcia fue aprobado por Ley Orgánica 4/1982, de 9 de junio, y reformado, entre otras, por LO 1/1998 y LO 4/2013. Su estructura comprende un Título Preliminar (identidad, capitalidad en Murcia, símbolos), Título I (competencias de la Comunidad Autónoma, clasificadas en exclusivas, de desarrollo legislativo y ejecución, y de ejecución de la legislación estatal, arts. 10 a 12), Título II (organización institucional: Asamblea Regional, Presidente y Consejo de Gobierno), Título III (Administración de Justicia), Título IV (Economía y Hacienda) y Título V (reforma del Estatuto, que exige aprobación por mayoría absoluta de la Asamblea Regional y tramitación como ley orgánica en las Cortes Generales). La Asamblea Regional se compone de un número de Diputados fijado por la legislación electoral (45), elegidos por sufragio universal cada cuatro años.</p>\n"}, {"num": 2, "title": "Concepto de Administración Pública. Diferentes niveles de la Administración Pública: Administración Estatal, Autonómica, Local e Institucional: ideas básicas. La Administración Pública de la Comunidad Autónoma de Murcia: organización y régimen jurídico.", "html": "<p>La Administración Pública puede definirse como la organización personificada, dotada de personalidad jurídica propia, que actúa al servicio de los intereses generales (art. 103.1 CE) bajo el sometimiento pleno a la ley y al Derecho, y sujeta en su actuación al Derecho Administrativo. Se rige, con carácter básico estatal, por la Ley 40/2015, de Régimen Jurídico del Sector Público (LRJSP), y en su vertiente procedimental por la Ley 39/2015, del Procedimiento Administrativo Común (LPAC).</p>\n<p>El ordenamiento reconoce cuatro niveles: <strong>AGE</strong> (órganos superiores y directivos, Ley 40/2015 Título II, estructura periférica y exterior); <strong>Administración Autonómica</strong> (17 CCAA + Ceuta y Melilla, potestad de autoorganización según su Estatuto); <strong>Administración Local</strong> (Ley 7/1985 LBRL, municipios, provincias e islas, art. 137 CE); <strong>Administración Institucional</strong> (entes vinculados a una Administración territorial: organismos autónomos, entidades públicas empresariales, autoridades independientes, sociedades mercantiles estatales, consorcios, fundaciones — Ley 40/2015 arts. 84 y ss.).</p>\n<p>La <strong>Administración Pública de la CARM</strong> se organiza conforme a la Ley 7/2004, de 28 de diciembre, de Organización y Régimen Jurídico de la Administración Pública de la Región de Murcia: Consejo de Gobierno (dirección política y administrativa, presidido por el Presidente) y Consejerías (departamentos, cada una con Consejero, Secretarías Generales, Direcciones Generales y, en su caso, Viceconsejerías), completada por el sector público institucional (organismos autónomos, entes públicos, empresas y fundaciones públicas regionales). Principios: eficacia, jerarquía, descentralización, desconcentración, coordinación (art. 103 CE).</p>\n"}, {"num": 3, "title": "Ordenación de la Función Pública Regional. Principios informadores. Clases de personal: su régimen jurídico. Derechos y Deberes: derechos de negociación colectiva y huelga. Régimen disciplinario. Régimen de incompatibilidades. Retribuciones. La responsabilidad de las administraciones y de los funcionarios. La protección de datos de carácter personal y el secreto profesional.", "html": "<p>Se rige por el Texto Refundido de la Ley de la Función Pública de la Región de Murcia (Decreto Legislativo 1/2001), en lo no derogado, y con carácter básico/supletorio por el TREBEP (RDLeg 5/2015). Principios: igualdad, mérito y capacidad, publicidad, transparencia, objetividad, eficacia.</p>\n<p><strong>Clases de personal</strong>: funcionarios de carrera, funcionarios interinos (art. 10 TREBEP: sustitución, vacante, programas, exceso de tareas), personal laboral (fijo/indefinido/temporal, Estatuto de los Trabajadores), personal eventual (confianza/asesoramiento, cese automático, art. 12 TREBEP).</p>\n<p><strong>Negociación colectiva y huelga</strong>: Mesas de Negociación (General y Sectoriales, arts. 34-38 bis TREBEP); huelga (art. 28.2 CE) con servicios mínimos esenciales (RD-Ley 17/1977).</p>\n<p><strong>Régimen disciplinario</strong> (arts. 93-98 TREBEP, RD 33/1986 supletorio): faltas muy graves/graves/leves, sanciones desde apercibimiento hasta separación del servicio/despido, procedimiento con pliego de cargos y audiencia.</p>\n<p><strong>Incompatibilidades</strong>: Ley 53/1984, dedicación a un solo puesto salvo excepciones tasadas (docencia, investigación) y compatibilidad privada autorizada (máx. 15% retribuciones).</p>\n<p><strong>Retribuciones</strong> (art. 23 TREBEP): básicas (sueldo, trienios) y complementarias (destino, específico, productividad, gratificaciones).</p>\n<p><strong>Responsabilidad patrimonial</strong> (art. 32 y ss. Ley 40/2015): lesión antijurídica, efectiva, evaluable, individualizada, nexo causal, sin fuerza mayor, prescripción de un año. Responsabilidad del funcionario: disciplinaria, civil (dolo/culpa grave, repetición), penal.</p>\n<p><strong>Protección de datos</strong>: RGPD + LOPDGDD, DPO. <strong>Secreto profesional</strong>: deber de sigilo, art. 53 TREBEP (código de conducta).</p>\n"}, {"num": 4, "title": "El presupuesto de la Comunidad Autónoma. Principios presupuestarios. Elaboración y aprobación del presupuesto. La ejecución del presupuesto: operaciones necesarias. Gestión de los diferentes gastos. Modificaciones presupuestarias.", "html": "<p>Se rige por el Texto Refundido de la Ley de Hacienda de la Región de Murcia (Decreto Legislativo 1/1999) y la LO 2/2012 de Estabilidad Presupuestaria. <strong>Principios</strong>: unidad, universalidad, especialidad (cualitativa/cuantitativa/temporal), anualidad, equilibrio y estabilidad, prórroga automática.</p>\n<p><strong>Elaboración</strong>: la Consejería de Hacienda recaba anteproyectos de las Consejerías, elabora el anteproyecto de Ley de Presupuestos, aprobado por el Consejo de Gobierno como proyecto de ley, tramitado y aprobado por la Asamblea Regional antes del 31 de diciembre.</p>\n<p><strong>Ejecución — fases del gasto</strong>: <strong>A</strong>utorización, <strong>D</strong>isposición/compromiso, <strong>O</strong>bligación (reconocimiento), <strong>P</strong>ago (ADO puede acumularse en un solo acto).</p>\n<p><strong>Gestión de gastos</strong>: personal, corrientes en bienes y servicios, financieros, transferencias corrientes, inversiones reales, transferencias de capital.</p>\n<p><strong>Modificaciones presupuestarias</strong>: créditos extraordinarios (gasto sin crédito), suplementos de crédito (crédito insuficiente), transferencias de crédito, generación de créditos (ingresos afectados), ampliación de créditos, incorporación de remanentes.</p>\n"}, {"num": 5, "title": "Los principios informadores de la actividad administrativa: eficacia, jerarquía, descentralización, desconcentración, coordinación y legalidad.", "html": "<p>Art. 103.1 CE: la Administración sirve con objetividad los intereses generales conforme a eficacia, jerarquía, descentralización, desconcentración y coordinación, con sometimiento pleno a la ley y al Derecho (desarrollado en art. 3 Ley 40/2015).</p>\n<p><strong>Eficacia</strong>: cumplimiento efectivo de fines con el menor coste/tiempo; se complementa con eficiencia. <strong>Jerarquía</strong>: estructura piramidal, superioridad-subordinación, potestad de dirección y revisión (recurso de alzada). <strong>Descentralización</strong>: distribución de competencias entre Administraciones distintas dotadas de personalidad jurídica propia, sin relación jerárquica (territorial o funcional). <strong>Desconcentración</strong>: transferencia de competencias de órgano superior a inferior dentro de la misma persona jurídica (art. 8 Ley 40/2015), persiste la jerarquía. <strong>Coordinación</strong>: coherencia entre órganos/Administraciones sobre un mismo ámbito, mediante conferencias sectoriales, convenios, planes conjuntos. <strong>Legalidad</strong>: sometimiento pleno a la ley y al Derecho (art. 9.3 CE, interdicción de la arbitrariedad), reserva de ley, jerarquía normativa, control judicial (art. 106.1 CE).</p>\n"}, {"num": 6, "title": "El procedimiento administrativo común: concepto. Fases del procedimiento administrativo común. Audiencia al interesado. Cómputo de plazos. La revisión de los actos en vía administrativa. Los derechos de los ciudadanos.", "html": "<p>Regulado con carácter básico en la Ley 39/2015 (LPAC). <strong>Fases</strong>: (1) Iniciación (de oficio o a solicitud, art. 66 requisitos de instancia), (2) Ordenación (impulso de oficio, expediente electrónico), (3) Instrucción (alegaciones, informes, prueba 10-30 días, audiencia), (4) Terminación (resolución expresa, desistimiento, renuncia, caducidad, terminación convencional).</p>\n<p><strong>Audiencia al interesado</strong> (art. 82): tras instrucción y antes de la propuesta de resolución, plazo de 10 a 15 días; puede omitirse si no figuran otros hechos/alegaciones/pruebas que las del propio interesado.</p>\n<p><strong>Cómputo de plazos</strong> (art. 30): por días hábiles salvo indicación de \"naturales\"; excluidos sábados, domingos, festivos. Meses/años: de fecha a fecha. Último día inhábil → prórroga al siguiente hábil. Registro electrónico: 24h/365 días.</p>\n<p><strong>Revisión de actos</strong>: de oficio (nulidad de pleno derecho sin plazo, previo dictamen del Consejo Jurídico; declaración de lesividad 4 años; revocación) y recursos administrativos: <strong>alzada</strong> (contra actos que no agotan vía administrativa, 1 mes/3 meses si presunto, resolución 3 meses), <strong>reposición</strong> potestativo (contra actos que agotan vía administrativa, 1 mes), <strong>extraordinario de revisión</strong> (actos firmes, causas tasadas).</p>\n<p><strong>Derechos de los ciudadanos</strong> (art. 13 LPAC): comunicación electrónica vía Punto de Acceso General, asistencia en medios electrónicos, uso de lenguas cooficiales, acceso a información/archivos/registros, trato respetuoso, exigir responsabilidades, copia sellada, no aportar documentos ya en poder de la Administración (art. 28.2-3).</p>\n"}, {"num": 7, "title": "Los procedimientos de contratación.", "html": "<p>Ley 9/2017, de Contratos del Sector Público (LCSP), transposición de Directivas UE 2014/23, 24 y 25.</p>\n<p><strong>Tipos</strong>: obras, concesión de obras, concesión de servicios, suministro, servicios, mixtos.</p>\n<p><strong>Preparación</strong>: expediente con justificación de necesidad, PCAP (condiciones jurídico-económicas) y PPT (especificaciones técnicas). Criterios de adjudicación: precio único o pluralidad (juicios de valor + fórmulas automáticas).</p>\n<p><strong>Procedimientos de adjudicación</strong>: <strong>abierto</strong> (ordinario o simplificado, sin negociación), <strong>restringido</strong> (previa selección de candidatos), <strong>negociado</strong> (con/sin publicidad, supuestos tasados art. 168), <strong>diálogo competitivo</strong>, <strong>asociación para la innovación</strong>, <strong>contratos menores</strong> (obras &lt;40.000€, suministros/servicios &lt;15.000€, sin licitación formal, límite de duración de un año).</p>\n<p><strong>Órganos</strong>: órgano de contratación (Consejo de Gobierno o titular de Consejería según cuantía), <strong>Mesa de Contratación</strong> (art. 326, preceptiva en abierto/restringido/negociado con publicidad).</p>\n<p><strong>Garantías</strong>: provisional (potestativa, hasta 3%), definitiva (obligatoria, 5% del importe de adjudicación).</p>\n<p><strong>Publicidad</strong>: Plataforma de Contratación del Sector Público, DOUE si supera umbrales comunitarios. Recurso especial en materia de contratación (art. 44 y ss.) ante el Tribunal de Recursos Contractuales competente.</p>\n"}, {"num": 8, "title": "Los recursos humanos y la calidad en los servicios. Los servicios de información administrativa y de atención al ciudadano.", "html": "<p><strong>RRHH</strong>: gestión por competencias, evaluación del desempeño (art. 20 TREBEP), Relación de Puestos de Trabajo (RPT).</p>\n<p><strong>Calidad</strong>: Modelo EFQM, ISO 9001, <strong>CAF</strong> (Common Assessment Framework, específico sector público europeo: agentes facilitadores + resultados). Herramientas: Cartas de Servicios, quejas y sugerencias, encuestas de satisfacción, auditorías internas.</p>\n<p><strong>Servicios de información y atención al ciudadano</strong>: información general (pública, sin acreditar interés) vs particular (estado de tramitación, solo interesados). Canales: presencial (Oficinas de Asistencia en Materia de Registros, OAMR), telefónico, telemático (sede electrónica, Punto de Acceso General). En la CARM: Oficinas Corporativas de Atención al Ciudadano y sede electrónica regional (sedeelectronica.carm.es), con Carpeta Ciudadana y principio de \"no aportar documentos ya en poder de la Administración\" (art. 28.3 LPAC).</p>\n"}, {"num": 9, "title": "Los sistemas informáticos: concepto, componentes y funcionamiento general. Redes de ordenadores e Internet. La red corporativa de la Comunidad Autónoma de la Región de Murcia.", "html": "<p>Un sistema informático combina hardware (CPU, memoria RAM/ROM, almacenamiento, periféricos), software (de sistema y de aplicación) y personas, para captación, almacenamiento, procesamiento y transmisión de información. Funcionamiento según arquitectura Von Neumann (ciclo captación-decodificación-ejecución), coordinado por el sistema operativo.</p>\n<p><strong>Redes</strong>: LAN/MAN/WAN según extensión. Modelos OSI (7 capas) y TCP/IP (4 capas). <strong>Internet</strong>: red de redes con TCP/IP, direccionamiento IP (IPv4/IPv6), DNS. Protocolos de aplicación: HTTP/HTTPS, SMTP/POP3/IMAP, FTP, DHCP.</p>\n<p><strong>Red corporativa de la CARM</strong>: interconecta sedes, Consejerías, organismos y centros dependientes, integrando voz, datos y videoconferencia, con conexión a la red <strong>SARA</strong> (interconexión de Administraciones Públicas españolas) y de esta a la red transeuropea <strong>TESTA</strong>, aplicando el Esquema Nacional de Interoperabilidad (RD 4/2010). Gestión por el órgano TIC de la CARM: correo corporativo, intranet, CAU (Centro de Atención al Usuario), seguridad conforme al ENS (RD 311/2022).</p>\n"}, {"num": 10, "title": "Prevención de riesgos laborales: derechos y obligaciones de los trabajadores en materia de prevención de riesgos laborales. La organización de la Prevención de Riesgos Laborales en la Administración Regional.", "html": "<p>Ley 31/1995, de Prevención de Riesgos Laborales (LPRL), aplicable a la función pública con adaptaciones (RD 39/1997 Reglamento de Servicios de Prevención, RD 67/2010 adaptación a la AGE).</p>\n<p><strong>Derechos</strong> (art. 14 y ss.): protección eficaz, información sobre riesgos (art. 18), formación teórica/práctica (art. 19), consulta y participación mediante Delegados de Prevención y Comités de Seguridad y Salud (arts. 33-40), vigilancia periódica de la salud (art. 22, voluntaria salvo excepciones), <strong>paralización de la actividad ante riesgo grave e inminente</strong> (art. 21).</p>\n<p><strong>Obligaciones</strong> (art. 29): velar por la propia seguridad y la de terceros, uso adecuado de equipos y EPI, no anular dispositivos de seguridad, informar de situaciones de riesgo, cooperar con la Administración.</p>\n<p><strong>Organización en la Administración Regional</strong>: Servicio de Prevención propio o ajeno (según especialidad: medicina del trabajo, higiene, seguridad, ergonomía/psicosociología), que elabora la Evaluación de Riesgos y la Planificación de la Actividad Preventiva. Órganos de participación: Delegados de Prevención (elegidos por los representantes del personal) y Comités de Seguridad y Salud (paritarios, obligatorios con 50+ empleados, reunión trimestral).</p>\n"}, {"num": 11, "title": "La sede electrónica. La identificación y autenticación de las personas físicas y jurídicas para las diferentes actuaciones en la gestión electrónica. El documento electrónico. El expediente electrónico. La Plataforma de Interoperabilidad.", "html": "<p><strong>Sede electrónica</strong> (arts. 38-40 Ley 40/2015): dirección electrónica de titularidad de una Administración, disponible 24/7, con identificación del titular mediante sello electrónico basado en certificado. La CARM dispone de sede electrónica corporativa (registro, tablón de edictos, carpeta ciudadana, catálogo de procedimientos).</p>\n<p><strong>Identificación y autenticación</strong> (arts. 9-10 LPAC): personas físicas mediante certificado cualificado (DNIe, FNMT) o clave concertada (Cl@ve PIN/Permanente); personas jurídicas obligatoriamente mediante certificado de representante (art. 14.2, obligadas a relacionarse electrónicamente). Las Administraciones se identifican mediante sello electrónico o firma del personal (art. 43 Ley 40/2015).</p>\n<p><strong>Documento electrónico</strong> (art. 26 LPAC): información en forma electrónica con contenido, formato identificable, en su caso firma y metadatos ENI. Las copias electrónicas tienen la misma validez que el original si se garantiza autenticidad, integridad y conservación.</p>\n<p><strong>Expediente electrónico</strong> (art. 70 LPAC): conjunto ordenado de documentos y actuaciones, foliado mediante índice electrónico firmado, que garantiza integridad e inmutabilidad.</p>\n<p><strong>Plataforma de Interoperabilidad</strong>: en el marco del ENI (RD 4/2010), incluye la Plataforma de Intermediación de Datos (consulta de datos sin aportación del ciudadano, art. 28.2-3 LPAC) y el Sistema de Interconexión de Registros (SIR). La CARM se interconecta a estas plataformas estatales vía su propia Plataforma de Interoperabilidad autonómica, integrada en su sede electrónica y conectada a la red SARA.</p>\n"}, {"num": 12, "title": "Igualdad: Disposiciones generales. Transparencia y acceso a la información pública: conceptos fundamentales.", "html": "<p><strong>Igualdad</strong>: LO 3/2007, para la igualdad efectiva de mujeres y hombres (LOIEMH): igualdad de trato y de oportunidades, acciones positivas (art. 11), transversalidad de género (art. 15), planes de igualdad. En Murcia: Ley 7/2007, para la Igualdad entre Mujeres y Hombres y de Protección contra la Violencia de Género (Plan Estratégico, unidades de igualdad).</p>\n<p><strong>Transparencia</strong>: Ley 19/2013 estatal + Ley 12/2014 de Transparencia y Participación Ciudadana de la CARM. Doble mecanismo:</p>\n<ul>\n<li><strong>Publicidad activa</strong> (Título I): información institucional, organizativa, jurídica, económica-presupuestaria-estadística en el Portal de Transparencia.</li>\n<li><strong>Derecho de acceso</strong> (Título II): cualquier persona, sin motivar, plazo de resolución de 1 mes (+1 mes ampliable), límites del art. 14 (seguridad nacional, defensa, etc.) y art. 15 (protección de datos), reclamación potestativa ante el Consejo de Transparencia antes de la vía contencioso-administrativa.</li>\n</ul>\n"}]}, {"key": "esp1", "title": "Materias específicas (1-15)", "temas": [{"num": 1, "title": "Sistemas GNU/Linux. Distribuciones. Órdenes y configuraciones básicas, el sistema gráfico. El Shell, conceptos y programación. Administración, herramientas básicas, monitorización del sistema, usuarios, grupos y permisos. El sistema de ficheros.", "html": "<p>GNU/Linux es un sistema operativo tipo Unix compuesto por el núcleo Linux (creado por Linus Torvalds en 1991) y las herramientas del proyecto GNU. Se distribuye bajo licencia GPL. Las <strong>distribuciones</strong> empaquetan el núcleo junto con gestores de paquetes y utilidades: familia Debian (Debian, Ubuntu, Linux Mint) con <code>apt</code>/<code>dpkg</code>; familia Red Hat (RHEL, CentOS Stream, Fedora, Rocky Linux) con <code>dnf</code>/<code>rpm</code>; SUSE con <code>zypper</code>; Arch Linux con <code>pacman</code>. Cada una define su ciclo de vida (LTS en Ubuntu cada dos años, Debian stable/testing/unstable/experimental).</p>\n<p><strong>Órdenes básicas</strong>: navegación (<code>cd</code>, <code>pwd</code>, <code>ls -la</code>), gestión de ficheros (<code>cp -r</code>, <code>mv</code>, <code>rm -rf</code>, <code>find /var -name \"*.log\" -mtime +30</code>), texto (<code>grep -rn patrón</code>, <code>sed -i 's/a/b/g'</code>, <code>awk '{print $1}'</code>, <code>cat</code>, <code>less</code>), compresión (<code>tar czvf archivo.tar.gz dir/</code>, <code>gzip</code>). El <strong>sistema gráfico</strong> se basa en el protocolo X11 (X.Org Server) o, en distribuciones modernas, Wayland (compositor nativo usado por GNOME/Mutter y KDE/KWin), con gestores de sesión como GDM, SDDM o LightDM y entornos de escritorio GNOME, KDE Plasma o XFCE.</p>\n<p>El <strong>Shell</strong> es el intérprete de órdenes; bash es el más extendido, junto a zsh, dash (usado como <code>/bin/sh</code> en Debian por rapidez) y fish. La <strong>programación en shell</strong> incluye variables (<code>VAR=valor</code>, <code>export VAR</code>), estructuras de control (<code>if [ -f fichero ]; then ... fi</code>, <code>for i in $(seq 1 10); do ... done</code>, <code>while read linea; do ... done &lt; fichero</code>), funciones, redirecciones (<code>&gt;</code>, <code>&gt;&gt;</code>, <code>2&gt;&amp;1</code>, <code>|</code>) y sustitución de comandos (<code>$(comando)</code>). Los scripts comienzan con shebang <code>#!/bin/bash</code> y requieren permiso de ejecución (<code>chmod +x</code>).</p>\n<p><strong>Administración de usuarios y grupos</strong>: <code>useradd -m -s /bin/bash usuario</code>, <code>usermod -aG grupo usuario</code>, <code>passwd usuario</code>, <code>groupadd</code>, <code>userdel -r</code>. La información reside en <code>/etc/passwd</code> (usuario<span class=\"emoji\" data-emoji=\"x\">❌</span>UID:GID:comentario:home:shell), <code>/etc/shadow</code> (contraseñas cifradas), <code>/etc/group</code> y <code>/etc/gshadow</code>. El superusuario root tiene UID 0; <code>sudo</code> (configurado en <code>/etc/sudoers</code>, editable con <code>visudo</code>) delega privilegios de forma auditada.</p>\n<p><strong>Permisos</strong>: cada fichero tiene triadas rwx para propietario, grupo y otros (<code>chmod 750 fichero</code>, <code>chmod u+x,g-w script.sh</code>), y propietario/grupo se cambian con <code>chown usuario:grupo fichero</code>. Existen bits especiales: SUID (4000, ejecuta con permisos del propietario, ej. <code>/usr/bin/passwd</code>), SGID (2000, hereda grupo en directorios) y sticky bit (1000, en <code>/tmp</code>, solo el propietario borra sus ficheros). Las ACL extendidas (<code>setfacl -m u:usuario:rwx fichero</code>, <code>getfacl</code>) permiten permisos granulares más allá del modelo clásico.</p>\n<p><strong>Monitorización del sistema</strong>: <code>top</code>/<code>htop</code> (procesos y consumo de CPU/memoria), <code>ps aux</code>, <code>free -h</code> (memoria), <code>df -h</code> (espacio en disco), <code>du -sh</code> (tamaño de directorios), <code>iostat</code>, <code>vmstat</code>, <code>netstat -tulnp</code>/<code>ss -tulnp</code> (puertos en escucha), <code>journalctl -xe</code> (registros de systemd), <code>dmesg</code>. El sistema de arranque moderno es <strong>systemd</strong>, que gestiona servicios (<code>systemctl start/stop/enable/status nombre.service</code>), unidades objetivo (targets equivalentes a runlevels) y temporizadores (<code>.timer</code>) como alternativa a cron. Cron clásico se configura en <code>/etc/crontab</code> o <code>crontab -e</code> con sintaxis <code>min hora día mes díasemana comando</code>.</p>\n<p><strong>El sistema de ficheros</strong> sigue el estándar FHS (Filesystem Hierarchy Standard): <code>/bin</code>, <code>/sbin</code> (binarios), <code>/etc</code> (configuración), <code>/home</code> (usuarios), <code>/var</code> (logs, spool), <code>/tmp</code>, <code>/usr</code>, <code>/opt</code>, <code>/proc</code> y <code>/sys</code> (virtuales, exponen información del núcleo). Los formatos de sistema de archivos habituales son ext4 (journaling, por defecto en muchas distros), XFS (RHEL), Btrfs (snapshots, subvolúmenes) y ZFS. La gestión de volúmenes lógicos se realiza con LVM (<code>pvcreate</code>, <code>vgcreate</code>, <code>lvcreate</code>, <code>lvextend</code> + <code>resize2fs</code>), y el montaje se define en <code>/etc/fstab</code> con dispositivo, punto de montaje, tipo de FS y opciones, o dinámicamente con <code>mount</code>/<code>umount</code>. Todo en Linux es un fichero, incluidos dispositivos (<code>/dev/sda1</code>) y sockets, lo que unifica el modelo de E/S del sistema.</p>\n"}, {"num": 2, "title": "Windows Server. Active Directory: Arquitectura y servicios. Servicio de impresión. Servicio de ficheros. Administración de discos y volúmenes. Permisos sobre archivos y carpetas. DFS.", "html": "<p>Windows Server es la familia de sistemas operativos de Microsoft orientada a servidores (versiones 2016, 2019, 2022, 2025), que incorpora roles y características gestionables desde el Administrador del Servidor o mediante PowerShell (<code>Install-WindowsFeature</code>, <code>Get-WindowsFeature</code>).</p>\n<p><strong>Active Directory (AD DS)</strong> es el servicio de directorio basado en LDAP y el protocolo Kerberos para autenticación. Su unidad lógica principal es el <strong>dominio</strong>, agrupado en <strong>árboles</strong> y <strong>bosques</strong> (forest), con una relación de confianza transitiva entre dominios del mismo árbol. La arquitectura lógica incluye Unidades Organizativas (OU) para agrupar objetos (usuarios, equipos, grupos) y aplicar Directivas de Grupo (GPO); la arquitectura física se basa en <strong>sitios</strong> (Sites) que reflejan la topología de red y controlan la replicación mediante el protocolo KCC (Knowledge Consistency Checker) y RPC/SMTP entre controladores de dominio (DC). Cada bosque mantiene cinco roles FSMO (Flexible Single Master Operations): Schema Master y Domain Naming Master (a nivel de bosque), y RID Master, PDC Emulator e Infrastructure Master (a nivel de dominio), consultables con <code>netdom query fsmo</code>. La base de datos de AD reside en <code>NTDS.dit</code>, con el catálogo global (Global Catalog) replicando atributos parciales de todos los objetos del bosque para búsquedas entre dominios. AD integra DNS (zonas integradas en AD, registros SRV para localización de servicios) y DHCP para autorización de servidores.</p>\n<p><strong>Servicio de impresión</strong>: el rol Print and Document Services centraliza colas de impresión, publica impresoras compartidas en AD y permite despliegue de controladores mediante GPO (<code>Impresoras desplegadas</code>) o Point and Print. La consola <code>printmanagement.msc</code> gestiona servidores de impresión, controladores y colas; PowerShell ofrece <code>Add-Printer</code>, <code>Add-PrinterDriver</code>, <code>Get-PrintJob</code>.</p>\n<p><strong>Servicio de ficheros</strong>: el rol File and Storage Services gestiona recursos compartidos SMB (versión mínima recomendada SMB3 por cifrado y firma), cuotas y filtrado de tipos de archivo mediante FSRM (File Server Resource Manager), además de clasificación automática de datos. Los recursos se comparten con <code>New-SmbShare -Name Datos -Path D:\\Datos -FullAccess Dominio\\Grupo</code>.</p>\n<p><strong>Administración de discos y volúmenes</strong>: la consola <code>diskmgmt.msc</code> o <code>Get-Disk</code>/<code>New-Partition</code>/<code>Format-Volume</code> en PowerShell gestionan discos MBR o GPT (necesario para discos &gt;2TB y arranque UEFI), volúmenes simples, distribuidos, seccionados (RAID 0), reflejados (RAID 1) y RAID 5 por software, además de Espacios de Almacenamiento (Storage Spaces) que virtualizan varios discos físicos en pools resilientes.</p>\n<p><strong>Permisos sobre archivos y carpetas</strong> combinan dos capas: permisos NTFS (lectura, escritura, modificación, control total, aplicables a nivel local, editables con <code>icacls carpeta /grant usuario:(OI)(CI)M</code>) y permisos de recurso compartido SMB (lectura, cambio, control total). El permiso efectivo es la intersección más restrictiva entre ambos cuando se accede en red. NTFS soporta herencia desde carpetas padre y permisos explícitos que la rompen; los grupos de seguridad de AD son el mecanismo recomendado frente a asignar permisos a usuarios individuales (modelo AGDLP: cuentas en grupos globales, en grupos locales de dominio, con permisos asignados).</p>\n<p><strong>DFS (Distributed File System)</strong> consta de dos componentes: DFS Namespaces, que unifica rutas de recursos compartidos dispersos en varios servidores bajo un espacio de nombres lógico único (<code>\\\\dominio\\Datos</code>) con tolerancia a fallos si hay varios objetivos de carpeta; y DFS Replication (DFSR), que sincroniza contenido entre servidores mediante el algoritmo RDC (Remote Differential Compression), útil para sucursales y alta disponibilidad de ficheros, configurable mediante grupos de replicación en la consola <code>dfsmgmt.msc</code>.</p>\n"}, {"num": 3, "title": "Correo electrónico. Elementos que componen un sistema de correo electrónico. Protocolos SMTP, POP3, IMAP. Exchange. Herramientas colaborativas en la Nube.", "html": "<p>Un sistema de correo electrónico se compone de: <strong>MUA</strong> (Mail User Agent, cliente como Outlook o Thunderbird), <strong>MTA</strong> (Mail Transfer Agent, encargado del transporte entre servidores, ej. Postfix, Exim, Sendmail, o Exchange Transport), <strong>MDA</strong> (Mail Delivery Agent, entrega en el buzón local) y <strong>MSA</strong> (Mail Submission Agent, recepción autenticada del cliente, típicamente puerto 587). El enrutamiento depende de los registros DNS <strong>MX</strong> (Mail Exchanger, con prioridad numérica), y la reputación/antispam se apoya en registros <strong>SPF</strong> (TXT que autoriza IPs remitentes), <strong>DKIM</strong> (firma criptográfica del mensaje mediante clave pública en DNS) y <strong>DMARC</strong> (política que combina SPF/DKIM e indica qué hacer con mensajes no conformes: none, quarantine, reject).</p>\n<p><strong>SMTP</strong> (Simple Mail Transfer Protocol, puerto 25 entre servidores, 587 con STARTTLS para envío autenticado de clientes, 465 SMTPS implícito) es el protocolo de envío; usa comandos de texto plano (<code>HELO</code>/<code>EHLO</code>, <code>MAIL FROM</code>, <code>RCPT TO</code>, <code>DATA</code>). <strong>POP3</strong> (Post Office Protocol, puerto 110/995 SSL) descarga los mensajes al cliente y por defecto los elimina del servidor, adecuado para un único dispositivo. <strong>IMAP</strong> (Internet Message Access Protocol, puerto 143/993 SSL) mantiene los mensajes en el servidor, sincroniza carpetas, estado leído/no leído y flags entre múltiples dispositivos, siendo el estándar actual para entornos corporativos.</p>\n<p><strong>Microsoft Exchange Server</strong> es la plataforma de mensajería corporativa on-premise, estructurada en roles de servidor: Mailbox (aloja buzones, bases de datos EDB, transporte y acceso de cliente) y Edge Transport (en versiones anteriores a Exchange 2016, filtrado perimetral antispam). Los buzones se organizan en Bases de Datos de Buzones (Mailbox Database), con Grupos de Disponibilidad de Base de Datos (<strong>DAG</strong>, Database Availability Group) para alta disponibilidad mediante réplicas y conmutación por error automática (replicación de logs de transacciones ESE). El acceso de clientes se realiza vía <strong>MAPI/HTTP</strong> o <strong>Outlook Anywhere</strong> (RPC sobre HTTPS), Exchange ActiveSync (EAS) para móviles, y Exchange Web Services (EWS) para integración programática. La administración se realiza mediante el Centro de Administración de Exchange (EAC, interfaz web) o el <strong>Exchange Management Shell</strong> (cmdlets PowerShell: <code>Get-Mailbox</code>, <code>New-MailboxDatabase</code>, <code>Set-TransportConfig</code>, <code>Get-MessageTrackingLog</code>). Las directivas de retención (Retention Policies), journaling y transport rules aplican cumplimiento normativo.</p>\n<p><strong>Exchange Online</strong> es la versión SaaS integrada en Microsoft 365, gestionada desde el Centro de administración de Exchange Online o PowerShell remoto (<code>Connect-ExchangeOnline</code>), con buzones alojados en la nube de Microsoft, protección antimalware/antispam mediante Exchange Online Protection (EOP) y Defender for Office 365 para amenazas avanzadas (phishing, sandboxing de adjuntos).</p>\n<p>Las <strong>herramientas colaborativas en la Nube</strong> amplían el correo tradicional: Microsoft 365 integra Outlook, Exchange Online, SharePoint Online (gestión documental), Teams (mensajería, videoconferencia, coedición) y OneDrive; Google Workspace ofrece Gmail, Drive, Docs/Sheets/Slides y Meet, con arquitectura basada en OAuth 2.0 para autenticación de terceros. Estos entornos aportan coedición en tiempo real, control de versiones, calendarios compartidos y federación de identidad mediante SSO (SAML 2.0, OpenID Connect), habitualmente integrados con Azure AD/Entra ID como proveedor de identidad único de la organización.</p>\n"}, {"num": 4, "title": "Windows 10. Instalación. Cuentas de usuario. Configuración de políticas. Gestión de ficheros, permisos. Carpetas compartidas.", "html": "<p>La <strong>instalación</strong> de Windows 10 puede realizarse desde medio USB/DVD creado con la Media Creation Tool, mediante imágenes WIM/ESD desplegadas con MDT (Microsoft Deployment Toolkit) o SCCM/Configuration Manager en entornos corporativos, o vía Windows Autopilot para aprovisionamiento zero-touch desde la nube. El proceso usa el modo de instalación UEFI (recomendado, con Secure Boot y tabla de particiones GPT) frente al modo Legacy BIOS/MBR. Un fichero <code>unattend.xml</code> permite instalaciones desatendidas especificando particionado, cuenta de administrador, idioma y unión a dominio. Las ediciones relevantes en entorno empresarial son Pro, Enterprise (con LTSC para sistemas críticos sin actualizaciones de funcionalidades) y Education.</p>\n<p><strong>Cuentas de usuario</strong>: locales (almacenadas en el SAM local, <code>Administrador</code> y <code>Invitado</code> deshabilitadas por defecto), cuentas Microsoft (vinculadas a un correo, sincronizan configuración vía OneDrive) y cuentas de dominio (autenticadas contra AD mediante Kerberos). Se gestionan desde <code>Configuración &gt; Cuentas</code>, el panel clásico <code>lusrmgr.msc</code> (solo en ediciones Pro/Enterprise, no en Home) o PowerShell (<code>New-LocalUser</code>, <code>Add-LocalGroupMember -Group Administradores -Member usuario</code>). El Control de Cuentas de Usuario (<strong>UAC</strong>) eleva privilegios de forma puntual mediante tokens de acceso restringido, configurable en niveles desde <code>secpol.msc</code> o GPO.</p>\n<p><strong>Configuración de políticas</strong>: en equipos independientes se usa el Editor de Directivas de Grupo Local (<code>gpedit.msc</code>, no disponible en Home) o el Editor del Registro (<code>regedit</code>) para claves equivalentes bajo <code>HKLM\\Software\\Policies</code>. En entorno de dominio, las <strong>GPO</strong> se administran desde GPMC (Group Policy Management Console) en el controlador de dominio, se vinculan a sitios, dominios u OU, y se aplican con orden de precedencia LSDOU (Local, Site, Domain, OU, con la más cercana al objeto prevaleciendo salvo bloqueo de herencia o \"No Override\"). Incluyen configuración de equipo y de usuario, plantillas administrativas (.admx/.adml), scripts de inicio/cierre de sesión, redirección de carpetas y preferencias de grupo (mapeo de unidades, impresoras). La actualización forzada se realiza con <code>gpupdate /force</code> y la comprobación de aplicación con <code>gpresult /r</code> o <code>rsop.msc</code>.</p>\n<p><strong>Gestión de ficheros y permisos</strong>: el explorador de archivos trabaja sobre NTFS, que soporta permisos granulares (lectura, escritura, lectura y ejecución, modificación, control total) configurables en la pestaña Seguridad de las propiedades del objeto o vía <code>icacls</code>/<code>cacls</code>. Los permisos se heredan de la carpeta contenedora salvo ruptura explícita, y se combinan de forma acumulativa entre los grupos a los que pertenece el usuario, excepto la denegación explícita, que siempre prevalece. Comandos clave: <code>icacls ruta /grant usuario:(F|M|RX|R|W)</code>, <code>icacls ruta /deny usuario:F</code>, <code>takeown /f ruta</code> para tomar posesión.</p>\n<p><strong>Carpetas compartidas</strong>: se configuran desde <code>Propiedades &gt; Compartir &gt; Uso compartido avanzado</code> o <code>New-SmbShare -Name Recurso -Path C:\\Datos -FullAccess Everyone</code> en PowerShell, definiendo el límite de usuarios simultáneos y permisos de recurso compartido (independientes de los NTFS, aplicándose siempre la intersección más restrictiva al acceder por red vía <code>\\\\equipo\\recurso</code>). El servicio subyacente es SMB (Server Message Block), cuya versión se puede consultar con <code>Get-SmbConnection</code> y cuya versión 1 debe deshabilitarse por motivos de seguridad (<code>Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol</code>) en favor de SMB 3.x, que soporta cifrado y firma de extremo a extremo.</p>\n"}, {"num": 5, "title": "Windows 10. Configuración de hardware y drivers. Configuración TCP/IP. Opciones de Internet. Sistemas de archivos (NTFS, FAT, FAT32).", "html": "<p><strong>Configuración de hardware y controladores</strong>: el Administrador de dispositivos (<code>devmgmt.msc</code>) permite ver, actualizar, deshabilitar y desinstalar dispositivos y sus controladores (drivers), que deben estar firmados digitalmente (WHQL) para cargarse en modo kernel bajo Driver Signature Enforcement; en modo de pruebas puede desactivarse con <code>bcdedit /set testsigning on</code>. Windows Update gestiona la distribución de drivers, y el almacén de controladores reside en <code>C:\\Windows\\System32\\DriverStore\\FileRepository</code>, consultable con <code>pnputil /enum-drivers</code>. El Administrador de tareas (<code>taskmgr</code>) y el Monitor de recursos (<code>resmon</code>) permiten supervisar CPU, memoria, disco y red en tiempo real; <code>msinfo32</code> ofrece un resumen completo del hardware instalado; <code>dxdiag</code> diagnostica subsistema gráfico y de audio.</p>\n<p><strong>Configuración TCP/IP</strong>: se gestiona desde <code>Configuración &gt; Red e Internet</code>, el panel clásico <code>ncpa.cpl</code>, o PowerShell con los cmdlets modernos <code>Get-NetIPAddress</code>, <code>New-NetIPAddress -IPAddress 192.168.1.10 -PrefixLength 24 -InterfaceAlias Ethernet -DefaultGateway 192.168.1.1</code>, <code>Set-DnsClientServerAddress -InterfaceAlias Ethernet -ServerAddresses 8.8.8.8,8.8.4.4</code>. El diagnóstico clásico usa <code>ipconfig /all</code>, <code>ipconfig /release</code> y <code>/renew</code> para DHCP, <code>ipconfig /flushdns</code>, <code>ping</code>, <code>tracert</code>, <code>nslookup</code> y <code>netstat -ano</code>. La resolución de nombres combina el fichero <code>hosts</code> (<code>C:\\Windows\\System32\\drivers\\etc\\hosts</code>), la caché DNS local y el protocolo DHCP (proceso DORA: Discover, Offer, Request, Acknowledge) para asignación dinámica de IP, puerta de enlace y servidores DNS. El Firewall de Windows Defender (<code>wf.msc</code>) filtra tráfico por perfiles (Dominio, Privado, Público) con reglas de entrada/salida basadas en puerto, programa o servicio.</p>\n<p><strong>Opciones de Internet</strong> (<code>inetcpl.cpl</code>) configuran, además del navegador Internet Explorer/Edge legacy, ajustes usados por el sistema y muchas aplicaciones vía WinINet: configuración de proxy (manual, automática mediante script PAC, o detección automática WPAD), zonas de seguridad (Internet, Intranet local, Sitios de confianza, Sitios restringidos, cada una con nivel de restricción para ActiveX, scripts y descargas), certificados de confianza (gestionados también desde <code>certmgr.msc</code>), y configuración de conexión LAN. En entornos de dominio, el proxy y las zonas de seguridad suelen desplegarse vía GPO.</p>\n<p><strong>Sistemas de archivos</strong>: <strong>FAT</strong> (File Allocation Table, 16 bits) es obsoleto, sin soporte de permisos ni ficheros grandes. <strong>FAT32</strong> admite particiones hasta 2TB pero limita el tamaño de fichero individual a 4GB (por el campo de tamaño de 32 bits), sin journaling ni seguridad a nivel de archivo; sigue usándose por compatibilidad universal en memorias USB y firmware de dispositivos embebidos. <strong>NTFS</strong> (New Technology File System) es el sistema nativo de Windows: soporta journaling (registro de transacciones para recuperación ante fallos), permisos ACL granulares, cifrado nativo (EFS, Encrypting File System), compresión transparente, cuotas de disco por usuario, enlaces simbólicos y duros, streams de datos alternativos (ADS), y ficheros/particiones de tamaño prácticamente ilimitado (hasta 16 EB teóricos). La conversión de FAT32 a NTFS sin pérdida de datos se realiza con <code>convert D: /FS:NTFS</code>; el formateo se hace con <code>format D: /FS:NTFS /Q</code>. exFAT es una alternativa moderna sin journaling pensada para almacenamiento externo de gran capacidad, compatible entre Windows, macOS y Linux, sin límite práctico de tamaño de archivo.</p>\n"}, {"num": 6, "title": "Windows 10. Acceso remoto. Arranque del sistema. Puntos de restauración. Seguridad del puesto de trabajo: antivirus, cortafuegos.", "html": "<p><strong>Acceso remoto</strong>: el <strong>Escritorio Remoto</strong> (RDP, Remote Desktop Protocol, puerto TCP 3389) se activa en <code>Sistema &gt; Escritorio remoto</code> (solo disponible en Windows 10 Pro/Enterprise como servidor) y requiere que el usuario pertenezca al grupo local \"Usuarios de escritorio remoto\"; el cliente es <code>mstsc</code>, configurable con ficheros <code>.rdp</code> o parámetros de línea de comandos. La seguridad se refuerza con NLA (Network Level Authentication), que exige autenticación antes de establecer la sesión completa, mitigando ataques de fuerza bruta. <strong>Asistencia Remota</strong> (<code>msra</code>) permite compartir sesión con invitación cifrada. <strong>PowerShell Remoting</strong> (WinRM, puertos 5985 HTTP/5986 HTTPS) habilita administración remota mediante <code>Enable-PSRemoting</code>, <code>Enter-PSSession -ComputerName equipo</code> y <code>Invoke-Command -ComputerName equipo -ScriptBlock {...}</code>, base de herramientas como Ansible o DSC. Existen además soluciones de terceros (AnyDesk, TeamViewer) y VPN (L2TP/IPSec, SSTP, IKEv2) para acceso remoto seguro a la red corporativa.</p>\n<p><strong>Arranque del sistema</strong>: en firmware UEFI con Secure Boot, la cadena de arranque verifica firmas digitales del gestor de arranque (<code>bootmgfw.efi</code>) antes de cargar el núcleo, protegiendo contra rootkits de arranque (bootkits). El <strong>BCD</strong> (Boot Configuration Data) sustituye al antiguo <code>boot.ini</code>, gestionable con <code>bcdedit /enum</code> y <code>bcdedit /set</code>, o mediante <code>msconfig</code> en su pestaña Arranque para configurar arranque seguro (modo mínimo, con símbolo del sistema, red) y diagnóstico. El <strong>Entorno de recuperación de Windows</strong> (WinRE, accesible con <code>shift+reinicio</code> o tres fallos de arranque consecutivos) ofrece reparación de inicio, restauración de sistema, recuperación desde imagen, símbolo del sistema y desinstalación de actualizaciones. El proceso de arranque sigue la secuencia: POST del firmware → UEFI/BIOS localiza el gestor de arranque → <code>bootmgr</code> carga <code>winload.exe</code> → carga del núcleo <code>ntoskrnl.exe</code> y controladores de arranque → inicio de servicios y sesión de usuario (<code>winlogon.exe</code>).</p>\n<p><strong>Puntos de restauración</strong>: la Protección del sistema (<code>SystemPropertiesProtection.exe</code> o <code>sysdm.cpl</code>) crea instantáneas del registro y ficheros de sistema mediante el servicio de instantáneas de volumen (<strong>VSS</strong>, Volume Shadow Copy Service), permitiendo revertir el sistema sin afectar a documentos de usuario. Se crean automáticamente antes de instalar actualizaciones o drivers no firmados, o manualmente con <code>Checkpoint-Computer -Description \"Nombre\"</code> en PowerShell; la restauración se ejecuta con <code>rstrui.exe</code>. El espacio reservado se configura como porcentaje del disco, y las instantáneas más antiguas se purgan automáticamente al superarse la cuota.</p>\n<p><strong>Seguridad del puesto de trabajo</strong>: <strong>Windows Defender Antivirus</strong> (Microsoft Defender) ofrece protección en tiempo real, análisis basado en firmas y heurística, protección en la nube (MAPS) y detección de comportamiento; se gestiona desde <code>Seguridad de Windows</code> o PowerShell (<code>Get-MpComputerStatus</code>, <code>Start-MpScan</code>, <code>Update-MpSignature</code>). El <strong>Firewall de Windows Defender con seguridad avanzada</strong> (<code>wf.msc</code>) filtra tráfico por perfil de red (Dominio, Privado, Público) mediante reglas de entrada y salida basadas en puerto/protocolo/programa, integrable con IPSec para cifrado de tráfico interno. Otras capas de defensa incluyen SmartScreen (bloqueo de webs/ejecutables maliciosos), Control de aplicaciones y explotación (Exploit Protection, ASLR/DEP), BitLocker (cifrado de volumen con TPM) y Windows Hello para autenticación biométrica/PIN respaldada por hardware.</p>\n"}, {"num": 7, "title": "Sistema Gestor de Base de Datos Oracle. Estructura física y lógica de la base de datos. Arquitectura de memoria y procesos. Arranque y parada. Acceso a la base de datos y seguridad de la información.", "html": "<p><strong>Estructura física</strong>: una base de datos Oracle se compone de ficheros de datos (<strong>datafiles</strong>, <code>.dbf</code>), ficheros de control (<strong>control files</strong>, que registran metadatos de la estructura física y SCN) y ficheros de redo log (registro de transacciones, organizados en grupos multiplexados para tolerancia a fallos). Complementan la estructura los ficheros de parámetros (<code>SPFILE</code>/<code>PFILE</code>, con directivas como <code>SGA_TARGET</code>, <code>DB_NAME</code>), archived redo logs (si la base opera en modo ARCHIVELOG, necesarios para recuperación point-in-time) y ficheros de traza/alert log (<code>alert_&lt;SID&gt;.log</code>) para diagnóstico.</p>\n<p><strong>Estructura lógica</strong>: se organiza jerárquicamente en tablespaces (unidades lógicas de almacenamiento, ej. <code>SYSTEM</code>, <code>SYSAUX</code>, <code>UNDOTBS1</code>, <code>TEMP</code>, y tablespaces de usuario), que se componen de uno o varios datafiles y se dividen en <strong>segmentos</strong> (de tabla, índice, undo, temporal), estos en <strong>extents</strong> (conjuntos contiguos de bloques) y finalmente en <strong>bloques de datos</strong> (unidad mínima de E/S, tamaño configurable con <code>DB_BLOCK_SIZE</code>, típicamente 8KB). Desde Oracle 12c se introduce la arquitectura <strong>multitenant</strong>: un Container Database (<strong>CDB</strong>) alberga una base raíz (root) y múltiples Pluggable Databases (<strong>PDB</strong>), facilitando consolidación, clonado y portabilidad.</p>\n<p><strong>Arquitectura de memoria</strong>: la <strong>SGA</strong> (System Global Area, memoria compartida entre procesos) incluye el Database Buffer Cache (bloques de datos en memoria), Shared Pool (caché de sentencias SQL parseadas y diccionario de datos), Redo Log Buffer (cambios pendientes de escribir a disco), Large Pool y Java Pool. La <strong>PGA</strong> (Program Global Area) es memoria privada por proceso/sesión para ordenaciones, hash joins y cursores. La gestión puede ser automática (AMM, <code>MEMORY_TARGET</code>) o manual por componentes.</p>\n<p><strong>Procesos en segundo plano</strong> (background processes) esenciales: <strong>PMON</strong> (Process Monitor, limpia procesos fallidos), <strong>SMON</strong> (System Monitor, recuperación de instancia tras caída), <strong>DBWn</strong> (Database Writer, vuelca bloques modificados de la buffer cache a datafiles), <strong>LGWR</strong> (Log Writer, escribe el redo log buffer a disco, garantizando durabilidad ACID), <strong>CKPT</strong> (Checkpoint, sincroniza punto de consistencia entre memoria y disco), <strong>ARCn</strong> (Archiver, copia redo logs llenos si ARCHIVELOG está activo).</p>\n<p><strong>Arranque y parada</strong>: se gestionan vía SQL*Plus conectado como SYSDBA (<code>sqlplus / as sysdba</code>). Secuencia de arranque: <code>STARTUP NOMOUNT</code> (lee el parameter file y levanta la instancia, asignando memoria e iniciando procesos, sin abrir control files) → <code>ALTER DATABASE MOUNT</code> (asocia la instancia a la base leyendo los control files) → <code>ALTER DATABASE OPEN</code> (abre datafiles y redo logs, disponible para usuarios); <code>STARTUP</code> ejecuta las tres fases de forma directa. La parada admite modos: <code>SHUTDOWN NORMAL</code> (espera desconexión de sesiones activas), <code>IMMEDIATE</code> (aborta transacciones activas con rollback, el más usado en producción), <code>TRANSACTIONAL</code> (espera a que terminen las transacciones en curso) y <code>ABORT</code> (parada brusca, requiere recuperación de instancia al reiniciar).</p>\n<p><strong>Acceso y seguridad</strong>: la autenticación se realiza mediante usuarios/roles con perfiles de contraseña (<code>CREATE PROFILE ... PASSWORD_LIFE_TIME</code>), o externamente vía Oracle Wallet/Kerberos/LDAP. Los privilegios se conceden con <code>GRANT SELECT, INSERT ON esquema.tabla TO usuario</code> o mediante roles (<code>CREATE ROLE</code>, <code>GRANT rol TO usuario</code>), separando privilegios de sistema (<code>CREATE SESSION</code>, <code>DBA</code>) de privilegios de objeto. <strong>TDE</strong> (Transparent Data Encryption) cifra datos en reposo a nivel de columna o tablespace mediante un Wallet de claves maestras. <strong>VPD</strong> (Virtual Private Database) y Oracle Label Security implementan seguridad a nivel de fila. La auditoría (<code>AUDIT</code> tradicional o Unified Auditing desde 12c) registra accesos y operaciones sensibles, y el listener (<code>lsnrctl status</code>, fichero <code>listener.ora</code>) controla las conexiones de red entrantes en el puerto TCP 1521 por defecto.</p>\n"}, {"num": 8, "title": "Características generales de MySQL, PostgreSQL, SQL Server.", "html": "<p><strong>MySQL</strong> es un SGBD relacional open source (GPL, propiedad de Oracle Corporation desde 2010, con el fork comunitario <strong>MariaDB</strong> como alternativa totalmente libre) que soporta múltiples motores de almacenamiento intercambiables: <strong>InnoDB</strong> (por defecto desde 5.5, transaccional, con soporte ACID, claves foráneas, bloqueo a nivel de fila mediante MVCC) y <strong>MyISAM</strong> (sin transacciones, bloqueo a nivel de tabla, más rápido en lecturas puras pero obsoleto para OLTP). La administración se realiza vía cliente <code>mysql</code>, phpMyAdmin o MySQL Workbench; el fichero de configuración es <code>my.cnf</code>/<code>my.ini</code>. Ofrece replicación asíncrona maestro-esclavo tradicional (basada en binary log) y <strong>Group Replication</strong>/InnoDB Cluster para alta disponibilidad multi-maestro. Es el motor predominante en aplicaciones web (pila LAMP/LEMP) por su simplicidad y rendimiento en lecturas. Gestión de usuarios: <code>CREATE USER 'u'@'host' IDENTIFIED BY 'pass'; GRANT SELECT ON bd.* TO 'u'@'host';</code>.</p>\n<p><strong>PostgreSQL</strong> es un SGBD objeto-relacional open source (licencia PostgreSQL, permisiva tipo BSD) reconocido por su estricta conformidad con el estándar SQL y su extensibilidad: tipos de datos avanzados (JSON/JSONB nativo, arrays, rangos, tipos geométricos con la extensión <strong>PostGIS</strong> para datos geoespaciales), índices especializados (GiST, GIN, BRIN, hash) y funciones definidas por el usuario en múltiples lenguajes (PL/pgSQL, PL/Python, PL/Perl). Implementa <strong>MVCC</strong> (Multi-Version Concurrency Control) de forma nativa para todas las tablas, garantizando alta concurrencia sin bloqueos de lectura, con el proceso <strong>VACUUM</strong> (manual <code>VACUUM ANALYZE</code> o autovacuum) encargado de recuperar espacio de tuplas obsoletas generadas por MVCC. Soporta replicación física en streaming (WAL, Write-Ahead Log) y lógica (publicación/suscripción desde la versión 10), particionado declarativo de tablas y extensiones como <code>pg_stat_statements</code> para análisis de rendimiento. Herramientas: <code>psql</code> (cliente CLI), pgAdmin (interfaz gráfica). Es la opción preferida cuando se requiere integridad de datos rigurosa, consultas complejas o cargas mixtas OLTP/analíticas.</p>\n<p><strong>SQL Server</strong> (Microsoft) es un SGBD comercial (con edición gratuita Express, limitada a 10GB por base y 1 CPU/1GB RAM) fuertemente integrado con el ecosistema Windows y .NET, aunque desde 2017 disponible también en Linux y contenedores Docker. Utiliza el dialecto <strong>Transact-SQL (T-SQL)</strong>, con extensiones procedurales (cursores, <code>TRY...CATCH</code>, variables de tabla). La administración se centraliza en <strong>SQL Server Management Studio</strong> (SSMS), y el motor de base de datos relacional coexiste con <strong>SSIS</strong> (Integration Services, ETL), <strong>SSRS</strong> (Reporting Services) y <strong>SSAS</strong> (Analysis Services, OLAP/tabular) en la misma suite. Ofrece Always On Availability Groups (alta disponibilidad y recuperación ante desastres con réplicas síncronas/asíncronas), Failover Cluster Instances, particionado de tablas, columnstore indexes para cargas analíticas y <strong>Transparent Data Encryption</strong> para cifrado en reposo. La autenticación admite modo Windows (integrado con AD, recomendado) o modo mixto (login SQL adicional con usuario/contraseña). El motor de almacenamiento organiza los datos en ficheros <code>.mdf</code> (primario), <code>.ndf</code> (secundarios) y <code>.ldf</code> (log de transacciones), con el modelo de recuperación (Simple, Full, Bulk-logged) determinando la política de truncado del log.</p>\n<p>En síntesis: MySQL prioriza simplicidad y rendimiento web; PostgreSQL, robustez, extensibilidad y cumplimiento del estándar SQL; SQL Server, integración empresarial con el stack Microsoft y herramientas de BI integradas.</p>\n"}, {"num": 9, "title": "Centros de proceso de datos: Arquitectura física y lógica de un CPD. Estructura y funciones de cada tipo de sala.", "html": "<p>Un <strong>Centro de Proceso de Datos (CPD)</strong> o Data Center es la infraestructura física destinada a alojar sistemas de información críticos (servidores, almacenamiento, red) garantizando disponibilidad, seguridad física y continuidad operativa. Su diseño se rige por normas de referencia como <strong>TIA-942</strong> (que define niveles Tier I a IV según redundancia) y el estándar <strong>Uptime Institute</strong> (Tier I: sin redundancia, disponibilidad ~99.67%; Tier II: componentes redundantes N+1; Tier III: mantenimiento concurrente sin interrupción de servicio, doble ruta de alimentación aunque activa-pasiva; Tier IV: tolerancia a fallos con doble ruta activa-activa, disponibilidad ~99.995%).</p>\n<p><strong>Arquitectura física</strong>: se estructura habitualmente en zonas concéntricas de seguridad creciente. El <strong>perímetro</strong> incluye control de accesos físico (torniquetes, tarjetas RFID, biometría), CCTV y vallado. La <strong>sala blanca</strong> (white space) alberga los racks de equipamiento sobre suelo técnico (falso suelo elevado, típicamente 60-90 cm) que permite el paso de cableado y climatización por debajo; el <strong>suelo técnico</strong> organiza pasillos fríos y calientes (cold aisle/hot aisle containment) para optimizar el flujo de aire: los racks se orientan enfrentando sus tomas de aire frío en un pasillo y expulsando aire caliente al opuesto, evitando recirculación.</p>\n<p><strong>Climatización</strong>: sistemas CRAC (Computer Room Air Conditioner) o CRAH (Computer Room Air Handler, con agua fría desde una planta enfriadora/chiller externa) mantienen temperatura (rango recomendado ASHRAE 18-27°C) y humedad relativa controlada (40-60%) para evitar condensación y electricidad estática. La refrigeración puede complementarse con free cooling (aprovechamiento de aire exterior frío) para eficiencia energética, medida mediante el indicador <strong>PUE</strong> (Power Usage Effectiveness = energía total del CPD / energía consumida por TI; un PUE cercano a 1 indica alta eficiencia).</p>\n<p><strong>Alimentación eléctrica</strong>: doble acometida desde la red eléctrica, sistemas SAI/UPS (Sistema de Alimentación Ininterrumpida) que garantizan continuidad ante microcortes y tiempo de transición hasta el arranque de grupos electrógenos diésel, cuadros de distribución (PDU, Power Distribution Unit) en cada rack con doble alimentación (A/B) para equipos con fuentes redundantes.</p>\n<p><strong>Estructura y funciones de cada tipo de sala</strong>:</p>\n<ul>\n<li><strong>Sala de servidores/CPD propiamente dicho</strong>: aloja racks de servidores, cabinas de almacenamiento (SAN/NAS) y equipos de virtualización, con control ambiental estricto.</li>\n<li><strong>Sala de comunicaciones/MDF-IDF</strong>: concentra el cableado troncal (backbone) y los racks de electrónica de red (switches core, routers, firewalls perimetrales), punto de entrada de las acometidas de operadores de telecomunicaciones.</li>\n<li><strong>Sala de operaciones/NOC (Network Operations Center)</strong>: puesto de monitorización 24x7 con paneles de control, sistemas de gestión de eventos (SIEM, herramientas de monitorización tipo Zabbix/Nagios/PRTG) y personal de guardia.</li>\n<li><strong>Sala eléctrica y de UPS</strong>: aloja baterías, cuadros eléctricos y transformadores, físicamente separada de la sala blanca por motivos de seguridad (riesgo de incendio, gases).</li>\n<li><strong>Sala de extinción de incendios</strong>: sistemas de detección temprana por aspiración (VESDA) y extinción por gas inerte (FM-200, Novec 1230, o mezclas de nitrógeno/argón como Inergen) que no dañan el equipamiento electrónico, en sustitución de sprinklers de agua.</li>\n<li><strong>Zona de carga y descarga/almacén</strong>: recepción de equipamiento nuevo, separada del área de producción para control de acceso y seguridad.</li>\n</ul>\n<p>La seguridad lógica se complementa con segmentación de red (DMZ, VLAN de gestión out-of-band) y la seguridad física con esclusas (mantrap) entre zonas de distinto nivel de criticidad.</p>\n"}, {"num": 10, "title": "Virtualización de servidores y almacenamiento en datacenters: Conceptos generales de virtualización de servidores. Servicios de almacenamiento NAS y SAN. Niveles RAID.", "html": "<p><strong>Virtualización de servidores</strong>: técnica que permite ejecutar múltiples máquinas virtuales (VM) aisladas sobre un mismo servidor físico, mediante un <strong>hipervisor</strong>. Se distinguen dos tipos: Tipo 1 o bare-metal (se ejecuta directamente sobre el hardware, ej. VMware ESXi/vSphere, Microsoft Hyper-V, KVM sobre Linux, Citrix XenServer), de mayor rendimiento y uso predominante en producción; y Tipo 2 (se ejecuta sobre un sistema operativo anfitrión, ej. VMware Workstation, VirtualBox), orientado a entornos de desarrollo/pruebas. Cada VM dispone de hardware virtual (vCPU, vRAM, discos virtuales .vmdk/.vhdx, NICs virtuales) aislado mediante técnicas de traducción binaria, paravirtualización o asistencia hardware (Intel VT-x, AMD-V). Las ventajas incluyen consolidación de servidores (mejor ratio de uso de CPU/memoria), migración en caliente entre hosts físicos sin interrupción de servicio (vMotion en VMware, Live Migration en Hyper-V), snapshots para rollback rápido, y alta disponibilidad mediante clústeres de hosts (VMware HA/DRS redistribuye VMs automáticamente ante fallo de un nodo o desequilibrio de carga). La virtualización de red (NSX, switches virtuales distribuidos) y de almacenamiento (vSAN, Storage Spaces Direct) completa la infraestructura hiperconvergente (HCI).</p>\n<p><strong>Almacenamiento NAS</strong> (Network Attached Storage): dispositivo de almacenamiento conectado a la red LAN que expone ficheros mediante protocolos de nivel de archivo, <strong>NFS</strong> (Network File System, propio de entornos Unix/Linux) y <strong>SMB/CIFS</strong> (Server Message Block, entornos Windows). El acceso se realiza vía IP estándar (E
