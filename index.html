<meta charset="utf-8">
<title>Legajo TAI·CARM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  /* ============ TOKENS ============ */
  :root{
    --paper:#eeece1;
    --surface:#fbfaf5;
    --surface-2:#e3e0d0;
    --ink:#1d2837;
    --ink-soft:#525d6e;
    --ink-faint:#7c8494;
    --border:#d5d0bd;
    --border-strong:#c2bca5;
    --accent:#9c3527;
    --accent-ink:#fbf7ee;
    --accent-soft:#e9d9d1;
    --gold:#8a6a1d;
    --gold-soft:#e9dfc3;
    --good:#3f6b3f;
    --shadow:0 1px 2px rgba(29,40,55,.06), 0 8px 24px -12px rgba(29,40,55,.18);

    /* code / skylighting */
    --code-bg:#28313f;
    --code-ink:#dfe4ec;
    --code-kw:#e0a15c;   /* keyword */
    --code-dt:#d98c8c;   /* datatype */
    --code-st:#9fc492;   /* string */
    --code-co:#7c8fa6;   /* comment */
    --code-fu:#8ab4d8;   /* function */
    --code-dv:#c9a8e0;   /* number */
    --code-op:#dfe4ec;   /* operator */

    --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
    --sans:"Public Sans", -apple-system, "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#151a22;
      --surface:#1c2129;
      --surface-2:#262c36;
      --ink:#e9e6db;
      --ink-soft:#a8adb8;
      --ink-faint:#767c88;
      --border:#333a46;
      --border-strong:#434b59;
      --accent:#e08a76;
      --accent-ink:#1a1512;
      --accent-soft:#3a2620;
      --gold:#d9bd6f;
      --gold-soft:#39331d;
      --good:#7fae7f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --code-bg:#11151b;
      --code-ink:#dfe4ec;
    }
  }
  :root[data-theme="dark"]{
    --paper:#151a22;
    --surface:#1c2129;
    --surface-2:#262c36;
    --ink:#e9e6db;
    --ink-soft:#a8adb8;
    --ink-faint:#767c88;
    --border:#333a46;
    --border-strong:#434b59;
    --accent:#e08a76;
    --accent-ink:#1a1512;
    --accent-soft:#3a2620;
    --gold:#d9bd6f;
    --gold-soft:#39331d;
    --good:#7fae7f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --code-bg:#11151b;
    --code-ink:#dfe4ec;
  }

  /* ============ RESET / BASE ============ */
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--serif);text-wrap:balance;margin:0;}
  a{color:var(--accent);}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  .app{
    display:grid;
    grid-template-columns:320px 1fr;
    height:100vh;
    height:100dvh;
  }

  /* ============ SIDEBAR ============ */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .sb-head{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .sb-brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:2px;
  }
  .sb-brand .mark{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--gold);
    background:var(--gold-soft);
    padding:2px 6px;
    border-radius:3px;
    font-weight:600;
  }
  .sb-brand h1{
    font-size:20px;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .sb-sub{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:2px;
    font-family:var(--mono);
    letter-spacing:.02em;
  }

  .progress-overall{margin-top:14px;}
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-family:var(--mono);
  }
  .progress-row strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
  .bar{
    height:6px;
    background:var(--surface-2);
    border-radius:99px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .bar > i{
    display:block;
    height:100%;
    background:var(--accent);
    border-radius:99px;
    transition:width .35s ease;
  }
  @media (prefers-reduced-motion:reduce){ .bar > i{transition:none;} }

  .sb-search{
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .sb-search input{
    width:100%;
    padding:8px 10px 8px 30px;
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:7px;
    color:var(--ink);
    font-size:13.5px;
    font-family:var(--sans);
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23767c88" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>');
    background-repeat:no-repeat;
    background-position:9px center;
  }
  .sb-search input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .sb-search .hint{font-size:10.5px;color:var(--ink-faint);margin-top:6px;font-family:var(--mono);}
  kbd{
    background:var(--surface-2);
    border:1px solid var(--border-strong);
    border-bottom-width:2px;
    border-radius:4px;
    padding:0px 4px;
    font-family:var(--mono);
    font-size:10px;
  }

  .sb-tree{
    flex:1 1 auto;
    overflow-y:auto;
    padding:8px 10px 24px;
  }
  .grp{margin-top:10px;}
  .grp-title{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .grp-title .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-soft);}

  .blk{margin-bottom:2px;}
  .blk-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 8px;
    background:none;
    border:none;
    text-align:left;
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    border-radius:6px;
    cursor:pointer;
  }
  .blk-btn:hover{background:var(--surface-2);}
  .blk-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .blk-btn .chev{
    width:13px;height:13px;flex:0 0 auto;
    color:var(--ink-faint);
    transition:transform .15s ease;
  }
  .blk.open .blk-btn .chev{transform:rotate(90deg);}
  .blk-btn .lbl{flex:1;line-height:1.3;}
  .blk-btn .cnt{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .blk-bar{height:3px;background:var(--surface-2);border-radius:99px;margin:2px 8px 6px;overflow:hidden;}
  .blk-bar>i{display:block;height:100%;background:var(--gold);}

  .blk-list{list-style:none;margin:0;padding:0 0 6px;display:none;}
  .blk.open .blk-list{display:block;}
  .tema-row{display:flex;}
  .tema-btn{
    flex:1;
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:6px 8px 6px 30px;
    background:none;
    border:none;
    text-align:left;
    color:var(--ink-soft);
    font-size:12.7px;
    line-height:1.35;
    border-radius:6px;
    cursor:pointer;
  }
  .tema-btn:hover{background:var(--surface-2);color:var(--ink);}
  .tema-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .tema-btn.active{background:var(--accent-soft);color:var(--ink);}
  .tema-btn .num{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-faint);
    flex:0 0 auto;
    padding-top:1px;
    min-width:16px;
  }
  .tema-btn.active .num{color:var(--accent);font-weight:600;}
  .tema-btn.done{color:var(--ink-faint);}
  .tema-btn.done .ttl{text-decoration:line-through;text-decoration-color:var(--border-strong);text-decoration-thickness:1px;}
  .check{
    flex:0 0 auto;
    width:15px;height:15px;
    border-radius:4px;
    border:1.5px solid var(--border-strong);
    background:var(--surface);
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .check:hover{border-color:var(--accent);}
  .check.on{background:var(--good);border-color:var(--good);}
  .check.on::after{content:"";width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0,-1px);}
  .check:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .tema-row.hidden, .blk.filtered-out{display:none;}

  .sb-foot{
    flex:0 0 auto;
    padding:10px 16px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .theme-btn{
    background:none;border:1px solid var(--border);border-radius:7px;
    color:var(--ink-soft);
    padding:6px 10px;
    font-size:12px;
    display:flex;gap:6px;align-items:center;
    cursor:pointer;
  }
  .theme-btn:hover{background:var(--surface-2);color:var(--ink);}
  .reset-btn{
    background:none;border:none;color:var(--ink-faint);
    font-size:11px;font-family:var(--mono);
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;
  }
  .reset-btn:hover{color:var(--accent);}

  /* ============ MAIN ============ */
  .main{
    min-width:0;
    overflow-y:auto;
    position:relative;
  }
  .topbar{
    display:none;
    position:sticky;top:0;z-index:5;
    background:var(--paper);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    align-items:center;
    gap:12px;
  }
  .menu-btn{
    background:var(--surface);border:1px solid var(--border);border-radius:7px;
    width:34px;height:34px;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .topbar .tt{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}

  .reader{
    max-width:760px;
    margin:0 auto;
    padding:56px 40px 120px;
  }
  .crumb{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.05em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .crumb .sep{margin:0 6px;color:var(--border-strong);}
  .tema-head{
    display:flex;
    gap:16px;
    align-items:flex-start;
    padding-bottom:22px;
    margin-bottom:28px;
    border-bottom:2px solid var(--border);
  }
  .tema-head .num{
    font-family:var(--serif);
    font-size:44px;
    font-weight:600;
    color:var(--gold);
    line-height:1;
    flex:0 0 auto;
  }
  .tema-head h2{
    font-size:26px;
    font-weight:600;
    line-height:1.28;
    color:var(--ink);
    flex:1;
  }
  .mark-btn{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    padding:8px 14px;
    border-radius:8px;
    border:1.5px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
    white-space:nowrap;
  }
  .mark-btn:hover{border-color:var(--good);}
  .mark-btn.on{background:var(--good);border-color:var(--good);color:#f3f8f2;}
  .mark-btn .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:0 0 auto;}
  .mark-btn.on .dot{background:currentColor;}

  .prose{font-size:15.8px;}
  .prose p{margin:0 0 16px;color:var(--ink);}
  .prose strong{color:var(--ink);font-weight:600;}
  .prose strong:first-child, .prose p > strong:first-child{color:var(--accent);}
  .prose h3{font-size:15px;margin:26px 0 4px;color:var(--ink-faint);font-family:var(--sans);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .prose ul,.prose ol{margin:0 0 16px;padding-left:22px;}
  .prose li{margin-bottom:6px;}
  .prose blockquote{
    margin:0 0 16px;
    padding:2px 16px;
    border-left:3px solid var(--gold);
    color:var(--ink-soft);
    font-size:14.5px;
    background:var(--gold-soft);
    border-radius:0 6px 6px 0;
  }
  .prose blockquote p{margin:8px 0;color:var(--ink-soft);}
  .prose code{
    font-family:var(--mono);
    font-size:.86em;
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:1px 5px;
    border-radius:4px;
    color:var(--accent);
  }
  .prose .tbl-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--border);border-radius:8px;}
  .prose table{border-collapse:collapse;width:100%;font-size:13.6px;}
  .prose th,.prose td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;}
  .prose th{background:var(--surface-2);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  .prose tr:last-child td{border-bottom:none;}

  .prose .code-block{margin:0 0 20px;border-radius:9px;overflow:hidden;border:1px solid var(--border-strong);box-shadow:var(--shadow);}
  .prose .code-block pre{margin:0;overflow-x:auto;background:var(--code-bg);padding:14px 16px;}
  .prose .code-block code{
    font-family:var(--mono);
    font-size:12.6px;
    line-height:1.6;
    color:var(--code-ink);
    background:none;border:none;padding:0;
  }
  .sourceCode .kw{color:var(--code-kw);}
  .sourceCode .dt{color:var(--code-dt);}
  .sourceCode .st{color:var(--code-st);}
  .sourceCode .co{color:var(--code-co);font-style:italic;}
  .sourceCode .fu{color:var(--code-fu);}
  .sourceCode .dv,.sourceCode .bn,.sourceCode .fl{color:var(--code-dv);}
  .sourceCode .op{color:var(--code-op);}
  .sourceCode .cf{color:var(--code-kw);font-weight:600;}
  .sourceCode .va,.sourceCode .cn,.sourceCode .ot{color:var(--code-fu);}

  .nav-foot{
    display:flex;
    gap:14px;
    margin-top:40px;
    padding-top:24px;
    border-top:1px solid var(--border);
  }
  .nav-card{
    flex:1;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    cursor:pointer;
    text-align:left;
    color:var(--ink);
  }
  .nav-card:hover{border-color:var(--accent);}
  .nav-card:focus-visible{outline:2px solid var(--accent);}
  .nav-card.next{text-align:right;}
  .nav-card .lbl{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .nav-card .ttl{font-family:var(--serif);font-size:14.5px;margin-top:3px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .nav-card[disabled]{opacity:.35;cursor:default;}

  .empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:70vh;text-align:center;color:var(--ink-faint);gap:10px;padding:0 30px;
  }
  .empty .big{font-family:var(--serif);font-size:22px;color:var(--ink-soft);}

  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid var(--paper);}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .topbar{display:flex;}
    .sidebar{
      position:fixed;inset:0 25% 0 0;z-index:20;
      transform:translateX(-104%);
      transition:transform .22s ease;
      box-shadow:var(--shadow);
    }
    @media (prefers-reduced-motion:reduce){ .sidebar{transition:none;} }
    body.sb-open .sidebar{transform:translateX(0);}
    body.sb-open::after{
      content:"";position:fixed;inset:0;left:75%;background:rgba(0,0,0,.35);z-index:19;
    }
    .reader{padding:32px 20px 90px;}
    .tema-head .num{font-size:32px;}
    .tema-head h2{font-size:21px;}
  }
</style>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-brand"><span class="mark">EXP. 2026</span></div>
      <h1>Legajo TAI·CARM</h1>
      <div class="sb-sub">74 temas · Estado + Región de Murcia</div>
      <div class="progress-overall">
        <div class="progress-row"><span>Progreso total</span><strong id="ov-pct">0%</strong></div>
        <div class="bar"><i id="ov-bar" style="width:0%"></i></div>
      </div>
    </div>
    <div class="sb-search">
      <input id="search" type="text" placeholder="Buscar tema…" autocomplete="off">
      <div class="hint"><kbd>/</kbd> buscar · <kbd>←</kbd><kbd>→</kbd> navegar</div>
    </div>
    <nav class="sb-tree" id="tree"></nav>
    <div class="sb-foot">
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Cambiar tema visual">
        <span id="theme-icon">◐</span><span id="theme-label">Automático</span>
      </button>
      <button class="reset-btn" id="reset-btn" type="button">Reiniciar progreso</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Abrir índice">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="tt" id="topbar-title">Legajo TAI·CARM</span>
    </div>
    <div id="content"></div>

<script id="tema-data" type="application/json">{"TAI": [{"key": "b1", "title": "Bloque I — Organización del Estado y Administración electrónica", "temas": [{"num": 1, "title": "La Constitución Española de 1978. Derechos y deberes fundamentales. Su garantía y suspensión. La Corona: funciones constitucionales del Rey.", "html": "<h3 id=\"elaboración-y-estructura\">Elaboración y estructura</h3>\n<p>La Constitución Española (CE) fue aprobada por las Cortes el 31 de octubre de 1978, ratificada en referéndum el 6 de diciembre de 1978 y sancionada por el Rey el 27 de diciembre de 1978, entrando en vigor el 29 de diciembre de 1978 (día de su publicación en el BOE). Consta de un Preámbulo, un Título Preliminar (arts. 1-9), diez Títulos (I a X), cuatro disposiciones adicionales, nueve transitorias, una derogatoria y una final, con 169 artículos.</p>\n<table>\n<thead>\n<tr>\n<th>Parte</th>\n<th>Artículos</th>\n<th>Contenido</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Título Preliminar</td>\n<td>1-9</td>\n<td>Valores, soberanía, unidad, lengua, capital, principios del ordenamiento</td>\n</tr>\n<tr>\n<td>Título I</td>\n<td>10-55</td>\n<td>Derechos y deberes fundamentales</td>\n</tr>\n<tr>\n<td>Título II</td>\n<td>56-65</td>\n<td>La Corona</td>\n</tr>\n<tr>\n<td>Título III</td>\n<td>66-96</td>\n<td>Las Cortes Generales</td>\n</tr>\n<tr>\n<td>Título IV</td>\n<td>97-107</td>\n<td>Gobierno y Administración</td>\n</tr>\n<tr>\n<td>Título V</td>\n<td>108-116</td>\n<td>Relaciones entre el Gobierno y las Cortes</td>\n</tr>\n<tr>\n<td>Título VI</td>\n<td>117-127</td>\n<td>Poder Judicial</td>\n</tr>\n<tr>\n<td>Título VII</td>\n<td>128-136</td>\n<td>Economía y Hacienda</td>\n</tr>\n<tr>\n<td>Título VIII</td>\n<td>137-158</td>\n<td>Organización territorial del Estado</td>\n</tr>\n<tr>\n<td>Título IX</td>\n<td>159-165</td>\n<td>Tribunal Constitucional</td>\n</tr>\n<tr>\n<td>Título X</td>\n<td>166-169</td>\n<td>Reforma constitucional</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Título Preliminar.</strong> El art. 1.1 define a España como un Estado social y democrático de Derecho, que propugna como valores superiores de su ordenamiento la libertad, la justicia, la igualdad y el pluralismo político. La soberanía nacional reside en el pueblo español (art. 1.2) y la forma política del Estado es la Monarquía parlamentaria (art. 1.3). El art. 2 proclama la unidad indisoluble de la Nación española y reconoce el derecho a la autonomía de las nacionalidades y regiones. El art. 3 establece el castellano como lengua oficial del Estado y las demás lenguas españolas como cooficiales en sus respectivas CCAA. El art. 4 fija la bandera y el art. 5 la capitalidad en Madrid. El art. 9.3 garantiza los principios de legalidad, jerarquía normativa, publicidad de las normas, irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad de los poderes públicos.</p>\n<h3 id=\"derechos-y-deberes-fundamentales-título-i\">Derechos y deberes fundamentales (Título I)</h3>\n<p>El Título I, \"De los derechos y deberes fundamentales\", se estructura en cinco capítulos: Capítulo I (españoles y extranjeros, arts. 11-13), Capítulo II (derechos y libertades, arts. 14-38) con dos secciones — Sección 1ª \"De los derechos fundamentales y de las libertades públicas\" (arts. 15-29) y Sección 2ª \"De los derechos y deberes de los ciudadanos\" (arts. 30-38) —, Capítulo III (principios rectores de la política social y económica, arts. 39-52) y Capítulo IV (garantías de las libertades y derechos fundamentales, arts. 53-54).</p>\n<p><strong>Sección 1ª (arts. 15-29):</strong> derecho a la vida e integridad física y moral, con abolición de la pena de muerte (art. 15); libertad ideológica y religiosa, con aconfesionalidad del Estado (art. 16); libertad y seguridad, con detención preventiva máxima de 72 horas y derecho al habeas corpus (art. 17); honor, intimidad y propia imagen, con inviolabilidad del domicilio y secreto de las comunicaciones (art. 18); libertad de residencia y circulación (art. 19); libertad de expresión e información, con prohibición de censura previa (art. 20); reunión pacífica y sin armas, sin necesidad de autorización previa (art. 21); asociación (art. 22); participación política, acceso a cargos públicos y sufragio (art. 23); tutela judicial efectiva, juez ordinario predeterminado por la ley y presunción de inocencia (art. 24); legalidad penal (art. 25); educación y libertad de enseñanza (art. 27); sindicación y huelga (art. 28); petición individual y colectiva (art. 29). El art. 14, que abre el Capítulo II, reconoce la igualdad ante la ley sin discriminación por nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.</p>\n<p><strong>Sección 2ª (arts. 30-38):</strong> deber de defender a España (art. 30); contribución al sostenimiento de los gastos públicos (art. 31); matrimonio (art. 32); propiedad privada y herencia (art. 33); fundación (art. 34); trabajo y deber de trabajar (art. 35); colegios profesionales (art. 36); negociación colectiva y medidas de conflicto colectivo (art. 37); libertad de empresa (art. 38).</p>\n<p><strong>Garantías.</strong> El art. 53.1 CE vincula a todos los poderes públicos los derechos del Capítulo II, cuyo ejercicio se regula por ley que respete su contenido esencial, y solo puede desarrollarse mediante ley orgánica en el caso de los derechos de la Sección 1ª (arts. 15-29) y de la objeción de conciencia. El art. 53.2 habilita el recurso preferente y sumario ante los tribunales ordinarios y, en su caso, el recurso de amparo ante el Tribunal Constitucional para los derechos de los arts. 14 a 30 (incluida la igualdad del art. 14). Los principios rectores del Capítulo III (art. 53.3) informan la legislación positiva, la práctica judicial y la actuación de los poderes públicos, pero solo son alegables ante la jurisdicción ordinaria conforme a lo que dispongan las leyes que los desarrollen. El art. 54 regula el Defensor del Pueblo.</p>\n<p><strong>Suspensión de derechos.</strong> El art. 55.1 CE permite suspender los derechos de los arts. 17 (libertad y seguridad), 18.2 y 18.3 (inviolabilidad del domicilio y secreto de las comunicaciones), 19 (residencia y circulación), 21 (reunión), 28.2 (huelga) y 37.2 (medidas de conflicto colectivo) cuando se declaren los estados de excepción o de sitio (LO 4/1981) — el estado de alarma no permite suspender derechos, solo limitarlos. El art. 55.2 permite la suspensión individual de los derechos de los arts. 17.2 (plazo de detención), 18.2 y 18.3 en relación con investigaciones de bandas armadas o terroristas, con intervención judicial y control parlamentario, sin que ello suponga suspensión genérica de las garantías judiciales del art. 17.3.</p>\n<h3 id=\"la-corona-título-ii-arts-56-65\">La Corona (Título II, arts. 56-65)</h3>\n<p>El Rey es Jefe del Estado, símbolo de su unidad y permanencia, arbitra y modera el funcionamiento regular de las instituciones y asume la más alta representación del Estado en las relaciones internacionales (art. 56.1). Su persona es inviolable y no está sujeta a responsabilidad (art. 56.3). La Corona es hereditaria (art. 57) en los sucesores de S.M. Don Juan Carlos I de Borbón, con orden regular de sucesión: primogenitura y representación, preferencia de la línea anterior sobre las posteriores, del grado más próximo sobre el más remoto, del varón sobre la mujer en el mismo grado y de la persona de más edad sobre la de menos (preferencia del varón vigente hasta la reforma pendiente). En defecto de llamados, las Cortes proveen a la sucesión de la forma que más convenga a los intereses de España. La Reina consorte o el consorte de la Reina no pueden asumir funciones constitucionales, salvo lo dispuesto para la Regencia (art. 58). La Regencia (arts. 59-60) corresponde al Rey o Reina consorte si el Rey fuere menor de edad, y se ejerce por mandato constitucional; la tutela del Rey menor se regula en el art. 60. La sucesión y la Regencia se rigen por los principios de la Constitución.</p>\n<p><strong>Refrendo (art. 64).</strong> Los actos del Rey están refrendados por el Presidente del Gobierno, salvo la propuesta de nombramiento del candidato a Presidente del Gobierno y el nombramiento de los demás miembros del Gobierno (refrendo del Presidente del Gobierno), y los actos referidos a las Cortes (refrendo de los Presidentes de las Cámaras). Sin refrendo, los actos del Rey carecen de validez. Quedan fuera del refrendo los actos del art. 65 (nombramiento y relevo de los miembros civiles y militares de la Casa Real y distribución libre de la asignación presupuestaria para el sostenimiento de la Familia y Casa Real).</p>\n<p><strong>Funciones del Rey (art. 62):</strong> sancionar y promulgar las leyes; convocar y disolver las Cortes Generales y convocar elecciones; convocar referéndum en los casos previstos en la Constitución; proponer el candidato a Presidente del Gobierno y, en su caso, nombrarlo y poner fin a sus funciones; nombrar y separar a los miembros del Gobierno a propuesta de su Presidente; expedir los decretos acordados en Consejo de Ministros; conferir los empleos civiles y militares y conceder honores y distinciones; ser informado de los asuntos de Estado y presidir las sesiones del Consejo de Ministros cuando lo estime oportuno, a petición del Presidente del Gobierno; el mando supremo de las Fuerzas Armadas; ejercer el derecho de gracia con arreglo a la ley, que no podrá autorizar indultos generales; el Alto Patronazgo de las Reales Academias. El art. 63: acredita a los embajadores y representantes diplomáticos; manifiesta el consentimiento del Estado para obligarse internacionalmente por medio de tratados; declara la guerra y hace la paz, previa autorización de las Cortes.</p>\n<h3 id=\"reforma-constitucional-título-x-arts-166-169\">Reforma constitucional (Título X, arts. 166-169)</h3>\n<p>La iniciativa de reforma corresponde al Gobierno, al Congreso y al Senado y a las Asambleas de las CCAA (art. 166, que remite al art. 87.1 y 87.2). El procedimiento ordinario (art. 167) exige la aprobación por 3/5 de cada Cámara; de no lograrse acuerdo entre ambas se constituye una Comisión Mixta paritaria de Diputados y Senados y, si el Senado no aprueba el texto por 3/5 pero el Congreso lo aprobó por mayoría de 2/3, el Congreso puede aprobar la reforma. Aprobada la reforma, se somete a referéndum para su ratificación cuando lo soliciten, dentro de los 15 días siguientes, una décima parte de los miembros de cualquiera de las Cámaras. El procedimiento agravado (art. 168) se aplica a la revisión total de la Constitución o a la parcial que afecte al Título Preliminar, a la Sección 1ª del Capítulo II del Título I (arts. 15-29) o al Título II (la Corona): aprobación por mayoría de 2/3 de cada Cámara, disolución inmediata de las Cortes, convocatoria de elecciones, ratificación por las nuevas Cámaras (2/3) y referéndum obligatorio. El art. 169 prohíbe iniciar la reforma en tiempo de guerra o durante la vigencia de los estados de alarma, excepción o sitio.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>Fechas</strong>: el referéndum fue el 6 de diciembre (Día de la Constitución), pero la entrada en vigor y la publicación en BOE fueron el 29 de diciembre de 1978. No confundir con la sanción del Rey (27 de diciembre).</li>\n<li><strong>169 artículos</strong> (no 167 ni 165); el Título X (reforma) son los arts. 166-169.</li>\n<li><strong>El estado de alarma no suspende derechos</strong> (arts. 55.1 y 116); solo los estados de excepción y sitio suspenden los derechos enumerados en el art. 55.1.</li>\n<li><strong>Actos del Rey sin refrendo</strong>: los de la Casa Real (art. 65). El examen suele preguntar cuál de los actos NO necesita refrendo.</li>\n<li><strong>Reforma agravada (art. 168)</strong>: doble 2/3 (antes y después de la disolución) + referéndum obligatorio; la ordinaria (art. 167) solo 3/5 con referéndum facultativo (1/10 de una Cámara).</li>\n<li><strong>El indulto general está prohibido</strong> (art. 62.i); el derecho de gracia es del Rey conforme a la ley.</li>\n<li><strong>Preferencia del varón sobre la mujer</strong> en el orden sucesorio: sigue vigente (reforma pendiente), suele caer como trampa.</li>\n<li><strong>El art. 14 no está en la Sección 1ª</strong> (es el primer artículo del Capítulo II, fuera de la sección de derechos fundamentales), aunque sí está protegido por amparo vía art. 53.2.</li>\n</ul>\n"}, {"num": 2, "title": "Las Cortes Generales: atribuciones del Congreso de los Diputados y del Senado. El Tribunal Constitucional: composición y atribuciones. El Defensor del Pueblo.", "html": "<h3 id=\"las-cortes-generales-título-iii-arts-66-96\">Las Cortes Generales (Título III, arts. 66-96)</h3>\n<p>Representan al pueblo español, ejercen la potestad legislativa del Estado, aprueban los Presupuestos Generales del Estado, controlan la acción del Gobierno y tienen las demás competencias del art. 66 CE. Son inviolables (art. 66.3). Están formadas por el Congreso de los Diputados y el Senado (bicameralismo imperfecto o asimétrico). El mandato de ambas Cámaras es de cuatro años, salvo disolución anticipada (arts. 68.4 y 69.6).</p>\n<p><strong>Estatuto de los parlamentarios (art. 71).</strong> Diputados y senadores gozan de inviolabilidad por las opiniones manifestadas en el ejercicio de sus funciones, de inmunidad (solo pueden ser detenidos en caso de flagrante delito; el procesamiento exige la autorización de la Cámara — suplicatorio) y de fuero especial: las causas contra ellos se sustancian ante la Sala de lo Penal del Tribunal Supremo. Reciben una asignación económica fijada por sus respectivas Cámaras.</p>\n<p><strong>Congreso de los Diputados.</strong> Entre 300 y 400 diputados (actualmente 350, LOREG), elegidos por sufragio universal, libre, igual, directo y secreto cada cuatro años, mediante circunscripción provincial y sistema proporcional (regla D'Hondt), con representación mínima inicial por provincia (dos diputados cada una; Ceuta y Melilla, uno cada una) (art. 68 CE). Es la cámara de representación popular y la que sostiene la relación de confianza con el Gobierno: investidura (art. 99), moción de censura (art. 113) y cuestión de confianza (art. 112).</p>\n<p><strong>Senado.</strong> Cámara de representación territorial (art. 69), integrada por senadores elegidos por sufragio universal (4 por cada provincia peninsular; 3 por Gran Canaria, Mallorca y Tenerife; 1 por cada una de las demás islas o agrupaciones; 2 por Ceuta y 2 por Melilla) y senadores designados por las Asambleas legislativas de las CCAA (uno fijo por cada Comunidad Autónoma y otro más por cada millón de habitantes de su territorio).</p>\n<p><strong>Atribuciones diferenciadas.</strong> El Congreso tiene primacía en: investidura del Presidente del Gobierno (art. 99), moción de censura y cuestión de confianza (arts. 113-114), convalidación o derogación de decretos-leyes en 30 días (art. 86.2), autorización del referéndum consultivo (art. 92) y aprobación de los Presupuestos Generales del Estado (art. 134: toda proposición o enmienda que suponga aumento de créditos o disminución de ingresos presupuestarios requiere la conformidad del Gobierno para su tramitación). El Senado interviene en el veto o enmienda de los proyectos de ley (plazo de dos meses, veinte días si el proyecto es declarado urgente; el veto por mayoría absoluta puede ser levantado por el Congreso, por mayoría absoluta o por mayoría simple una vez transcurridos dos meses — art. 90), autoriza las medidas coercitivas del art. 155 (incumplimiento de obligaciones constitucionales o legales por una CCAA, a propuesta del Gobierno y por mayoría absoluta) y participa en el nombramiento de los miembros del TC (4) y de los vocales del CGPJ (10 de sus 20). Ante desacuerdo entre Cámaras se constituye una Comisión Mixta Congreso-Senado (art. 74.2). Las Cámaras se reúnen en dos periodos ordinarios de sesiones al año: septiembre-diciembre y febrero-junio (art. 73.1), y en sesiones extraordinarias a petición del Gobierno, de la Diputación Permanente o de la mayoría absoluta de los miembros de la Cámara (art. 73.2). Las Diputaciones Permanentes (art. 78) velan por los poderes de las Cámaras entre periodos de sesiones y tras su disolución.</p>\n<p><strong>Potestad legislativa y otras funciones.</strong> Las Cortes ejercen la potestad legislativa del Estado (art. 66.2) y aprueban: leyes orgánicas (art. 81: las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que aprueben los Estatutos de Autonomía, el régimen electoral general y las demás previstas en la CE; exigen mayoría absoluta del Congreso en una votación final sobre el conjunto del proyecto) y leyes ordinarias. Autorizan la celebración de tratados internacionales: los que cedan competencias constitucionales (art. 93, mediante ley orgánica), los de carácter político, militar, de participación en organizaciones internacionales o que afecten a derechos y deberes del Título I (art. 94.1, previa autorización de las Cortes) y los demás se comunican a las Cámaras (art. 94.2). Ejercen el control del Gobierno mediante preguntas, interpelaciones, comisiones de investigación (art. 76) y comparecencias.</p>\n<h3 id=\"el-tribunal-constitucional-título-ix-arts-159-165-ce-lo-21979\">El Tribunal Constitucional (Título IX, arts. 159-165 CE, LO 2/1979)</h3>\n<p>Compuesto por 12 miembros nombrados por el Rey: 4 a propuesta del Congreso (por mayoría de 3/5), 4 a propuesta del Senado (por mayoría de 3/5), 2 a propuesta del Gobierno y 2 a propuesta del CGPJ. Mandato de 9 años, con renovación por terceras partes cada 3 años. Deben ser juristas de reconocida competencia con más de 15 años de ejercicio profesional. El Presidente es nombrado por el Rey entre sus miembros, a propuesta del propio Tribunal, por un mandato de 3 años (el Vicepresidente se designa del mismo modo). Es un órgano constitucional independiente, sometido solo a la Constitución y a su Ley Orgánica.</p>\n<p><strong>Atribuciones (art. 161 CE):</strong> recurso de inconstitucionalidad contra leyes y normas con rango de ley (legitimados: Presidente del Gobierno, Defensor del Pueblo, 50 diputados, 50 senadores, órganos colegiados ejecutivos y asambleas de las CCAA; plazo de interposición de 3 meses desde la publicación de la norma); cuestión de inconstitucionalidad planteada por jueces y tribunales; recurso de amparo por vulneración de los derechos y libertades de los arts. 14 a 30 y 53.2 CE (subsidiario: exige agotar la vía judicial previa); conflictos de competencia entre el Estado y las CCAA o entre estas; conflictos entre órganos constitucionales del Estado; control previo de la constitucionalidad de tratados internacionales (art. 95 CE); e impugnación de disposiciones y resoluciones de las CCAA (art. 161.2 CE, con suspensión automática de 5 meses a instancia del Gobierno).</p>\n<p><strong>Sentencias (art. 164 CE).</strong> Se publican en el BOE, tienen plenos efectos frente a todos (erga omnes) desde su publicación y contra ellas no cabe recurso alguno. Las que declaran la inconstitucionalidad de una ley expulsan la norma del ordenamiento jurídico, sin efecto retroactivo general, salvo en materia penal o sancionadora cuando ello sea favorable al reo (art. 40 LOTC).</p>\n<h3 id=\"el-defensor-del-pueblo-art-54-ce-lo-31981\">El Defensor del Pueblo (art. 54 CE, LO 3/1981)</h3>\n<p>Alto comisionado de las Cortes Generales para la defensa de los derechos del Título I, que supervisa la actividad de la Administración, dando cuenta a las Cortes. Elegido por mayoría de 3/5 del Congreso y ratificado por 3/5 del Senado (o, subsidiariamente, por mayoría absoluta), por un mandato de 5 años. Puede iniciar y proseguir de oficio o a instancia de parte cualquier investigación, sin necesidad de mandato imperativo previo. Tiene legitimación para interponer recursos de inconstitucionalidad y de amparo. Cuenta con dos adjuntos (primero y segundo) en los que puede delegar funciones. Presenta un informe anual a las Cortes Generales. Es inviolable e inamovible durante su mandato, salvo cese por: nombramiento para cargo público incompatible, renuncia, incapacidad sobrevenida, actuación con notoria negligencia en el cumplimiento de las obligaciones de su cargo o fallecimiento.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>TC: 12 miembros</strong> (no 9 ni 15), mandato de 9 años, renovación por tercios cada 3 años y Presidente por 3 años. El Defensor del Pueblo: 5 años.</li>\n<li><strong>Inmunidad ≠ inviolabilidad</strong>: la inviolabilidad protege las opiniones (permanente); la inmunidad protege la libertad personal (detención solo en flagrante delito y suplicatorio de la Cámara).</li>\n<li><strong>Veto del Senado</strong>: 2 meses (20 días en procedimiento urgente), se levanta por el Congreso (mayoría absoluta, o simple tras 2 meses).</li>\n<li><strong>Recurso de inconstitucionalidad</strong>: plazo de 3 meses desde la publicación y solo para los legitimados del art. 162.1.a (el ciudadano individual solo puede acudir en amparo). La cuestión la plantea un juez, sin plazo.</li>\n<li><strong>Impugnación del art. 161.2</strong>: suspensión automática de 5 meses que el TC debe ratificar o levantar.</li>\n<li><strong>Presupuestos</strong>: solo los aprueba el Congreso (art. 134); el Senado no tiene competencia en esta materia.</li>\n<li><strong>Leyes orgánicas</strong>: mayoría absoluta del Congreso en votación final sobre el conjunto (art. 81), solo para las materias taxativamente previstas.</li>\n</ul>\n"}, {"num": 3, "title": "El Gobierno: composición, nombramiento y cese. Las funciones del Gobierno. Relaciones entre el Gobierno y las Cortes Generales.", "html": "<h3 id=\"marco-normativo\">Marco normativo</h3>\n<p>El Gobierno se regula en el Título IV CE (arts. 97-107) y en la Ley 50/1997, de 27 de noviembre, del Gobierno.</p>\n<h3 id=\"composición-art-98-ce-arts-1-2-ley-501997\">Composición (art. 98 CE, arts. 1-2 Ley 50/1997)</h3>\n<p>El Gobierno se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, de los Ministros y de los demás miembros que establezca la ley. Se estructura en los siguientes órganos:</p>\n<ul>\n<li><strong>El Presidente</strong>: dirige la acción del Gobierno y coordina las funciones de los demás miembros.</li>\n<li><strong>El Consejo de Ministros</strong>: órgano colegiado superior, formado por el Presidente, los Vicepresidentes y los Ministros.</li>\n<li><strong>Las Comisiones Delegadas del Gobierno</strong>: integradas por varios Ministros, coordinan materias comunes (asuntos económicos, seguridad, etc.).</li>\n<li><strong>La Comisión General de Secretarios de Estado y Subsecretarios</strong>: órgano de preparación y estudio de los asuntos que vayan a tratarse en el Consejo de Ministros.</li>\n<li><strong>El Secretariado del Gobierno</strong>: secretaría técnica del Consejo de Ministros y de las Comisiones Delegadas.</li>\n</ul>\n<p>Los miembros del Gobierno no pueden ejercer otras funciones representativas que las propias del mandato parlamentario, ni actividad profesional o mercantil alguna (art. 98.3 CE, desarrollado por la Ley 3/2015, de 30 de marzo, reguladora del ejercicio del alto cargo de la Administración General del Estado).</p>\n<h3 id=\"nombramiento-y-cese\">Nombramiento y cese</h3>\n<p><strong>Investidura (art. 99 CE).</strong> El candidato a Presidente del Gobierno es propuesto por el Rey, previa consulta con los representantes designados por los grupos políticos con representación parlamentaria, y a través del Presidente del Congreso. El candidato expone su programa ante el Congreso y solicita la confianza: se entiende otorgada por mayoría absoluta en primera votación; si no se obtiene, se somete la misma propuesta a una nueva votación 48 horas después, en la que bastará la mayoría simple. Si transcurridos dos meses desde la primera votación ningún candidato obtiene la confianza, el Rey disuelve las Cortes y convoca nuevas elecciones (art. 99.5).</p>\n<p><strong>Nombramiento de los restantes miembros.</strong> El Presidente del Gobierno nombra y separa a los Vicepresidentes y Ministros, y el Rey los nombra y separa formalmente a propuesta de aquel (art. 100 CE).</p>\n<p><strong>Cese (art. 101 CE).</strong> El Gobierno cesa tras la celebración de elecciones generales, por pérdida de la confianza parlamentaria (aprobación de una moción de censura o denegación de una cuestión de confianza) o por dimisión o fallecimiento de su Presidente. El Gobierno cesante continúa en funciones hasta la toma de posesión del nuevo Gobierno, con funciones limitadas (art. 21 Ley 50/1997): despacho ordinario de los asuntos públicos, sin poder aprobar proyectos de ley (salvo que el Congreso lo autorice o haya urgencia justificada), plantear la cuestión de confianza, proponer la disolución de las Cortes ni remitir los Presupuestos Generales del Estado (salvo que hayan vencido los del ejercicio anterior).</p>\n<h3 id=\"funciones-art-97-ce-y-ley-501997\">Funciones (art. 97 CE y Ley 50/1997)</h3>\n<p>El Gobierno dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado; ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes. El art. 5 de la Ley 50/1997 detalla las funciones del Consejo de Ministros: aprobar los proyectos de ley y el proyecto de Ley de Presupuestos Generales del Estado; aprobar reales decretos-leyes y reales decretos legislativos; acordar la negociación y firma de tratados internacionales y su aplicación provisional; declarar los estados de alarma y excepción y proponer al Congreso la declaración del estado de sitio; disponer la emisión de Deuda Pública; aprobar los planes generales de la actividad económica; crear, modificar y suprimir órganos directivos; nombrar y separar altos cargos; y ejercer la potestad reglamentaria mediante Real Decreto (de acuerdo con la Constitución y las leyes).</p>\n<p><strong>Potestad reglamentaria.</strong> Se ejercita mediante reales decretos del Consejo de Ministros y órdenes ministeriales (art. 23-24 Ley 50/1997). Los reglamentos no pueden tipificar delitos, imponer penas, establecer tributos ni regular materias reservadas a la ley, y quedan sujetos al principio de jerarquía normativa (art. 9.3 CE). El Presidente puede dictar disposiciones administrativas (reales decretos del Presidente).</p>\n<h3 id=\"relaciones-con-las-cortes-generales-título-v-arts-108-116-ce\">Relaciones con las Cortes Generales (Título V, arts. 108-116 CE)</h3>\n<p><strong>Responsabilidad.</strong> El Gobierno responde solidariamente de su gestión política ante el Congreso (art. 108 CE); cada miembro responde de su propia gestión.</p>\n<p><strong>Control parlamentario (arts. 109-111).</strong> Las Cámaras y sus Comisiones pueden recabar la información y ayuda que precisen del Gobierno; los miembros del Gobierno están obligados a comparecer a requerimiento de las Cámaras y a facilitar la información que se les solicite (preguntas, interpelaciones, comisiones de investigación).</p>\n<p><strong>Moción de censura (art. 113).</strong> Debe ser propuesta al menos por 1/10 de los diputados e incluir un candidato alternativo a la Presidencia del Gobierno (moción \"constructiva\"). No puede votarse hasta que transcurran 5 días desde su presentación; dentro de los dos primeros días pueden presentarse mociones alternativas. Se entiende aprobada por mayoría absoluta; si prospera, el candidato incluido se entiende investido de la confianza y el Rey lo nombra Presidente del Gobierno.</p>\n<p><strong>Cuestión de confianza (art. 112).</strong> La plantea el Presidente del Gobierno, previa deliberación del Consejo de Ministros, sobre su programa o una declaración de política general. Se entiende otorgada por mayoría simple. Si es denegada, el Presidente debe dimitir y se inicia el procedimiento de investidura del art. 99 (art. 114).</p>\n<p><strong>Disolución de las Cortes (art. 115).</strong> El Presidente, previa deliberación del Consejo de Ministros y bajo su exclusiva responsabilidad, puede proponer la disolución del Congreso, del Senado o de las Cortes Generales, que decreta el Rey. No procede durante la tramitación de una moción de censura ni antes de que transcurra un año desde la anterior disolución.</p>\n<p><strong>Decretos-leyes (art. 86 CE).</strong> En caso de extraordinaria y urgente necesidad, el Gobierno puede dictar disposiciones legislativas provisionales (reales decretos-leyes) que no pueden afectar al ordenamiento de las instituciones básicas del Estado, a los derechos, deberes y libertades del Título I, al régimen de las Comunidades Autónomas ni al derecho electoral general. Deben ser convalidados o derogados por el Congreso en el plazo de 30 días desde su promulgación, tras debate y votación; en el mismo plazo, las Cortes pueden tramitarlos como proyectos de ley por el procedimiento de urgencia.</p>\n<p><strong>Legislación delegada (arts. 82-85 CE).</strong> Las Cortes pueden delegar en el Gobierno la potestad de dictar normas con rango de ley: mediante ley de bases (para la formación de textos articulados) o mediante ley ordinaria (para refundir varios textos legales en uno solo). No cabe delegación sobre materias propias de ley orgánica, ni puede subdelegarse, ni la delegación puede ser implícita o por tiempo indeterminado: se agota con la publicación de la norma delegada (decreto legislativo), que queda sometida a los límites de la delegación y al control jurisdiccional y, en su caso, a las fórmulas adicionales de control que prevea la ley de delegación (art. 82.6).</p>\n<p><strong>Responsabilidad penal (art. 102 CE).</strong> El Presidente y los demás miembros del Gobierno son penalmente responsables ante la Sala de lo Penal del Tribunal Supremo. Si la acusación fuera por traición o por cualquier delito contra la seguridad del Estado en el ejercicio de sus funciones, solo podrá plantearse por iniciativa de la cuarta parte de los miembros del Congreso y con la aprobación de la mayoría absoluta del mismo.</p>\n<p><strong>Estados de alarma, excepción y sitio (art. 116 CE, LO 4/1981):</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Alarma</th>\n<th>Excepción</th>\n<th>Sitio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Quién declara</td>\n<td>El Gobierno, mediante Real Decreto</td>\n<td>El Gobierno, previa autorización del Congreso</td>\n<td>El Congreso, por mayoría absoluta, a propuesta exclusiva del Gobierno</td>\n</tr>\n<tr>\n<td>Duración</td>\n<td>Máximo 15 días, prorrogable con autorización del Congreso</td>\n<td>30 días, prorrogable por otros 30</td>\n<td>La que fije el Congreso</td>\n</tr>\n<tr>\n<td>Efecto sobre derechos</td>\n<td>Limitación (no suspensión): circulación, requisas, ocupación de centros, abastecimiento</td>\n<td>Suspensión de los derechos de los arts. 17, 18.2 y 18.3, 19, 20.1.a y d, 20.5, 21, 28.2 y 37.2 CE</td>\n<td>Suspensión de los anteriores más las garantías jurídicas del detenido del art. 17.3</td>\n</tr>\n</tbody>\n</table>\n<p>En todos los casos, la declaración delimita el ámbito territorial y temporal, y las medidas adoptadas no pueden alterar el funcionamiento normal de los poderes constitucionales. Durante la vigencia de estos estados no puede interrumpirse la actividad de las Cámaras ni de los demás poderes (art. 116.5).</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>Moción de censura</strong>: \"constructiva\" (debe incluir candidato), la proponen al menos 1/10 de los diputados, no se vota hasta 5 días después y exige mayoría absoluta. La cuestión de confianza la plantea solo el Presidente y se otorga por mayoría simple.</li>\n<li><strong>Decreto-ley</strong>: 30 días para su convalidación por el Congreso; no puede afectar a los derechos del Título I (sí puede regular materias de ley ordinaria). No confundir con el decreto legislativo, que requiere delegación previa de las Cortes (arts. 82-85).</li>\n<li><strong>Gobierno en funciones</strong>: no puede aprobar proyectos de ley (salvo urgencia), plantear cuestión de confianza, proponer la disolución ni remitir los PGE.</li>\n<li><strong>Responsabilidad penal del Gobierno</strong>: ante la Sala de lo Penal del TS; para traición/seguridad del Estado, iniciativa de 1/4 del Congreso + aprobación por mayoría absoluta.</li>\n<li><strong>Estado de alarma</strong>: 15 días, lo declara el Gobierno y no suspende derechos (los limita). El de excepción: 30 días prorrogables otros 30, con autorización previa del Congreso. El de sitio: mayoría absoluta del Congreso a propuesta del Gobierno.</li>\n<li><strong>Investidura</strong>: primera votación mayoría absoluta; segunda votación (a las 48 horas) mayoría simple; dos meses sin confianza → disolución de las Cortes.</li>\n</ul>\n"}, {"num": 4, "title": "TREBEP, transparencia y Agenda 2030", "html": "<h3 id=\"texto-refundido-del-estatuto-básico-del-empleado-público-trebep-rdleg-52015-de-30-de-octubre\">Texto Refundido del Estatuto Básico del Empleado Público (TREBEP, RDLeg 5/2015, de 30 de octubre)</h3>\n<p>Aprueba el texto refundido de la Ley 7/2007, de 12 de abril, del Estatuto Básico del Empleado Público (EBEP). Regula las bases del régimen estatutario de los funcionarios públicos y los principios del personal laboral al servicio de las Administraciones Públicas.</p>\n<p><strong>Clases de personal (arts. 8-13).</strong></p>\n<ul>\n<li><strong>Funcionarios de carrera</strong> (art. 9): en virtud de nombramiento legal, vinculados por una relación estatutaria de carácter permanente; el ejercicio de las funciones que impliquen ejercicio de autoridad corresponde exclusivamente a funcionarios públicos (art. 9.2).</li>\n<li><strong>Funcionarios interinos</strong> (art. 10): por razones expresamente justificadas de necesidad y urgencia, para el desempeño de funciones propias de funcionarios de carrera (plazas vacantes no cubiertas, sustitución transitoria de titulares, ejecución de programas de carácter temporal, exceso o acumulación de tareas); cesan cuando desaparezcan las causas que motivaron su nombramiento. No pueden ocupar puestos que estén reservados a funcionarios de carrera.</li>\n<li><strong>Personal laboral</strong> (art. 11): fijo, por tiempo indefinido o temporal, contratado en régimen de derecho laboral.</li>\n<li><strong>Personal eventual</strong> (art. 12): solo para funciones expresamente calificadas de confianza o asesoramiento especial, no reservadas a funcionarios de carrera; su nombramiento y cese son libres y cesa automáticamente cuando cesa la autoridad a la que presta funciones de confianza.</li>\n<li><strong>Personal directivo profesional</strong> (art. 13): sujeto a la relación laboral especial de alta dirección.</li>\n</ul>\n<p><strong>Derechos (arts. 14-15).</strong> El art. 14 enumera los derechos individuales: inamovilidad en la condición de funcionario, progresión profesional, percepción de las retribuciones, conciliación de la vida personal, familiar y laboral, no discriminación, libertad de expresión, vacaciones, permisos, etc. El art. 15 reconoce los derechos individuales ejercidos colectivamente: libertad sindical, negociación colectiva, huelga, reunión y participación en la determinación de las condiciones de trabajo.</p>\n<p><strong>Retribuciones (arts. 22-31).</strong> Básicas (sueldo, trienios y pagas extraordinarias) y complementarias (destino, específico, productividad y gratificaciones). Están sujetas a reserva de ley y a los límites presupuestarios establecidos.</p>\n<p><strong>Jornada, permisos y vacaciones (arts. 47-51).</strong> Jornada de trabajo, permisos (asuntos particulares, traslado de domicilio, matrimonio, nacimiento, etc.) y vacaciones retribuidas: mínimo 22 días hábiles al año o la parte proporcional correspondiente (art. 50).</p>\n<p><strong>Deberes y Código de Conducta (arts. 52-54).</strong> El art. 52 enumera los deberes de los empleados públicos (respetar la Constitución y el resto del ordenamiento jurídico, actuar con lealtad y buena fe, observar el Código de Conducta, etc.). Los arts. 53 y 54 fijan los principios éticos (objetividad, integridad, neutralidad política y religiosa, respeto a la igualdad entre mujeres y hombres, imparcialidad, etc.) y los principios de conducta (trato esmerado, diligencia, celeridad, honestidad, no aceptación de regalos, etc.). El Código de Conducta es aplicable también al personal laboral y eventual.</p>\n<p><strong>Negociación colectiva y representación (Título IV, arts. 31-45).</strong> Órganos de representación de los funcionarios: Juntas de Personal y Delegados de Personal; órganos de negociación: Mesas de negociación. Se reconoce el derecho de reunión, la participación y la negociación colectiva, con acuerdos y pactos.</p>\n<p><strong>Carrera profesional (arts. 16-20).</strong> La carrera puede ser horizontal (progreso de grado, categoría o escalón sin cambio de puesto) o vertical (ascenso en la estructura de puestos). La promoción interna vertical exige poseer los requisitos para el Grupo o Subgrupo superior, dos años de antigüedad en el inferior y superar el proceso selectivo (art. 18); la horizontal permite progresar entre Subgrupos de un mismo Grupo.</p>\n<p><strong>Formas de provisión de puestos (arts. 78-84).</strong> Concurso (procedimiento normal, valora los méritos mediante baremo) y libre designación (con convocatoria pública, para puestos de especial responsabilidad o confianza). Otras formas: redistribución de efectivos, atribución temporal de funciones, comisión de servicios, movilidad por motivos de salud o rehabilitación, permuta y reingreso al servicio activo. La provisión respeta los principios de igualdad, mérito, capacidad y publicidad.</p>\n<p><strong>Situaciones administrativas (arts. 85-92).</strong> Servicio activo, servicios especiales, servicio en otras Administraciones Públicas, excedencia y suspensión de funciones. La excedencia comprende: voluntaria por interés particular (mínimo 2 meses, máximo 5 años), por agrupación familiar, por cuidado de familiares (máximo 3 años), por razón de violencia de género o de violencia terrorista, y voluntaria incentivada.</p>\n<p><strong>Incompatibilidades.</strong> Se rigen supletoriamente por la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas: régimen general de un solo puesto de trabajo en el sector público, con autorización excepcional de compatibilidad para una segunda actividad pública (docencia, investigación) o privada, siempre que no menoscabe el estricto cumplimiento de los deberes ni comprometa la imparcialidad; las retribuciones de la actividad privada compatibilizada no pueden superar el 15% de las retribuciones públicas (art. 11).</p>\n<p><strong>Régimen disciplinario (arts. 93-98).</strong> Las faltas se clasifican en muy graves (art. 95), graves (art. 96) y leves (art. 97). Entre las muy graves: incumplimiento del deber de respeto a la Constitución y a los Estatutos de Autonomía, toda actuación que suponga discriminación, el acoso laboral, el acoso sexual, el abandono del servicio, la publicación o utilización indebida de secretos oficiales, el incumplimiento de las normas sobre incompatibilidades y la obstaculización del ejercicio de las libertades públicas y de los derechos sindicales. Sanciones (art. 96): separación del servicio, suspensión firme de funciones (máximo 6 años), traslado forzoso con cambio de residencia, demérito y apercibimiento. Prescripción (art. 97): las faltas muy graves prescriben a los 3 años, las graves a los 2 años y las leves a los 6 meses; las sanciones por faltas muy graves a los 3 años, por graves a los 2 años y por leves al año. Procedimiento: expediente contradictorio con instrucción (art. 98).</p>\n<h3 id=\"ley-192013-de-9-de-diciembre-de-transparencia-acceso-a-la-información-pública-y-buen-gobierno\">Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno</h3>\n<p>Se estructura en tres títulos:</p>\n<ul>\n<li><strong>Título I — Publicidad activa</strong>: obligación de publicar información institucional, organizativa y de planificación (estructuras, funciones, normativa), información de relevancia jurídica (normativa vigente, directrices, informes), información económica, presupuestaria y estadística (contratos, convenios, subvenciones, presupuestos, retribuciones de altos cargos, etc.) en las sedes electrónicas o Portales de Transparencia. Sujetos obligados (art. 2): sector público (AGE, CCAA, EELL, organismos, entidades, sociedades, fundaciones), partidos políticos, organizaciones sindicales y empresariales, y entidades privadas que perciban subvenciones públicas o presten servicios públicos en determinados casos.</li>\n<li><strong>Título II — Derecho de acceso a la información pública</strong>: cualquier persona puede solicitar acceso a la información pública (documentos, contenidos o datos en poder de los sujetos obligados, en cualquier formato o soporte) sin necesidad de acreditar interés legítimo. Plazo de resolución: 1 mes, prorrogable otro mes (art. 20); el silencio administrativo tiene efecto negativo (art. 20.4). Límites (art. 14): seguridad nacional, defensa, relaciones exteriores, seguridad pública, prevención, investigación y sanción de ilícitos penales, administrativos o disciplinarios, igualdad de las partes en los procesos, funciones de vigilancia, inspección y control financiero y presupuestario, protección del medio ambiente, intereses económicos y comerciales, secreto profesional y propiedad intelectual e industrial. Protección de datos personales (art. 15): acceso directo para datos meramente identificativos si no se perjudica al interesado, y ponderación cuando se trate de datos especialmente protegidos. Reclamación potestativa ante el Consejo de Transparencia y Buen Gobierno, previa a la vía contencioso-administrativa, que debe resolver en 3 meses (art. 24).</li>\n<li><strong>Título III — Buen gobierno</strong>: principios éticos y de actuación de los altos cargos (interés general, transparencia, responsabilidad, dedicación al servicio público, etc.), infracciones y sanciones en materia de gestión económico-presupuestaria y de gestión de los asuntos públicos.</li>\n</ul>\n<p>Crea el <strong>Consejo de Transparencia y Buen Gobierno</strong> (CTBG), órgano independiente que garantiza el cumplimiento de la ley, resuelve las reclamaciones y promueve la transparencia de la actividad pública.</p>\n<h3 id=\"agenda-2030-y-objetivos-de-desarrollo-sostenible-ods\">Agenda 2030 y Objetivos de Desarrollo Sostenible (ODS)</h3>\n<p>Aprobada por la Asamblea General de la ONU el 25 de septiembre de 2015 (\"Transformar nuestro mundo: la Agenda 2030 para el Desarrollo Sostenible\"), establece 17 Objetivos de Desarrollo Sostenible y 169 metas con horizonte 2030, articuladas en torno a las 5P: Personas, Planeta, Prosperidad, Paz y Alianzas (Partnership). Los ODS sustituyen a los Objetivos de Desarrollo del Milenio (ODM, 2000-2015). Los más relevantes para el sector público: ODS 5 (igualdad de género), ODS 8 (trabajo decente y crecimiento económico), ODS 9 (industria, innovación e infraestructura), ODS 16 (paz, justicia e instituciones sólidas) y ODS 17 (alianzas para lograr los objetivos). En España: Plan de Acción para la Implementación de la Agenda 2030 (2018), Estrategia de Desarrollo Sostenible 2030 (2021), Alto Comisionado para la Agenda 2030 (adscrito a Presidencia del Gobierno) y Consejo de Desarrollo Sostenible (órgano de participación de la sociedad civil). El seguimiento se realiza mediante exámenes nacionales voluntarios ante el Foro Político de Alto Nivel de la ONU.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>TREBEP = RDLeg 5/2015, de 30 de octubre</strong> (texto refundido del EBEP, Ley 7/2007, de 12 de abril). No confundir con la Ley 39/2015 (LPACAP) ni con la Ley 40/2015 (LRJSP).</li>\n<li><strong>Personal eventual</strong>: cesa automáticamente al cesar la autoridad que lo nombró; solo funciones de confianza o asesoramiento especial.</li>\n<li><strong>Promoción interna vertical</strong>: 2 años de antigüedad en el Subgrupo inferior + superar proceso selectivo. La horizontal es progresión dentro del mismo Grupo.</li>\n<li><strong>Incompatibilidades</strong>: prohibición general de dos puestos en el sector público; la autorización de compatibilidad limita las retribuciones de la actividad privada al 15% de las públicas.</li>\n<li><strong>Ley 19/2013</strong>: plazo de resolución de 1 mes + 1 de prórroga; silencio negativo; reclamación ante el CTBG en 3 meses.</li>\n<li><strong>Prescripción disciplinaria</strong>: faltas muy graves 3 años / graves 2 años / leves 6 meses; sanciones 3/2/1 años.</li>\n<li><strong>Agenda 2030</strong>: 17 ODS y 169 metas, aprobada el 25 de septiembre de 2015 (no en 2016).</li>\n</ul>\n"}, {"num": 5, "title": "Políticas de igualdad y contra la violencia de género. Igualdad de trato y no discriminación LGTBI. Discapacidad y dependencia.", "html": "<h3 id=\"igualdad-de-género-lo-32007-de-22-de-marzo\">Igualdad de género: LO 3/2007, de 22 de marzo</h3>\n<p>La LO 3/2007, para la igualdad efectiva de mujeres y hombres, tiene por objeto hacer efectivo el principio de igualdad de trato y no discriminación por razón de sexo (art. 1). Contenido esencial:</p>\n<ul>\n<li><strong>Transversalidad del principio de igualdad</strong> (art. 15): integración del principio en la definición y ejecución de todas las políticas públicas.</li>\n<li><strong>Acción positiva</strong> (art. 11): medidas específicas a favor de las mujeres para corregir situaciones patentes de desigualdad.</li>\n<li><strong>Planes de igualdad en las empresas</strong> (art. 45 y RD 901/2020, de 13 de octubre): obligatorios para las empresas de 50 o más personas trabajadoras, con diagnóstico de situación, registro retributivo y auditoría salarial.</li>\n<li><strong>Presencia equilibrada</strong> de mujeres y hombres en los órganos directivos (art. 75: proporción 40-60%).</li>\n<li><strong>Informe de impacto de género</strong> en las disposiciones normativas (art. 19).</li>\n<li><strong>Unidad de Igualdad</strong> en cada Ministerio y Comisión Interministerial de Igualdad entre Mujeres y Hombres.</li>\n<li><strong>Conciliación</strong>: permisos por nacimiento y cuidado de menor igualados en 16 semanas para cada progenitor (tras las reformas de 2019-2021), ampliación de la suspensión del contrato por cuidado de hijos, etc.</li>\n</ul>\n<h3 id=\"violencia-de-género-lo-12004-de-28-de-diciembre\">Violencia de género: LO 1/2004, de 28 de diciembre</h3>\n<p>La LO 1/2004, de Medidas de Protección Integral contra la Violencia de Género, define la violencia de género (art. 1.3) como la manifestación de la discriminación, la situación de desigualdad y las relaciones de poder de los hombres sobre las mujeres, ejercida sobre estas por parte de quienes sean o hayan sido sus cónyuges o de quienes estén o hayan estado ligados a ellas por relaciones similares de afectividad, aun sin convivencia. Contenido esencial:</p>\n<ul>\n<li><strong>Juzgados de Violencia sobre la Mujer</strong>: órganos especializados con competencias penales y civiles.</li>\n<li><strong>Orden de protección</strong> (art. 62 y ss.): medidas cautelares civiles y penales coordinadas (prohibición de aproximación, alejamiento, suspensión del régimen de visitas, etc.), con solicitud ante el juez o la policía y resolución en 72 horas.</li>\n<li><strong>Derechos de las víctimas</strong>: información y asistencia social integral, asistencia jurídica gratuita inmediata y especializada, derechos laborales (reducción y reordenación de jornada, movilidad geográfica, suspensión del contrato con reserva de puesto, extinción con derecho a desempleo — arts. 21-23) y prestaciones económicas (ayuda del art. 27 cuando se carece de rentas).</li>\n<li><strong>Órganos</strong>: Delegación del Gobierno contra la Violencia de Género (art. 29, en el Ministerio de Igualdad) y Observatorio Estatal de Violencia sobre la Mujer (art. 30).</li>\n</ul>\n<h3 id=\"igualdad-de-trato-y-no-discriminación-ley-152022-de-12-de-julio\">Igualdad de trato y no discriminación: Ley 15/2022, de 12 de julio</h3>\n<p>La Ley 15/2022, integral para la igualdad de trato y la no discriminación, prohíbe la discriminación por razón de nacimiento, origen racial o étnico, sexo, religión, convicción u opinión, edad, discapacidad, orientación o identidad sexual, expresión de género, enfermedad o condición de salud, lengua u otras condiciones (art. 2). Prohíbe la discriminación directa e indirecta, el acoso y las represalias; regula la inversión de la carga de la prueba (corresponde a la parte demandada acreditar la ausencia de discriminación), la nulidad de las disposiciones discriminatorias y el derecho a indemnización. Crea la <strong>Autoridad Independiente para la Igualdad de Trato y la No Discriminación</strong> (art. 40), que tramita quejas y elabora informes.</p>\n<h3 id=\"lgtbi-ley-42023-de-28-de-febrero\">LGTBI: Ley 4/2023, de 28 de febrero</h3>\n<p>La Ley 4/2023, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI (\"Ley Trans\"), reconoce el derecho a la rectificación registral de la mención de sexo mediante la simple manifestación de la persona solicitante, sin necesidad de informes médicos ni psicológicos: los mayores de 16 años pueden solicitarlo por declaración de voluntad; de 14 a 16 años, con la asistencia de sus representantes legales (o defensor judicial en caso de discrepancia); los menores de 14 años, a través de sus representantes legales, con control judicial en su caso. Prohíbe las llamadas \"terapias de conversión\" (art. 60). Establece medidas de no discriminación por orientación sexual, identidad, expresión de género y características sexuales en los ámbitos laboral, educativo, sanitario, deportivo, de la vivienda y de los medios de comunicación, y garantiza el respeto a la intimidad y a la autodeterminación en el ámbito laboral.</p>\n<h3 id=\"discapacidad-rdleg-12013-de-29-de-noviembre\">Discapacidad: RDLeg 1/2013, de 29 de noviembre</h3>\n<p>El RDLeg 1/2013 aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, que desarrolla los principios de la Convención Internacional sobre los Derechos de las Personas con Discapacidad (Nueva York, 13 de diciembre de 2006; ratificada por España en 2007 y en vigor desde mayo de 2008): respeto a la dignidad, no discriminación, participación e inclusión plenas, accesibilidad universal, diseño para todos y vida independiente. Regula el <strong>CERMI</strong> (Comité Español de Representantes de Personas con Discapacidad) como plataforma de representación y diálogo civil. En materia de empleo: cuota de reserva del 2% para empresas de 50 o más personas trabajadoras (art. 42) y del 7% de las plazas en el sector público (art. 59 TREBEP), de las cuales el 2% se reserva para personas con discapacidad intelectual; en los procesos selectivos, adaptación de tiempos y medios. Fórmulas de empleo protegido: centros especiales de empleo (CEE) y enclaves laborales.</p>\n<h3 id=\"dependencia-ley-392006-de-14-de-diciembre\">Dependencia: Ley 39/2006, de 14 de diciembre</h3>\n<p>La Ley 39/2006, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, crea el Sistema para la Autonomía y Atención a la Dependencia (SAAD), de carácter público y universal. Configura tres grados de dependencia (art. 26): Grado I (dependencia moderada), Grado II (dependencia severa) y Grado III (gran dependencia), reconocidos mediante resolución tras la solicitud y valoración con el Baremo de Valoración de la Dependencia (BVD). Para cada persona se elabora un Programa Individual de Atención (PIA) que determina las prestaciones: servicios (prevención, teleasistencia, ayuda a domicilio, centro de día y de noche, atención residencial, atención temprana) y prestaciones económicas (vinculada al servicio, para cuidados en el entorno familiar y de asistencia personal). La financiación corresponde al Estado y a las CCAA, con participación del beneficiario según su capacidad económica.</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>LO 1/2004</strong>: la violencia de género es la ejercida sobre la mujer por quien sea o haya sido su cónyuge o pareja afectiva (aun sin convivencia). No confundir con la violencia doméstica (intrafamiliar, en cualquier dirección).</li>\n<li><strong>Ley 4/2023</strong>: rectificación registral por mera manifestación (mayores de 16 años) sin informes médicos; prohibición expresa de terapias de conversión.</li>\n<li><strong>Ley 15/2022</strong>: inversión de la carga de la prueba y Autoridad Independiente para la Igualdad de Trato y la No Discriminación.</li>\n<li><strong>Reservas de empleo</strong>: 7% en el sector público (2% discapacidad intelectual) y 2% en empresas de 50 o más trabajadores. El examen suele intercambiar el 2% y el 7%.</li>\n<li><strong>Ley 39/2006</strong>: tres grados (I moderada, II severa, III gran dependencia) + BVD + PIA; el sistema se llama SAAD.</li>\n<li><strong>LO 3/2007</strong>: presencia equilibrada = 40-60%; planes de igualdad obligatorios desde 50 personas trabajadoras (RD 901/2020).</li>\n</ul>\n"}, {"num": 6, "title": "La sociedad de la información. Identidad y firma electrónica. El DNI electrónico. La Agenda Digital para España.", "html": "<h3 id=\"la-sociedad-de-la-información-y-la-lssi-ce-ley-342002-de-11-de-julio\">La sociedad de la información y la LSSI-CE (Ley 34/2002, de 11 de julio)</h3>\n<p>La sociedad de la información designa el modelo social basado en las TIC como motor de generación, tratamiento y transmisión de información. En España se regula por la Ley 34/2002, de 11 de julio, de Servicios de la Sociedad de la Información y de Comercio Electrónico (LSSI-CE), transposición de la Directiva 2000/31/CE. Contenido esencial:</p>\n<ul>\n<li><strong>Obligaciones de los prestadores de servicios</strong> (art. 10): información general (nombre o denominación, domicilio, datos de contacto, datos registrales, etc.).</li>\n<li><strong>Comunicaciones comerciales electrónicas (arts. 20-22)</strong>: prohibidas sin consentimiento previo y expreso del destinatario, salvo que exista una relación contractual previa con el oferente (en cuyo caso el oferente debe ofrecer siempre la posibilidad de oponerse — art. 21.2).</li>\n<li><strong>Responsabilidad de los prestadores de servicios de intermediación (arts. 13-17)</strong>: los prestadores de servicios de acceso a la red, copia en caché, alojamiento de datos y enlaces o localización de contenidos no son responsables en determinadas condiciones (no conocer la ilicitud, retirar el contenido, no originar la transmisión, etc.) — régimen de exención de responsabilidad o \"puertos seguros\".</li>\n<li><strong>Régimen sancionador (Título IV)</strong>: infracciones leves, graves y muy graves (incluida la remisión de comunicaciones sin consentimiento o la falta de información).</li>\n<li>La LSSI regula también el uso de dispositivos de almacenamiento y recuperación de datos (art. 22.2): las \"cookies\" requieren consentimiento previo e informado, conforme a las directrices del Comité Europeo de Protección de Datos.</li>\n</ul>\n<h3 id=\"identidad-y-firma-electrónica-reglamento-eidas-y-ley-62020\">Identidad y firma electrónica: Reglamento eIDAS y Ley 6/2020</h3>\n<p>El Reglamento (UE) n.º 910/2014, de 23 de julio (Reglamento eIDAS), aplicable desde el 1 de julio de 2016, establece el marco europeo para la identificación electrónica y los servicios de confianza —firma electrónica, sello electrónico, sellos de tiempo, entrega electrónica certificada y autenticación de sitios web— en el mercado interior, reconociendo eficacia jurídica transfronteriza a los medios de identificación electrónica notificados y a los servicios de confianza cualificados. Fue modificado en 2024 por el Reglamento (UE) 2024/1183 (\"eIDAS 2\"), que incorpora los monederos europeos de identidad digital (EUDI Wallet).</p>\n<p><strong>Niveles de firma electrónica (arts. 3 y 25 eIDAS):</strong></p>\n<ul>\n<li><strong>Simple</strong>: datos en forma electrónica anexos a otros datos o asociados lógicamente con ellos, utilizados como método de firma.</li>\n<li><strong>Avanzada</strong>: vinculada al firmante de manera única, permite su identificación, está creada con medios que el firmante puede utilizar bajo su control exclusivo y está vinculada a los datos firmados de modo que cualquier modificación posterior sea detectable.</li>\n<li><strong>Cualificada</strong>: firma avanzada basada en un certificado electrónico cualificado y creada mediante un dispositivo cualificado de creación de firma; tiene el mismo valor jurídico que la firma manuscrita (art. 25.2 eIDAS).</li>\n</ul>\n<p>En España, la Ley 6/2020, de 11 de noviembre, reguladora de determinados aspectos de los servicios electrónicos de confianza, sustituyó y derogó la Ley 59/2003, de 19 de diciembre, de firma electrónica. Regula la eficacia de la firma electrónica, el sello electrónico, la identificación electrónica de las personas jurídicas, la lista de confianza de prestadores cualificados de servicios de confianza (TSL) y el DNI electrónico. Los prestadores cualificados de servicios de confianza están sujetos a la supervisión de la Secretaría de Estado de Digitalización e Inteligencia Artificial.</p>\n<h3 id=\"el-dni-electrónico-dnie\">El DNI electrónico (DNIe)</h3>\n<p>Regulado por el RD 1553/2005, de 23 de diciembre (modificado por el RD 1451/2015, de 11 de diciembre), es el documento que acredita electrónicamente la identidad personal de su titular y permite firmar electrónicamente documentos. Incorpora un chip criptográfico con dos certificados electrónicos: uno de autenticación y otro de firma, expedidos por la Dirección General de la Policía (Ministerio del Interior). Desde 2021 se emite el DNIe 4.0, con chip de comunicaciones sin contacto (NFC), que permite la autenticación mediante la app DNIe en dispositivos móviles sin necesidad de lector con contacto. <strong>Vigencia</strong>: 2 años para menores de 5 años; 5 años entre 5 y 30; 10 años entre 30 y 70; e indefinida para mayores de 70.</p>\n<h3 id=\"la-agenda-digital-para-españa\">La Agenda Digital para España</h3>\n<p>Aprobada por el Consejo de Ministros el 15 de febrero de 2013, fue el marco de referencia para el desarrollo de la economía y la sociedad digital en España, alineado con la Agenda Digital para Europa 2020. Se articulaba en seis grandes objetivos: fomentar el despliegue de redes de banda ancha de nueva generación; desarrollar la economía digital; mejorar la e-Administración; reforzar la confianza en el ámbito digital; impulsar el sistema de I+D+i en TIC; y fomentar la inclusión y la alfabetización digital. Ha sido sucedida por la <strong>Agenda España Digital 2025</strong> (julio de 2020) y por <strong>España Digital 2026</strong> (2022), que despliegan planes específicos: Plan de Conectividad, Plan de Competencias Digitales, Plan de Digitalización de las Administraciones Públicas, Plan de Inteligencia Artificial y la <strong>Carta de Derechos Digitales</strong> (14 de julio de 2021). La coordinación corresponde a la Secretaría de Estado de Digitalización e Inteligencia Artificial (Ministerio para la Transformación Digital y de la Función Pública).</p>\n<h3 id=\"trampas-habituales-de-examen\">Trampas habituales de examen</h3>\n<ul>\n<li><strong>Tres niveles de firma</strong>: simple, avanzada y cualificada. Solo la cualificada equivale a la firma manuscrita; la \"firma reconocida\" de la Ley 59/2003 desapareció con la Ley 6/2020 (adaptación a eIDAS).</li>\n<li><strong>eIDAS</strong>: Reglamento UE 910/2014, aplicable desde el 1 de julio de 2016 (no desde 2014, año de publicación). eIDAS 2 (2024/1183): monederos europeos de identidad digital.</li>\n<li><strong>LSSI</strong>: el envío de comunicaciones comerciales exige consentimiento previo, con la excepción de la relación contractual previa; los intermediarios (acceso, caché, alojamiento, enlaces) tienen exención de responsabilidad en condiciones tasadas.</li>\n<li><strong>DNIe</strong>: vigencia 2/5/10/indefinida según la edad — trampa frecuente: los mayores de 70 años tienen validez indefinida, no 10 años.</li>\n<li><strong>Agenda Digital para España</strong>: febrero de 2013, 6 objetivos; sucedida por España Digital 2025/2026 y la Carta de Derechos Digitales (2021).</li>\n</ul>\n"}, {"num": 7, "title": "La protección de datos personales y su régimen jurídico. Derechos digitales.", "html": "<h3 id=\"marco-normativo\">Marco normativo</h3>\n<p>El régimen se articula sobre el Reglamento (UE) 2016/679, General de Protección de Datos (RGPD), de aplicación directa y obligatoria en todos los Estados miembros desde el 25 de mayo de 2018, y la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales (LOPDGDD), que lo desarrolla y completa en lo no armonizado. La LOPDGDD deroga la anterior LO 15/1999.</p>\n<p><strong>Definiciones básicas (art. 4 RGPD).</strong> Dato personal: toda información sobre una persona física identificada o identificable; interesado: la persona física; responsable: quien determina los fines y medios del tratamiento; encargado: quien trata datos por cuenta del responsable; tratamiento: cualquier operación o conjunto de operaciones sobre datos personales. <strong>Categorías especiales de datos (art. 9 RGPD)</strong>: origen racial o étnico, opiniones políticas, convicciones religiosas o filosóficas, afiliación sindical, datos genéticos, datos biométricos dirigidos a identific
