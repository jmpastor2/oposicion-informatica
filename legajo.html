squema relacional siguiendo reglas de paso:</p>\n<ul>\n<li>Entidad fuerte → tabla con su clave primaria.</li>\n<li>Relación 1:N → la clave primaria del lado \"1\" se propaga como clave ajena en el lado \"N\".</li>\n<li>Relación N:M → se crea una tabla intermedia con ambas claves ajenas, que normalmente forman la clave primaria compuesta.</li>\n<li>Atributo multivaluado → tabla independiente relacionada por clave ajena.</li>\n</ul>\n<p><strong>Diseño físico.</strong> Consiste en decidir la implementación concreta: tipos de datos del SGBD, índices, particionado, espacios de tablas, estrategias de almacenamiento y parámetros de rendimiento (tablespaces en Oracle, filegroups en SQL Server).</p>\n<h3 id=\"el-modelo-relacional\">El modelo relacional</h3>\n<p>Propuesto por E.F. Codd (1970), se basa en el álgebra relacional y la lógica de predicados. Una <strong>relación</strong> (tabla) es un conjunto de tuplas (filas) sobre un conjunto de atributos (columnas), cada uno con un dominio. Reglas fundamentales:</p>\n<ul>\n<li>Cada tabla tiene una clave primaria (PK) que garantiza la integridad de entidad (no nulos, no duplicados).</li>\n<li>Las claves ajenas (FK) garantizan la integridad referencial.</li>\n<li>Las restricciones de dominio (CHECK, NOT NULL) garantizan la integridad de dominio.</li>\n</ul>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">TABLE</span> DEPARTAMENTO (</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    id_dept     <span class=\"dt\">INT</span> <span class=\"kw\">PRIMARY</span> <span class=\"kw\">KEY</span>,</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    nombre      <span class=\"dt\">VARCHAR</span>(<span class=\"dv\">50</span>) <span class=\"kw\">NOT</span> <span class=\"kw\">NULL</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>);</span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">TABLE</span> EMPLEADO (</span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>    id_emp      <span class=\"dt\">INT</span> <span class=\"kw\">PRIMARY</span> <span class=\"kw\">KEY</span>,</span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a>    nombre      <span class=\"dt\">VARCHAR</span>(<span class=\"dv\">50</span>) <span class=\"kw\">NOT</span> <span class=\"kw\">NULL</span>,</span>\n<span id=\"cb1-9\"><a href=\"#cb1-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>    salario     <span class=\"dt\">DECIMAL</span>(<span class=\"dv\">10</span>,<span class=\"dv\">2</span>) <span class=\"kw\">CHECK</span> (salario <span class=\"op\">&gt;</span> <span class=\"dv\">0</span>),</span>\n<span id=\"cb1-10\"><a href=\"#cb1-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>    id_dept     <span class=\"dt\">INT</span>,</span>\n<span id=\"cb1-11\"><a href=\"#cb1-11\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">CONSTRAINT</span> fk_dept <span class=\"kw\">FOREIGN</span> <span class=\"kw\">KEY</span> (id_dept)</span>\n<span id=\"cb1-12\"><a href=\"#cb1-12\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"kw\">REFERENCES</span> DEPARTAMENTO(id_dept)</span>\n<span id=\"cb1-13\"><a href=\"#cb1-13\" aria-hidden=\"true\" tabindex=\"-1\"></a>);</span></code></pre></div>\n<h3 id=\"normalización\">Normalización</h3>\n<p>La normalización es un proceso de descomposición de tablas para eliminar redundancias y anomalías de inserción, actualización y borrado, basado en dependencias funcionales.</p>\n<p><strong>Primera Forma Normal (1FN):</strong> todos los atributos deben ser atómicos (indivisibles) y no debe haber grupos repetitivos.</p>\n<pre><code>NO 1FN:  Pedido(id, cliente, productos=&quot;lápiz,goma,folio&quot;)\n1FN:     PedidoLinea(id_pedido, producto)</code></pre>\n<p><strong>Segunda Forma Normal (2FN):</strong> debe estar en 1FN y todo atributo no clave debe depender funcionalmente de la clave primaria <strong>completa</strong> (elimina dependencias parciales, aplicable con claves compuestas).</p>\n<pre><code>NO 2FN: LineaPedido(id_pedido, id_producto, cant, nombre_producto)\n        -- nombre_producto depende solo de id_producto, no de la clave completa\n2FN:    LineaPedido(id_pedido, id_producto, cant)\n        Producto(id_producto, nombre_producto)</code></pre>\n<p><strong>Tercera Forma Normal (3FN):</strong> debe estar en 2FN y ningún atributo no clave debe depender de otro atributo no clave (elimina dependencias transitivas).</p>\n<pre><code>NO 3FN: Empleado(id_emp, id_dept, nombre_dept)\n        -- nombre_dept depende de id_dept, no de id_emp\n3FN:    Empleado(id_emp, id_dept)\n        Departamento(id_dept, nombre_dept)</code></pre>\n<p>Existen formas superiores (FNBC, 4FN, 5FN) que resuelven dependencias multivaluadas y de proyección-unión, aunque en la práctica profesional la 3FN o FNBC suele ser suficiente. En sistemas de alto rendimiento se aplica en ocasiones <strong>desnormalización</strong> controlada para reducir joins costosos, a cambio de asumir cierta redundancia gestionada.</p>\n<h3 id=\"metodologías-de-modelado\">Metodologías de modelado</h3>\n<p>Las metodologías estructuradas (Métrica v3, en la Administración española) definen fases: Estudio de Viabilidad, Análisis, Diseño, Construcción, Implantación y Mantenimiento, con el modelo E/R como artefacto central del subproceso de Diseño de Datos. Métrica v3 distingue el <strong>Diseño Lógico de Datos</strong> (paso a tablas, normalización) del <strong>Diseño Físico de Datos</strong> (elección de estructuras de almacenamiento, índices).</p>\n"}, {"num": 2, "title": "Lenguajes de programación. Representación de tipos de datos. Operadores. Instrucciones condicionales. Bucles y recursividad. Procedimientos, funciones y parámetros. Vectores y registros. Estructura de un programa.", "html": "<h3 id=\"clasificación-de-lenguajes\">Clasificación de lenguajes</h3>\n<p>Los lenguajes de programación se clasifican por su nivel de abstracción (máquina, ensamblador, alto nivel), por su paradigma (imperativo, orientado a objetos, funcional, declarativo/lógico) y por su forma de ejecución (compilados: C, C++; interpretados: Python, JavaScript; híbridos con máquina virtual: Java, C#). Un <strong>compilador</strong> traduce todo el código fuente a código máquina antes de ejecutarlo; un <strong>intérprete</strong> traduce y ejecuta instrucción a instrucción; los lenguajes como Java compilan a bytecode intermedio ejecutado por una JVM.</p>\n<h3 id=\"tipos-de-datos\">Tipos de datos</h3>\n<ul>\n<li><strong>Primitivos/simples</strong>: enteros (<code>int</code>, <code>long</code>), reales (<code>float</code>, <code>double</code>), carácter (<code>char</code>), booleano (<code>bool</code>), en coma flotante representados según IEEE 754.</li>\n<li><strong>Compuestos/estructurados</strong>: cadenas, vectores (arrays), registros (struct), uniones, punteros/referencias.</li>\n<li><strong>Abstractos (TDA)</strong>: pilas, colas, listas, árboles, definidos por su comportamiento, no por su representación interna.</li>\n</ul>\n<h3 id=\"operadores\">Operadores</h3>\n<ul>\n<li><strong>Aritméticos</strong>: <code>+ - * / % (módulo)</code>.</li>\n<li><strong>Relacionales</strong>: <code>== != &lt; &gt; &lt;= &gt;=</code>.</li>\n<li><strong>Lógicos</strong>: <code>AND OR NOT</code> (evaluación cortocircuito <code>&amp;&amp;</code>, <code>||</code>).</li>\n<li><strong>Asignación</strong>: <code>= += -= *=</code>.</li>\n<li><strong>Bit a bit</strong>: <code>&amp; | ^ ~ &lt;&lt; &gt;&gt;</code>.</li>\n</ul>\n<h3 id=\"estructuras-de-control\">Estructuras de control</h3>\n<pre><code>SI (edad &gt;= 18) ENTONCES\n    ESCRIBIR &quot;Mayor de edad&quot;\nSINO\n    ESCRIBIR &quot;Menor de edad&quot;\nFIN SI\n\nMIENTRAS (i &lt; 10) HACER\n    ESCRIBIR i\n    i &lt;- i + 1\nFIN MIENTRAS\n\nREPETIR\n    ESCRIBIR i\n    i &lt;- i + 1\nHASTA (i &gt;= 10)\n\nPARA i &lt;- 1 HASTA 10 HACER\n    ESCRIBIR i\nFIN PARA</code></pre>\n<h3 id=\"recursividad\">Recursividad</h3>\n<p>Una función recursiva se llama a sí misma, requiriendo siempre un <strong>caso base</strong> (condición de parada) y un <strong>caso recursivo</strong>.</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">int</span> <span class=\"fu\">factorial</span><span class=\"op\">(</span><span class=\"dt\">int</span> n<span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"cf\">if</span> <span class=\"op\">(</span>n <span class=\"op\">&lt;=</span> <span class=\"dv\">1</span><span class=\"op\">)</span> <span class=\"cf\">return</span> <span class=\"dv\">1</span><span class=\"op\">;</span>          <span class=\"co\">// caso base</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"cf\">return</span> n <span class=\"op\">*</span> <span class=\"fu\">factorial</span><span class=\"op\">(</span>n <span class=\"op\">-</span> <span class=\"dv\">1</span><span class=\"op\">);</span>   <span class=\"co\">// caso recursivo</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<h3 id=\"procedimientos-funciones-y-parámetros\">Procedimientos, funciones y parámetros</h3>\n<p>Un <strong>procedimiento</strong> ejecuta una acción sin devolver valor; una <strong>función</strong> devuelve un valor. Los parámetros pueden pasarse <strong>por valor</strong> (se copia, no se modifica el original) o <strong>por referencia</strong> (se pasa la dirección de memoria, permitiendo modificar el original).</p>\n<h3 id=\"vectores-y-registros\">Vectores y registros</h3>\n<div class=\"sourceCode\" id=\"cb3\"><pre class=\"sourceCode c\"><code class=\"sourceCode c\"><span id=\"cb3-1\"><a href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">int</span> notas<span class=\"op\">[</span><span class=\"dv\">5</span><span class=\"op\">]</span> <span class=\"op\">=</span> <span class=\"op\">{</span><span class=\"dv\">7</span><span class=\"op\">,</span> <span class=\"dv\">8</span><span class=\"op\">,</span> <span class=\"dv\">5</span><span class=\"op\">,</span> <span class=\"dv\">9</span><span class=\"op\">,</span> <span class=\"dv\">6</span><span class=\"op\">};</span>   <span class=\"co\">// vector: homogéneo, indexado</span></span>\n<span id=\"cb3-2\"><a href=\"#cb3-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">struct</span> Empleado <span class=\"op\">{</span>                  <span class=\"co\">// registro: heterogéneo</span></span>\n<span id=\"cb3-3\"><a href=\"#cb3-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">int</span> id<span class=\"op\">;</span></span>\n<span id=\"cb3-4\"><a href=\"#cb3-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">char</span> nombre<span class=\"op\">[</span><span class=\"dv\">50</span><span class=\"op\">];</span></span>\n<span id=\"cb3-5\"><a href=\"#cb3-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">float</span> salario<span class=\"op\">;</span></span>\n<span id=\"cb3-6\"><a href=\"#cb3-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">};</span></span></code></pre></div>\n<h3 id=\"estructura-de-un-programa\">Estructura de un programa</h3>\n<p>Cabecera/importación de librerías, declaración de constantes y tipos, variables globales, subprogramas, bloque principal, organizado en paquetes/módulos para favorecer la modularidad.</p>\n"}, {"num": 3, "title": "Lenguajes de interrogación de bases de datos. Estándar ANSI SQL. Procedimientos almacenados. Eventos y disparadores.", "html": "<p>SQL (Structured Query Language) es el lenguaje estándar (ISO/IEC 9075, originalmente ANSI SQL-86) para la gestión de bases de datos relacionales, subdividido en:</p>\n<p><strong>DDL</strong> (define estructura): <code>CREATE TABLE</code>, <code>ALTER TABLE</code>, <code>DROP TABLE</code>, <code>CREATE INDEX</code>.</p>\n<p><strong>DML</strong> (manipula datos): <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>, <code>SELECT</code> con <code>JOIN</code> (INNER, LEFT, RIGHT, FULL), <code>GROUP BY</code>/<code>HAVING</code>, subconsultas y funciones de ventana (<code>OVER (PARTITION BY ...)</code>).</p>\n<p><strong>DCL</strong> (permisos y transacciones): <code>GRANT</code>, <code>REVOKE</code>, <code>BEGIN TRANSACTION</code> / <code>COMMIT</code> / <code>ROLLBACK</code>.</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span> <span class=\"kw\">TRANSACTION</span>;</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">UPDATE</span> CUENTA <span class=\"kw\">SET</span> saldo <span class=\"op\">=</span> saldo <span class=\"op\">-</span> <span class=\"dv\">100</span> <span class=\"kw\">WHERE</span> <span class=\"kw\">id</span> <span class=\"op\">=</span> <span class=\"dv\">1</span>;</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">UPDATE</span> CUENTA <span class=\"kw\">SET</span> saldo <span class=\"op\">=</span> saldo <span class=\"op\">+</span> <span class=\"dv\">100</span> <span class=\"kw\">WHERE</span> <span class=\"kw\">id</span> <span class=\"op\">=</span> <span class=\"dv\">2</span>;</span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">COMMIT</span>;</span></code></pre></div>\n<p>Las transacciones cumplen ACID, con niveles de aislamiento (READ UNCOMMITTED, READ COMMITTED, REPEATABLE READ, SERIALIZABLE).</p>\n<p><strong>Procedimientos almacenados</strong>: bloques compilados en el servidor (PL/SQL en Oracle, T-SQL en SQL Server) que encapsulan lógica de negocio.</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">PROCEDURE</span> ActualizarSalario @id_emp <span class=\"dt\">INT</span>, @porcentaje <span class=\"dt\">DECIMAL</span>(<span class=\"dv\">5</span>,<span class=\"dv\">2</span>)</span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">AS</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">UPDATE</span> EMPLEADO <span class=\"kw\">SET</span> salario <span class=\"op\">=</span> salario <span class=\"op\">*</span> (<span class=\"dv\">1</span> <span class=\"op\">+</span> @porcentaje<span class=\"op\">/</span><span class=\"dv\">100</span>) <span class=\"kw\">WHERE</span> id_emp <span class=\"op\">=</span> @id_emp;</span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">END</span>;</span></code></pre></div>\n<p><strong>Triggers</strong>: se ejecutan automáticamente ante un evento DML/DDL, sin invocación explícita.</p>\n<div class=\"sourceCode\" id=\"cb3\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb3-1\"><a href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">TRIGGER</span> trg_AuditoriaSalario <span class=\"kw\">ON</span> EMPLEADO <span class=\"kw\">AFTER</span> <span class=\"kw\">UPDATE</span></span>\n<span id=\"cb3-2\"><a href=\"#cb3-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">AS</span></span>\n<span id=\"cb3-3\"><a href=\"#cb3-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span></span>\n<span id=\"cb3-4\"><a href=\"#cb3-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"cf\">IF</span> <span class=\"kw\">UPDATE</span>(salario)</span>\n<span id=\"cb3-5\"><a href=\"#cb3-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"kw\">INSERT</span> <span class=\"kw\">INTO</span> AUDITORIA_SALARIO (id_emp, salario_anterior, fecha)</span>\n<span id=\"cb3-6\"><a href=\"#cb3-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"kw\">SELECT</span> d.id_emp, d.salario, GETDATE() <span class=\"kw\">FROM</span> deleted d;</span>\n<span id=\"cb3-7\"><a href=\"#cb3-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">END</span>;</span></code></pre></div>\n<p>Se clasifican por momento (<code>BEFORE</code>/<code>AFTER</code>/<code>INSTEAD OF</code>) y ámbito (por fila o por sentencia). Uso típico: auditoría, validación de reglas complejas, integridad referencial personalizada.</p>\n"}, {"num": 4, "title": "Diseño y programación orientada a objetos. Elementos y componentes software: objetos, clases, herencia, métodos, sobrecarga. Ventajas e inconvenientes. Patrones de diseño y lenguaje de modelado unificado (UML).", "html": "<h3 id=\"fundamentos-de-la-poo\">Fundamentos de la POO</h3>\n<p>La POO organiza el software en <strong>objetos</strong>, instancias de <strong>clases</strong>. Sus cuatro pilares: <strong>encapsulamiento</strong>, <strong>abstracción</strong>, <strong>herencia</strong> y <strong>polimorfismo</strong>.</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">abstract</span> <span class=\"kw\">class</span> Vehiculo <span class=\"op\">{</span></span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">protected</span> <span class=\"bu\">String</span> matricula<span class=\"op\">;</span></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">protected</span> <span class=\"dt\">int</span> velocidad<span class=\"op\">;</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"fu\">Vehiculo</span><span class=\"op\">(</span><span class=\"bu\">String</span> matricula<span class=\"op\">)</span> <span class=\"op\">{</span> <span class=\"kw\">this</span><span class=\"op\">.</span><span class=\"fu\">matricula</span> <span class=\"op\">=</span> matricula<span class=\"op\">;</span> <span class=\"op\">}</span></span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"kw\">abstract</span> <span class=\"dt\">void</span> <span class=\"fu\">acelerar</span><span class=\"op\">();</span></span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"dt\">void</span> <span class=\"fu\">frenar</span><span class=\"op\">()</span> <span class=\"op\">{</span> velocidad <span class=\"op\">=</span> <span class=\"dv\">0</span><span class=\"op\">;</span> <span class=\"op\">}</span></span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb1-9\"><a href=\"#cb1-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> Coche <span class=\"kw\">extends</span> Vehiculo <span class=\"op\">{</span>          <span class=\"co\">// herencia</span></span>\n<span id=\"cb1-10\"><a href=\"#cb1-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"fu\">Coche</span><span class=\"op\">(</span><span class=\"bu\">String</span> matricula<span class=\"op\">)</span> <span class=\"op\">{</span> <span class=\"kw\">super</span><span class=\"op\">(</span>matricula<span class=\"op\">);</span> <span class=\"op\">}</span></span>\n<span id=\"cb1-11\"><a href=\"#cb1-11\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"at\">@Override</span></span>\n<span id=\"cb1-12\"><a href=\"#cb1-12\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"dt\">void</span> <span class=\"fu\">acelerar</span><span class=\"op\">()</span> <span class=\"op\">{</span> velocidad <span class=\"op\">+=</span> <span class=\"dv\">20</span><span class=\"op\">;</span> <span class=\"op\">}</span>   <span class=\"co\">// polimorfismo/sobreescritura</span></span>\n<span id=\"cb1-13\"><a href=\"#cb1-13\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"dt\">void</span> <span class=\"fu\">acelerar</span><span class=\"op\">(</span><span class=\"dt\">int</span> incremento<span class=\"op\">)</span> <span class=\"op\">{</span> velocidad <span class=\"op\">+=</span> incremento<span class=\"op\">;</span> <span class=\"op\">}</span>  <span class=\"co\">// sobrecarga</span></span>\n<span id=\"cb1-14\"><a href=\"#cb1-14\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p>La <strong>sobrecarga (overloading)</strong> define varios métodos con el mismo nombre y distinta firma, resuelta en compilación. La <strong>sobreescritura (overriding)</strong> redefine un método heredado, resuelta en ejecución.</p>\n<p><strong>Ventajas</strong>: reutilización, mantenibilidad, modelado natural, extensión sin modificar código existente. <strong>Inconvenientes</strong>: curva de aprendizaje, sobrecarga en tiempo de ejecución, riesgo de jerarquías mal diseñadas.</p>\n<p><strong>Principios SOLID</strong>: Responsabilidad única, Abierto/cerrado, Sustitución de Liskov, Segregación de interfaces, Inversión de dependencias.</p>\n<p><strong>Patrones de diseño</strong> (Gang of Four, 1994): creacionales (Singleton, Factory Method, Builder), estructurales (Adapter, Decorator, Facade), de comportamiento (Observer, Strategy, Command).</p>\n<p><strong>UML</strong>: diagrama de clases (atributos, métodos, relaciones: asociación, agregación ◇, composición ◆, herencia △), diagrama de casos de uso (actores, <code>&lt;&lt;include&gt;&gt;</code>/<code>&lt;&lt;extend&gt;&gt;</code>), diagrama de secuencia (interacción temporal entre objetos).</p>\n"}, {"num": 5, "title": "Arquitectura Java EE/Jakarta EE y plataforma .NET: componentes, persistencia y seguridad. Características, elementos, lenguajes y funciones en ambos entornos. Desarrollo de interfaces.", "html": "<h3 id=\"jakarta-ee-antes-java-ee\">Jakarta EE (antes Java EE)</h3>\n<p>Conjunto de especificaciones sobre la JVM, ejecutado sobre servidor de aplicaciones (WildFly, GlassFish, WebSphere Liberty). Componentes: <strong>Servlets</strong>, <strong>JSP/JSF</strong>, <strong>EJB</strong> (lógica de negocio con soporte transaccional), <strong>CDI</strong> (inyección de dependencias), <strong>JPA</strong> (ORM, implementado por Hibernate), <strong>JAX-RS/JAX-WS</strong> (REST/SOAP).</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">@Entity</span></span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> Empleado <span class=\"op\">{</span></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"at\">@Id</span> <span class=\"at\">@GeneratedValue</span> <span class=\"kw\">private</span> <span class=\"bu\">Long</span> id<span class=\"op\">;</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">private</span> <span class=\"bu\">String</span> nombre<span class=\"op\">;</span></span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">@Path</span><span class=\"op\">(</span><span class=\"st\">&quot;/empleados&quot;</span><span class=\"op\">)</span></span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> EmpleadoResource <span class=\"op\">{</span></span>\n<span id=\"cb1-9\"><a href=\"#cb1-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"at\">@GET</span> <span class=\"at\">@Path</span><span class=\"op\">(</span><span class=\"st\">&quot;/{id}&quot;</span><span class=\"op\">)</span></span>\n<span id=\"cb1-10\"><a href=\"#cb1-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> Empleado <span class=\"fu\">obtener</span><span class=\"op\">(</span><span class=\"at\">@PathParam</span><span class=\"op\">(</span><span class=\"st\">&quot;id&quot;</span><span class=\"op\">)</span> <span class=\"bu\">Long</span> id<span class=\"op\">)</span> <span class=\"op\">{</span> <span class=\"cf\">return</span> entityManager<span class=\"op\">.</span><span class=\"fu\">find</span><span class=\"op\">(</span>Empleado<span class=\"op\">.</span><span class=\"fu\">class</span><span class=\"op\">,</span> id<span class=\"op\">);</span> <span class=\"op\">}</span></span>\n<span id=\"cb1-11\"><a href=\"#cb1-11\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p>Seguridad: Jakarta Security (<code>@RolesAllowed</code>), realms del servidor de aplicaciones.</p>\n<h3 id=\"plataforma-net\">Plataforma .NET</h3>\n<p>Multiplataforma desde .NET 5. Lenguajes: C#, F#, VB.NET, compilados a CIL/MSIL ejecutado por el CLR (garbage collector, JIT). Componentes: <strong>ASP.NET Core</strong> (MVC, Web API), <strong>Entity Framework Core</strong> (ORM), <strong>ASP.NET Core Identity</strong> (autenticación).</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode csharp\"><code class=\"sourceCode cs\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">[</span>ApiController<span class=\"op\">][</span><span class=\"fu\">Route</span><span class=\"op\">(</span><span class=\"st\">&quot;api/[controller]&quot;</span><span class=\"op\">)]</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> EmpleadosController <span class=\"op\">:</span> ControllerBase <span class=\"op\">{</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"op\">[</span><span class=\"fu\">HttpGet</span><span class=\"op\">(</span><span class=\"st\">&quot;{id}&quot;</span><span class=\"op\">)][</span><span class=\"fu\">Authorize</span><span class=\"op\">(</span>Roles <span class=\"op\">=</span> <span class=\"st\">&quot;Administrador&quot;</span><span class=\"op\">)]</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> async Task<span class=\"op\">&lt;</span>ActionResult<span class=\"op\">&lt;</span>Empleado<span class=\"op\">&gt;&gt;</span> <span class=\"fu\">Obtener</span><span class=\"op\">(</span><span class=\"dt\">int</span> id<span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"dt\">var</span> emp <span class=\"op\">=</span> await _context<span class=\"op\">.</span><span class=\"fu\">Empleados</span><span class=\"op\">.</span><span class=\"fu\">FindAsync</span><span class=\"op\">(</span>id<span class=\"op\">);</span></span>\n<span id=\"cb2-6\"><a href=\"#cb2-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"kw\">return</span> emp <span class=\"kw\">is</span> <span class=\"kw\">null</span> <span class=\"op\">?</span> <span class=\"fu\">NotFound</span><span class=\"op\">()</span> <span class=\"op\">:</span> <span class=\"fu\">Ok</span><span class=\"op\">(</span>emp<span class=\"op\">);</span></span>\n<span id=\"cb2-7\"><a href=\"#cb2-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"op\">}</span></span>\n<span id=\"cb2-8\"><a href=\"#cb2-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<h3 id=\"comparativa\">Comparativa</h3>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Java EE/Jakarta EE</th>\n<th>.NET</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ORM</td>\n<td>JPA (Hibernate)</td>\n<td>Entity Framework Core</td>\n</tr>\n<tr>\n<td>DI</td>\n<td>CDI</td>\n<td>Contenedor DI integrado</td>\n</tr>\n<tr>\n<td>Servidor</td>\n<td>Externo (WildFly, Tomcat)</td>\n<td>Kestrel embebido</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"desarrollo-de-interfaces\">Desarrollo de interfaces</h3>\n<p>Ambos entornos desacoplan presentación de backend: Java EE con JSF/PrimeFaces o frontend SPA (Angular/React) consumiendo REST; .NET con Razor Pages/Blazor o igualmente un frontend SPA independiente. Convergen en la arquitectura desacoplada backend-API / frontend-SPA.</p>\n"}, {"num": 6, "title": "Arquitectura de sistemas cliente/servidor y multicapas: componentes y operación. Arquitecturas de servicios web y protocolos asociados.", "html": "<h3 id=\"clienteservidor\">Cliente/servidor</h3>\n<ul>\n<li><strong>2 capas</strong>: cliente con presentación+negocio, acceso directo a BD. Acoplamiento fuerte.</li>\n<li><strong>3 capas</strong>: separa presentación, lógica de negocio y datos.</li>\n<li><strong>N capas</strong>: añade capas adicionales (servicios, integración, caché).</li>\n</ul>\n<pre><code>[Cliente/Navegador] --HTTP--&gt; [Servidor de Aplicaciones] --SQL--&gt; [Servidor de BD]</code></pre>\n<p><strong>SOA</strong>: servicios débilmente acoplados coordinados por un bus (ESB). <strong>Microservicios</strong>: servicios pequeños y autónomos con BD propia, desplegados en contenedores (Docker/Kubernetes), comunicados vía REST o mensajería asíncrona (Kafka, RabbitMQ).</p>\n<h3 id=\"servicios-web\">Servicios web</h3>\n<p><strong>SOAP</strong>: basado en XML, contrato formal en WSDL, catalogado en UDDI, soporta WS-Security y transacciones — usado en banca y Administración Pública.</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode xml\"><code class=\"sourceCode xml\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a>&lt;<span class=\"kw\">soap:Envelope</span> <span class=\"ot\">xmlns:soap=</span><span class=\"st\">&quot;http://www.w3.org/2003/05/soap-envelope&quot;</span>&gt;</span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>  &lt;<span class=\"kw\">soap:Body</span>&gt;&lt;<span class=\"kw\">ObtenerEmpleado</span>&gt;&lt;<span class=\"kw\">id</span>&gt;5&lt;/<span class=\"kw\">id</span>&gt;&lt;/<span class=\"kw\">ObtenerEmpleado</span>&gt;&lt;/<span class=\"kw\">soap:Body</span>&gt;</span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>&lt;/<span class=\"kw\">soap:Envelope</span>&gt;</span></code></pre></div>\n<p><strong>REST</strong>: estilo arquitectónico (Roy Fielding), recursos por URI, verbos HTTP, sin estado, JSON.</p>\n<pre class=\"http\"><code>GET /api/empleados/5 HTTP/1.1\nAccept: application/json</code></pre>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>SOAP</th>\n<th>REST</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Formato</td>\n<td>XML estricto</td>\n<td>JSON típico</td>\n</tr>\n<tr>\n<td>Contrato</td>\n<td>WSDL formal</td>\n<td>OpenAPI/Swagger opcional</td>\n</tr>\n<tr>\n<td>Estado</td>\n<td>Puede ser stateful</td>\n<td>Stateless</td>\n</tr>\n</tbody>\n</table>\n<p>Otros: GraphQL (consultas flexibles), gRPC (RPC sobre HTTP/2 con Protocol Buffers), AMQP/MQTT (mensajería asíncrona).</p>\n"}, {"num": 7, "title": "Aplicaciones web. Desarrollo web front-end y en servidor, multiplataforma y multidispositivo. Lenguajes: HTML, XML y sus derivaciones. Navegadores y lenguajes de programación web. Lenguajes de script.", "html": "<h3 id=\"arquitectura-de-una-aplicación-web\">Arquitectura de una aplicación web</h3>\n<p><strong>Front-end</strong>: HTML, CSS, JavaScript ejecutados en el navegador. <strong>Back-end/server-side</strong>: Java, C#, PHP, Node.js, Python, responsable de lógica de negocio. Renderizado: SSR, CSR (SPA React/Angular/Vue), o híbrido (Next.js).</p>\n<h3 id=\"html5\">HTML5</h3>\n<p>Etiquetas semánticas (<code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;article&gt;</code>), APIs nativas (Canvas, geolocalización, WebSockets), multimedia sin plugins (<code>&lt;video&gt;</code>, <code>&lt;audio&gt;</code>).</p>\n<h3 id=\"xml-y-derivaciones\">XML y derivaciones</h3>\n<p>Metalenguaje jerárquico autodescriptivo. Tecnologías asociadas: <strong>XSD</strong> (esquemas), <strong>XSLT</strong> (transformación), <strong>XPath</strong> (navegación), <strong>DTD</strong>. Frente a XML, <strong>JSON</strong> es más ligero y de mapeo directo a estructuras de programación, aunque XML se mantiene donde se requiere validación estricta (SOAP, facturación electrónica, interoperabilidad Administración).</p>\n<h3 id=\"navegadores\">Navegadores</h3>\n<p>Motores de renderizado: Blink (Chrome/Edge), Gecko (Firefox), WebKit (Safari). Motores JavaScript: V8, SpiderMonkey.</p>\n<h3 id=\"lenguajes-de-script-y-css\">Lenguajes de script y CSS</h3>\n<p><strong>JavaScript</strong>: dinámico, débilmente tipado, basado en prototipos, bucle de eventos (<code>Promise</code>, <code>async/await</code>).</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode javascript\"><code class=\"sourceCode javascript\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">async</span> <span class=\"kw\">function</span> <span class=\"fu\">obtenerEmpleado</span>(id) {</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">const</span> respuesta <span class=\"op\">=</span> <span class=\"cf\">await</span> <span class=\"fu\">fetch</span>(<span class=\"vs\">`/api/empleados/</span><span class=\"sc\">${</span>id<span class=\"sc\">}</span><span class=\"vs\">`</span>)<span class=\"op\">;</span></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">const</span> datos <span class=\"op\">=</span> <span class=\"cf\">await</span> respuesta<span class=\"op\">.</span><span class=\"fu\">json</span>()<span class=\"op\">;</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>}</span></code></pre></div>\n<p><strong>TypeScript</strong>: tipado estático opcional sobre JavaScript. <strong>CSS3</strong>: Flexbox, Grid, media queries, base del diseño responsive.</p>\n<h3 id=\"multiplataforma-y-multidispositivo\">Multiplataforma y multidispositivo</h3>\n<p>Responsive design (mobile first) + frameworks CSS (Bootstrap, Tailwind). Para nativas/híbridas: React Native, Flutter, Ionic.</p>\n"}, {"num": 8, "title": "Accesibilidad, diseño universal y usabilidad. Acceso y usabilidad de las tecnologías, productos y servicios relacionados con la sociedad de la información. Confidencialidad y disponibilidad de la información en puestos de usuario final. Conceptos de seguridad en el desarrollo de los sistemas.", "html": "<h3 id=\"accesibilidad-y-diseño-universal\">Accesibilidad y diseño universal</h3>\n<p>Garantiza que personas con discapacidad puedan percibir, entender, navegar e interactuar con un sistema. Normativa española: RDLeg 1/2013 y RD 1112/2018 (accesibilidad web y apps móviles del sector público).</p>\n<h3 id=\"wcag-pour\">WCAG (POUR)</h3>\n<p><strong>Perceptible, Operable, Comprensible, Robusto.</strong> Niveles A, AA (exigido por normativa), AAA.</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode html\"><code class=\"sourceCode html\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;</span><span class=\"kw\">img</span><span class=\"ot\"> src</span><span class=\"op\">=</span><span class=\"st\">&quot;grafico.png&quot;</span><span class=\"ot\"> alt</span><span class=\"op\">=</span><span class=\"st\">&quot;Gráfico de ventas trimestrales 2025&quot;</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;</span><span class=\"kw\">label</span><span class=\"ot\"> for</span><span class=\"op\">=</span><span class=\"st\">&quot;dni&quot;</span><span class=\"dt\">&gt;</span>DNI:<span class=\"dt\">&lt;/</span><span class=\"kw\">label</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;</span><span class=\"kw\">input</span><span class=\"ot\"> type</span><span class=\"op\">=</span><span class=\"st\">&quot;text&quot;</span><span class=\"ot\"> id</span><span class=\"op\">=</span><span class=\"st\">&quot;dni&quot;</span><span class=\"ot\"> aria-required</span><span class=\"op\">=</span><span class=\"st\">&quot;true&quot;</span><span class=\"dt\">&gt;</span></span></code></pre></div>\n<h3 id=\"usabilidad\">Usabilidad</h3>\n<p>ISO 9241-11: eficacia, eficiencia y satisfacción. Heurísticas de Nielsen: visibilidad del estado, coherencia, prevención de errores.</p>\n<h3 id=\"confidencialidad-y-disponibilidad-en-el-puesto-de-usuario-final\">Confidencialidad y disponibilidad en el puesto de usuario final</h3>\n<p>Tríada <strong>CID</strong>: confidencialidad (cifrado de disco, bloqueo de sesión, MFA), integridad (firmas digitales, hash), disponibilidad (backups, SAI, redundancia). Marco normativo: <strong>ENS</strong> (RD 311/2022).</p>\n<h3 id=\"seguridad-en-el-desarrollo-owasp-top-10\">Seguridad en el desarrollo (OWASP Top 10)</h3>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">-- Vulnerable a inyección SQL</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"ot\">&quot;SELECT * FROM usuarios WHERE nombre = &#39;&quot;</span> <span class=\"op\">+</span> nombreUsuario <span class=\"op\">+</span> <span class=\"ot\">&quot;&#39;&quot;</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">-- Correcto: parametrizada</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">SELECT</span> <span class=\"op\">*</span> <span class=\"kw\">FROM</span> usuarios <span class=\"kw\">WHERE</span> nombre <span class=\"op\">=</span> @nombreUsuario;</span></code></pre></div>\n<p>Mitigaciones: consultas parametrizadas (SQLi), codificación de salida + CSP (XSS), tokens anti-CSRF, hash con sal bcrypt/PBKDF2 (contraseñas), JWT firmados con expiración, cookies <code>HttpOnly</code>/<code>Secure</code>/<code>SameSite</code>.</p>\n"}, {"num": 9, "title": "Repositorios: estructura y actualización. Generación de código y documentación. Metodologías de desarrollo. Pruebas. Programas para control de versiones. Plataformas de desarrollo colaborativo de software.", "html": "<h3 id=\"control-de-versiones\">Control de versiones</h3>\n<p><strong>Centralizados</strong> (SVN, CVS) vs <strong>distribuidos</strong> (Git). Git: commit, branch, merge, remote, pull/merge request.</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode bash\"><code class=\"sourceCode bash\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> init</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> add archivo.java</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> commit <span class=\"at\">-m</span> <span class=\"st\">&quot;Añade validación de entrada&quot;</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> branch feature/login</span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> push origin feature/login</span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">git</span> merge feature/login</span></code></pre></div>\n<p>Estrategias: Git Flow (<code>main</code>/<code>develop</code>/<code>feature</code>/<code>release</code>/<code>hotfix</code>), GitHub Flow, Trunk-Based Development.</p>\n<h3 id=\"plataformas-colaborativas\">Plataformas colaborativas</h3>\n<p>GitHub, GitLab, Bitbucket: issues, pull/merge requests, CI/CD (<code>.gitlab-ci.yml</code>, GitHub Actions), wikis, tableros Kanban.</p>\n<h3 id=\"generación-de-código-y-documentación\">Generación de código y documentación</h3>\n<p>Herramientas CASE, scaffolding. Documentación desde comentarios estructurados: Javadoc, Doxygen, Swagger/OpenAPI.</p>\n<h3 id=\"metodologías-de-desarrollo\">Metodologías de desarrollo</h3>\n<p><strong>Cascada</strong>: fases secuenciales estrictas, sin retroceso. <strong>Ágiles</strong> (Manifiesto Ágil 2001): iterativo e incremental.</p>\n<ul>\n<li><strong>Scrum</strong>: sprints, roles (Product Owner, Scrum Master, equipo), Product/Sprint Backlog, Daily/Planning/Review/Retrospectiva.</li>\n<li><strong>Kanban</strong>: flujo continuo, límites WIP.</li>\n<li><strong>XP</strong>: programación en parejas, integración continua, TDD.</li>\n</ul>\n<h3 id=\"pruebas-de-software\">Pruebas de software</h3>\n<p>Pirámide de testing: unitarias (JUnit), integración, sistema, aceptación.</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"at\">@Test</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">void</span> <span class=\"fu\">debeCalcularSalarioNetoCorrectamente</span><span class=\"op\">()</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    Empleado emp <span class=\"op\">=</span> <span class=\"kw\">new</span> <span class=\"fu\">Empleado</span><span class=\"op\">(</span><span class=\"fl\">2000.0</span><span class=\"op\">);</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"fu\">assertEquals</span><span class=\"op\">(</span><span class=\"fl\">1600.0</span><span class=\"op\">,</span> emp<span class=\"op\">.</span><span class=\"fu\">calcularNeto</span><span class=\"op\">(),</span> <span class=\"fl\">0.01</span><span class=\"op\">);</span></span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p><strong>TDD</strong>: ciclo red-green-refactor. <strong>CI/CD</strong>: integración y despliegue continuo automatizados en cada cambio.</p>\n"}]}, {"key": "b4", "title": "Bloque IV — Sistemas y comunicaciones", "temas": [{"num": 1, "title": "Administración del Sistema operativo y software de base. Actualización, mantenimiento y reparación del sistema operativo.", "html": "<p>La administración del sistema operativo (SO) comprende la gestión del núcleo, los servicios, los controladores y el software de base que sustenta las aplicaciones. En entornos GNU/Linux, la administración se apoya en gestores de paquetes que resuelven dependencias y mantienen un registro del software instalado. Los principales son APT (Debian/Ubuntu, con <code>apt-get</code>, <code>apt</code>, ficheros <code>.deb</code> y repositorios definidos en <code>/etc/apt/sources.list</code>), YUM y su sucesor DNF (Red Hat/CentOS/Fedora, paquetes <code>.rpm</code>, con resolución de dependencias mediante metadatos <code>repodata</code>), y Zypper (openSUSE). Todos ellos permiten actualizaciones de seguridad (<code>apt upgrade</code>, <code>dnf update</code>), instalación transaccional y rollback en sistemas con Btrfs o LVM mediante snapshots. En Windows Server, la gestión equivalente se realiza con Windows Update, WSUS (Windows Server Update Services) para centralizar la distribución de parches en la red corporativa, y PowerShell DSC (Desired State Configuration) para garantizar la configuración declarativa de los servidores.</p>\n<p>El mantenimiento del SO implica varias tareas periódicas: gestión de logs (rotación con <code>logrotate</code>, revisión de <code>/var/log/syslog</code>, <code>journalctl</code> en sistemas con systemd), gestión de procesos y recursos (monitorización de carga con <code>top</code>, <code>htop</code>, <code>vmstat</code>, <code>iostat</code>), gestión de servicios (systemd como gestor de arranque en Linux moderno, sustituyendo a SysVinit y Upstart; unidades <code>.service</code>, <code>.timer</code>, <code>.mount</code>), y gestión del sistema de ficheros (comprobación de integridad con <code>fsck</code>, gestión de particiones con <code>fdisk</code>/<code>parted</code>, cuotas de disco con <code>quota</code>). La actualización del SO debe seguir un ciclo de gestión de parches (patch management) que incluya: inventario de activos, clasificación de vulnerabilidades (CVE, puntuación CVSS), pruebas en entorno de preproducción, ventana de mantenimiento planificada y plan de rollback ante fallos.</p>\n<p>La reparación del sistema operativo ante fallos de arranque requiere conocer el proceso de arranque: en BIOS/MBR, el bootloader (GRUB2) carga el kernel desde <code>/boot</code>; en UEFI, se emplea la partición EFI (ESP, FAT32) con <code>grub-efi</code> o el gestor propio de Windows (Boot Manager, BCD). Ante corrupción del sistema, se recurre a modo de recuperación (<code>init=/bin/bash</code>, single user mode), live CD/USB de rescate, <code>chroot</code> para reparar el sistema desde un entorno externo, y reconstrucción de <code>initramfs</code>. En Windows, las herramientas de reparación incluyen el Entorno de recuperación (WinRE), <code>sfc /scannow</code> (System File Checker), <code>DISM</code> (Deployment Image Servicing and Management) para reparar la imagen del componente store, y <code>bootrec</code> para reconstruir el registro de arranque maestro.</p>\n<p>El software de base incluye también los controladores de dispositivo (drivers), firmware (actualizable vía UEFI/BIOS o herramientas del fabricante como iDRAC/iLO en servidores), y el middleware que conecta el SO con las aplicaciones (bibliotecas de tiempo de ejecución como .NET Runtime, JVM). La gestión de la configuración a escala se realiza mediante herramientas de automatización como Ansible (agentless, YAML playbooks, idempotencia), Puppet o Chef (modelo agente-servidor, DSL declarativo), que garantizan que múltiples servidores mantengan un estado consistente y auditable.</p>\n<p>Un aspecto crítico es la gestión del ciclo de vida del software: los fabricantes definen fechas de fin de soporte (EOL) y fin de vida útil de seguridad (EOSL), tras las cuales dejan de publicarse parches; mantener sistemas fuera de soporte constituye un riesgo grave de seguridad y suele estar prohibido por normativa como el Esquema Nacional de Seguridad (ENS). La virtualización de la gestión (imágenes doradas o \"golden images\", plantillas preconfiguradas y despliegue mediante herramientas como Packer) permite estandarizar y acelerar el despliegue de sistemas actualizados.</p>\n<p>Finalmente, la monitorización proactiva del estado del SO (uso de CPU, memoria, disco, número de procesos zombis, actualizaciones pendientes) mediante agentes como Nagios, Zabbix o Prometheus con Node Exporter permite anticipar fallos antes de que afecten al servicio, cerrando el ciclo de administración: instalar, configurar, monitorizar, parchear y, cuando es necesario, reparar.</p>\n"}, {"num": 2, "title": "Administración de bases de datos. Sistemas de almacenamiento y su virtualización. Políticas, sistemas y procedimientos de backup y su recuperación. Backup de sistemas físicos y virtuales. Virtualización de sistemas y virtualización de puestos de usuario.", "html": "<p>La administración de bases de datos (DBA) abarca la instalación, configuración, ajuste de rendimiento (tuning), seguridad y disponibilidad de sistemas gestores como SQL Server, Oracle, MySQL/MariaDB y PostgreSQL. Las tareas habituales incluyen la gestión de índices, la planificación de consultas (query execution plans), el control de bloqueos y transacciones (ACID), la gestión de tablespaces/filegroups, y la replicación (maestro-esclavo, maestro-maestro, Always On Availability Groups en SQL Server, streaming replication en PostgreSQL). El aislamiento transaccional se regula mediante niveles como Read Committed, Repeatable Read o Serializable, equilibrando consistencia y concurrencia.</p>\n<p>Los sistemas de almacenamiento se clasifican en DAS (Direct Attached Storage), NAS (Network Attached Storage, almacenamiento de archivos por red mediante NFS o SMB/CIFS) y SAN (Storage Area Network, red dedicada de bloques mediante Fibre Channel o iSCSI, que presenta LUNs a los servidores como discos locales). El nivel de redundancia física se implementa mediante RAID: RAID 0 (striping, sin redundancia), RAID 1 (mirroring), RAID 5 (striping con paridad distribuida, tolera un fallo), RAID 6 (doble paridad, tolera dos fallos) y RAID 10 (mirroring + striping). La virtualización del almacenamiento añade una capa de abstracción (storage pools, thin provisioning) mediante VMware vSAN, Storage Spaces Direct (Windows) o LVM en Linux.</p>\n<p>Las políticas de backup se rigen por dos métricas clave: <strong>RPO</strong> (Recovery Point Objective, cantidad máxima de datos que se puede perder) y <strong>RTO</strong> (Recovery Time Objective, tiempo máximo admisible para restaurar el servicio). Tipos de copia: <strong>completa</strong> (íntegra), <strong>incremental</strong> (cambios desde la última copia de cualquier tipo, minimiza tiempo/espacio pero complica la restauración) y <strong>diferencial</strong> (cambios desde la última copia completa, restauración más simple a costa de mayor tamaño progresivo). La <strong>regla 3-2-1</strong> es el estándar de referencia: 3 copias, en 2 soportes distintos, 1 copia offsite, con la variante 3-2-1-1-0 que añade una copia inmutable/air-gapped frente al ransomware.</p>\n<p>El backup de sistemas físicos se apoya en agentes que copian a nivel de bloque o fichero (Veeam, Bacula, <code>mysqldump</code>/<code>pg_dump</code>), mientras que el backup de sistemas virtuales aprovecha snapshots del hipervisor y APIs específicas como VMware VADP, con Changed Block Tracking (CBT) para copiar solo bloques modificados. La recuperación debe probarse periódicamente (restore testing), documentada en un Plan de Recuperación ante Desastres (DRP) integrado en el Plan de Continuidad de Negocio (BCP).</p>\n<p>La virtualización de sistemas se sustenta en hipervisores de <strong>Tipo 1</strong> (bare-metal: VMware ESXi, Hyper-V, KVM, Xen), usados en producción, y <strong>Tipo 2</strong> (hosted: VirtualBox, VMware Workstation), orientados a desarrollo. Cada VM encapsula un SO completo con recursos virtuales (vCPU, vRAM, vNIC, vDisk), con sobreaprovisionamiento (overcommit) y migración en caliente (vMotion/Live Migration).</p>\n<p>La <strong>virtualización de puestos de usuario (VDI)</strong> centraliza los escritorios en el centro de datos, entregados mediante RDP, PCoIP/Blast Extreme (VMware Horizon), Citrix HDX o Azure Virtual Desktop. Facilita la gestión centralizada y la seguridad (los datos no residen en el endpoint), pero exige dimensionamiento cuidadoso frente al \"boot storm\".</p>\n"}, {"num": 3, "title": "Administración de servidores de correo electrónico y sus protocolos. Administración de contenedores y microservicios.", "html": "<p>El correo electrónico se sustenta en varios protocolos complementarios. <strong>SMTP</strong> (puerto 25 relay, 587 con STARTTLS, 465 SMTPS) gestiona envío y transporte entre MTA (Postfix, Exim, Exchange Transport). La recepción se realiza mediante <strong>POP3</strong> (110/995, descarga y suele eliminar mensajes, un solo cliente) o <strong>IMAP</strong> (143/993, mantiene mensajes sincronizados en servidor, acceso concurrente multi-dispositivo).</p>\n<p>Autenticación de dominio contra suplantación: <strong>SPF</strong> (registro DNS TXT, servidores autorizados a enviar), <strong>DKIM</strong> (firma criptográfica de cabeceras, clave publicada en DNS) y <strong>DMARC</strong> (combina SPF+DKIM, política none/quarantine/reject). Administración: colas de correo, listas negras/blancas (RBL, DNSBL), antispam (SpamAssassin), antivirus (ClamAV), cuotas de buzón y retención conforme al RGPD.</p>\n<p><strong>Contenedores</strong>: virtualizan a nivel de SO, comparten el kernel del host mediante namespaces (aislamiento) y cgroups (control de recursos), mucho más ligeros que las VM. Docker: imagen inmutable (<code>Dockerfile</code>), registros (Docker Hub, Harbor), Docker Engine.</p>\n<p><strong>Microservicios</strong>: aplicaciones descompuestas en servicios pequeños e independientes, comunicados vía REST/gRPC o mensajería asíncrona (Kafka, RabbitMQ). <strong>Kubernetes</strong>: Pods (unidad mínima), Deployments (réplicas, rolling updates), Services (IP virtual estable), Ingress (enrutamiento HTTP), ConfigMaps/Secrets, PersistentVolumes, autoescalado (HPA), autorreparación.</p>\n<p>Diferencia VM vs contenedores: VM = aislamiento fuerte, más recursos, arranque en minutos; contenedores = más eficientes/portables, comparten kernel, exigen escaneo de vulnerabilidades (Trivy, Clair) y ejecución sin privilegios. Integración con CI/CD (Jenkins, GitLab CI) automatiza build, test y despliegue.</p>\n"}, {"num": 4, "title": "Administración de redes de área local. Gestión de usuarios. Gestión de dispositivos. Monitorización y control de tráfico.", "html": "<p>Una LAN se estructura jerárquicamente: núcleo (core), distribución (VLAN, políticas de enrutamiento) y acceso. <strong>VLAN</strong> (802.1Q) segmenta dominios de difusión; el etiquetado marca las tramas en enlaces troncales. Direccionamiento: <strong>DHCP</strong> (IP, máscara, gateway, DNS con leases) y <strong>DNS</strong> (zonas primarias/secundarias, registros A, AAAA, CNAME, MX, PTR).</p>\n<p><strong>Gestión de usuarios</strong>: Active Directory (LDAP + Kerberos), unidades organizativas (OU), GPO (políticas centralizadas). En Linux: OpenLDAP, FreeIPA, SSSD/Winbind. Modelo <strong>RBAC</strong> (permisos por rol, mínimo privilegio).</p>\n<p><strong>Gestión de dispositivos</strong>: switches gestionables, routers, APs (WPA3/802.1X). MDM/UEM (Microsoft Intune) para políticas de seguridad, cifrado, borrado remoto en dispositivos móviles (BYOD). CMDB para inventario de activos TI.</p>\n<p><strong>Monitorización</strong>: <strong>SNMP</strong> (GET/SET sobre MIB, traps asíncronos; SNMPv3 añade cifrado). Herramientas: Zabbix, PRTG, Nagios, LibreNMS. <strong>NetFlow/sFlow</strong> analizan tráfico a nivel de flujo.</p>\n<p><strong>Control de tráfico</strong>: <strong>QoS</strong> (colas de prioridad, marcado DSCP, traffic shaping/policing). NGFW e IDS/IPS con Deep Packet Inspection. Wireshark/tcpdump para análisis de capturas y forense de incidentes.</p>\n"}, {"num": 5, "title": "Conceptos de seguridad de los sistemas de información. Seguridad física. Seguridad lógica. Amenazas y vulnerabilidades. Técnicas criptográficas y protocolos seguros. Mecanismos de firma digital. Infraestructura física de un CPD: acondicionamiento y equipamiento. Sistemas de gestión de incidencias. Control remoto de puestos de usuario.", "html": "<p>Tríada <strong>CIA</strong>: Confidencialidad, Integridad, Disponibilidad, más Autenticidad y Trazabilidad (recogidas en el ENS, RD 311/2022).</p>\n<p><strong>Seguridad física</strong>: control de acceso (tarjetas, biometría, mantrap), CCTV, extinción de incendios con gas inerte (FM-200, Novec 1230, no daña equipos). <strong>Seguridad lógica</strong>: autenticación (MFA), ACL, cifrado en reposo/tránsito, segmentación de redes.</p>\n<p><strong>Amenazas y vulnerabilidades</strong>: clasificación por origen (naturales, humanas intencionadas/no intencionadas). Riesgo = f(probabilidad, impacto). Gestión de vulnerabilidades: escaneo (Nessus, OpenVAS), CVSS, parcheo priorizado. Malware relevante: ransomware, troyanos, phishing/spear-phishing.</p>\n<p><strong>Criptografía simétrica</strong>: clave única compartida (AES 128/192/256), rápida, problema de distribución. <strong>Asimétrica</strong>: par de claves pública/privada (RSA, ECC), resuelve la distribución a costa de rendimiento; en la práctica se combina (cifrado híbrido). <strong>Hash</strong> (SHA-256, SHA-3): huella irreversible, verifica integridad. Protocolos: <strong>TLS</strong> (handshake, autentica servidor con certificado), <strong>SSH</strong>, <strong>IPsec</strong> (base de VPN).</p>\n<p><strong>Firma digital</strong>: hash cifrado con clave privada del emisor; el receptor descifra con la clave pública y compara. Sustentada en <strong>PKI</strong>: Autoridad de Certificación (CA) emite certificados X.509, cadenas de confianza, CRL/OCSP. En España: FNMT, DNI electrónico.</p>\n<p><strong>Infraestructura física de un CPD</strong>: clasificación <strong>TIER</strong> del Uptime Institute (I sin redundancia, ~99,671%; II redundancia parcial; III mantenimiento concurrente, N+1; IV tolerancia a fallos, doble ruta activa-activa, ~99,995%). Climatización de precisión (CRAC/CRAH), pasillos fríos/calientes, PUE (eficiencia energética), SAI/UPS, generadores diésel, extinción específica para equipamiento eléctrico.</p>\n<p><strong>Gestión de incidencias</strong> (ITIL): incidente (interrupción, restaurar servicio) vs problema (causa raíz, evitar recurrencia). Ciclo de ticket: registro, clasificación, priorización (impacto/urgencia), asignación, resolución, cierre. Herramientas ITSM: ServiceNow, Jira Service Management, GLPI. SLA.</p>\n<p><strong>Control remoto de puestos de usuario</strong>: RDP (cifrado TLS), VNC (protocolo RFB), TeamViewer/AnyDesk. Debe quedar auditado, con consentimiento del usuario y bajo cifrado/autenticación robusta.</p>\n"}, {"num": 6, "title": "Comunicaciones. Medios de transmisión. Modos de comunicación. Equipos terminales y equipos de interconexión y conmutación. Redes de comunicaciones. Redes de conmutación y redes de difusión. Comunicaciones móviles e inalámbricas.", "html": "<h3 id=\"medios-de-transmisión\">Medios de transmisión</h3>\n<p><strong>Cable de pares trenzados</strong>: Cat5e (1 Gbps/100m), Cat6 (1-10 Gbps), Cat6a (10 Gbps/100m), Cat8 (25/40 Gbps/30m, centros de datos). UTP sin apantallar, STP apantalla cada par, FTP apantalla el conjunto. <strong>Fibra óptica</strong>: monomodo (SMF, alcances de decenas de km, backbone) y multimodo (MMF, OM3/OM4/OM5, centros de datos), inmune a interferencias. <strong>Medios no guiados</strong>: radiofrecuencia, infrarrojos, láser.</p>\n<h3 id=\"modos-de-comunicación\">Modos de comunicación</h3>\n<p><strong>Símplex</strong> (unidireccional), <strong>semidúplex/half-duplex</strong> (bidireccional alternado), <strong>dúplex/full-duplex</strong> (bidireccional simultáneo). Síncrona (reloj compartido) vs asíncrona (bits inicio/parada). Serie (estándar actual) vs paralelo (en desuso por skew).</p>\n<h3 id=\"equipos-y-dispositivos-de-interconexión\">Equipos y dispositivos de interconexión</h3>\n<p>DTE (origen/destino de datos) y DCE (adaptan señal al medio). Dispositivos por capa: <strong>repetidor</strong> (física, regenera), <strong>hub</strong> (física, un dominio de colisión), <strong>puente/bridge</strong> (enlace, tabla MAC, STP), <strong>switch</strong> (enlace, multipuerto, VLAN, LACP), <strong>router</strong> (red, tablas de encaminamiento), <strong>gateway</strong> (traduce protocolos hasta capa 7).</p>\n<h3 id=\"redes-de-conmutación-y-de-difusión\">Redes de conmutación y de difusión</h3>\n<p><strong>Conmutación de circuitos</strong>: camino dedicado (telefonía RTC/RDSI). <strong>Conmutación de paquetes</strong>: orientada a conexión (Frame Relay, ATM) o no orientada (IP/datagramas). <strong>Redes de difusión</strong>: canal compartido, requieren protocolos MAC de acceso.</p>\n<h3 id=\"comunicaciones-móviles-e-inalámbricas\">Comunicaciones móviles e inalámbricas</h3>\n<p>Evolución: 1G (analógica) → 2G/GSM (digital, GPRS/EDGE 2.5G) → 3G/UMTS (HSPA) → <strong>4G/LTE</strong> (all-IP, EPC) → <strong>5G NR</strong> (eMBB, URLLC, mMTC; sub-6GHz y mmWave; network slicing). Wi-Fi: 802.11b/g → 802.11ac/Wi-Fi 5 (MU-MIMO) → 802.11ax/Wi-Fi 6-6E (OFDMA, banda 6GHz). Corto alcance: Bluetooth (802.15.1), Zigbee (802.15.4), NFC.</p>\n"}, {"num": 7, "title": "El modelo TCP/IP y el modelo de referencia de interconexión de sistemas abiertos (OSI) de ISO. Protocolos TCP/IP.", "html": "<h3 id=\"modelo-osi-isoiec-7498-1984--7-capas\">Modelo OSI (ISO/IEC 7498, 1984) — 7 capas</h3>\n<ol type=\"1\">\n<li><strong>Física</strong>: bits en bruto, conectores, codificación de línea.</li>\n<li><strong>Enlace</strong>: tramas, CRC, control de flujo, MAC/LLC, direccionamiento MAC.</li>\n<li><strong>Red</strong>: encaminamiento, direccionamiento lógico (IP).</li>\n<li><strong>Transporte</strong>: extremo a extremo, multiplexación por puertos (TCP, UDP).</li>\n<li><strong>Sesión</strong>: establecimiento/sincronización de diálogos.</li>\n<li><strong>Presentación</strong>: representación de datos, cifrado, compresión.</li>\n<li><strong>Aplicación</strong>: interfaz con procesos de usuario (HTTP, FTP, SMTP, DNS).</li>\n</ol>\n<h3 id=\"modelo-tcpip--4-capas\">Modelo TCP/IP — 4 capas</h3>\n<p>Acceso a la red (capas 1-2 OSI) → Internet (capa 3, IP) → Transporte (capa 4, TCP/UDP) → Aplicación (capas 5-7 OSI). Diferencia clave: OSI es teórico-normativo previo a implementación; TCP/IP surgió de la práctica.</p>\n<h3 id=\"protocolos-principales\">Protocolos principales</h3>\n<p><strong>IP</strong>: no orientado a conexión, best-effort. IPv4 (32 bits), IPv6 (128 bits, cabecera fija 40 bytes, sin fragmentación en routers, IPsec nativo, SLAAC). <strong>TCP</strong>: orientado a conexión, fiable, three-way handshake (SYN/SYN-ACK/ACK), control de flujo (ventana deslizante) y congestión. <strong>UDP</strong>: sin conexión, sin garantías, cabecera mínima — DNS, streaming, VoIP, DHCP. <strong>ARP</strong>: IP→MAC en el mismo segmento. <strong>ICMP</strong>: control/diagnóstico (<code>ping</code>, <code>traceroute</code>). <strong>DNS</strong>: UDP/TCP 53, jerárquico, registros A/AAAA/MX/CNAME/NS/PTR/TXT/SOA. <strong>DHCP</strong>: proceso DORA (Discover/Offer/Request/Acknowledge), UDP 67/68.</p>\n"}, {"num": 8, "title": "Internet: arquitectura de red. Origen, evolución y estado actual. Principales servicios. Protocolos HTTP, HTTPS y SSL/TLS.", "html": "<h3 id=\"origen-y-evolución\">Origen y evolución</h3>\n<p><strong>ARPANET</strong> (1969, DARPA). <strong>TCP/IP</strong> (Cerf y Kahn, 1974; adoptado 1983). <strong>HTTP/HTML/URI</strong> (Tim Berners-Lee, CERN, 1990) → World Wide Web (servicio sobre Internet, no confundir con la infraestructura). Transición IPv4→IPv6 en curso por agotamiento de direcciones.</p>\n<h3 id=\"arquitectura\">Arquitectura</h3>\n<p>Jerarquía de operadoras: <strong>Tier 1</strong> (troncales, peering mutuo sin coste), <strong>Tier 2</strong> (regionales), <strong>Tier 3</strong> (ISP de acceso). <strong>IXP</strong> (puntos neutros: ESPANIX, CATNIX). <strong>RIR</strong> (RIPE NCC, ARIN, APNIC...) asignan bloques IP y AS. <strong>BGP</strong> interconecta sistemas autónomos.</p>\n<h3 id=\"principales-servicios\">Principales servicios</h3>\n<p>WWW, correo (SMTP/POP3/IMAP), FTP/SFTP, SSH/RDP, SIP/RTP (VoIP), DNS/DHCP, IaaS/PaaS/SaaS.</p>\n<h3 id=\"http\">HTTP</h3>\n<p>Sin estado, petición-respuesta sobre TCP/80. Métodos: GET, POST, PUT, DELETE, PATCH. Códigos: 2xx éxito, 3xx redirección, 4xx error cliente, 5xx error servidor. <strong>HTTP/1.1</strong>: keep-alive. <strong>HTTP/2</strong>: multiplexado, HPACK. <strong>HTTP/3</strong>: sobre QUIC/UDP, sin head-of-line blocking.</p>\n<h3 id=\"https-y-tls\">HTTPS y TLS</h3>\n<p>Puerto 443. <strong>TLS 1.2/1.3</strong> (SSL obsoleto). Handshake: ClientHello → ServerHello + certificado X.509 → validación de cadena de confianza → intercambio de claves (DHE/ECDHE, forward secrecy) → Finished → tráfico cifrado simétrico (AES-GCM). TLS 1.3 reduce a 1-RTT (0-RTT en reconexión).</p>\n"}, {"num": 9, "title": "Seguridad y protección en redes de comunicaciones. Seguridad perimetral. Acceso remoto seguro a redes. Redes privadas virtuales (VPN). Seguridad en el puesto del usuario.", "html": "<h3 id=\"seguridad-perimetral\">Seguridad perimetral</h3>\n<p><strong>Firewall</strong>: filtrado de paquetes (capa 3/4, sin estado), stateful (tabla de conexiones), de aplicación/proxy (capa 7). <strong>NGFW</strong> integra IPS y control de aplicaciones. <strong>DMZ</strong>: segmento aislado para servicios expuestos. <strong>IDS</strong> (pasivo) vs <strong>IPS</strong> (activo), por firmas o anomalías. Segmentación: VLAN, ACL, Zero Trust.</p>\n<h3 id=\"acceso-remoto-seguro\">Acceso remoto seguro</h3>\n<p>MFA, SSH (clave pública/privada), RDP con NLA sobre VPN, VPN SSL, <strong>ZTNA</strong> (acceso granular por aplicación, verificación continua).</p>\n<h3 id=\"vpn\">VPN</h3>\n<p><strong>IPsec</strong>: capa 3. <strong>AH</strong> (integridad/autenticación, sin cifrar), <strong>ESP</strong> (cifrado+integridad+autenticación), <strong>IKE</strong> (negociación de claves, IKEv1/IKEv2). Modos: transporte (extremo a extremo) y túnel (sitio a sitio). <strong>VPN SSL/TLS</strong>: capa de aplicación, atraviesa NAT/firewalls con facilidad (OpenVPN). <strong>WireGuard</strong>: base de código reducida, ChaCha20/Curve25519.</p>\n<h3 id=\"seguridad-en-el-puesto-del-usuario\">Seguridad en el puesto del usuario</h3>\n<p>Antivirus/EDR, cifrado de disco (BitLocker, LUKS), gestión de parches, control de USB/DLP, mínimo privilegio, MFA, formación anti-phishing, firewall personal.</p>\n"}, {"num": 10, "title": "Redes locales. Tipología. Técnicas de transmisión. Métodos de acceso. Dispositivos de interconexión.", "html": "<h3 id=\"topologías\">Topologías</h3>\n<p><strong>Bus</strong> (medio compartido lineal, un fallo colapsa todo), <strong>anillo</strong> (Token Ring, FDDI), <strong>estrella</strong> (dominante hoy, físicamente hacia switches), <strong>malla</strong> (redundancia alta, backbones), <strong>árbol</strong> (estrellas jerárquicas).</p>\n<h3 id=\"técnicas-de-transmisión\">Técnicas de transmisión</h3>\n<p><strong>Banda base</strong>: señal digital sin modular, todo el canal (Ethernet); codificación Manchester, 4B/5B, 8B/10B. <strong>Banda ancha</strong>: FDM, múltiples canales de frecuencia (CATV, HFC).</p>\n<h3 id=\"métodos-de-acceso-al-medio\">Métodos de acceso al medio</h3>\n<p><strong>CSMA/CD</strong>: Ethernet half-duplex clásico, detecta colisiones, backoff exponencial binario (inoperante en Ethernet full-duplex moderno con switch). <strong>CSMA/CA</strong>: redes inalámbricas 802.11, evita colisiones (no puede detectarlas), RTS/CTS para nodo oculto, ACK explícito por trama. <strong>Paso de testigo</strong>: Token Ring/FDDI, sin colisiones por diseño.</p>\n<h3 id=\"dispositivos-de-interconexión\">Dispositivos de interconexión</h3>\n<p>Repetidor (física), hub (física, dominio de colisión único), puente/bridge (enlace, STP/802.1D), switch (enlace, VLAN 802.1Q, LACP/802.3ad, RSTP), router (red, OSPF/RIP/EIGRP), gateway (traduce protocolos), AP inalámbrico (puente radio-Ethernet).</p>\n"}]}], "MUR": [{"key": "comunes", "title": "Materias comunes", "temas": [{"num": 1, "title": "La Constitución española de 1978: estructura y contenido. Derechos y deberes fundamentales: garantía y suspensión. Instituciones básicas del Estado. Estatuto de Autonomía de la Región de Murcia: estructuración y contenido.", "html": "<p>La Constitución Española (CE) fue aprobada por las Cortes el 31 de octubre de 1978, ratificada en referéndum el 6 de diciembre y sancionada por el Rey el 27 de diciembre de 1978, entrando en vigor el 29 de diciembre. Consta de un Preámbulo, un Título Preliminar (arts. 1-9, que consagra a España como Estado social y democrático de Derecho, la soberanía nacional, la monarquía parlamentaria y el principio de autonomía de nacionalidades y regiones), diez Títulos (I a X, arts. 10 a 169), cuatro disposiciones adicionales, nueve transitorias, una derogatoria y una final.</p>\n<p>El Título I (\"De los derechos y deberes fundamentales\") se estructura en el art. 10 (dignidad de la persona) y cinco capítulos: Capítulo I (españoles y extranjeros), Capítulo II (derechos y libertades, con la Sección 1ª —arts. 14 a 29— de derechos fundamentales y libertades públicas, y la Sección 2ª —arts. 30 a 38— de derechos y deberes de los ciudadanos), Capítulo III (principios rectores de la política social y económica, arts. 39-52) y Capítulo IV (garantías, art. 53).</p>\n<p>Las garantías del art. 53 son: reserva de ley para regular el ejercicio de los derechos (53.1), respeto al contenido esencial, tutela judicial ordinaria preferente y sumaria y recurso de amparo ante el Tribunal Constitucional para los derechos de la Sección 1ª más el art. 14 (53.2), y mera orientación de la actuación de los poderes públicos para los principios del Capítulo III, alegables solo conforme a lo que dispongan las leyes que los desarrollen (53.3). La suspensión de derechos se regula en el art. 55: la general (55.1), aplicable durante los estados de excepción y sitio (LO 4/1981) a derechos como libertad, inviolabilidad del domicilio o secreto de las comunicaciones; y la individual (55.2), vinculada a investigaciones de bandas armadas o terrorismo, bajo control judicial y parlamentario.</p>\n<p>Las instituciones básicas del Estado son: la Corona (Título II, jefatura del Estado, simbólica y arbitral); las Cortes Generales (Título III), bicamerales —Congreso de los Diputados (300-400 diputados, actualmente 350, elección por circunscripción provincial y sistema proporcional D'Hondt) y Senado (cámara de representación territorial, mayoría de escaños por elección directa provincial y una parte designada por las Asambleas autonómicas)—; el Gobierno y la Administración (Título IV); las relaciones Gobierno-Cortes (Título V); el Poder Judicial (Título VI, con el Consejo General del Poder Judicial como órgano de gobierno); Economía y Hacienda (Título VII); la Organización Territorial del Estado (Título VIII, municipios, provincias y Comunidades Autónomas); y el Tribunal Constitucional (Título IX).</p>\n<p>El Estatuto de Autonomía de la Región de Murcia fue aprobado por Ley Orgánica 4/1982, de 9 de junio, y reformado, entre otras, por LO 1/1998 y LO 4/2013. Su estructura comprende un Título Preliminar (identidad, capitalidad en Murcia, símbolos), Título I (competencias de la Comunidad Autónoma, clasificadas en exclusivas, de desarrollo legislativo y ejecución, y de ejecución de la legislación estatal, arts. 10 a 12), Título II (organización institucional: Asamblea Regional, Presidente y Consejo de Gobierno), Título III (Administración de Justicia), Título IV (Economía y Hacienda) y Título V (reforma del Estatuto, que exige aprobación por mayoría absoluta de la Asamblea Regional y tramitación como ley orgánica en las Cortes Generales). La Asamblea Regional se compone de un número de Diputados fijado por la legislación electoral (45), elegidos por sufragio universal cada cuatro años.</p>\n"}, {"num": 2, "title": "Concepto de Administración Pública. Diferentes niveles de la Administración Pública: Administración Estatal, Autonómica, Local e Institucional: ideas básicas. La Administración Pública de la Comunidad Autónoma de Murcia: organización y régimen jurídico.", "html": "<p>La Administración Pública puede definirse como la organización personificada, dotada de personalidad jurídica propia, que actúa al servicio de los intereses generales (art. 103.1 CE) bajo el sometimiento pleno a la ley y al Derecho, y sujeta en su actuación al Derecho Administrativo. Se rige, con carácter básico estatal, por la Ley 40/2015, de Régimen Jurídico del Sector Público (LRJSP), y en su vertiente procedimental por la Ley 39/2015, del Procedimiento Administrativo Común (LPAC).</p>\n<p>El ordenamiento reconoce cuatro niveles: <strong>AGE</strong> (órganos superiores y directivos, Ley 40/2015 Título II, estructura periférica y exterior); <strong>Administración Autonómica</strong> (17 CCAA + Ceuta y Melilla, potestad de autoorganización según su Estatuto); <strong>Administración Local</strong> (Ley 7/1985 LBRL, municipios, provincias e islas, art. 137 CE); <strong>Administración Institucional</strong> (entes vinculados a una Administración territorial: organismos autónomos, entidades públicas empresariales, autoridades independientes, sociedades mercantiles estatales, consorcios, fundaciones — Ley 40/2015 arts. 84 y ss.).</p>\n<p>La <strong>Administración Pública de la CARM</strong> se organiza conforme a la Ley 7/2004, de 28 de diciembre, de Organización y Régimen Jurídico de la Administración Pública de la Región de Murcia: Consejo de Gobierno (dirección política y administrativa, presidido por el Presidente) y Consejerías (departamentos, cada una con Consejero, Secretarías Generales, Direcciones Generales y, en su caso, Viceconsejerías), completada por el sector público institucional (organismos autónomos, entes públicos, empresas y fundaciones públicas regionales). Principios: eficacia, jerarquía, descentralización, desconcentración, coordinación (art. 103 CE).</p>\n"}, {"num": 3, "title": "Ordenación de la Función Pública Regional. Principios informadores. Clases de personal: su régimen jurídico. Derechos y Deberes: derechos de negociación colectiva y huelga. Régimen disciplinario. Régimen de incompatibilidades. Retribuciones. La responsabilidad de las administraciones y de los funcionarios. La protección de datos de carácter personal y el secreto profesional.", "html": "<p>Se rige por el Texto Refundido de la Ley de la Función Pública de la Región de Murcia (Decreto Legislativo 1/2001), en lo no derogado, y con carácter básico/supletorio por el TREBEP (RDLeg 5/2015). Principios: igualdad, mérito y capacidad, publicidad, transparencia, objetividad, eficacia.</p>\n<p><strong>Clases de personal</strong>: funcionarios de carrera, funcionarios interinos (art. 10 TREBEP: sustitución, vacante, programas, exceso de tareas), personal laboral (fijo/indefinido/temporal, Estatuto de los Trabajadores), personal eventual (confianza/asesoramiento, cese automático, art. 12 TREBEP).</p>\n<p><strong>Negociación colectiva y huelga</strong>: Mesas de Negociación (General y Sectoriales, arts. 34-38 bis TREBEP); huelga (art. 28.2 CE) con servicios mínimos esenciales (RD-Ley 17/1977).</p>\n<p><strong>Régimen disciplinario</strong> (arts. 93-98 TREBEP, RD 33/1986 supletorio): faltas muy graves/graves/leves, sanciones desde apercibimiento hasta separación del servicio/despido, procedimiento con pliego de cargos y audiencia.</p>\n<p><strong>Incompatibilidades</strong>: Ley 53/1984, dedicación a un solo puesto salvo excepciones tasadas (docencia, investigación) y compatibilidad privada autorizada (máx. 15% retribuciones).</p>\n<p><strong>Retribuciones</strong> (art. 23 TREBEP): básicas (sueldo, trienios) y complementarias (destino, específico, productividad, gratificaciones).</p>\n<p><strong>Responsabilidad patrimonial</strong> (art. 32 y ss. Ley 40/2015): lesión antijurídica, efectiva, evaluable, individualizada, nexo causal, sin fuerza mayor, prescripción de un año. Responsabilidad del funcionario: disciplinaria, civil (dolo/culpa grave, repetición), penal.</p>\n<p><strong>Protección de datos</strong>: RGPD + LOPDGDD, DPO. <strong>Secreto profesional</strong>: deber de sigilo, art. 53 TREBEP (código de conducta).</p>\n"}, {"num": 4, "title": "El presupuesto de la Comunidad Autónoma. Principios presupuestarios. Elaboración y aprobación del presupuesto. La ejecución del presupuesto: operaciones necesarias. Gestión de los diferentes gastos. Modificaciones presupuestarias.", "html": "<p>Se rige por el Texto Refundido de la Ley de Hacienda de la Región de Murcia (Decreto Legislativo 1/1999) y la LO 2/2012 de Estabilidad Presupuestaria. <strong>Principios</strong>: unidad, universalidad, especialidad (cualitativa/cuantitativa/temporal), anualidad, equilibrio y estabilidad, prórroga automática.</p>\n<p><strong>Elaboración</strong>: la Consejería de Hacienda recaba anteproyectos de las Consejerías, elabora el anteproyecto de Ley de Presupuestos, aprobado por el Consejo de Gobierno como proyecto de ley, tramitado y aprobado por la Asamblea Regional antes del 31 de diciembre.</p>\n<p><strong>Ejecución — fases del gasto</strong>: <strong>A</strong>utorización, <strong>D</strong>isposición/compromiso, <strong>O</strong>bligación (reconocimiento), <strong>P</strong>ago (ADO puede acumularse en un solo acto).</p>\n<p><strong>Gestión de gastos</strong>: personal, corrientes en bienes y servicios, financieros, transferencias corrientes, inversiones reales, transferencias de capital.</p>\n<p><strong>Modificaciones presupuestarias</strong>: créditos extraordinarios (gasto sin crédito), suplementos de crédito (crédito insuficiente), transferencias de crédito, generación de créditos (ingresos afectados), ampliación de créditos, incorporación de remanentes.</p>\n"}, {"num": 5, "title": "Los principios informadores de la actividad administrativa: eficacia, jerarquía, descentralización, desconcentración, coordinación y legalidad.", "html": "<p>Art. 103.1 CE: la Administración sirve con objetividad los intereses generales conforme a eficacia, jerarquía, descentralización, desconcentración y coordinación, con sometimiento pleno a la ley y al Derecho (desarrollado en art. 3 Ley 40/2015).</p>\n<p><strong>Eficacia</strong>: cumplimiento efectivo de fines con el menor coste/tiempo; se complementa con eficiencia. <strong>Jerarquía</strong>: estructura piramidal, superioridad-subordinación, potestad de dirección y revisión (recurso de alzada). <strong>Descentralización</strong>: distribución de competencias entre Administraciones distintas dotadas de personalidad jurídica propia, sin relación jerárquica (territorial o funcional). <strong>Desconcentración</strong>: transferencia de competencias de órgano superior a inferior dentro de la misma persona jurídica (art. 8 Ley 40/2015), persiste la jerarquía. <strong>Coordinación</strong>: coherencia entre órganos/Administraciones sobre un mismo ámbito, mediante conferencias sectoriales, convenios, planes conjuntos. <strong>Legalidad</strong>: sometimiento pleno a la ley y al Derecho (art. 9.3 CE, interdicción de la arbitrariedad), reserva de ley, jerarquía normativa, control judicial (art. 106.1 CE).</p>\n"}, {"num": 6, "title": "El procedimiento administrativo común: concepto. Fases del procedimiento administrativo común. Audiencia al interesado. Cómputo de plazos. La revisión de los actos en vía administrativa.
