siness Impact Analysis), RTO (Recovery Time Objective) y RPO (Recovery Point Objective).</li>\n<li><strong>Gestión financiera de servicios</strong>: presupuestación, contabilidad y facturación de TI (chargeback).</li>\n<li><strong>Gestión de la seguridad de la información</strong>: controles alineados con ISO/IEC 27001, gestión de incidentes de seguridad diferenciados de incidentes de servicio.</li>\n<li><strong>Gestión de relaciones de negocio y de proveedores (SUPPM)</strong>: contratos, UC (Underpinning Contracts) con terceros.</li>\n</ul>\n<p><strong>Procesos de soporte (Service Support)</strong>:</p>\n<ul>\n<li><strong>Gestión de incidentes</strong>: restaurar el servicio lo antes posible; clasificación por prioridad = impacto × urgencia; workaround como solución temporal.</li>\n<li><strong>Gestión de peticiones de servicio</strong>: canaliza solicitudes estándar (altas de usuario, permisos) normalmente vía catálogo de servicios.</li>\n<li><strong>Gestión de problemas</strong>: análisis de causa raíz (RCA) para evitar recurrencia de incidentes; genera KEDB (Known Error Database).</li>\n<li><strong>Gestión de despliegue y entrega (Release Management)</strong>: paso a producción controlado de nuevas versiones, con entornos DEV/TEST/PRE/PRO diferenciados.</li>\n</ul>\n<p><strong>Certificación.</strong> La otorgan organismos acreditados (en España, AENOR) tras una auditoría de tercera parte que valida que el SMS cumple los requisitos \"SHALL\" de la cláusula 4-10. La certificación tiene alcance definido (qué servicios, qué ubicaciones) y vigencia trienal con auditorías de seguimiento anuales.</p>\n<p><strong>Diferencia con ITIL</strong>: ITIL es un marco de buenas prácticas no certificable por organizaciones (solo las personas se certifican, ITIL Foundation/Practitioner/Managing Professional); ISO/IEC 20000 es una norma certificable que puede implementarse apoyándose en procesos ITIL como referencia práctica, pero define <em>qué</em> debe cumplirse, no <em>cómo</em>.</p>\n<p><strong>Ejemplo de métrica de SLA en un informe mensual:</strong></p>\n<pre><code>Servicio: ERP-Producción\nDisponibilidad comprometida: 99,5%\nDisponibilidad real: 99,72%\nIncidentes prioridad 1: 2 (SLA cumplido en ambos, resolución &lt; 4h)\nMTTR medio: 2h 15min</code></pre>\n<p>En la Administración Pública, la adopción de ISO/IEC 20000 suele vincularse a pliegos de contratación de servicios TIC externalizados, exigiendo certificación al proveedor como garantía de madurez del proceso.</p>\n"}, {"num": 17, "title": "Gestión de servicios de TI. ITIL: Conceptos. Ciclo de vida del servicio. Transición, operación y mejora continua del servicio.", "html": "<p>ITIL (Information Technology Infrastructure Library) es el marco de referencia de gestión de servicios de TI más extendido, desarrollado originalmente por la CCTA británica (hoy AXELOS, y desde 2021 propiedad de PeopleCert). Existen varias versiones: ITIL v2 (procesos agrupados en Service Support y Service Delivery), <strong>ITIL v3/2011</strong> (ciclo de vida del servicio en 5 fases, la base tradicional del temario de oposición) e <strong>ITIL 4</strong> (2019), que introduce el Sistema de Valor del Servicio (SVS) y las 34 prácticas.</p>\n<p><strong>Conceptos fundamentales (ITIL v3).</strong> Servicio: medio de entregar valor mediante la facilitación de resultados sin que el cliente asuma costes ni riesgos específicos. Valor = utilidad (fit for purpose, \"¿qué hace?\") + garantía (fit for use, \"¿cómo se entrega?\": disponibilidad, capacidad, continuidad, seguridad). Los 4 elementos que componen un servicio siguen el modelo de las 4 P: Personas, Procesos, Productos (tecnología) y Partners (proveedores/socios).</p>\n<p><strong>El ciclo de vida del servicio</strong> se articula en 5 fases, cada una con procesos y funciones propios:</p>\n<p><strong>1. Estrategia del servicio (Service Strategy).</strong> Define qué servicios ofrecer y a quién. Procesos: gestión de la estrategia, gestión del portfolio de servicios (pipeline, catálogo, servicios retirados), gestión financiera, gestión de la demanda (PBA, Patterns of Business Activity) y gestión de relaciones de negocio.</p>\n<p><strong>2. Diseño del servicio (Service Design).</strong> Diseña servicios nuevos o modificados y sus procesos de soporte. Procesos: gestión del catálogo de servicios, gestión del nivel de servicio (SLA/OLA/UC), gestión de la disponibilidad, gestión de la capacidad, gestión de la continuidad del servicio TI (ITSCM), gestión de la seguridad de la información, gestión de proveedores. Entregable clave: el paquete de diseño del servicio (SDP).</p>\n<p><strong>3. Transición del servicio (Service Transition).</strong> Introduce cambios en producción de forma controlada, gestionando el riesgo. Procesos principales:</p>\n<ul>\n<li><strong>Gestión de cambios</strong>: evalúa mediante el CAB tipos de cambio (estándar, normal, emergencia — usando ECAB), con los \"7 R\" para valorar una RFC (Request for Change): quién lo solicita, razón, resultado esperado, riesgos, recursos necesarios, responsables de construcción/prueba/implementación, y relación con otros cambios.</li>\n<li><strong>Gestión de la configuración y activos del servicio (SACM)</strong>: CMDB/CMS (Configuration Management System) con CI y sus relaciones.</li>\n<li><strong>Gestión de entregas y despliegues (Release and Deployment)</strong>: unidades de entrega (release units), opciones de despliegue big bang vs. fases.</li>\n<li><strong>Validación y pruebas del servicio</strong>: modelo en V, entornos de prueba.</li>\n<li><strong>Evaluación del cambio</strong> y <strong>gestión del conocimiento</strong> (SKMS, Service Knowledge Management System).</li>\n</ul>\n<p><strong>4. Operación del servicio (Service Operation).</strong> Fase de ejecución diaria, donde se entrega y soporta el valor. Procesos:</p>\n<ul>\n<li><strong>Gestión de eventos</strong>: monitorización, clasificación (informativo, advertencia, excepción).</li>\n<li><strong>Gestión de incidentes</strong>: restauración rápida del servicio; prioridad = impacto × urgencia; escalado funcional (a especialistas) vs. jerárquico (a gestión).</li>\n<li><strong>Cumplimiento de peticiones</strong>: vía catálogo de servicios.</li>\n<li><strong>Gestión de problemas</strong>: reactiva (tras incidentes) y proactiva (análisis de tendencias); RCA con técnicas como los 5 porqués o Ishikawa; genera errores conocidos (KEDB) y workarounds.</li>\n<li><strong>Gestión de accesos</strong>: provisión de derechos según políticas de seguridad. Funciones: <strong>Service Desk</strong> (único punto de contacto, SPOC), gestión técnica, gestión de operaciones TI, gestión de aplicaciones.</li>\n</ul>\n<p><strong>5. Mejora continua del servicio (CSI, Continual Service Improvement).</strong> Transversal a todo el ciclo, basada en el ciclo PHVA. Modelo CSI en 7 pasos: identificar la estrategia de mejora → definir qué se medirá → recopilar datos → procesarlos → analizarlos → presentarlos y usarlos → implementar la mejora. Utiliza el <strong>enfoque de las 7 R</strong> y el <strong>Registro de Mejoras del Servicio (SIP, CSI Register)</strong>. Métricas: KPI, factores críticos de éxito (CSF) y métricas de tecnología/proceso/servicio.</p>\n<p><strong>ITIL 4</strong> sustituye el ciclo de vida por el SVS, con la <strong>cadena de valor del servicio</strong> (Plan, Improve, Engage, Design &amp; Transition, Obtain/Build, Deliver &amp; Support) y añade prácticas nuevas como gestión de relaciones o gestión de riesgos, manteniendo compatibilidad conceptual con v3.</p>\n"}, {"num": 18, "title": "Gestión de proyectos. PRINCE2.", "html": "<p>PRINCE2 (PRojects IN Controlled Environments) es un método de gestión de proyectos desarrollado por la CCTA británica en 1996 y hoy gestionado por AXELOS/PeopleCert. Es un método estructurado, basado en procesos, orientado a producto y aplicable a cualquier tipo de proyecto independientemente del sector. La última edición relevante es PRINCE2 6th Edition (2017) y PRINCE2 7 (2023).</p>\n<p><strong>Los 7 principios</strong> (obligatorios, no adaptables):</p>\n<ol type=\"1\">\n<li>Justificación comercial continua (Business Case vivo durante todo el proyecto).</li>\n<li>Aprender de la experiencia (lecciones aprendidas al inicio, durante y al cierre).</li>\n<li>Roles y responsabilidades definidos.</li>\n<li>Gestión por fases (Stages), con puntos de decisión (Stage Boundaries).</li>\n<li>Gestión por excepción: cada nivel de dirección delega tolerancias (tiempo, coste, calidad, alcance, riesgo, beneficios) al nivel inferior; solo se escala si se superan.</li>\n<li>Enfoque en los productos (Product-Based Planning), no en las actividades.</li>\n<li>Adaptación al entorno del proyecto (tailoring).</li>\n</ol>\n<p><strong>Los 7 temas</strong> (aspectos que deben gestionarse continuamente): Business Case, Organización, Calidad, Planes, Riesgo, Cambio (control de configuración e incidencias) y Progreso (control de avance mediante tolerancias).</p>\n<p><strong>Estructura organizativa (los 4 niveles):</strong></p>\n<ul>\n<li><strong>Junta de Proyecto (Project Board)</strong>: máxima autoridad, formada por Ejecutivo (Executive, representa el negocio y toma decisiones finales), Usuario Senior (representa a quienes usarán el producto) y Proveedor Senior (representa a quienes lo construyen).</li>\n<li><strong>Gestión (Project Manager)</strong>: gestión diaria del proyecto.</li>\n<li><strong>Entrega (Team Manager)</strong>: gestión de equipos de trabajo especializados.</li>\n<li><strong>Dirección corporativa/de programa</strong>: por encima de la Junta, encarga el proyecto (Project Mandate). Roles de apoyo: Project Assurance (auditoría independiente) y Project Support (asistencia administrativa, gestión de configuración).</li>\n</ul>\n<p><strong>Los 7 procesos:</strong></p>\n<ol type=\"1\">\n<li><strong>SU – Puesta en marcha (Starting Up a Project)</strong>: valida la idea, nombra al Ejecutivo y PM, elabora el Project Brief.</li>\n<li><strong>IP – Iniciación (Initiating a Project)</strong>: produce el <strong>Documento de Inicio del Proyecto (PID)</strong>, con Business Case detallado, plan de proyecto, estrategias (calidad, riesgos, comunicación, configuración).</li>\n<li><strong>DP – Dirección (Directing a Project)</strong>: la Junta autoriza inicio, fases y cierre; gestiona por excepción.</li>\n<li><strong>CS – Control de una fase (Controlling a Stage)</strong>: asignación de paquetes de trabajo (Work Packages), seguimiento de progreso, gestión de incidencias (Issues) mediante el registro de incidencias.</li>\n<li><strong>MP – Gestión de la entrega de producto (Managing Product Delivery)</strong>: el Team Manager ejecuta y reporta sobre los Work Packages (Checkpoint Reports).</li>\n<li><strong>SB – Gestión de los límites de fase (Managing a Stage Boundary)</strong>: reporta a la Junta al final de cada fase (End Stage Report) y planifica la siguiente.</li>\n<li><strong>CP – Cierre de proyecto (Closing a Project)</strong>: entrega productos, lecciones aprendidas, plan de revisión de beneficios post-proyecto.</li>\n</ol>\n<p><strong>Los 26 productos de gestión</strong> documentan el método; los más relevantes: Business Case, PID, Plan de Proyecto/Fase/Equipo, Registro de Riesgos, Registro de Incidencias (Issue Register), Registro de Calidad, Registro de Lecciones, Informe de Progreso (Highlight Report), Informe de Excepción (Exception Report) y Registro de Configuración.</p>\n<p><strong>Planificación basada en productos:</strong> se elabora una Estructura de Descomposición de Productos (PBS), Descripciones de Producto (con criterios de calidad y método de verificación), un diagrama de secuencia de productos y finalmente el plan de actividades derivado.</p>\n<p><strong>PRINCE2 Agile</strong> combina el marco con prácticas ágiles (Scrum, Kanban), manteniendo la gobernanza PRINCE2 (Business Case, tolerancias, roles) mientras el equipo de entrega trabaja en sprints, útil cuando la Administración exige control formal de contratos pero el desarrollo se organiza de forma ágil.</p>\n<p><strong>Certificaciones:</strong> Foundation (conceptos) y Practitioner (aplicación adaptativa a un contexto real, examen basado en escenario).</p>\n"}, {"num": 19, "title": "Gestión de proyectos con metodologías ágiles. Scrum.", "html": "<p>Las metodologías ágiles surgen formalmente con el <strong>Manifiesto Ágil (2001)</strong>, firmado por 17 desarrolladores, que establece 4 valores: individuos e interacciones sobre procesos y herramientas; software funcionando sobre documentación exhaustiva; colaboración con el cliente sobre negociación contractual; respuesta al cambio sobre seguimiento de un plan. Se apoya en 12 principios (entrega temprana y continua, aceptar cambios incluso tardíos, entregas frecuentes, colaboración diaria negocio-desarrollo, equipos motivados y autoorganizados, comunicación cara a cara, software funcionando como medida de progreso, ritmo sostenible, excelencia técnica, simplicidad, retrospectivas regulares).</p>\n<p><strong>Scrum</strong> (Schwaber y Sutherland) es el framework ágil más adoptado, definido formalmente en la <strong>Guía Scrum</strong> (última revisión 2020). No es una metodología prescriptiva completa sino un marco ligero basado en control de procesos empírico: transparencia, inspección y adaptación.</p>\n<p><strong>Roles (2020: los \"3 responsabilidades\" del Scrum Team, equipo único auto-gestionado ≤10 personas):</strong></p>\n<ul>\n<li><strong>Product Owner (PO)</strong>: maximiza el valor del producto, gestiona y prioriza el <strong>Product Backlog</strong>, único responsable de definir qué se construye.</li>\n<li><strong>Scrum Master</strong>: garante del marco Scrum, elimina impedimentos, facilita eventos, sirve tanto al equipo como a la organización (coaching).</li>\n<li><strong>Developers</strong>: equipo multidisciplinar que construye el Incremento cada Sprint.</li>\n</ul>\n<p><strong>Artefactos y sus compromisos (commitments):</strong></p>\n<ul>\n<li><strong>Product Backlog</strong> (compromiso: <strong>Product Goal</strong>): lista ordenada y viva de todo lo pendiente (historias de usuario, bugs, deuda técnica), refinada continuamente (Backlog Refinement).</li>\n<li><strong>Sprint Backlog</strong> (compromiso: <strong>Sprint Goal</strong>): elementos seleccionados para el Sprint más el plan para entregarlos.</li>\n<li><strong>Incremento</strong> (compromiso: <strong>Definición de Terminado, DoD</strong>): suma de todos los elementos completados, debe ser utilizable e inspeccionable.</li>\n</ul>\n<p><strong>Eventos, dentro de un Sprint (bloque de tiempo fijo, típicamente 2-4 semanas):</strong></p>\n<ol type=\"1\">\n<li><strong>Sprint Planning</strong> (máx. 8h para sprint de 1 mes): responde qué se hará (selección de Product Backlog Items) y cómo (descomposición en tareas), fijando el Sprint Goal.</li>\n<li><strong>Daily Scrum</strong> (15 min diarios): sincronización del equipo, inspección de progreso hacia el Sprint Goal.</li>\n<li><strong>Sprint Review</strong>: inspección del Incremento con stakeholders, retroalimentación que alimenta el Product Backlog.</li>\n<li><strong>Sprint Retrospective</strong>: el equipo identifica mejoras de proceso, personas, herramientas para el siguiente Sprint.</li>\n</ol>\n<p><strong>Historias de usuario</strong>, técnica habitual (no formalmente parte de Scrum) para expresar el backlog: formato <em>\"Como [rol], quiero [funcionalidad] para [beneficio]\"</em>, con criterios INVEST (Independiente, Negociable, Valiosa, Estimable, Small/pequeña, Testeable) y criterios de aceptación tipo Gherkin (Given/When/Then).</p>\n<p><strong>Estimación:</strong> puntos de historia (Story Points, escala Fibonacci: 1,2,3,5,8,13...) mediante Planning Poker, midiendo esfuerzo/complejidad relativa, no tiempo absoluto. La <strong>velocidad</strong> (puntos completados por sprint) permite proyectar entregas.</p>\n<p><strong>Ejemplo de tablero Kanban de sprint:</strong></p>\n<pre><code>To Do          | In Progress    | In Review   | Done\n---------------|----------------|-------------|-------\nUS-102 (5pts)  | US-098 (3pts)  | US-095 (2pts)| US-090\nUS-103 (3pts)  |                |             | US-091</code></pre>\n<p><strong>Otros frameworks ágiles relacionados:</strong> Kanban (flujo continuo, WIP limits, sin sprints), XP/Extreme Programming (TDD, pair programming, integración continua), Lean, y a escala <strong>SAFe</strong> (Scaled Agile Framework) o <strong>LeSS</strong>, relevantes cuando varios equipos Scrum coordinan un mismo producto grande, algo habitual en proyectos TIC de gran envergadura en la Administración.</p>\n<p><strong>Diferencias clave frente a metodologías predictivas (cascada):</strong> planificación adaptativa e iterativa frente a planificación exhaustiva inicial; entregas incrementales frecuentes frente a entrega única al final; el alcance es la variable flexible (frente a tiempo/coste fijos), mientras tiempo y coste tienden a fijarse por el timebox del Sprint.</p>\n"}, {"num": 20, "title": "Programación orientada a objetos (clases, objetos, herencia, métodos). Lenguaje Unificado de Modelado (UML).", "html": "<p><strong>Programación orientada a objetos (POO).</strong> Paradigma que organiza el software en torno a objetos, instancias de clases que encapsulan estado (atributos) y comportamiento (métodos). Los 4 pilares son:</p>\n<p><strong>1. Encapsulación</strong>: oculta el estado interno tras una interfaz pública, controlando el acceso mediante modificadores de visibilidad (<code>private</code>, <code>protected</code>, <code>public</code>, <code>package/default</code>).</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> CuentaBancaria <span class=\"op\">{</span></span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">private</span> <span class=\"dt\">double</span> saldo<span class=\"op\">;</span> <span class=\"co\">// oculto al exterior</span></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"dt\">void</span> <span class=\"fu\">ingresar</span><span class=\"op\">(</span><span class=\"dt\">double</span> importe<span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"cf\">if</span> <span class=\"op\">(</span>importe <span class=\"op\">&gt;</span> <span class=\"dv\">0</span><span class=\"op\">)</span> <span class=\"kw\">this</span><span class=\"op\">.</span><span class=\"fu\">saldo</span> <span class=\"op\">+=</span> importe<span class=\"op\">;</span></span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"op\">}</span></span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"dt\">double</span> <span class=\"fu\">getSaldo</span><span class=\"op\">()</span> <span class=\"op\">{</span> <span class=\"cf\">return</span> saldo<span class=\"op\">;</span> <span class=\"op\">}</span></span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p><strong>2. Herencia</strong>: una clase (subclase) reutiliza y extiende atributos/métodos de otra (superclase), modelando relaciones \"es-un\".</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> CuentaAhorro <span class=\"kw\">extends</span> CuentaBancaria <span class=\"op\">{</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">private</span> <span class=\"dt\">double</span> tipoInteres<span class=\"op\">;</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"dt\">void</span> <span class=\"fu\">aplicarInteres</span><span class=\"op\">()</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"fu\">ingresar</span><span class=\"op\">(</span><span class=\"fu\">getSaldo</span><span class=\"op\">()</span> <span class=\"op\">*</span> tipoInteres<span class=\"op\">);</span> <span class=\"co\">// reutiliza método heredado</span></span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"op\">}</span></span>\n<span id=\"cb2-6\"><a href=\"#cb2-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p><strong>3. Polimorfismo</strong>: un mismo mensaje produce comportamientos distintos según el objeto receptor. Polimorfismo de sobreescritura (<em>overriding</em>, en tiempo de ejecución mediante enlace dinámico) frente a sobrecarga (<em>overloading</em>, en tiempo de compilación).</p>\n<div class=\"sourceCode\" id=\"cb3\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb3-1\"><a href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">class</span> Figura <span class=\"op\">{</span> <span class=\"dt\">double</span> <span class=\"fu\">area</span><span class=\"op\">()</span> <span class=\"op\">{</span> <span class=\"cf\">return</span> <span class=\"dv\">0</span><span class=\"op\">;</span> <span class=\"op\">}</span> <span class=\"op\">}</span></span>\n<span id=\"cb3-2\"><a href=\"#cb3-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">class</span> Circulo <span class=\"kw\">extends</span> Figura <span class=\"op\">{</span></span>\n<span id=\"cb3-3\"><a href=\"#cb3-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">double</span> radio<span class=\"op\">;</span></span>\n<span id=\"cb3-4\"><a href=\"#cb3-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"at\">@Override</span> <span class=\"dt\">double</span> <span class=\"fu\">area</span><span class=\"op\">()</span> <span class=\"op\">{</span> <span class=\"cf\">return</span> <span class=\"bu\">Math</span><span class=\"op\">.</span><span class=\"fu\">PI</span> <span class=\"op\">*</span> radio <span class=\"op\">*</span> radio<span class=\"op\">;</span> <span class=\"op\">}</span></span>\n<span id=\"cb3-5\"><a href=\"#cb3-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p><strong>4. Abstracción</strong>: modelar solo los aspectos relevantes del dominio, mediante clases abstractas (<code>abstract class</code>, pueden tener implementación parcial) e interfaces (contrato puro, en Java desde v8 con métodos <code>default</code>).</p>\n<p><strong>Otros conceptos</strong>: composición vs. herencia (\"favorecer composición sobre herencia\" — principio de diseño para evitar jerarquías rígidas); clases y métodos <code>static</code> (pertenecen a la clase, no a la instancia); constructores y sobrecarga de constructores; principio SOLID (Responsabilidad Única, Abierto/Cerrado, Sustitución de Liskov, Segregación de Interfaces, Inversión de Dependencias), base del diseño orientado a objetos de calidad.</p>\n<p><strong>UML (Unified Modeling Language).</strong> Lenguaje gráfico estándar (gestionado por OMG, Object Management Group) para especificar, visualizar, construir y documentar sistemas software. No es un método sino una notación. Versión de referencia: UML 2.5.</p>\n<p><strong>Diagramas estructurales:</strong></p>\n<ul>\n<li><strong>Clases</strong>: el más usado, representa clases con 3 compartimentos (nombre, atributos, métodos) y relaciones — asociación (línea simple, con multiplicidad 1, 0..1, <em>, 1..</em>), agregación (rombo hueco, \"tiene un\", ciclo de vida independiente), composición (rombo relleno, ciclo de vida dependiente), generalización/herencia (flecha triangular hueca), dependencia (línea discontinua) y realización de interfaz (línea discontinua con triángulo).</li>\n<li><strong>Objetos</strong>: instantánea de instancias concretas en un momento dado.</li>\n<li><strong>Componentes</strong> y <strong>Despliegue</strong> (nodos físicos, servidores, dispositivos y su interconexión).</li>\n<li><strong>Paquetes</strong>: agrupación lógica de elementos.</li>\n</ul>\n<p><strong>Diagramas de comportamiento:</strong></p>\n<ul>\n<li><strong>Casos de uso</strong>: actores (externos al sistema) y casos de uso (funcionalidades), con relaciones <code>&lt;&lt;include&gt;&gt;</code> (obligatoria) y <code>&lt;&lt;extend&gt;&gt;</code> (opcional/condicional).</li>\n<li><strong>Secuencia</strong>: interacción entre objetos ordenada temporalmente (eje vertical = tiempo), con líneas de vida, mensajes síncronos/asíncronos y fragmentos combinados (<code>alt</code>, <code>loop</code>, <code>opt</code>).</li>\n<li><strong>Actividades</strong>: flujo de control/datos, similar a diagramas de flujo pero con carriles (swimlanes), bifurcaciones y uniones.</li>\n<li><strong>Estados (máquina de estados)</strong>: estados, transiciones, eventos y guardas de un objeto a lo largo de su ciclo de vida.</li>\n<li><strong>Comunicación</strong>, <strong>Temporización</strong> y <strong>Vista general de interacción</strong>, menos usados en la práctica.</li>\n</ul>\n<p><strong>Ejemplo textual de relación en diagrama de clases:</strong></p>\n<pre><code>Cliente &quot;1&quot; --- &quot;0..*&quot; Pedido : realiza\nPedido *-- LineaPedido : contiene (composición)\nEmpleado ..|&gt; IAutenticable : implementa</code></pre>\n<p>UML se emplea típicamente en fases de análisis y diseño (metodologías como el Proceso Unificado, RUP) y sigue siendo referencia en documentación de arquitectura de sistemas de información en proyectos públicos, aunque en desarrollo ágil su uso se simplifica a diagramas puntuales de apoyo (whiteboard UML) en lugar de especificación exhaustiva.</p>\n"}, {"num": 21, "title": "Oracle. Objetos del esquema: tablas, vistas, secuencias, sinónimos, índices, paquetes, procedimientos, funciones, triggers, etcétera. Dependencias entre objetos. El diccionario de datos. Tipos de datos e integridad.", "html": "<p>Un <strong>esquema</strong> en Oracle es la colección de objetos de base de datos asociados a un usuario, que comparten el mismo namespace.</p>\n<p><strong>Objetos del esquema:</strong></p>\n<ul>\n<li><strong>Tablas</strong>: estructura básica de almacenamiento en filas y columnas. Pueden ser tablas normales, particionadas (<code>PARTITION BY RANGE/LIST/HASH</code>), organizadas por índice (IOT) o temporales (<code>GLOBAL TEMPORARY</code>).</li>\n<li><strong>Vistas</strong>: consultas almacenadas que presentan datos de una o varias tablas; pueden ser actualizables si cumplen ciertas condiciones (<code>CREATE OR REPLACE VIEW</code>). Las vistas materializadas (<code>CREATE MATERIALIZED VIEW</code>) almacenan físicamente el resultado y se refrescan (<code>ON COMMIT</code> o <code>ON DEMAND</code>), útiles en data warehousing.</li>\n<li><strong>Secuencias</strong>: generadores de números únicos, típicamente para claves primarias: <code>CREATE SEQUENCE seq_pedido START WITH 1 INCREMENT BY 1 NOCACHE;</code> — se invocan con <code>seq_pedido.NEXTVAL</code> y <code>.CURRVAL</code>.</li>\n<li><strong>Sinónimos</strong>: alias de otros objetos, privados o públicos (<code>CREATE PUBLIC SYNONYM emp_syn FOR hr.empleados;</code>), facilitan la transparencia de ubicación (útil junto a <code>DBLINK</code> para acceso remoto).</li>\n<li><strong>Índices</strong>: estructuras para acelerar accesos. B-tree (por defecto), bitmap (baja cardinalidad, DW), únicos, compuestos, basados en función (<code>CREATE INDEX idx_upper ON empleados(UPPER(apellido));</code>).</li>\n<li><strong>Paquetes (packages)</strong>: agrupan procedimientos, funciones, variables, cursores y tipos relacionados, con especificación (interfaz pública) y cuerpo (implementación, puede ocultar lógica privada).</li>\n<li><strong>Procedimientos y funciones</strong>: subprogramas PL/SQL almacenados; la función siempre retorna un valor (<code>RETURN</code>) y puede usarse en expresiones SQL; el procedimiento no retorna valor por <code>RETURN</code> pero puede usar parámetros <code>OUT</code>/<code>IN OUT</code>.</li>\n<li><strong>Triggers</strong>: código que se ejecuta automáticamente ante eventos DML (<code>INSERT</code>/<code>UPDATE</code>/<code>DELETE</code>), DDL o del sistema (<code>LOGON</code>, <code>SERVERERROR</code>). Pueden ser <code>BEFORE</code>/<code>AFTER</code>, a nivel de fila (<code>FOR EACH ROW</code>) o de sentencia.</li>\n<li>Otros: <strong>tipos de objeto</strong> (UDT, <code>CREATE TYPE</code>), <strong>clusters</strong> (agrupan físicamente tablas relacionadas), <strong>dimensiones</strong> (metadatos jerárquicos para OLAP), <strong>enlaces de base de datos (DB LINK)</strong>.</li>\n</ul>\n<p><strong>Ejemplo de trigger de auditoría:</strong></p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">OR</span> <span class=\"kw\">REPLACE</span> <span class=\"kw\">TRIGGER</span> trg_aud_salario</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">BEFORE</span> <span class=\"kw\">UPDATE</span> <span class=\"kw\">OF</span> salario <span class=\"kw\">ON</span> empleados</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">FOR</span> <span class=\"kw\">EACH</span> <span class=\"kw\">ROW</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span></span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">INSERT</span> <span class=\"kw\">INTO</span> aud_salarios(id_emp, salario_ant, salario_nue, fecha)</span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">VALUES</span> (<span class=\"ch\">:OLD</span>.id_emp, <span class=\"ch\">:OLD</span>.salario, <span class=\"ch\">:NEW</span>.salario, <span class=\"fu\">SYSDATE</span>);</span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">END</span>;</span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">/</span></span></code></pre></div>\n<p><strong>Dependencias entre objetos.</strong> Oracle mantiene un grafo de dependencias (visible en <code>USER_DEPENDENCIES</code>) entre objetos que referencian a otros: una vista depende de sus tablas base, un procedimiento de los objetos que invoca. Si un objeto base cambia de estructura, los dependientes pueden quedar <code>INVALID</code> y se recompilan automáticamente en el siguiente acceso (recompilación diferida) o manualmente con <code>ALTER ... COMPILE</code>. La vista <code>USER_OBJECTS</code> muestra el <code>STATUS</code> (VALID/INVALID) de cada objeto.</p>\n<p><strong>El diccionario de datos.</strong> Conjunto de tablas y vistas de solo lectura, propiedad del usuario <code>SYS</code>, que almacena metadatos de toda la base de datos. Tres niveles de vistas según ámbito: <code>USER_*</code> (objetos propios del usuario conectado), <code>ALL_*</code> (objetos propios más aquellos sobre los que se tiene privilegio), <code>DBA_*</code> (todos los objetos de la BD, requiere privilegio DBA). Ejemplos: <code>USER_TABLES</code>, <code>USER_TAB_COLUMNS</code>, <code>USER_CONSTRAINTS</code>, <code>USER_INDEXES</code>, <code>DBA_USERS</code>, <code>DBA_ROLE_PRIVS</code>. También existen las vistas dinámicas de rendimiento <code>V$</code> (p. ej. <code>V$SESSION</code>, <code>V$SQL</code>), que reflejan el estado en memoria de la instancia.</p>\n<p><strong>Tipos de datos</strong>: <code>VARCHAR2</code>/<code>CHAR</code> (texto), <code>NUMBER(p,s)</code> (precisión/escala), <code>DATE</code> (con hora, segundos), <code>TIMESTAMP</code> (con fracciones de segundo y zona horaria mediante <code>TIMESTAMP WITH TIME ZONE</code>), <code>CLOB</code>/<code>BLOB</code>/<code>NCLOB</code> (objetos grandes), <code>RAW</code>, <code>ROWID</code>.</p>\n<p><strong>Integridad de datos</strong>, mediante restricciones (<code>CONSTRAINT</code>):</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">TABLE</span> pedidos (</span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>  id_pedido   <span class=\"dt\">NUMBER</span> <span class=\"kw\">PRIMARY</span> <span class=\"kw\">KEY</span>,</span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>  id_cliente  <span class=\"dt\">NUMBER</span> <span class=\"kw\">NOT</span> <span class=\"kw\">NULL</span> <span class=\"kw\">REFERENCES</span> clientes(id_cliente),</span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>  estado      <span class=\"dt\">VARCHAR2</span>(<span class=\"dv\">10</span>) <span class=\"kw\">CHECK</span> (estado <span class=\"kw\">IN</span> (<span class=\"st\">&#39;PEND&#39;</span>,<span class=\"st\">&#39;ENV&#39;</span>,<span class=\"st\">&#39;ENT&#39;</span>)),</span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>  importe     <span class=\"dt\">NUMBER</span>(<span class=\"dv\">10</span>,<span class=\"dv\">2</span>) <span class=\"kw\">DEFAULT</span> <span class=\"dv\">0</span></span>\n<span id=\"cb2-6\"><a href=\"#cb2-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>);</span></code></pre></div>\n<p>Tipos: <code>PRIMARY KEY</code>, <code>FOREIGN KEY</code> (con <code>ON DELETE CASCADE</code>/<code>SET NULL</code>), <code>UNIQUE</code>, <code>CHECK</code>, <code>NOT NULL</code>. Pueden definirse <code>DEFERRABLE</code> para comprobarse al <code>COMMIT</code> en lugar de en cada sentencia, útil en cargas masivas con dependencias circulares.</p>\n"}, {"num": 22, "title": "Oracle. Lenguajes de programación SQL y PL/SQL.", "html": "<p><strong>SQL en Oracle.</strong> Lenguaje declarativo estándar (ISO/ANSI, con extensiones propietarias) dividido en subconjuntos: <strong>DDL</strong> (<code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>, <code>TRUNCATE</code>), <strong>DML</strong> (<code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>, <code>MERGE</code>), <strong>DCL</strong> (<code>GRANT</code>, <code>REVOKE</code>) y <strong>TCL</strong> (<code>COMMIT</code>, <code>ROLLBACK</code>, <code>SAVEPOINT</code>).</p>\n<p><strong>Particularidades de Oracle SQL</strong>: <code>DUAL</code> (tabla ficticia de una fila para evaluar expresiones: <code>SELECT SYSDATE FROM DUAL;</code>), operador de concatenación <code>||</code>, cláusula <code>ROWNUM</code>/<code>ROW_NUMBER()</code> para paginación (<code>FETCH FIRST n ROWS ONLY</code> desde 12c), funciones analíticas (<code>OVER (PARTITION BY ... ORDER BY ...)</code>: <code>RANK()</code>, <code>DENSE_RANK()</code>, <code>LAG()</code>, <code>LEAD()</code>), consultas jerárquicas (<code>CONNECT BY PRIOR ... START WITH</code>), y <code>MERGE</code> para upsert:</p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">MERGE</span> <span class=\"kw\">INTO</span> stock s</span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">USING</span> (<span class=\"kw\">SELECT</span> id_prod, cantidad <span class=\"kw\">FROM</span> entradas) e</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">ON</span> (s.id_prod <span class=\"op\">=</span> e.id_prod)</span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">WHEN</span> MATCHED <span class=\"cf\">THEN</span> <span class=\"kw\">UPDATE</span> <span class=\"kw\">SET</span> s.cantidad <span class=\"op\">=</span> s.cantidad <span class=\"op\">+</span> e.cantidad</span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">WHEN</span> <span class=\"kw\">NOT</span> MATCHED <span class=\"cf\">THEN</span> <span class=\"kw\">INSERT</span> (id_prod, cantidad) <span class=\"kw\">VALUES</span> (e.id_prod, e.cantidad);</span></code></pre></div>\n<p><strong>PL/SQL (Procedural Language/SQL)</strong> es la extensión procedimental propietaria de Oracle que embebe SQL dentro de estructuras de control tipo Ada. Un bloque tiene la estructura:</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">DECLARE</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>  v_salario empleados.salario<span class=\"dt\">%TYPE</span>;</span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>  v_nombre  empleados.nombre<span class=\"dt\">%TYPE</span>;</span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>  ex_sin_datos <span class=\"kw\">EXCEPTION</span>;</span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span></span>\n<span id=\"cb2-6\"><a href=\"#cb2-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">SELECT</span> salario, nombre <span class=\"kw\">INTO</span> v_salario, v_nombre</span>\n<span id=\"cb2-7\"><a href=\"#cb2-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">FROM</span> empleados <span class=\"kw\">WHERE</span> id_emp <span class=\"op\">=</span> <span class=\"dv\">100</span>;</span>\n<span id=\"cb2-8\"><a href=\"#cb2-8\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb2-9\"><a href=\"#cb2-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"cf\">IF</span> v_salario <span class=\"op\">&lt;</span> <span class=\"dv\">1200</span> <span class=\"cf\">THEN</span></span>\n<span id=\"cb2-10\"><a href=\"#cb2-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">UPDATE</span> empleados <span class=\"kw\">SET</span> salario <span class=\"op\">=</span> salario <span class=\"op\">*</span> <span class=\"fl\">1.05</span> <span class=\"kw\">WHERE</span> id_emp <span class=\"op\">=</span> <span class=\"dv\">100</span>;</span>\n<span id=\"cb2-11\"><a href=\"#cb2-11\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"cf\">ELSIF</span> v_salario <span class=\"op\">&gt;</span> <span class=\"dv\">5000</span> <span class=\"cf\">THEN</span></span>\n<span id=\"cb2-12\"><a href=\"#cb2-12\" aria-hidden=\"true\" tabindex=\"-1\"></a>    RAISE ex_sin_datos;</span>\n<span id=\"cb2-13\"><a href=\"#cb2-13\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"cf\">END</span> <span class=\"cf\">IF</span>;</span>\n<span id=\"cb2-14\"><a href=\"#cb2-14\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb2-15\"><a href=\"#cb2-15\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">COMMIT</span>;</span>\n<span id=\"cb2-16\"><a href=\"#cb2-16\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">EXCEPTION</span></span>\n<span id=\"cb2-17\"><a href=\"#cb2-17\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"cf\">WHEN</span> NO_DATA_FOUND <span class=\"cf\">THEN</span></span>\n<span id=\"cb2-18\"><a href=\"#cb2-18\" aria-hidden=\"true\" tabindex=\"-1\"></a>    DBMS_OUTPUT.PUT_LINE(<span class=\"st\">&#39;Empleado no encontrado&#39;</span>);</span>\n<span id=\"cb2-19\"><a href=\"#cb2-19\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"cf\">WHEN</span> OTHERS <span class=\"cf\">THEN</span></span>\n<span id=\"cb2-20\"><a href=\"#cb2-20\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">ROLLBACK</span>;</span>\n<span id=\"cb2-21\"><a href=\"#cb2-21\" aria-hidden=\"true\" tabindex=\"-1\"></a>    RAISE;</span>\n<span id=\"cb2-22\"><a href=\"#cb2-22\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">END</span>;</span>\n<span id=\"cb2-23\"><a href=\"#cb2-23\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">/</span></span></code></pre></div>\n<p><strong>Elementos clave</strong>: variables con <code>%TYPE</code> (ancla al tipo de una columna) y <code>%ROWTYPE</code> (ancla a la fila completa); estructuras de control <code>IF/ELSIF</code>, <code>LOOP</code>/<code>WHILE LOOP</code>/<code>FOR LOOP</code>; <strong>cursores</strong> explícitos (<code>CURSOR c IS SELECT ...; OPEN/FETCH/CLOSE</code>) e implícitos; <strong>cursores FOR</strong> (abren y cierran automáticamente); registros (<code>TYPE ... IS RECORD</code>) y colecciones (<code>TABLE</code>, <code>VARRAY</code>, <code>ASSOCIATIVE ARRAY</code>/<code>INDEX BY</code>).</p>\n<p><strong>Manejo de excepciones</strong>: predefinidas (<code>NO_DATA_FOUND</code>, <code>TOO_MANY_ROWS</code>, <code>DUP_VAL_ON_INDEX</code>, <code>ZERO_DIVIDE</code>), definidas por el usuario (<code>EXCEPTION</code> + <code>RAISE</code>) y <code>PRAGMA EXCEPTION_INIT</code> para asociar un código Oracle (<code>SQLCODE</code>) a una excepción con nombre.</p>\n<p><strong>Bulk operations</strong> para rendimiento en procesamiento masivo, evitando el context switch SQL↔︎PL/SQL fila a fila:</p>\n<div class=\"sourceCode\" id=\"cb3\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb3-1\"><a href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">DECLARE</span></span>\n<span id=\"cb3-2\"><a href=\"#cb3-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">TYPE</span> t_ids <span class=\"kw\">IS</span> <span class=\"kw\">TABLE</span> <span class=\"kw\">OF</span> <span class=\"dt\">NUMBER</span>;</span>\n<span id=\"cb3-3\"><a href=\"#cb3-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>  v_ids t_ids;</span>\n<span id=\"cb3-4\"><a href=\"#cb3-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span></span>\n<span id=\"cb3-5\"><a href=\"#cb3-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">SELECT</span> id_emp <span class=\"kw\">BULK</span> <span class=\"fu\">COLLECT</span> <span class=\"kw\">INTO</span> v_ids <span class=\"kw\">FROM</span> empleados <span class=\"kw\">WHERE</span> activo <span class=\"op\">=</span> <span class=\"st\">&#39;S&#39;</span>;</span>\n<span id=\"cb3-6\"><a href=\"#cb3-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>  FORALL i <span class=\"kw\">IN</span> v_ids.<span class=\"fu\">FIRST</span><span class=\"op\">..</span>v_ids.<span class=\"fu\">LAST</span></span>\n<span id=\"cb3-7\"><a href=\"#cb3-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">UPDATE</span> empleados <span class=\"kw\">SET</span> revisado <span class=\"op\">=</span> <span class=\"st\">&#39;S&#39;</span> <span class=\"kw\">WHERE</span> id_emp <span class=\"op\">=</span> v_ids(i);</span>\n<span id=\"cb3-8\"><a href=\"#cb3-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">END</span>;</span>\n<span id=\"cb3-9\"><a href=\"#cb3-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">/</span></span></code></pre></div>\n<p><strong>Funciones y procedimientos almacenados:</strong></p>\n<div class=\"sourceCode\" id=\"cb4\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb4-1\"><a href=\"#cb4-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">OR</span> <span class=\"kw\">REPLACE</span> <span class=\"kw\">FUNCTION</span> calcular_iva(p_base <span class=\"kw\">IN</span> <span class=\"dt\">NUMBER</span>, p_tipo <span class=\"kw\">IN</span> <span class=\"dt\">NUMBER</span> <span class=\"kw\">DEFAULT</span> <span class=\"dv\">21</span>)</span>\n<span id=\"cb4-2\"><a href=\"#cb4-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">RETURN</span> <span class=\"dt\">NUMBER</span> <span class=\"kw\">IS</span></span>\n<span id=\"cb4-3\"><a href=\"#cb4-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span></span>\n<span id=\"cb4-4\"><a href=\"#cb4-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">RETURN</span> <span class=\"fu\">ROUND</span>(p_base <span class=\"op\">*</span> p_tipo <span class=\"op\">/</span> <span class=\"dv\">100</span>, <span class=\"dv\">2</span>);</span>\n<span id=\"cb4-5\"><a href=\"#cb4-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">END</span>;</span>\n<span id=\"cb4-6\"><a href=\"#cb4-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">/</span></span></code></pre></div>\n<p><strong>Paquetes</strong>, con estado persistente durante la sesión (variables globales de paquete) y sobrecarga de subprogramas:</p>\n<div class=\"sourceCode\" id=\"cb5\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb5-1\"><a href=\"#cb5-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">CREATE</span> <span class=\"kw\">OR</span> <span class=\"kw\">REPLACE</span> <span class=\"kw\">PACKAGE</span> pkg_rrhh <span class=\"kw\">AS</span></span>\n<span id=\"cb5-2\"><a href=\"#cb5-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">FUNCTION</span> antiguedad(p_id <span class=\"dt\">NUMBER</span>) <span class=\"kw\">RETURN</span> <span class=\"dt\">NUMBER</span>;</span>\n<span id=\"cb5-3\"><a href=\"#cb5-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">PROCEDURE</span> subir_salario(p_id <span class=\"dt\">NUMBER</span>, p_pct <span class=\"dt\">NUMBER</span>);</span>\n<span id=\"cb5-4\"><a href=\"#cb5-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">END</span> pkg_rrhh;</span>\n<span id=\"cb5-5\"><a href=\"#cb5-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">/</span></span></code></pre></div>\n<p><strong>Triggers PL/SQL compuestos</strong> (<code>COMPOUND TRIGGER</code>, desde 11g) resuelven el error de mutating table permitiendo secciones <code>BEFORE STATEMENT</code>, <code>BEFORE EACH ROW</code>, <code>AFTER EACH ROW</code>, <code>AFTER STATEMENT</code> en un único trigger.</p>\n<p><strong>Optimización</strong>: uso de bind variables (<code>:variable</code>) para favorecer el <em>cursor sharing</em> y evitar hard parses; <code>EXPLAIN PLAN</code>/<code>AUTOTRACE</code> para analizar el plan de ejecución; paquetes de utilidad <code>DBMS_OUTPUT</code>, <code>UTL_FILE</code>, <code>DBMS_SCHEDULER</code>, <code>DBMS_XPLAN</code>.</p>\n"}, {"num": 23, "title": "Oracle. Oracle Developer (Oracle Forms, Oracle Reports).", "html": "<p><strong>Oracle Developer Suite</strong> (Oracle Developer/2000 en sus orígenes) es el conjunto de herramientas RAD (Rapid Application Development) de Oracle para construir aplicaciones cliente/servidor y, desde la versión 6i en adelante, aplicaciones desplegadas en tres capas mediante <strong>Oracle Application Server (Forms Services)</strong>. Incluye principalmente Oracle Forms y Oracle Reports, junto a Oracle Designer y Oracle Discoverer (herramientas complementarias hoy en desuso).</p>\n<p><strong>Oracle Forms.</strong> Herramienta para construir formularios de entrada/consulta de datos altamente ligados a la base de datos (data-bound), muy usada históricamente en aplicaciones corporativas y de Administración Pública sobre Oracle.</p>\n<p><strong>Arquitectura de ejecución</strong>: en modo web, el cliente ejecuta un <strong>applet Java (Forms Applet)</strong> o, desde versiones modernas, el <strong>Forms Web client</strong> vía Java Web Start/JNLP, que se comunica con el <strong>Forms Listener Servlet</strong> en el servidor de aplicaciones, el cual delega en un <strong>Forms Runtime Engine (frmweb)</strong> que mantiene la sesión y ejecuta la lógica, conectando a la base de datos Oracle.</p>\n<p><strong>Componentes de un módulo Forms (.fmb, compilado a .fmx):</strong></p>\n<ul>\n<li><strong>Bloques de datos (Data Blocks)</strong>: vinculados a tablas/vistas o procedimientos (bloques no basados en tabla), gestionan automáticamente <code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code> mediante el motor de Forms.</li>\n<li><strong>Ítems (Items)</strong>: campos de texto, listas, casillas, botones de radio, dentro de un canvas (lienzo visual).</li>\n<li><strong>Canvas y Ventanas</strong>: superficies de presentación.</li>\n<li><strong>LOV (List of Values)</strong> y <strong>Record Groups</strong>: listas de selección basadas en consultas SQL.</li>\n<li><strong>Triggers de Forms</strong>: código PL/SQL asociado a eventos, con nomenclatura por nivel:\n<ul>\n<li>Nivel formulario: <code>WHEN-NEW-FORM-INSTANCE</code>, <code>KEY-EXIT</code>.</li>\n<li>Nivel bloque: <code>PRE-QUERY</code>, <code>POST-QUERY</code>.</li>\n<li>Nivel ítem: <code>WHEN-VALIDATE-ITEM</code>, <code>WHEN-BUTTON-PRESSED</code>, <code>KEY-NEXT-ITEM</code>.</li>\n</ul></li>\n</ul>\n<p><strong>Ejemplo de trigger <code>WHEN-VALIDATE-ITEM</code>:</strong></p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">DECLARE</span></span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>  v_existe <span class=\"dt\">NUMBER</span>;</span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">BEGIN</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">SELECT</span> <span class=\"fu\">COUNT</span>(<span class=\"op\">*</span>) <span class=\"kw\">INTO</span> v_existe</span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">FROM</span> clientes <span class=\"kw\">WHERE</span> nif <span class=\"op\">=</span> <span class=\"ch\">:bloque_clientes</span>.nif;</span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"cf\">IF</span> v_existe <span class=\"op\">=</span> <span class=\"dv\">0</span> <span class=\"cf\">THEN</span></span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a>    MESSAGE(<span class=\"st\">&#39;NIF no encontrado en el sistema&#39;</span>);</span>\n<span id=\"cb1-9\"><a href=\"#cb1-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>    RAISE FORM_TRIGGER_FAILURE;</span>\n<span id=\"cb1-10\"><a href=\"#cb1-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"cf\">END</span> <span class=\"cf\">IF</span>;</span>\n<span id=\"cb1-11\"><a href=\"#cb1-11\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">END</span>;</span></code></pre></div>\n<p><strong>Program Units</strong>: procedimientos/funciones PL/SQL reutilizables dentro del módulo, o en <strong>librerías (.pll)</strong> compartidas entre varios formularios (<code>ATTACH LIBRARY</code>).</p>\n<p><strong>Estados de registro</strong>: <code>NEW</code>, <code>QUERY</code>, <code>CHANGED</code>, <code>INSERT</code> — controlan qué operación DML se ejecutará al hacer commit (<code>COMMIT_FORM</code>, tecla F10 por defecto).</p>\n<p><strong>Menús</strong> (.mmb): módulos de menú personalizados que sustituyen el menú por defecto de Forms, con roles de seguridad asociados.</p>\n<p><strong>Oracle Reports.</strong> Herramienta de generación de informes (.rdf) con salida en múltiples formatos: pantalla, PDF, HTML, PostScript, hoja de cálculo, XML.</p>\n<p><strong>Modelo de un informe:</strong></p>\n<ul>\n<li><strong>Data Model</strong>: consultas SQL (Q_1, Q_2...) organizadas jerárquicamente mediante enlaces de datos (grupos padre-hijo, <code>master-detail</code>), fórmulas y columnas resumen (<code>%COUNT</code>, <code>%SUM</code>).</li>\n<li><strong>Layout Model</strong>: disposición visual mediante <em>frames</em>, <em>repeating frames</em> (que iteran sobre los grupos de datos), campos y boilerplate (texto fijo).</li>\n<li><strong>PL/SQL asociado</strong>: triggers de formato (<code>Format Trigger</code>, oculta/muestra elementos condicionalmente), y triggers del informe (<code>Before Report</code>, <code>After Report</code>, <code>Between Pages</code>).</li>\n</ul>\n<p><strong>Ejemplo de consulta jerárquica en el Data Model:</strong></p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode sql\"><code class=\"sourceCode sql\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">-- Q_1 (maestro)</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">SELECT</span> id_dpto, nombre_dpto <span class=\"kw\">FROM</span> departamentos;</span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">-- Q_2 (detalle, enlazado por id_dpto)</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">SELECT</span> nombre, salario <span class=\"kw\">FROM</span> empleados <span class=\"kw\">WHERE</span> id_dpto <span class=\"op\">=</span> <span class=\"ch\">:id_dpto</span>;</span></code></pre></div>\n<p><strong>Despliegue</strong>: en modo servidor, <strong>Reports Server</strong> encola y ejecuta peticiones (batch o interactivo), invocable desde Forms mediante <code>RUN_PRODUCT</code> o el paquete <code>RUN_REPORT_OBJECT</code>. En entornos actuales, Oracle Forms/Reports 12c se ejecuta sobre <strong>WebLogic Server</strong>, y Oracle mantiene la tecnología en modo de soporte extendido, recomendando migraciones hacia <strong>APEX (Application Express)</strong> o arquitecturas web modernas, migración habitual en la modernización de sistemas legados de la Administración.</p>\n"}, {"num": 24, "title": "Diseño de páginas web. HTML. JavaScript. Intercambio de datos en Internet: formatos XML y JSON.", "html": "<p><strong>HTML (HyperText Markup Language)</strong>, estandarizado por el W3C/WHATWG, actualmente <strong>HTML5</strong> (Living Standard). Define la estructura semántica de una página mediante etiquetas.</p>\n<p><strong>Estructura básica y semántica HTML5:</strong></p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode html\"><code class=\"sourceCode html\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;!DOCTYPE</span> html<span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;</span><span class=\"kw\">html</span><span class=\"ot\"> lang</span><span class=\"op\">=</span><span class=\"st\">&quot;es&quot;</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;</span><span class=\"kw\">head</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"dt\">&lt;</span><span class=\"kw\">meta</span><span class=\"ot\"> charset</span><span class=\"op\">=</span><span class=\"st\">&quot;UTF-8&quot;</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"dt\">&lt;</span><span class=\"kw\">meta</span><span class=\"ot\"> name</span><span class=\"op\">=</span><span class=\"st\">&quot;viewport&quot;</span><span class=\"ot\"> content</span><span class=\"op\">=</span><span class=\"st\">&quot;width=device-width, initial-scale=1&quot;</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"dt\">&lt;</span><span class=\"kw\">title</span><span class=\"dt\">&gt;</span>Portal de trámites<span class=\"dt\">&lt;/</span><span class=\"kw\">title</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;/</span><span class=\"kw\">head</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;</span><span class=\"kw\">body</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-9\"><a href=\"#cb1-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"dt\">&lt;</span><span class=\"kw\">header</span><span class=\"dt\">&gt;&lt;</span><span class=\"kw\">nav</span><span class=\"dt\">&gt;</span>...<span class=\"dt\">&lt;/</span><span class=\"kw\">nav</span><span class=\"dt\">&gt;&lt;/</span><span class=\"kw\">header</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-10\"><a href=\"#cb1-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"dt\">&lt;</span><span class=\"kw\">main</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-11\"><a href=\"#cb1-11\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">&lt;</span><span class=\"kw\">article</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-12\"><a href=\"#cb1-12\" aria-hidden=\"true\" tabindex=\"-1\"></a>      <span class=\"dt\">&lt;</span><span class=\"kw\">h1</span><span class=\"dt\">&gt;</span>Solicitud de cita<span class=\"dt\">&lt;/</span><span class=\"kw\">h1</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-13\"><a href=\"#cb1-13\" aria-hidden=\"true\" tabindex=\"-1\"></a>      <span class=\"dt\">&lt;</span><span class=\"kw\">section</span><span class=\"dt\">&gt;</span>...<span class=\"dt\">&lt;/</span><span class=\"kw\">section</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-14\"><a href=\"#cb1-14\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">&lt;/</span><span class=\"kw\">article</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-15\"><a href=\"#cb1-15\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"dt\">&lt;/</span><span class=\"kw\">main</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-16\"><a href=\"#cb1-16\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"dt\">&lt;</span><span class=\"kw\">footer</span><span class=\"dt\">&gt;</span>...<span class=\"dt\">&lt;/</span><span class=\"kw\">footer</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-17\"><a href=\"#cb1-17\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;/</span><span class=\"kw\">body</span><span class=\"dt\">&gt;</span></span>\n<span id=\"cb1-18\"><a href=\"#cb1-18\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">&lt;/</span><span class=\"kw\">html</span><span class=\"dt\">&gt;</span></span></code></pre></div>\n<p>Elementos semánticos clave: <code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;article&gt;</code>, <code>&lt;section&gt;</code>, <code>&lt;aside&gt;</code>, <code>&lt;footer&gt;</code>, <code>&lt;figure&gt;</code>, mejoran accesibilidad (WAI-ARIA, atributos <code>role</code>, <code>aria-label</code>) y SEO frente al uso indiscriminado de <code>&lt;div&gt;</code>. <strong>Formularios</strong>: <code>&lt;form&gt;</code>, <code>&lt;input type=\"email|date|number\"&gt;</code>, validación nativa (<code>required</code>, <code>pattern</code>, <code>min</code>/<code>max</code>). APIs HTML5 relevantes: Canvas, LocalStorage/SessionStorage, Geolocation, WebSockets, Fetch API.</p>\n<p><strong>JavaScript</strong>, lenguaje interpretado, dinámico, basado en prototipos, con estándar <strong>ECMAScript</strong> (ES6/ES2015 en adelante marca la modernización: <code>let</code>/<code>const</code>, arrow functions, clases, <code>Promise</code>, módulos, plantillas literales).</p>\n<p><strong>Manipulación del DOM:</strong></p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode javascript\"><code class=\"sourceCode javascript\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"bu\">document</span><span class=\"op\">.</span><span class=\"fu\">getElementById</span>(<span class=\"st\">&#39;btnEnviar&#39;</span>)<span class=\"op\">.</span><span class=\"fu\">addEventListener</span>(<span class=\"st\">&#39;click&#39;</span><span class=\"op\">,</span> <span class=\"kw\">async</span> () <span class=\"kw\">=&gt;</span> {</span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">const</span> nombre <span class=\"op\">=</span> <span class=\"bu\">document</span><span class=\"op\">.</span><span class=\"fu\">querySelector</span>(<span class=\"st\">&#39;#nombre&#39;</span>)<span class=\"op\">.</span><span class=\"at\">value</span><span class=\"op\">;</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"cf\">if</span> (<span class=\"op\">!</span>nombre) {</span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"fu\">alert</span>(<span class=\"st\">&#39;Campo obligatorio&#39;</span>)<span class=\"op\">;</span></span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"cf\">return</span><span class=\"op\">;</span></span>\n<span id=\"cb2-6\"><a href=\"#cb2-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>  }</span>\n<span id=\"cb2-7\"><a href=\"#cb2-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">const</span> respuesta <span class=\"op\">=</span> <span class=\"cf\">await</span> <span class=\"fu\">fetch</span>(<span class=\"st\">&#39;/api/solicitudes&#39;</span><span class=\"op\">,</span> {</span>\n<span id=\"cb2-8\"><a href=\"#cb2-8\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">method</span><span class=\"op\">:</span> <span class=\"st\">&#39;POST&#39;</span><span class=\"op\">,</span></span>\n<span id=\"cb2-9\"><a href=\"#cb2-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">headers</span><span class=\"op\">:</span> { <span class=\"st\">&#39;Content-Type&#39;</span><span class=\"op\">:</span> <span class=\"st\">&#39;application/json&#39;</span> }<span class=\"op\">,</span></span>\n<span id=\"cb2-10\"><a href=\"#cb2-10\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">body</span><span class=\"op\">:</span> <span class=\"bu\">JSON</span><span class=\"op\">.</span><span class=\"fu\">stringify</span>({ nombre })</span>\n<span id=\"cb2-11\"><a href=\"#cb2-11\" aria-hidden=\"true\" tabindex=\"-1\"></a>  })<span class=\"op\">;</span></span>\n<span id=\"cb2-12\"><a href=\"#cb2-12\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"kw\">const</span> datos <span class=\"op\">=</span> <span class=\"cf\">await</span> respuesta<span class=\"op\">.</span><span class=\"fu\">json</span>()<span class=\"op\">;</span></span>\n<span id=\"cb2-13\"><a href=\"#cb2-13\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"bu\">console</span><span class=\"op\">.</span><span class=\"fu\">log</span>(datos)<span class=\"op\">;</span></span>\n<span id=\"cb2-14\"><a href=\"#cb2-14\" aria-hidden=\"true\" tabindex=\"-1\"></a>})<span class=\"op\">;</span></span></code></pre></div>\n<p><strong>Conceptos clave de JS moderno</strong>: closures, hoisting, event loop (asincronía mediante <em>callback queue</em> y <em>microtask queue</em>), <code>this</code> y su enlace dinámico (<code>bind</code>/<code>call</code>/<code>apply</code>), programación funcional (<code>map</code>, <code>filter</code>, <code>reduce</code>), clases ES6 con <code>class</code>/<code>extends</code>, módulos (<code>import</code>/<code>export</code>), y manejo de promesas con <code>async</code>/<code>await</code> para evitar el <em>callback hell</em>.</p>\n<p><strong>JavaScript en el navegador vs. Node.js</strong>: en el cliente interactúa con el DOM/BOM; Node.js (motor V8) permite ejecución en servidor, con <code>npm</code> como gestor de paquetes.</p>\n<p><strong>Intercambio de datos: XML.</strong> Lenguaje de marcado extensible (W3C, 1998), jerárquico, autodescriptivo, con validación mediante DTD o <strong>XSD (XML Schema Definition)</strong>, transformable con <strong>XSLT</strong>.</p>\n<div class=\"sourceCode\" id=\"cb3\"><pre class=\"sourceCode xml\"><code class=\"sourceCode xml\"><span id=\"cb3-1\"><a href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">&lt;?xml</span> <span class=\"ot\">version=</span><span class=\"st\">&quot;1.0&quot;</span> <span class=\"ot\">encoding=</span><span class=\"st\">&quot;UTF-8&quot;</span><span class=\"fu\">?&gt;</span></span>\n<span id=\"cb3-2\"><a href=\"#cb3-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>&lt;<span class=\"kw\">solicitudes</span>&gt;</span>\n<span id=\"cb3-3\"><a href=\"#cb3-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>  &lt;<span class=\"kw\">solicitud</span> <span class=\"ot\">id=</span><span class=\"st\">&quot;1001&quot;</span>&gt;</span>\n<span id=\"cb3-4\"><a href=\"#cb3-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    &lt;<span class=\"kw\">ciudadano</span> <span class=\"ot\">nif=</span><span class=\"st\">&quot;12345678A&quot;</span>&gt;Juan Pérez&lt;/<span class=\"kw\">ciudadano</span>&gt;</span>\n<span id=\"cb3-5\"><a href=\"#cb3-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>    &lt;<span class=\"kw\">fecha</span>&gt;2026-08-27&lt;/<span class=\"kw\">fecha</span>&gt;</span>\n<span id=\"cb3-6\"><a href=\"#cb3-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>    &lt;<span class=\"kw\">estado</span>&gt;PENDIENTE&lt;/<span class=\"kw\">estado</span>&gt;</span>\n<span id=\"cb3-7\"><a href=\"#cb3-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>  &lt;/<span class=\"kw\">solicitud</span>&gt;</span>\n<span id=\"cb3-8\"><a href=\"#cb3-8\" aria-hidden=\"true\" tabindex=\"-1\"></a>&lt;/<span class=\"kw\">solicitudes</span>&gt;</span></code></pre></div>\n<p>Usos típicos: SOAP (envoltura <code>&lt;Envelope&gt;</code>/<code>&lt;Header&gt;</code>/<code>&lt;Body&gt;</code>), configuraciones, intercambio en la interoperabilidad administrativa (esquemas SICRES, facturación electrónica Facturae).</p>\n<p><strong>JSON (JavaScript Object Notation)</strong>, formato más ligero (RFC 8259), notación de objetos/arrays nativa de JS, hoy predominante en APIs REST por su menor verbosidad y parseo directo.</p>\n<div class=\"sourceCode\" id=\"cb4\"><pre class=\"sourceCode json\"><code class=\"sourceCode json\"><span id=\"cb4-1\"><a href=\"#cb4-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">{</span></span>\n<span id=\"cb4-2\"><a href=\"#cb4-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"dt\">&quot;solicitud&quot;</span><span class=\"fu\">:</span> <span class=\"fu\">{</span></span>\n<span id=\"cb4-3\"><a href=\"#cb4-3\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">&quot;id&quot;</span><span class=\"fu\">:</span> <span class=\"dv\">1001</span><span class=\"fu\">,</span></span>\n<span id=\"cb4-4\"><a href=\"#cb4-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">&quot;ciudadano&quot;</span><span class=\"fu\">:</span> <span class=\"fu\">{</span> <span class=\"dt\">&quot;nif&quot;</span><span class=\"fu\">:</span> <span class=\"st\">&quot;12345678A&quot;</span><span class=\"fu\">,</span> <span class=\"dt\">&quot;nombre&quot;</span><span class=\"fu\">:</span> <span class=\"st\">&quot;Juan Pérez&quot;</span> <span class=\"fu\">},</span></span>\n<span id=\"cb4-5\"><a href=\"#cb4-5\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">&quot;fecha&quot;</span><span class=\"fu\">:</span> <span class=\"st\">&quot;2026-08-27&quot;</span><span class=\"fu\">,</span></span>\n<span id=\"cb4-6\"><a href=\"#cb4-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">&quot;estado&quot;</span><span class=\"fu\">:</span> <span class=\"st\">&quot;PENDIENTE&quot;</span><span class=\"fu\">,</span></span>\n<span id=\"cb4-7\"><a href=\"#cb4-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">&quot;documentos&quot;</span><span class=\"fu\">:</span> <span class=\"ot\">[</span><span class=\"st\">&quot;dni.pdf&quot;</span><span class=\"ot\">,</span> <span class=\"st\">&quot;empadronamiento.pdf&quot;</span><span class=\"ot\">]</span></span>\n<span id=\"cb4-8\"><a href=\"#cb4-8\" aria-hidden=\"true\" tabindex=\"-1\"></a>  <span class=\"fu\">}</span></span>\n<span id=\"cb4-9\"><a href=\"#cb4-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"fu\">}</span></span></code></pre></div>\n<p><strong>Comparativa XML vs. JSON</strong>: XML admite atributos, namespaces, validación de esquema robusta y transformación declarativa (XSLT), preferible en contextos que exigen contratos estrictos e interoperabilidad formal (Administración, SOAP). JSON es más compacto, de parseo nativo en JS (<code>JSON.parse()</code>/<code>JSON.stringify()</code>) y dominante en APIs REST modernas y aplicaciones SPA. Ambos se validan: XML con XSD, JSON con <strong>JSON Schema</strong>.</p>\n"}, {"num": 25, "title": "El lenguaje de programación Java: sintaxis, tipos de datos, operadores, estructuras de control.", "html": "<p>Java es un lenguaje de programación orientado a objetos, fuertemente tipado, compilado a bytecode y ejecutado sobre la <strong>JVM (Java Virtual Machine)</strong>, lo que le confiere portabilidad (\"write once, run anywhere\"). Desarrollado originalmente por Sun Microsystems (1995), hoy propiedad de Oracle, con ciclo de versiones semestral desde Java 9 y versiones LTS (8, 11, 17, 21).</p>\n<p><strong>Estructura básica de un programa:</strong></p>\n<div class=\"sourceCode\" id=\"cb1\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb1-1\"><a href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">package</span><span class=\"im\"> com</span><span class=\"op\">.</span><span class=\"im\">carm</span><span class=\"op\">.</span><span class=\"im\">app</span><span class=\"op\">;</span></span>\n<span id=\"cb1-2\"><a href=\"#cb1-2\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb1-3\"><a href=\"#cb1-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">import</span> <span class=\"im\">java</span><span class=\"op\">.</span><span class=\"im\">util</span><span class=\"op\">.</span><span class=\"im\">List</span><span class=\"op\">;</span></span>\n<span id=\"cb1-4\"><a href=\"#cb1-4\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">import</span> <span class=\"im\">java</span><span class=\"op\">.</span><span class=\"im\">util</span><span class=\"op\">.</span><span class=\"im\">ArrayList</span><span class=\"op\">;</span></span>\n<span id=\"cb1-5\"><a href=\"#cb1-5\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb1-6\"><a href=\"#cb1-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"kw\">public</span> <span class=\"kw\">class</span> Main <span class=\"op\">{</span></span>\n<span id=\"cb1-7\"><a href=\"#cb1-7\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">public</span> <span class=\"dt\">static</span> <span class=\"dt\">void</span> <span class=\"fu\">main</span><span class=\"op\">(</span><span class=\"bu\">String</span><span class=\"op\">[]</span> args<span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb1-8\"><a href=\"#cb1-8\" aria-hidden=\"true\" tabindex=\"-1\"></a>        <span class=\"bu\">System</span><span class=\"op\">.</span><span class=\"fu\">out</span><span class=\"op\">.</span><span class=\"fu\">println</span><span class=\"op\">(</span><span class=\"st\">&quot;Inicio de la aplicación&quot;</span><span class=\"op\">);</span></span>\n<span id=\"cb1-9\"><a href=\"#cb1-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"op\">}</span></span>\n<span id=\"cb1-10\"><a href=\"#cb1-10\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p><strong>Tipos de datos primitivos</strong> (8 tipos, almacenados por valor): | Tipo | Tamaño | Rango/uso | |---|---|---| | <code>byte</code> | 8 bits | -128 a 127 | | <code>short</code> | 16 bits | enteros pequeños | | <code>int</code> | 32 bits | entero por defecto | | <code>long</code> | 64 bits | requiere sufijo <code>L</code> | | <code>float</code> | 32 bits | coma flotante, sufijo <code>f</code> | | <code>double</code> | 64 bits | coma flotante por defecto | | <code>char</code> | 16 bits | carácter Unicode (UTF-16) | | <code>boolean</code> | 1 bit lógico | <code>true</code>/<code>false</code> |</p>\n<p><strong>Tipos de referencia</strong>: clases, interfaces, arrays, enums. Cada primitivo tiene su <strong>wrapper class</strong> (<code>Integer</code>, <code>Double</code>, <code>Boolean</code>...) para uso en colecciones genéricas, con <em>autoboxing/unboxing</em> automático desde Java 5.</p>\n<p><strong>Operadores</strong>: aritméticos (<code>+ - * / %</code>), de asignación (<code>= += -= *=</code>), relacionales (<code>== != &gt; &lt; &gt;= &lt;=</code>), lógicos (<code>&amp;&amp; || !</code>, con cortocircuito), a nivel de bit (<code>&amp; | ^ ~ &lt;&lt; &gt;&gt; &gt;&gt;&gt;</code>), condicional ternario (<code>cond ? a : b</code>), <code>instanceof</code> (comprobación de tipo, con <em>pattern matching</em> desde Java 16: <code>if (obj instanceof String s)</code>). Importante distinguir <code>==</code> (compara referencias en objetos, valor en primitivos) de <code>.equals()</code> (compara contenido lógico).</p>\n<p><strong>Estructuras de control:</strong></p>\n<p>Condicionales:</p>\n<div class=\"sourceCode\" id=\"cb2\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb2-1\"><a href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">if</span> <span class=\"op\">(</span>edad <span class=\"op\">&gt;=</span> <span class=\"dv\">18</span><span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-2\"><a href=\"#cb2-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"bu\">System</span><span class=\"op\">.</span><span class=\"fu\">out</span><span class=\"op\">.</span><span class=\"fu\">println</span><span class=\"op\">(</span><span class=\"st\">&quot;Mayor de edad&quot;</span><span class=\"op\">);</span></span>\n<span id=\"cb2-3\"><a href=\"#cb2-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span> <span class=\"cf\">else</span> <span class=\"cf\">if</span> <span class=\"op\">(</span>edad <span class=\"op\">&gt;=</span> <span class=\"dv\">14</span><span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-4\"><a href=\"#cb2-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"bu\">System</span><span class=\"op\">.</span><span class=\"fu\">out</span><span class=\"op\">.</span><span class=\"fu\">println</span><span class=\"op\">(</span><span class=\"st\">&quot;Adolescente&quot;</span><span class=\"op\">);</span></span>\n<span id=\"cb2-5\"><a href=\"#cb2-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span> <span class=\"cf\">else</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-6\"><a href=\"#cb2-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"bu\">System</span><span class=\"op\">.</span><span class=\"fu\">out</span><span class=\"op\">.</span><span class=\"fu\">println</span><span class=\"op\">(</span><span class=\"st\">&quot;Menor&quot;</span><span class=\"op\">);</span></span>\n<span id=\"cb2-7\"><a href=\"#cb2-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span>\n<span id=\"cb2-8\"><a href=\"#cb2-8\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb2-9\"><a href=\"#cb2-9\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"co\">// switch expression (Java 14+)</span></span>\n<span id=\"cb2-10\"><a href=\"#cb2-10\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"bu\">String</span> categoria <span class=\"op\">=</span> <span class=\"cf\">switch</span> <span class=\"op\">(</span>mes<span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb2-11\"><a href=\"#cb2-11\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"cf\">case</span> <span class=\"dv\">12</span><span class=\"op\">,</span> <span class=\"dv\">1</span><span class=\"op\">,</span> <span class=\"dv\">2</span> <span class=\"op\">-&gt;</span> <span class=\"st\">&quot;Invierno&quot;</span><span class=\"op\">;</span></span>\n<span id=\"cb2-12\"><a href=\"#cb2-12\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"cf\">case</span> <span class=\"dv\">3</span><span class=\"op\">,</span> <span class=\"dv\">4</span><span class=\"op\">,</span> <span class=\"dv\">5</span> <span class=\"op\">-&gt;</span> <span class=\"st\">&quot;Primavera&quot;</span><span class=\"op\">;</span></span>\n<span id=\"cb2-13\"><a href=\"#cb2-13\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"kw\">default</span> <span class=\"op\">-&gt;</span> <span class=\"st\">&quot;Otra estación&quot;</span><span class=\"op\">;</span></span>\n<span id=\"cb2-14\"><a href=\"#cb2-14\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">};</span></span></code></pre></div>\n<p>Bucles:</p>\n<div class=\"sourceCode\" id=\"cb3\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb3-1\"><a href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">for</span> <span class=\"op\">(</span><span class=\"dt\">int</span> i <span class=\"op\">=</span> <span class=\"dv\">0</span><span class=\"op\">;</span> i <span class=\"op\">&lt;</span> <span class=\"dv\">10</span><span class=\"op\">;</span> i<span class=\"op\">++)</span> <span class=\"op\">{</span> <span class=\"co\">/* ... */</span> <span class=\"op\">}</span></span>\n<span id=\"cb3-2\"><a href=\"#cb3-2\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb3-3\"><a href=\"#cb3-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">for</span> <span class=\"op\">(</span><span class=\"bu\">String</span> nombre <span class=\"op\">:</span> listaNombres<span class=\"op\">)</span> <span class=\"op\">{</span> <span class=\"co\">/* for-each */</span> <span class=\"op\">}</span></span>\n<span id=\"cb3-4\"><a href=\"#cb3-4\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb3-5\"><a href=\"#cb3-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">int</span> i <span class=\"op\">=</span> <span class=\"dv\">0</span><span class=\"op\">;</span></span>\n<span id=\"cb3-6\"><a href=\"#cb3-6\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">while</span> <span class=\"op\">(</span>i <span class=\"op\">&lt;</span> <span class=\"dv\">10</span><span class=\"op\">)</span> <span class=\"op\">{</span> i<span class=\"op\">++;</span> <span class=\"op\">}</span></span>\n<span id=\"cb3-7\"><a href=\"#cb3-7\" aria-hidden=\"true\" tabindex=\"-1\"></a></span>\n<span id=\"cb3-8\"><a href=\"#cb3-8\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">do</span> <span class=\"op\">{</span></span>\n<span id=\"cb3-9\"><a href=\"#cb3-9\" aria-hidden=\"true\" tabindex=\"-1\"></a>    i<span class=\"op\">--;</span></span>\n<span id=\"cb3-10\"><a href=\"#cb3-10\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span> <span class=\"cf\">while</span> <span class=\"op\">(</span>i <span class=\"op\">&gt;</span> <span class=\"dv\">0</span><span class=\"op\">);</span></span></code></pre></div>\n<p><
