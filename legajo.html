strong>Arrays</strong>:</p>\n<div class=\"sourceCode\" id=\"cb4\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb4-1\"><a href=\"#cb4-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">int</span><span class=\"op\">[]</span> numeros <span class=\"op\">=</span> <span class=\"op\">{</span><span class=\"dv\">1</span><span class=\"op\">,</span> <span class=\"dv\">2</span><span class=\"op\">,</span> <span class=\"dv\">3</span><span class=\"op\">,</span> <span class=\"dv\">4</span><span class=\"op\">,</span> <span class=\"dv\">5</span><span class=\"op\">};</span></span>\n<span id=\"cb4-2\"><a href=\"#cb4-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"dt\">int</span><span class=\"op\">[][]</span> matriz <span class=\"op\">=</span> <span class=\"kw\">new</span> <span class=\"dt\">int</span><span class=\"op\">[</span><span class=\"dv\">3</span><span class=\"op\">][</span><span class=\"dv\">3</span><span class=\"op\">];</span></span></code></pre></div>\n<p><strong>Manejo de excepciones</strong> (checked vs. unchecked):</p>\n<div class=\"sourceCode\" id=\"cb5\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb5-1\"><a href=\"#cb5-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">try</span> <span class=\"op\">{</span></span>\n<span id=\"cb5-2\"><a href=\"#cb5-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"dt\">int</span> resultado <span class=\"op\">=</span> <span class=\"dv\">10</span> <span class=\"op\">/</span> divisor<span class=\"op\">;</span></span>\n<span id=\"cb5-3\"><a href=\"#cb5-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span> <span class=\"cf\">catch</span> <span class=\"op\">(</span><span class=\"bu\">ArithmeticException</span> e<span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb5-4\"><a href=\"#cb5-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"bu\">System</span><span class=\"op\">.</span><span class=\"fu\">err</span><span class=\"op\">.</span><span class=\"fu\">println</span><span class=\"op\">(</span><span class=\"st\">&quot;Error: &quot;</span> <span class=\"op\">+</span> e<span class=\"op\">.</span><span class=\"fu\">getMessage</span><span class=\"op\">());</span></span>\n<span id=\"cb5-5\"><a href=\"#cb5-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span> <span class=\"cf\">finally</span> <span class=\"op\">{</span></span>\n<span id=\"cb5-6\"><a href=\"#cb5-6\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"bu\">System</span><span class=\"op\">.</span><span class=\"fu\">out</span><span class=\"op\">.</span><span class=\"fu\">println</span><span class=\"op\">(</span><span class=\"st\">&quot;Bloque finally siempre se ejecuta&quot;</span><span class=\"op\">);</span></span>\n<span id=\"cb5-7\"><a href=\"#cb5-7\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p>Excepciones <em>checked</em> (<code>IOException</code>, <code>SQLException</code>) deben declararse con <code>throws</code> o capturarse obligatoriamente; <em>unchecked</em> (<code>RuntimeException</code> y subclases como <code>NullPointerException</code>, <code>ArrayIndexOutOfBoundsException</code>) no lo exigen. Desde Java 7, <em>try-with-resources</em> cierra automáticamente recursos <code>AutoCloseable</code>:</p>\n<div class=\"sourceCode\" id=\"cb6\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb6-1\"><a href=\"#cb6-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"cf\">try</span> <span class=\"op\">(</span><span class=\"bu\">Connection</span> con <span class=\"op\">=</span> <span class=\"bu\">DriverManager</span><span class=\"op\">.</span><span class=\"fu\">getConnection</span><span class=\"op\">(</span>url<span class=\"op\">,</span> user<span class=\"op\">,</span> pass<span class=\"op\">))</span> <span class=\"op\">{</span></span>\n<span id=\"cb6-2\"><a href=\"#cb6-2\" aria-hidden=\"true\" tabindex=\"-1\"></a>    <span class=\"co\">// uso de con</span></span>\n<span id=\"cb6-3\"><a href=\"#cb6-3\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span> <span class=\"cf\">catch</span> <span class=\"op\">(</span><span class=\"bu\">SQLException</span> e<span class=\"op\">)</span> <span class=\"op\">{</span></span>\n<span id=\"cb6-4\"><a href=\"#cb6-4\" aria-hidden=\"true\" tabindex=\"-1\"></a>    e<span class=\"op\">.</span><span class=\"fu\">printStackTrace</span><span class=\"op\">();</span></span>\n<span id=\"cb6-5\"><a href=\"#cb6-5\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"op\">}</span></span></code></pre></div>\n<p><strong>Genéricos y colecciones</strong>:</p>\n<div class=\"sourceCode\" id=\"cb7\"><pre class=\"sourceCode java\"><code class=\"sourceCode java\"><span id=\"cb7-1\"><a href=\"#cb7-1\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"bu\">List</span><span class=\"op\">&lt;</span><span class=\"bu\">String</span><span class=\"op\">&gt;</span> nombres <span class=\"op\">=</span> <span class=\"kw\">new</span> <span class=\"bu\">ArrayList</span><span class=\"op\">&lt;&gt;();</span></span>\n<span id=\"cb7-2\"><a href=\"#cb7-2\" aria-hidden=\"true\" tabindex=\"-1\"></a><span class=\"bu\">Map</span><span class=\"op\">&lt;</span><span class=\"bu\">String</span><span class=\"op\">,</span> <span class=\"bu\">Integer</span><span class=\"op\">&gt;</span> edades <span class=\"op\">=</span> <span class=\"kw\">new</span> <span class=\"bu\">HashMap</span><span class=\"op\">&lt;&gt;();</span></span></code></pre></div>\n<p><strong>Elementos modernos</strong>: <em>records</em> (Java 16, clases inmutables concisas: <code>record Punto(int x, int y) {}</code>), <em>streams</em> para procesamiento funcional (<code>lista.stream().filter(n -&gt; n &gt; 10).collect(Collectors.toList())</code>), expresiones lambda (<code>(a, b) -&gt; a + b</code>) e interfaces funcionales (<code>Runnable</code>, <code>Comparator</code>, <code>Function&lt;T,R&gt;</code>).</p>\n"}, {"num": 26, "title": "Reglamento (UE) 2016/679 del Parlamento Europeo y del Consejo de 27 de abril de 2016 relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales y a la libre circulación de estos datos (RGPD).", "html": "<p>El <strong>RGPD</strong> (Reglamento General de Protección de Datos, Reglamento UE 2016/679), aplicable desde el 25 de mayo de 2018, es de aplicación directa en todos los Estados miembros sin necesidad de transposición, sustituyendo a la Directiva 95/46/CE. En España se completa con la <strong>LOPDGDD</strong> (Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales).</p>\n<p><strong>Ámbito de aplicación</strong>: material (tratamiento total o parcialmente automatizado de datos personales, o tratamiento no automatizado incluido en un fichero) y territorial (responsables/encargados establecidos en la UE, y también fuera de la UE si ofrecen bienes/servicios o monitorizan el comportamiento de interesados en la UE — criterio de extraterritorialidad, art. 3).</p>\n<p><strong>Principios (art. 5)</strong>: licitud, lealtad y transparencia; limitación de la finalidad; minimización de datos; exactitud; limitación del plazo de conservación; integridad y confidencialidad; y <strong>responsabilidad proactiva (accountability)</strong>, principio transversal que obliga al responsable a poder demostrar el cumplimiento.</p>\n<p><strong>Bases de legitimación (art. 6)</strong>: consentimiento (debe ser libre, específico, informado, inequívoco y revocable, art. 4.11 y 7), ejecución de un contrato, cumplimiento de una obligación legal, protección de intereses vitales, cumplimiento de una misión de interés público o ejercicio de poderes públicos (base típica de la Administración), e interés legítimo.</p>\n<p><strong>Categorías especiales de datos (art. 9)</strong>: origen étnico/racial, opiniones políticas, convicciones religiosas/filosóficas, afiliación sindical, datos genéticos, biométricos, de salud, vida u orientación sexual — tratamiento prohibido salvo excepciones tasadas (consentimiento explícito, interés público esencial, obligación en el ámbito laboral/social).</p>\n<p><strong>Derechos de los interesados (arts. 15-22, \"ARSULOP\")</strong>: Acceso, Rectificación, Supresión (\"derecho al olvido\"), Limitación del tratamiento, Portabilidad (obtener los datos en formato estructurado, de uso común y lectura mecánica), Oposición, y decisiones no basadas únicamente en tratamiento automatizado (incluida la elaboración de perfiles). Plazo general de respuesta: <strong>1 mes</strong>, prorrogable 2 meses más si es complejo.</p>\n<p><strong>Obligaciones del responsable/encargado</strong>:</p>\n<ul>\n<li><strong>Registro de actividades de tratamiento (RAT, art. 30)</strong>: obligatorio (con umbral de exención para organizaciones &lt;250 empleados salvo ciertos supuestos).</li>\n<li><strong>Evaluación de Impacto relativa a la Protección de Datos (EIPD/DPIA, art. 35)</strong>: obligatoria cuando el tratamiento entrañe alto riesgo (evaluación sistemática, tratamiento a gran escala de categorías especiales, observación sistemática a gran escala).</li>\n<li><strong>Delegado de Protección de Datos (DPO, art. 37)</strong>: obligatorio en autoridades/organismos públicos (salvo tribunales en ejercicio de función jurisdiccional), en tratamientos de observación sistemática a gran escala, o categorías especiales a gran escala.</li>\n<li><strong>Privacidad desde el diseño y por defecto (art. 25)</strong>: incorporar medidas técnicas/organizativas desde la concepción del sistema y configurar por defecto solo el tratamiento necesario.</li>\n<li><strong>Notificación de violaciones de seguridad (arts. 33-34)</strong>: a la autoridad de control (AEPD en España) en un plazo máximo de <strong>72 horas</strong> desde que se tenga conocimiento; comunicación al interesado si supone alto riesgo.</li>\n<li><strong>Medidas de seguridad (art. 32)</strong>: pseudonimización, cifrado, garantía de confidencialidad/integridad/disponibilidad/resiliencia, capacidad de restauración tras incidente, verificación periódica.</li>\n</ul>\n<p><strong>Encargado del tratamiento</strong>: debe existir un contrato o acto jurídico (art. 28) que regule objeto, duración, naturaleza, finalidad, tipo de datos, obligaciones y derechos.</p>\n<p><strong>Transferencias internacionales (Capítulo V)</strong>: solo a terceros países con decisión de adecuación de la Comisión, o mediante garantías adecuadas (Cláusulas Contractuales Tipo, normas corporativas vinculantes - BCR).</p>\n<p><strong>Sanciones (art. 83)</strong>: dos niveles — hasta 10 millones € o 2% del volumen de negocio global (infracciones \"menos graves\": deberes del encargado, EIPD, DPO) y hasta 20 millones € o 4% (infracciones \"graves\": principios, consentimiento, derechos de los interesados, transferencias internacionales). La AEPD es la autoridad de control en España, con potestad sancionadora e inspectora.</p>\n"}, {"num": 27, "title": "Seguridad en redes de ordenadores. Tipos de ataques y defensas. Políticas de seguridad para redes corporativas.", "html": "<p><strong>Fundamentos de seguridad</strong>: la tríada CIA — Confidencialidad, Integridad, Disponibilidad —, ampliada con Autenticidad y No Repudio (modelo CIDAN/AAA extendido).</p>\n<p><strong>Tipos de ataques:</strong></p>\n<p><em>Ataques de reconocimiento</em>: sniffing (captura de tráfico, herramientas Wireshark/tcpdump), escaneo de puertos (Nmap), footprinting.</p>\n<p><em>Ataques de acceso/intrusión</em>:</p>\n<ul>\n<li><strong>Spoofing</strong>: IP spoofing (suplantación de dirección origen), ARP spoofing/poisoning (envenenamiento de tablas ARP para interceptar tráfico en LAN), DNS spoofing/cache poisoning.</li>\n<li><strong>Man-in-the-Middle (MitM)</strong>: interceptación activa entre dos partes, frecuentemente combinado con ARP spoofing o portales wifi falsos (evil twin).</li>\n<li><strong>Ataques de fuerza bruta y diccionario</strong> contra credenciales.</li>\n<li><strong>Explotación de vulnerabilidades</strong>: buffer overflow, inyección SQL, RCE (Remote Code Execution) sobre servicios expuestos.</li>\n</ul>\n<p><em>Ataques de denegación de servicio</em>:</p>\n<ul>\n<li><strong>DoS/DDoS</strong>: SYN flood (agotamiento de la pila TCP mediante conexiones semiabiertas), UDP flood, ICMP flood (ping flood), ataques de amplificación (DNS/NTP amplification), y a nivel de aplicación (HTTP flood, Slowloris).</li>\n</ul>\n<p><em>Malware</em>: virus, gusanos (autopropagación en red sin intervención humana), troyanos, ransomware (cifrado extorsivo, vector habitual: phishing/RDP expuesto), rootkits (persistencia oculta a nivel de kernel), botnets (redes de equipos zombi controladas para DDoS/spam).</p>\n<p><em>Ingeniería social</em>: phishing, spear phishing (dirigido), whaling (a directivos), vishing/smishing (voz/SMS), pretexting.</p>\n<p><em>Ataques a nivel de aplicación web</em>: XSS (Cross-Site Scripting, inyección de script en páginas confiadas), CSRF (Cross-Site Request Forgery), inyección SQL, path traversal, referenciados en el <strong>OWASP Top 10</strong>.</p>\n<p><strong>Defensas y controles:</strong></p>\n<p><strong>Perimetrales</strong>: <strong>Firewall</strong> (filtrado por reglas, capas 3-4; de nueva generación NGFW añade inspección de capa 7 y control de aplicaciones), <strong>IDS/IPS</strong> (Snort, Suricata — detección vs. prevención activa mediante firmas y análisis de anomalías), <strong>DMZ</strong> (zona desmilitarizada para servicios expuestos, aislada de la red interna con doble firewall o firewall de tres interfaces), <strong>proxy</strong> (control de salida, filtrado de contenido) y <strong>reverse proxy</strong> (protección de servidores internos).</p>\n<p><strong>Segmentación</strong>: VLAN (aislamiento lógico de capa 2), microsegmentación en entornos virtualizados, arquitectura <strong>Zero Trust</strong> (verificación continua, \"nunca confiar, siempre verificar\", independiente de la ubicación en red).</p>\n<p><strong>Cifrado</strong>: VPN (IPSec en modo túnel/transporte, con IKE para negociación de claves; SSL/TLS VPN), TLS 1.2/1.3 para tráfico web, cifrado en reposo de datos sensibles.</p>\n<p><strong>Autenticación</strong>: <strong>802.1X</strong> (control de acceso a red basado en puertos, con servidor RADIUS), <strong>MFA</strong> (autenticación multifactor), políticas de contraseñas robustas, gestión de identidades (IAM).</p>\n<p><strong>Monitorización</strong>: <strong>SIEM</strong> (correlación de logs y eventos de seguridad, alertas), <strong>NAC</strong> (Network Access Control, verifica cumplimiento del endpoint antes de conceder acceso), honeypots (señuelos para detectar/estudiar atacantes), análisis de tráfico con NetFlow/sFlow.</p>\n<p><strong>Protección de infraestructura</strong>: hardening de sistemas (deshabilitar servicios innecesarios, parcheo regular), segregación de redes de gestión (out-of-band), listas de control de acceso (ACL) en routers/switches, port security (limitación de MAC por puerto), protección contra spoofing con DHCP snooping y Dynamic ARP Inspection.</p>\n<p><strong>Políticas de seguridad corporativas</strong>: deben incluir política de uso aceptable (PUA), gestión de activos, control de acceso basado en el principio de mínimo privilegio, clasificación de la información, gestión de parches, plan de respuesta a incidentes (con roles CSIRT/CERT), plan de continuidad de negocio (BCP) y de recuperación ante desastres (DRP), formación y concienciación periódica del personal (el eslabón humano es el vector más explotado), auditorías periódicas y pentesting, y cumplimiento normativo (ENS en el caso de la Administración Pública española, ISO/IEC 27001 como marco de gestión).</p>\n"}, {"num": 28, "title": "Certificados digitales.", "html": "<p>Un <strong>certificado digital</strong> es un documento electrónico firmado por una Autoridad de Certificación (CA) que vincula una clave pública a la identidad de su titular (persona física, jurídica, dispositivo o sede electrónica), garantizando autenticidad, integridad y no repudio en las comunicaciones y transacciones electrónicas. Se basa en criptografía asimétrica: un par de claves, pública (contenida en el certificado, distribuible) y privada (custodiada de forma segura por el titular, en tarjeta criptográfica, HSM o almacén software).</p>\n<p><strong>Estándar X.509 (v3)</strong>, campos principales: número de serie, algoritmo de firma (típicamente <code>SHA256withRSA</code> o ECDSA), emisor (Issuer/DN de la CA), periodo de validez (<code>Not Before</code>/<code>Not After</code>), sujeto (Subject/DN del titular), clave pública, extensiones (Key Usage, Extended Key Usage, Subject Alternative Name — SAN, CRL Distribution Point, Authority Information Access/OCSP), y la firma digital de la CA sobre todo lo anterior.</p>\n<p><strong>Infraestructura de Clave Pública (PKI)</strong>, componentes:</p>\n<ul>\n<li><strong>Autoridad de Certificación (CA)</strong>: emite y firma certificados; puede haber jerarquía (CA raíz, autofirmada, y CAs subordinadas/intermedias) formando una <strong>cadena de confianza</strong> que se valida hasta un certificado raíz de confianza instalado en el almacén del sistema/navegador.</li>\n<li><strong>Autoridad de Registro (RA)</strong>: verifica la identidad del solicitante antes de la emisión (en España, oficinas de registro presenciales para persona física con FNMT).</li>\n<li><strong>Repositorio/Directorio</strong>: publica certificados emitidos y listas de revocación.</li>\n<li><strong>Autoridad de Validación</strong>: comprueba el estado de un certificado mediante <strong>CRL</strong> (Certificate Revocation List, lista periódica de números de serie revocados) u <strong>OCSP</strong> (Online Certificate Status Protocol, consulta en tiempo real punto a punto, más eficiente y con menor latencia de propagación).</li>\n</ul>\n<p><strong>Ciclo de vida</strong>: solicitud → verificación de identidad (RA) → generación de par de claves → emisión y firma (CA) → distribución → uso → renovación → revocación (por compromiso de clave, cese, cambio de datos) o expiración.</p>\n<p><strong>Tipos de certificados en España</strong>: certificado de persona física (FNMT, DNIe — este último embebido en el chip del documento de identidad), de representante (persona jurídica/entidad sin personalidad), de sede electrónica (identifica un sitio web de una Administración), de sello electrónico (actuación administrativa automatizada, sin intervención de una persona física concreta), de empleado público, y certificados de componente/servidor (TLS).</p>\n<p><strong>Prestadores de servicios de confianza cualificados</strong> en España, según el <strong>Reglamento eIDAS (UE 910/2014)</strong>: FNMT-RCM (CERES), DNIe, y otros prestadores privados (Camerfirma, Firmaprofesional, ANF AC, etc.), listados en la TSL (Trusted List) nacional.</p>\n<p><strong>Firma electrónica</strong>, niveles según eIDAS: simple, avanzada (vinculada de manera única al firmante, permite su identificación, creada con medios bajo su control exclusivo y detecta modificaciones posteriores) y <strong>cualificada</strong> (avanzada + certificado cualificado + dispositivo cualificado de creación de firma, DCCF — equivalente jurídico a la firma manuscrita, con presunción de validez).</p>\n<p><strong>Formatos de firma electrónica avanzada</strong>: <strong>XAdES</strong> (XML Advanced Electronic Signatures), <strong>CAdES</strong> (basado en CMS/PKCS#7, para cualquier tipo de documento binario), <strong>PAdES</strong> (específico para PDF, compatible con el estándar ISO 32000). Cada uno define niveles de firma (BES, T con sello de tiempo, LT con información de validación a largo plazo, LTA con archivo a largo plazo).</p>\n<p><strong>Sello de tiempo (timestamp, RFC 3161)</strong>: emitido por una TSA (Time Stamping Authority), garantiza que un documento existía en un instante determinado, esencial para la validez a largo plazo de la firma tras la expiración del certificado.</p>\n<p><strong>Aplicación práctica en la Administración</strong>: plataformas @firma (validación de certificados y firma del Estado), Cl@ve (identificación electrónica ciudadana, combina Cl@ve PIN/Permanente con certificado/DNIe), Autofirma (cliente de firma de escritorio del Gobierno de España), Port@firmas (tramitación de firmas en flujos de trabajo administrativos).</p>\n"}, {"num": 29, "title": "Real Decreto 3/2010, de 8 de enero, por el que se regula el Esquema Nacional de Seguridad en el ámbito de la Administración Electrónica (ENS).", "html": "<p>El <strong>Esquema Nacional de Seguridad (ENS)</strong> fue creado por el <strong>RD 3/2010</strong>, de 8 de enero, en desarrollo del artículo 42 de la entonces Ley 11/2007 de acceso electrónico de los ciudadanos, con el objetivo de establecer los principios y requisitos de una política de seguridad en la utilización de medios electrónicos que permitiera la protección adecuada de la información. <strong>Este Real Decreto fue derogado y sustituido por el RD 311/2022, de 3 de mayo</strong>, que actualiza el ENS adaptándolo al RGPD, a la Ley 40/2015 de Régimen Jurídico del Sector Público, al Reglamento eIDAS y a la evolución de las ciberamenazas, reforzando además la coordinación con el Esquema Nacional de Interoperabilidad (ENI) y con el CCN-CERT.</p>\n<p><strong>Ámbito de aplicación (RD 311/2022)</strong>: sector público (Administración General del Estado, CCAA, Entidades Locales, entidades de derecho público vinculadas) y, cuando presten servicios a las Administraciones o ejerzan potestades administrativas, también a entidades del sector privado.</p>\n<p><strong>Principios básicos</strong>: seguridad como proceso integral, gestión de la seguridad basada en riesgos, prevención/detección/respuesta/conservación (nuevo enfoque frente al RD 3/2010, que hablaba de prevención-reacción-recuperación), existencia de líneas de defensa, vigilancia continua, y reevaluación periódica.</p>\n<p><strong>Requisitos mínimos</strong>: organización e implantación del proceso de seguridad, análisis y gestión de riesgos, gestión de personal, profesionalidad, autorización y control de accesos, protección de instalaciones, adquisición de productos, seguridad por defecto, integridad y actualización del sistema, protección de la información almacenada y en tránsito, prevención frente a otros sistemas interconectados, registro de actividad y detección de código dañino, incidentes de seguridad, continuidad de la actividad, y mejora continua del proceso de seguridad.</p>\n<p><strong>Categorización de sistemas</strong>: se determina en función del impacto que tendría un incidente sobre las dimensiones de seguridad, en tres niveles — <strong>BÁSICA, MEDIA, ALTA</strong>. Las <strong>dimensiones de seguridad (ADATC/CIDAT)</strong> son: Confidencialidad, Integridad, Disponibilidad, Autenticidad y Trazabilidad (el RD 311/2022 añade \"Conservación\" como propiedad adicional). La categoría del sistema es la más alta entre las alcanzadas por cada dimensión, siguiendo la metodología de valoración recogida en el Anexo I.</p>\n<p><strong>Medidas de seguridad (Anexo II)</strong>, organizadas en tres grupos:</p>\n<ul>\n<li><strong>Marco organizativo</strong>: política de seguridad, normativa de seguridad, procedimientos de seguridad, proceso de autorización.</li>\n<li><strong>Marco operacional</strong>: planificación, control de acceso, explotación, servicios externos, continuidad del servicio, monitorización del sistema.</li>\n<li><strong>Medidas de protección</strong>: protección de instalaciones e infraestructuras, gestión del personal, protección de equipos, protección de comunicaciones, protección de soportes de información, protección de aplicaciones informáticas, protección de la información, protección de servicios.</li>\n</ul>\n<p>El número de medidas aplicables aumenta con la categoría del sistema (aplicación gradual/graduada); además existen <strong>refuerzos</strong> y medidas compensatorias cuando una medida no puede implantarse íntegramente.</p>\n<p><strong>Auditoría de seguridad</strong>: obligatoria al menos cada dos años (y siempre que haya cambios sustanciales) para sistemas de categoría MEDIA o ALTA; para categoría BÁSICA basta con autoevaluación. El informe de auditoría se remite al responsable de seguridad y a los órganos competentes.</p>\n<p><strong>Declaración y certificación de conformidad</strong>: el RD 311/2022 introduce la <strong>Declaración de Conformidad</strong> con el ENS y refuerza el régimen de <strong>certificación</strong> por entidades de certificación acreditadas por ENAC, otorgando mayor peso a la verificación independiente frente al modelo de autoevaluación predominante bajo el RD 3/2010.</p>\n<p><strong>Estructura de gobernanza de la seguridad</strong>: responsable de la información, <strong>responsable de la seguridad</strong> (distinto del responsable del sistema, garantiza la coordinación), <strong>responsable del sistema</strong>, y el <strong>Comité o Comisión de Seguridad TIC</strong>, roles que deben quedar diferenciados para evitar conflictos de interés.</p>\n<p><strong>Actualización de guías CCN-STIC</strong>: el Centro Criptológico Nacional (CCN) desarrolla la serie de guías CCN-STIC (destaca la CCN-STIC-800, \"Glosario y Abreviaturas del ENS\", y la CCN-STIC-804 sobre medidas de implantación) que operativizan los requisitos del ENS, herramienta de referencia obligada para cualquier técnico de sistemas de una Administración Pública española, incluida la CARM.</p>\n"}]}]}</script>
<script>
(function(){
  "use strict";
  var RAW = JSON.parse(document.getElementById("tema-data").textContent);

  // Merge Murcia especificas 1-15 + 16-29 into one continuous block
  var mur = RAW.MUR;
  var comunes = mur.find(function(b){return b.key==="comunes";});
  var esp1 = mur.find(function(b){return b.key==="esp1";});
  var esp2 = mur.find(function(b){return b.key==="esp2";});
  var especificas = {
    key:"esp",
    title:"Materias específicas — Opción Informática",
    temas: esp1.temas.concat(esp2.temas).sort(function(a,b){return a.num-b.num;})
  };

  var GROUPS = [
    {key:"TAI", label:"Cuerpo TAI (Estado)", blocks: RAW.TAI},
    {key:"MUR", label:"Técnico Especialista (Murcia)", blocks:[comunes, especificas]}
  ];

  // flatten ordered list for prev/next
  var FLAT = [];
  GROUPS.forEach(function(g){
    g.blocks.forEach(function(b){
      b.temas.forEach(function(t){
        FLAT.push({group:g.key, groupLabel:g.label, blockKey:b.key, blockTitle:b.title, num:t.num, title:t.title, html:t.html});
      });
    });
  });
  function idOf(item){ return item.group+"|"+item.blockKey+"|"+item.num; }
  var INDEX = {};
  FLAT.forEach(function(it, i){ INDEX[idOf(it)] = i; });

  var TOTAL = FLAT.length;

  /* ---------- progress storage ---------- */
  var LS_PROGRESS = "legajo-progress-v1";
  var LS_LAST = "legajo-last-v1";
  var LS_THEME = "legajo-theme-v1";
  var done = {};
  try{
    var stored = JSON.parse(localStorage.getItem(LS_PROGRESS) || "[]");
    stored.forEach(function(id){ done[id]=true; });
  }catch(e){}

  function saveProgress(){
    try{ localStorage.setItem(LS_PROGRESS, JSON.stringify(Object.keys(done))); }catch(e){}
  }
  function toggleDone(id){
    if(done[id]) delete done[id]; else done[id]=true;
    saveProgress();
    renderProgress();
  }

  /* ---------- build sidebar tree ---------- */
  var treeEl = document.getElementById("tree");
  var blockEls = {}; // key -> {barFill, cntEl, li, ul, temaBtns:{}}

  GROUPS.forEach(function(g){
    var grpWrap = document.createElement("div");
    grpWrap.className = "grp";
    var gTitle = document.createElement("div");
    gTitle.className = "grp-title";
    gTitle.innerHTML = "<span>"+g.label+"</span><span class=\"n\" id=\"gn-"+g.key+"\"></span>";
    grpWrap.appendChild(gTitle);

    g.blocks.forEach(function(b){
      var blk = document.createElement("div");
      blk.className = "blk";
      if(g.key==="TAI" && b.key==="b1") blk.classList.add("open");

      var btn = document.createElement("button");
      btn.type="button";
      btn.className="blk-btn";
      btn.innerHTML = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>'+
        '<span class="lbl">'+b.title+'</span><span class="cnt" id="cnt-'+g.key+"-"+b.key+'"></span>';
      btn.addEventListener("click", function(){ blk.classList.toggle("open"); });
      blk.appendChild(btn);

      var barWrap = document.createElement("div");
      barWrap.className="blk-bar";
      var barFill = document.createElement("i");
      barFill.style.width="0%";
      barWrap.appendChild(barFill);
      blk.appendChild(barWrap);

      var ul = document.createElement("ul");
      ul.className="blk-list";

      var temaBtns = {};
      b.temas.forEach(function(t){
        var id = g.key+"|"+b.key+"|"+t.num;
        var row = document.createElement("li");
        row.className="tema-row";

        var chk = document.createElement("span");
        chk.className="check";
        chk.tabIndex=0;
        chk.setAttribute("role","checkbox");
        chk.setAttribute("aria-label","Marcar tema "+t.num+" como estudiado");
        chk.addEventListener("click", function(ev){ ev.stopPropagation(); toggleDone(id); });
        chk.addEventListener("keydown", function(ev){ if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();toggleDone(id);} });

        var tbtn = document.createElement("button");
        tbtn.type="button";
        tbtn.className="tema-btn";
        tbtn.dataset.search = (t.num+" "+t.title).toLowerCase();
        tbtn.innerHTML = '<span class="num">'+t.num+'</span><span class="ttl">'+t.title+'</span>';
        tbtn.addEventListener("click", function(){ goTo(id); if(window.innerWidth<=900) closeSidebar(); });
        tbtn.prepend(chk);

        row.appendChild(tbtn);
        ul.appendChild(row);
        temaBtns[t.num] = {btn:tbtn, chk:chk, row:row};
      });

      blk.appendChild(ul);
      grpWrap.appendChild(blk);
      blockEls[g.key+"|"+b.key] = {barFill:barFill, cntEl:null, temas:b.temas, temaBtns:temaBtns};
    });

    treeEl.appendChild(grpWrap);
  });

  /* ---------- progress rendering ---------- */
  function renderProgress(){
    var overallDone=0;
    GROUPS.forEach(function(g){
      var gDone=0, gTotal=0;
      g.blocks.forEach(function(b){
        var be = blockEls[g.key+"|"+b.key];
        var bDone=0;
        b.temas.forEach(function(t){
          var id=g.key+"|"+b.key+"|"+t.num;
          var isDone=!!done[id];
          if(isDone) bDone++;
          var info = be.temaBtns[t.num];
          info.btn.classList.toggle("done", isDone);
          info.chk.classList.toggle("on", isDone);
        });
        gDone+=bDone; gTotal+=b.temas.length;
        be.barFill.style.width = (bDone/b.temas.length*100)+"%";
        var cnt = document.getElementById("cnt-"+g.key+"-"+b.key);
        if(cnt) cnt.textContent = bDone+"/"+b.temas.length;
      });
      overallDone+=gDone;
      var gn = document.getElementById("gn-"+g.key);
      if(gn) gn.textContent = gDone+"/"+gTotal;
    });
    var pct = TOTAL? Math.round(overallDone/TOTAL*100) : 0;
    document.getElementById("ov-pct").textContent = overallDone+"/"+TOTAL+" · "+pct+"%";
    document.getElementById("ov-bar").style.width = pct+"%";

    if(current){
      var curId = idOf(current);
      markBtn.classList.toggle("on", !!done[curId]);
      markLabel.textContent = done[curId] ? "Estudiado" : "Marcar como estudiado";
    }
  }

  /* ---------- reader ---------- */
  var contentEl = document.getElementById("content");
  var topbarTitle = document.getElementById("topbar-title");
  var current = null;
  var markBtn, markLabel;

  function wrapExtras(html){
    var div = document.createElement("div");
    div.innerHTML = html;
    div.querySelectorAll("table").forEach(function(t){
      var w = document.createElement("div"); w.className="tbl-wrap";
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    div.querySelectorAll("pre.sourceCode, pre:not(.sourceCode)").forEach(function(p){
      var w = document.createElement("div"); w.className="code-block";
      p.parentNode.insertBefore(w, p); w.appendChild(p);
    });
    return div.innerHTML;
  }

  function goTo(id){
    var idx = INDEX[id];
    if(idx===undefined) return;
    current = FLAT[idx];
    renderCurrent();
    try{ localStorage.setItem(LS_LAST, id); }catch(e){}
    document.querySelectorAll(".tema-btn.active").forEach(function(b){b.classList.remove("active");});
    var be = blockEls[current.group+"|"+current.blockKey];
    if(be){
      var info = be.temaBtns[current.num];
      if(info){
        info.btn.classList.add("active");
        var blk = info.btn.closest(".blk");
        if(blk) blk.classList.add("open");
        info.row.scrollIntoView({block:"nearest"});
      }
    }
    main.scrollTo({top:0, behavior:"auto"});
  }

  function renderCurrent(){
    if(!current) return;
    topbarTitle.textContent = "Tema "+current.num+" · "+current.blockTitle;
    var idx = INDEX[idOf(current)];
    var prev = FLAT[idx-1], next = FLAT[idx+1];
    var id = idOf(current);

    contentEl.innerHTML =
      '<div class="reader">'+
        '<div class="crumb">'+current.groupLabel+'<span class="sep">›</span>'+current.blockTitle+'</div>'+
        '<div class="tema-head">'+
          '<div class="num">'+String(current.num).padStart(2,"0")+'</div>'+
          '<h2>'+current.title+'</h2>'+
          '<button class="mark-btn" id="mark-btn" type="button"><span class="dot"></span><span id="mark-label">Marcar como estudiado</span></button>'+
        '</div>'+
        '<div class="prose">'+wrapExtras(current.html)+'</div>'+
        '<div class="nav-foot">'+
          '<button class="nav-card prev" '+(prev?"":"disabled")+' id="prev-btn"><div class="lbl">← Anterior</div><div class="ttl">'+(prev? "T"+prev.num+". "+prev.title : "—")+'</div></button>'+
          '<button class="nav-card next" '+(next?"":"disabled")+' id="next-btn"><div class="lbl">Siguiente →</div><div class="ttl">'+(next? "T"+next.num+". "+next.title : "—")+'</div></button>'+
        '</div>'+
      '</div>';

    markBtn = document.getElementById("mark-btn");
    markLabel = document.getElementById("mark-label");
    markBtn.addEventListener("click", function(){ toggleDone(id); });
    markBtn.classList.toggle("on", !!done[id]);
    markLabel.textContent = done[id] ? "Estudiado" : "Marcar como estudiado";

    if(prev) document.getElementById("prev-btn").addEventListener("click", function(){ goTo(idOf(prev)); });
    if(next) document.getElementById("next-btn").addEventListener("click", function(){ goTo(idOf(next)); });
  }

  /* ---------- search ---------- */
  var searchEl = document.getElementById("search");
  searchEl.addEventListener("input", function(){
    var q = searchEl.value.trim().toLowerCase();
    document.querySelectorAll(".blk").forEach(function(blk){
      var rows = blk.querySelectorAll(".tema-row");
      var any = false;
      rows.forEach(function(row){
        var btn = row.querySelector(".tema-btn");
        var match = !q || btn.dataset.search.indexOf(q) !== -1;
        row.classList.toggle("hidden", !match);
        if(match) any = true;
      });
      if(q){ blk.classList.toggle("open", any); }
      blk.style.display = (q && !any) ? "none" : "";
    });
  });

  /* ---------- keyboard shortcuts ---------- */
  document.addEventListener("keydown", function(ev){
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if(ev.key==="/" && tag!=="INPUT"){ ev.preventDefault(); searchEl.focus(); return; }
    if(tag==="INPUT") return;
    if(ev.key==="ArrowLeft" && current){
      var idx = INDEX[idOf(current)];
      if(FLAT[idx-1]) goTo(idOf(FLAT[idx-1]));
    }
    if(ev.key==="ArrowRight" && current){
      var idx2 = INDEX[idOf(current)];
      if(FLAT[idx2+1]) goTo(idOf(FLAT[idx2+1]));
    }
    if(ev.key==="Escape") closeSidebar();
  });

  /* ---------- mobile sidebar ---------- */
  var main = document.getElementById("main");
  function openSidebar(){ document.body.classList.add("sb-open"); }
  function closeSidebar(){ document.body.classList.remove("sb-open"); }
  document.getElementById("menu-btn").addEventListener("click", openSidebar);
  document.addEventListener("click", function(ev){
    if(document.body.classList.contains("sb-open") &&
       !document.getElementById("sidebar").contains(ev.target) &&
       ev.target.id !== "menu-btn" && !document.getElementById("menu-btn").contains(ev.target)){
      closeSidebar();
    }
  });

  /* ---------- theme toggle ---------- */
  var themeBtn = document.getElementById("theme-btn");
  var themeIcon = document.getElementById("theme-icon");
  var themeLabel = document.getElementById("theme-label");
  var THEMES = ["auto","light","dark"];
  var ICONS = {auto:"◐", light:"☀", dark:"☾"};
  var LABELS = {auto:"Automático", light:"Claro", dark:"Oscuro"};
  function applyTheme(t){
    if(t==="auto"){ document.documentElement.removeAttribute("data-theme"); }
    else{ document.documentElement.setAttribute("data-theme", t); }
    themeIcon.textContent = ICONS[t];
    themeLabel.textContent = LABELS[t];
  }
  var savedTheme = "auto";
  try{ savedTheme = localStorage.getItem(LS_THEME) || "auto"; }catch(e){}
  applyTheme(savedTheme);
  themeBtn.addEventListener("click", function(){
    var i = THEMES.indexOf(savedTheme);
    savedTheme = THEMES[(i+1)%THEMES.length];
    applyTheme(savedTheme);
    try{ localStorage.setItem(LS_THEME, savedTheme); }catch(e){}
  });

  /* ---------- reset ---------- */
  document.getElementById("reset-btn").addEventListener("click", function(){
    if(confirm("¿Reiniciar todo el progreso de estudio? Esta acción no se puede deshacer.")){
      done = {};
      saveProgress();
      renderProgress();
    }
  });

  /* ---------- init ---------- */
  renderProgress();
  var lastId = null;
  try{ lastId = localStorage.getItem(LS_LAST); }catch(e){}
  if(lastId && INDEX[lastId]!==undefined){ goTo(lastId); }
  else { goTo(idOf(FLAT[0])); }
})();
</script>
