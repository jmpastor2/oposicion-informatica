<meta charset="utf-8">
<title>Legajo TAI·CARM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  /* ============ TOKENS ============ */
  :root{
    --paper:#eeece1;
    --surface:#fbfaf5;
    --surface-2:#e3e0d0;
    --ink:#1d2837;
    --ink-soft:#525d6e;
    --ink-faint:#7c8494;
    --border:#d5d0bd;
    --border-strong:#c2bca5;
    --accent:#9c3527;
    --accent-ink:#fbf7ee;
    --accent-soft:#e9d9d1;
    --gold:#8a6a1d;
    --gold-soft:#e9dfc3;
    --good:#3f6b3f;
    --shadow:0 1px 2px rgba(29,40,55,.06), 0 8px 24px -12px rgba(29,40,55,.18);

    /* code / skylighting */
    --code-bg:#28313f;
    --code-ink:#dfe4ec;
    --code-kw:#e0a15c;   /* keyword */
    --code-dt:#d98c8c;   /* datatype */
    --code-st:#9fc492;   /* string */
    --code-co:#7c8fa6;   /* comment */
    --code-fu:#8ab4d8;   /* function */
    --code-dv:#c9a8e0;   /* number */
    --code-op:#dfe4ec;   /* operator */

    --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
    --sans:"Public Sans", -apple-system, "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#151a22;
      --surface:#1c2129;
      --surface-2:#262c36;
      --ink:#e9e6db;
      --ink-soft:#a8adb8;
      --ink-faint:#767c88;
      --border:#333a46;
      --border-strong:#434b59;
      --accent:#e08a76;
      --accent-ink:#1a1512;
      --accent-soft:#3a2620;
      --gold:#d9bd6f;
      --gold-soft:#39331d;
      --good:#7fae7f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --code-bg:#11151b;
      --code-ink:#dfe4ec;
    }
  }
  :root[data-theme="dark"]{
    --paper:#151a22;
    --surface:#1c2129;
    --surface-2:#262c36;
    --ink:#e9e6db;
    --ink-soft:#a8adb8;
    --ink-faint:#767c88;
    --border:#333a46;
    --border-strong:#434b59;
    --accent:#e08a76;
    --accent-ink:#1a1512;
    --accent-soft:#3a2620;
    --gold:#d9bd6f;
    --gold-soft:#39331d;
    --good:#7fae7f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --code-bg:#11151b;
    --code-ink:#dfe4ec;
  }

  /* ============ RESET / BASE ============ */
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--serif);text-wrap:balance;margin:0;}
  a{color:var(--accent);}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  .app{
    display:grid;
    grid-template-columns:320px 1fr;
    height:100vh;
    height:100dvh;
  }

  /* ============ SIDEBAR ============ */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .sb-head{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .sb-brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:2px;
  }
  .sb-brand .mark{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--gold);
    background:var(--gold-soft);
    padding:2px 6px;
    border-radius:3px;
    font-weight:600;
  }
  .sb-brand h1{
    font-size:20px;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .sb-sub{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:2px;
    font-family:var(--mono);
    letter-spacing:.02em;
  }

  .progress-overall{margin-top:14px;}
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-family:var(--mono);
  }
  .progress-row strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
  .bar{
    height:6px;
    background:var(--surface-2);
    border-radius:99px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .bar > i{
    display:block;
    height:100%;
    background:var(--accent);
    border-radius:99px;
    transition:width .35s ease;
  }
  @media (prefers-reduced-motion:reduce){ .bar > i{transition:none;} }

  .sb-search{
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .sb-search input{
    width:100%;
    padding:8px 10px 8px 30px;
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:7px;
    color:var(--ink);
    font-size:13.5px;
    font-family:var(--sans);
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23767c88" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>');
    background-repeat:no-repeat;
    background-position:9px center;
  }
  .sb-search input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .sb-search .hint{font-size:10.5px;color:var(--ink-faint);margin-top:6px;font-family:var(--mono);}
  kbd{
    background:var(--surface-2);
    border:1px solid var(--border-strong);
    border-bottom-width:2px;
    border-radius:4px;
    padding:0px 4px;
    font-family:var(--mono);
    font-size:10px;
  }

  .sb-tree{
    flex:1 1 auto;
    overflow-y:auto;
    padding:8px 10px 24px;
  }
  .grp{margin-top:10px;}
  .grp-title{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .grp-title .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-soft);}

  .blk{margin-bottom:2px;}
  .blk-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 8px;
    background:none;
    border:none;
    text-align:left;
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    border-radius:6px;
    cursor:pointer;
  }
  .blk-btn:hover{background:var(--surface-2);}
  .blk-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .blk-btn .chev{
    width:13px;height:13px;flex:0 0 auto;
    color:var(--ink-faint);
    transition:transform .15s ease;
  }
  .blk.open .blk-btn .chev{transform:rotate(90deg);}
  .blk-btn .lbl{flex:1;line-height:1.3;}
  .blk-btn .cnt{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .blk-bar{height:3px;background:var(--surface-2);border-radius:99px;margin:2px 8px 6px;overflow:hidden;}
  .blk-bar>i{display:block;height:100%;background:var(--gold);}

  .blk-list{list-style:none;margin:0;padding:0 0 6px;display:none;}
  .blk.open .blk-list{display:block;}
  .tema-row{display:flex;}
  .tema-btn{
    flex:1;
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:6px 8px 6px 30px;
    background:none;
    border:none;
    text-align:left;
    color:var(--ink-soft);
    font-size:12.7px;
    line-height:1.35;
    border-radius:6px;
    cursor:pointer;
  }
  .tema-btn:hover{background:var(--surface-2);color:var(--ink);}
  .tema-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .tema-btn.active{background:var(--accent-soft);color:var(--ink);}
  .tema-btn .num{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-faint);
    flex:0 0 auto;
    padding-top:1px;
    min-width:16px;
  }
  .tema-btn.active .num{color:var(--accent);font-weight:600;}
  .tema-btn.done{color:var(--ink-faint);}
  .tema-btn.done .ttl{text-decoration:line-through;text-decoration-color:var(--border-strong);text-decoration-thickness:1px;}
  .check{
    flex:0 0 auto;
    width:15px;height:15px;
    border-radius:4px;
    border:1.5px solid var(--border-strong);
    background:var(--surface);
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .check:hover{border-color:var(--accent);}
  .check.on{background:var(--good);border-color:var(--good);}
  .check.on::after{content:"";width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(0,-1px);}
  .check:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .tema-row.hidden, .blk.filtered-out{display:none;}

  .sb-foot{
    flex:0 0 auto;
    padding:10px 16px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .theme-btn{
    background:none;border:1px solid var(--border);border-radius:7px;
    color:var(--ink-soft);
    padding:6px 10px;
    font-size:12px;
    display:flex;gap:6px;align-items:center;
    cursor:pointer;
  }
  .theme-btn:hover{background:var(--surface-2);color:var(--ink);}
  .reset-btn{
    background:none;border:none;color:var(--ink-faint);
    font-size:11px;font-family:var(--mono);
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;
  }
  .reset-btn:hover{color:var(--accent);}

  /* ============ MAIN ============ */
  .main{
    min-width:0;
    overflow-y:auto;
    position:relative;
  }
  .topbar{
    display:none;
    position:sticky;top:0;z-index:5;
    background:var(--paper);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    align-items:center;
    gap:12px;
  }
  .menu-btn{
    background:var(--surface);border:1px solid var(--border);border-radius:7px;
    width:34px;height:34px;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .topbar .tt{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}

  .reader{
    max-width:760px;
    margin:0 auto;
    padding:56px 40px 120px;
  }
  .crumb{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.05em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .crumb .sep{margin:0 6px;color:var(--border-strong);}
  .tema-head{
    display:flex;
    gap:16px;
    align-items:flex-start;
    padding-bottom:22px;
    margin-bottom:28px;
    border-bottom:2px solid var(--border);
  }
  .tema-head .num{
    font-family:var(--serif);
    font-size:44px;
    font-weight:600;
    color:var(--gold);
    line-height:1;
    flex:0 0 auto;
  }
  .tema-head h2{
    font-size:26px;
    font-weight:600;
    line-height:1.28;
    color:var(--ink);
    flex:1;
  }
  .mark-btn{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    padding:8px 14px;
    border-radius:8px;
    border:1.5px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
    white-space:nowrap;
  }
  .mark-btn:hover{border-color:var(--good);}
  .mark-btn.on{background:var(--good);border-color:var(--good);color:#f3f8f2;}
  .mark-btn .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:0 0 auto;}
  .mark-btn.on .dot{background:currentColor;}

  .prose{font-size:15.8px;}
  .prose p{margin:0 0 16px;color:var(--ink);}
  .prose strong{color:var(--ink);font-weight:600;}
  .prose strong:first-child, .prose p > strong:first-child{color:var(--accent);}
  .prose h3{font-size:15px;margin:26px 0 4px;color:var(--ink-faint);font-family:var(--sans);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .prose ul,.prose ol{margin:0 0 16px;padding-left:22px;}
  .prose li{margin-bottom:6px;}
  .prose blockquote{
    margin:0 0 16px;
    padding:2px 16px;
    border-left:3px solid var(--gold);
    color:var(--ink-soft);
    font-size:14.5px;
    background:var(--gold-soft);
    border-radius:0 6px 6px 0;
  }
  .prose blockquote p{margin:8px 0;color:var(--ink-soft);}
  .prose code{
    font-family:var(--mono);
    font-size:.86em;
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:1px 5px;
    border-radius:4px;
    color:var(--accent);
  }
  .prose .tbl-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--border);border-radius:8px;}
  .prose table{border-collapse:collapse;width:100%;font-size:13.6px;}
  .prose th,.prose td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;}
  .prose th{background:var(--surface-2);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  .prose tr:last-child td{border-bottom:none;}

  .prose .code-block{margin:0 0 20px;border-radius:9px;overflow:hidden;border:1px solid var(--border-strong);box-shadow:var(--shadow);}
  .prose .code-block pre{margin:0;overflow-x:auto;background:var(--code-bg);padding:14px 16px;}
  .prose .code-block code{
    font-family:var(--mono);
    font-size:12.6px;
    line-height:1.6;
    color:var(--code-ink);
    background:none;border:none;padding:0;
  }
  .sourceCode .kw{color:var(--code-kw);}
  .sourceCode .dt{color:var(--code-dt);}
  .sourceCode .st{color:var(--code-st);}
  .sourceCode .co{color:var(--code-co);font-style:italic;}
  .sourceCode .fu{color:var(--code-fu);}
  .sourceCode .dv,.sourceCode .bn,.sourceCode .fl{color:var(--code-dv);}
  .sourceCode .op{color:var(--code-op);}
  .sourceCode .cf{color:var(--code-kw);font-weight:600;}
  .sourceCode .va,.sourceCode .cn,.sourceCode .ot{color:var(--code-fu);}

  .nav-foot{
    display:flex;
    gap:14px;
    margin-top:40px;
    padding-top:24px;
    border-top:1px solid var(--border);
  }
  .nav-card{
    flex:1;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    cursor:pointer;
    text-align:left;
    color:var(--ink);
  }
  .nav-card:hover{border-color:var(--accent);}
  .nav-card:focus-visible{outline:2px solid var(--accent);}
  .nav-card.next{text-align:right;}
  .nav-card .lbl{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .nav-card .ttl{font-family:var(--serif);font-size:14.5px;margin-top:3px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .nav-card[disabled]{opacity:.35;cursor:default;}

  .empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:70vh;text-align:center;color:var(--ink-faint);gap:10px;padding:0 30px;
  }
  .empty .big{font-family:var(--serif);font-size:22px;color:var(--ink-soft);}

  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid var(--paper);}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .topbar{display:flex;}
    .sidebar{
      position:fixed;inset:0 25% 0 0;z-index:20;
      transform:translateX(-104%);
      transition:transform .22s ease;
      box-shadow:var(--shadow);
    }
    @media (prefers-reduced-motion:reduce){ .sidebar{transition:none;} }
    body.sb-open .sidebar{transform:translateX(0);}
    body.sb-open::after{
      content:"";position:fixed;inset:0;left:75%;background:rgba(0,0,0,.35);z-index:19;
    }
    .reader{padding:32px 20px 90px;}
    .tema-head .num{font-size:32px;}
    .tema-head h2{font-size:21px;}
  }
</style>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-brand"><span class="mark">EXP. 2026</span></div>

    <div class="sb-search">
      <input id="search" type="text" placeholder="Buscar tema…" autocomplete="off">

  <main class="main" id="main">

        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

<script id="tema-data" type="application/json">{"TAI": [{"key": "b1", "title": "Bloque I — Organización del Estado y Administración electrónica", "temas": [{"num": 1, "title": "La Constitución Española de 1978. Derechos y deberes fundamentales. Su garantía y suspensión. La Corona: funciones constitucionales del Rey.", "html": "<p><strong>Elaboración y estructura.</strong> La Constitución Española (CE) fue aprobada por las Cortes el 31 de octubre de 1978, ratificada en referéndum el 6 de diciembre de 1978 y sancionada por el Rey el 27 de diciembre de 1978, entrando en vigor el 29 de diciembre de 1978 (día de su publicación en el BOE). Consta de un Preámbulo, un Título Preliminar (arts. 1-9), diez Títulos (I a X), disposiciones adicionales, transitorias, una derogatoria y una final. El art. 1.1 define a España como un Estado social y democrático de Derecho, que propugna como valores superiores de su ordenamiento la libertad, la justicia, la igualdad y el pluralismo político. El art. 1.3 establece la Monarquía parlamentaria como forma política del Estado. La soberanía nacional reside en el pueblo español (art. 1.2).</p>\n<p><strong>Derechos y deberes fundamentales (Título I).</strong> El Título I, \"De los derechos y deberes fundamentales\", se estructura en cinco capítulos: Capítulo I (españoles y extranjeros), Capítulo II (derechos y libertades), con dos secciones — Sección 1ª \"De los derechos fundamentales y de las libertades públicas\" (arts. 15-29) y Sección 2ª \"De los derechos y deberes de los ciudadanos\" (arts. 30-38) —, Capítulo III (principios rectores de la política social y económica, arts. 39-52) y Capítulo IV (garantías de las libertades y derechos fundamentales, arts. 53-54). Entre los derechos fundamentales destacan: derecho a la vida e integridad física y moral con abolición de la pena de muerte (art. 15); libertad ideológica y religiosa (art. 16); libertad y seguridad (art. 17, con detención preventiva máxima de 72 horas); honor, intimidad y propia imagen (art. 18); libertad de residencia y circulación (art. 19); libertad de expresión e información (art. 20); reunión (art. 21); asociación (art. 22); participación política y sufragio (art. 23); tutela judicial efectiva (art. 24); legalidad penal (art. 25); educación (art. 27); sindicación y huelga (art. 28); petición (art. 29). Entre los deberes: defensa de España (art. 30), contribución al sostenimiento de los gastos públicos (art. 31).</p>\n<p><strong>Garantías.</strong> El art. 53.1 CE vincula a todos los poderes públicos a los derechos del Capítulo II, cuyo ejercicio se regula por ley que respete su contenido esencial, y solo puede desarrollarse mediante ley orgánica en el caso de los derechos de la Sección 1ª (arts. 15-29) y objeción de conciencia. El art. 53.2 habilita el recurso preferente y sumario ante los tribunales ordinarios y, en su caso, el recurso de amparo ante el Tribunal Constitucional para los derechos de los arts. 14 a 30 (incluida la igualdad del art. 14 y la objeción de conciencia del art. 30.2). Los principios rectores del Capítulo III (art. 53.3) solo son alegables ante la jurisdicción ordinaria conforme a lo que dispongan las leyes que los desarrollen.</p>\n<p><strong>Suspensión de derechos.</strong> El art. 55.1 CE permite suspender los derechos de los arts. 17 (libertad), 18.2 y 18.3 (inviolabilidad domicilio y secreto comunicaciones), 19 (circulación), 21 (reunión), 28.2 (huelga) y 37.2 (medidas conflicto colectivo) cuando se declaren el estado de excepción o de sitio (LO 4/1981). El art. 55.2 permite la suspensión individual de los derechos de los arts. 17.2 (plazo detención), 18.2 y 18.3, en relación con investigaciones de bandas armadas o terroristas, con intervención judicial y control parlamentario, sin que ello suponga suspensión genérica de garantías judiciales del art. 17.3.</p>\n<p><strong>La Corona (Título II, arts. 56-65).</strong> El Rey es Jefe del Estado, símbolo de su unidad y permanencia, arbitra y modera el funcionamiento regular de las instituciones y asume la más alta representación del Estado en las relaciones internacionales (art. 56). La Corona es hereditaria (art. 57), con preferencia del varón sobre la mujer en el mismo grado hasta la reforma pendiente. Sus actos están sujetos a refrendo (art. 64), sin el cual carecen de validez, salvo la distribución de la asignación de la Casa Real (art. 65). Funciones del Rey (art. 62): sancionar y promulgar leyes; convocar y disolver Cortes y convocar elecciones; convocar referéndum; proponer candidato a Presidente del Gobierno y nombrarlo, así como poner fin a sus funciones; nombrar y separar a los miembros del Gobierno a propuesta del Presidente; expedir decretos acordados en Consejo de Ministros; mando supremo de las Fuerzas Armadas; ejercer el derecho de gracia; Alto Patronazgo de las Reales Academias.</p>\n"}, {"num": 2, "title": "Las Cortes Generales: atribuciones del Congreso de los Diputados y del Senado. El Tribunal Constitucional: composición y atribuciones. El Defensor del Pueblo.", "html": "<p><strong>Las Cortes Generales (Título III, arts. 66-96).</strong> Representan al pueblo español, ejercen la potestad legislativa del Estado, aprueban los Presupuestos Generales del Estado, controlan la acción del Gobierno y tienen las demás competencias del art. 66 CE. Son inviolables (art. 66.3). Están formadas por el Congreso de los Diputados y el Senado (bicameralismo imperfecto).</p>\n<p><strong>Congreso de los Diputados.</strong> Entre 300 y 400 diputados (actualmente 350, LOREG), elegidos por sufragio universal, libre, igual, directo y secreto cada cuatro años, mediante circunscripción provincial y sistema proporcional (regla D'Hondt), con representación mínima inicial por provincia (art. 68 CE). Ceuta y Melilla eligen un diputado cada una. Es la cámara de representación popular, con confianza (investidura, moción de censura del art. 113, cuestión de confianza del art. 112) y control preferente sobre el Gobierno.</p>\n<p><strong>Senado.</strong> Cámara de representación territorial (art. 69), integrada por senadores elegidos por provincia (4 por provincia, 3 Mallorca/Gran Canaria/Tenerife, 1 por otras islas o agrupaciones, 1 Ceuta y 1 Melilla) y senadores designados por las Asambleas legislativas de las CCAA (uno fijo más uno por cada millón de habitantes).</p>\n<p><strong>Atribuciones diferenciadas.</strong> El Congreso tiene primacía: investidura del Presidente del Gobierno (art. 99), moción de censura y cuestión de confianza (arts. 113-114), convalidación de decretos-leyes (art. 86.2), autorización de referéndum consultivo (art. 92). El Senado interviene en el veto/enmienda de proyectos de ley (plazo de dos meses, art. 90), autoriza medidas coercitivas contra CCAA incumplidoras (art. 155) y participa en el nombramiento de miembros del TC (4) y del CGPJ (10 senadores). Ante desacuerdo entre cámaras se constituye una Comisión Mixta Congreso-Senado (art. 74). Las Cortes se reúnen en sesiones ordinarias (septiembre-diciembre y febrero-junio, art. 73) y extraordinarias.</p>\n<p><strong>El Tribunal Constitucional (Título IX, arts. 159-165 CE, LO 2/1979).</strong> Compuesto por 12 miembros nombrados por el Rey: 4 a propuesta del Congreso (mayoría 3/5), 4 a propuesta del Senado (mayoría 3/5), 2 a propuesta del Gobierno y 2 a propuesta del CGPJ. Mandato de 9 años, renovación por terceras partes cada 3 años. Deben ser juristas de reconocida competencia con más de 15 años de ejercicio profesional. El Presidente es nombrado por el Rey entre sus miembros, a propuesta del propio Tribunal, por 3 años. Atribuciones (art. 161 CE): recurso de inconstitucionalidad contra leyes y normas con rango de ley (legitimados: Presidente del Gobierno, Defensor del Pueblo, 50 diputados, 50 senadores, órganos ejecutivos y asambleas de CCAA); cuestión de inconstitucionalidad planteada por jueces; recurso de amparo por vulneración de derechos y libertades de los arts. 14 a 30 y 53.2 CE (subsidiario tras vía judicial); conflictos de competencia entre Estado y CCAA o entre CCAA; conflictos entre órganos constitucionales del Estado; control previo de tratados internacionales; impugnación de disposiciones de CCAA (art. 161.2, con efecto suspensivo automático de 5 meses).</p>\n<p><strong>El Defensor del Pueblo (art. 54 CE, LO 3/1981).</strong> Alto comisionado de las Cortes Generales para la defensa de los derechos del Título I, que supervisa la actividad de la Administración, dando cuenta a las Cortes. Elegido por mayoría de 3/5 del Congreso y ratificado por 3/5 del Senado (o subsidiariamente por mayorías absolutas), por un mandato de 5 años. Puede iniciar y proseguir de oficio o a instancia de parte cualquier investigación, sin necesidad de mandato imperativo previo. Tiene legitimación para interponer recursos de inconstitucionalidad y de amparo. Cuenta con dos adjuntos en los que puede delegar funciones. Presenta un informe anual a las Cortes Generales. Es inviolable, inamovible durante su mandato salvo causas tasadas (cese, incompatibilidad, incapacidad, actuación con notoria negligencia, fallecimiento) y goza de inmunidad.</p>\n"}, {"num": 3, "title": "El Gobierno: composición, nombramiento y cese. Las funciones del Gobierno. Relaciones entre el Gobierno y las Cortes Generales.", "html": "<p><strong>Marco normativo.</strong> El Gobierno se regula en el Título IV CE (arts. 97-107) y en la Ley 50/1997, de 27 de noviembre, del Gobierno.</p>\n<p><strong>Composición (art. 98 CE, art. 1 Ley 50/1997).</strong> El Gobierno se compone del Presidente, Vicepresidente o Vicepresidentes en su caso, Ministros y demás miembros que establezca la ley. Se estructura en Consejo de Ministros (órgano colegiado superior) y Comisiones Delegadas del Gobierno. Los miembros del Gobierno no pueden ejercer otras funciones representativas que las del mandato parlamentario, ni actividad profesional o mercantil alguna (art. 98.3), régimen desarrollado por la Ley 3/2015 de altos cargos.</p>\n<p><strong>Nombramiento.</strong> El Presidente es propuesto por el Rey, previa consulta con los representantes designados por los grupos políticos con representación parlamentaria, y a través del Presidente del Congreso (art. 99 CE). El candidato expone su programa ante el Congreso y solicita la confianza: mayoría absoluta en primera votación; si no la obtiene, mayoría simple 48 horas después. Si transcurridos dos meses desde la primera votación ningún candidato obtiene la confianza, el Rey disuelve las Cortes y convoca nuevas elecciones (art. 99.5). Los demás miembros del Gobierno son nombrados y separados por el Rey a propuesta del Presidente (art. 100).</p>\n<p><strong>Cese.</strong> El Gobierno cesa (art. 101 CE) tras la celebración de elecciones generales, por pérdida de la confianza parlamentaria (moción de censura no prosperada a la inversa, o cuestión de confianza denegada) o por dimisión o fallecimiento del Presidente. El Gobierno cesante continúa en funciones hasta la toma de posesión del nuevo Gobierno, con funciones limitadas (art. 21 Ley 50/1997): despacho ordinario, sin poder plantear cuestión de confianza, disolver Cortes, ni aprobar proyectos de ley salvo urgencia justificada.</p>\n<p><strong>Funciones del Gobierno (art. 97 CE).</strong> Dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado; ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes. El art. 5 de la Ley 50/1997 detalla las funciones del Consejo de Ministros: aprobar proyectos de ley y el proyecto de Ley de Presupuestos; aprobar reales decretos-leyes y decretos legislativos; acordar la negociación de tratados internacionales; declarar los estados de alarma y excepción y proponer al Congreso el de sitio; nombrar y separar altos cargos; ejercer la potestad reglamentaria mediante Real Decreto.</p>\n<p><strong>Relaciones con las Cortes Generales (Título V, arts. 108-116 CE).</strong> El Gobierno responde solidariamente de su gestión política ante el Congreso (art. 108). Instrumentos de control: preguntas e interpelaciones parlamentarias, comisiones de investigación, solicitudes de información y comparecencias (art. 109-110). La moción de censura (art. 113) debe ser propuesta por al menos 1/10 de los diputados, incluir un candidato alternativo (moción \"constructiva\"), y aprobarse por mayoría absoluta; transcurridos 5 días desde su presentación sin votarse pueden presentarse mociones alternativas. La cuestión de confianza (art. 112) la plantea el Presidente, previa deliberación del Consejo de Ministros, sobre su programa o una declaración de política general, y se entiende otorgada por mayoría simple. El Presidente, previa deliberación del Consejo de Ministros y bajo su exclusiva responsabilidad, puede proponer al Rey la disolución de las Cortes (art. 115), con el límite de no poder hacerlo antes de un año desde la anterior disolución ni durante la tramitación de una moción de censura. Los estados de alarma, excepción y sitio se regulan en el art. 116 y en la LO 4/1981: el de alarma lo declara el Gobierno por 15 días (prórroga requiere autorización del Congreso); el de excepción lo declara el Gobierno previa autorización del Congreso; el de sitio lo declara el Congreso por mayoría absoluta a propuesta exclusiva del Gobierno.</p>\n"}, {"num": 4, "title": "TREBEP, transparencia y Agenda 2030", "html": "<p><strong>Texto Refundido del Estatuto Básico del Empleo Público (TREBEP, RDLeg 5/2015).</strong> Regula las bases del régimen estatutario de los funcionarios públicos y los principios del personal laboral al servicio de las Administraciones Públicas.</p>\n<p><strong>Derechos y deberes (Título III).</strong> El art. 14 TREBEP enumera derechos individuales: inamovilidad, progresión profesional, percepción de retribuciones, conciliación, no discriminación, libertad de expresión, negociación colectiva, etc. El art. 15 reconoce derechos individuales ejercidos colectivamente (libertad sindical, huelga, negociación colectiva). El Capítulo XIV (arts. 52-54) fija los deberes y el Código de Conducta: principios éticos (objetividad, integridad, neutralidad, respeto a la igualdad, imparcialidad) y principios de conducta (diligencia, cuidado en el trato, honestidad).</p>\n<p><strong>Formas de provisión de puestos (arts. 78-84).</strong> Concurso (procedimiento normal, valora méritos mediante baremo) y libre designación (con convocatoria pública, para puestos de especial responsabilidad); también redistribución de efectivos, atribución temporal de funciones, comisión de servicios, movilidad por motivos de salud o rehabilitación, permuta y reingreso al servicio activo.</p>\n<p><strong>Promoción interna y carrera profesional (arts. 16-20 y 72-79).</strong> La carrera profesional puede ser horizontal (progresión de grado, categoría o escalón sin cambiar de puesto) o vertical (ascenso en la estructura de puestos). La promoción interna vertical exige poseer los requisitos para el Subgrupo/Grupo superior, antigüedad de dos años en el inferior y superar el proceso selectivo; la promoción interna horizontal exige progresar entre Subgrupos de un mismo Grupo.</p>\n<p><strong>Situaciones administrativas (arts. 85-92).</strong> Servicio activo, servicios especiales, servicio en otras Administraciones Públicas, excedencia (voluntaria por interés particular, por agrupación familiar, por cuidado de familiares, por violencia de género o terrorismo, voluntaria incentivada), suspensión de funciones.</p>\n<p><strong>Incompatibilidades.</strong> Se rigen supletoriamente por la Ley 53/1984, de 26 de diciembre, de incompatibilidades del personal al servicio de las Administraciones Públicas: régimen de incompatibilidad de un solo puesto de trabajo en el sector público, salvo autorización de compatibilidad para segunda actividad pública (docencia, investigación) o privada, siempre que no supere el 15% de las retribuciones ni menoscabe el cumplimiento de las obligaciones.</p>\n<p><strong>Régimen disciplinario (arts. 93-98 TREBEP).</strong> Las faltas se clasifican en muy graves, graves y leves. Las faltas muy graves (art. 95) incluyen: incumplimiento del deber de respeto a la Constitución, toda actuación discriminatoria, abandono del servicio, publicación de secretos, incumplimiento de normas de incompatibilidades, acoso. Las sanciones incluyen separación del servicio, suspensión firme de funciones, traslado con cambio de residencia, demérito y apercibimiento.</p>\n<p><strong>Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno.</strong> Se estructura en tres títulos: publicidad activa (Título I: información institucional, organizativa, de planificación, económica, presupuestaria y estadística que deben publicar los sujetos obligados en sus sedes electrónicas o Portal de Transparencia), derecho de acceso a la información pública (Título II: cualquier persona puede solicitar acceso, con plazo de resolución de un mes, prorrogable otro mes, silencio negativo, límites del art. 14 —seguridad nacional, defensa, relaciones exteriores, etc.— y protección de datos del art. 15) y buen gobierno (Título III: principios éticos y de actuación de altos cargos, régimen sancionador). Crea el Consejo de Transparencia y Buen Gobierno, que resuelve reclamaciones potestativas previas a la vía contencioso-administrativa en el plazo de tres meses.</p>\n<p><strong>Agenda 2030 y ODS.</strong> Aprobada por la Asamblea General de la ONU en septiembre de 2015 (\"Transformar nuestro mundo\"), establece 17 Objetivos de Desarrollo Sostenible y 169 metas, con horizonte 2030, articulados en torno a las 5P: Personas, Planeta, Prosperidad, Paz y Alianzas (Partnership). España aprobó el Plan de Acción para su implementación (2018) y cuenta con una Estrategia de Desarrollo Sostenible; el órgano de coordinación es el Alto Comisionado para la Agenda 2030 (adscrito a Presidencia del Gobierno) y el Consejo de Desarrollo Sostenible.</p>\n"}, {"num": 5, "title": "Políticas de igualdad y contra la violencia de género. Igualdad de trato y no discriminación LGTBI. Discapacidad y dependencia.", "html": "<p><strong>Igualdad de género.</strong> La LO 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, tiene por objeto hacer efectivo el principio de igualdad de trato y no discriminación por razón de sexo (art. 1), regulando la transversalidad de género en las políticas públicas, la acción positiva, los planes de igualdad en las empresas (obligatorios según plantilla, desarrollados por el RD 901/2020) y la presencia equilibrada en órganos directivos (representación mínima del 40%).</p>\n<p><strong>Violencia de género.</strong> La LO 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género, define esta violencia como manifestación de discriminación, situación de desigualdad y relaciones de poder de los hombres sobre las mujeres, ejercida por quienes sean o hayan sido cónyuges o parejas afectivas. Crea los Juzgados de Violencia sobre la Mujer (competencia civil y penal), la orden de protección integral (art. 62 y ss., con medidas cautelares penales y civiles simultáneas), el derecho a la asistencia social integral, a la asistencia jurídica gratuita inmediata y especializada, derechos laborales (reducción/reordenación de jornada, movilidad geográfica, suspensión con reserva de puesto, extinción con derecho a desempleo) y económicos (ayuda del art. 27). Se crea la Delegación del Gobierno contra la Violencia de Género y el Observatorio Estatal de Violencia sobre la Mujer.</p>\n<p><strong>Igualdad de trato y no discriminación.</strong> La Ley 15/2022, de 12 de julio, integral para la igualdad de trato y la no discriminación, prohíbe la discriminación por origen, sexo, orientación e identidad sexual, edad, discapacidad, enfermedad, religión, etc., regula la inversión de la carga de la prueba y crea la Autoridad Independiente para la Igualdad de Trato y la No Discriminación.</p>\n<p><strong>LGTBI.</strong> La Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI, reconoce el derecho a la rectificación registral de la mención de sexo mediante simple manifestación de la persona solicitante (mayores de 16 años, con régimen especial para 14-16 y para menores de 12-14), prohíbe las llamadas \"terapias de conversión\" y regula medidas contra la discriminación en los ámbitos laboral, educativo, sanitario y deportivo.</p>\n<p><strong>Discapacidad.</strong> El Real Decreto Legislativo 1/2013, de 29 de noviembre, aprueba el Texto Refundido de la Ley General de derechos de las personas con discapacidad y de su inclusión social, que desarrolla los principios de la Convención de la ONU de 2006 (ratificada por España en 2007): vida independiente, no discriminación, accesibilidad universal, diseño para todos, diálogo civil. Regula el CERMI como plataforma de representación, y establece la cuota de reserva de empleo del 2% en empresas de 50 o más trabajadores (7% en el sector público, art. 59 TREBEP) y el 6% para personas con discapacidad en las ofertas de empleo público, con posibilidad de adaptación de tiempos y medios en los procesos selectivos.</p>\n<p><strong>Dependencia.</strong> La Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, crea el Sistema para la Autonomía y Atención a la Dependencia (SAAD), configurando tres grados de dependencia (I moderada, II severa, III gran dependencia), reconocidos mediante resolución tras solicitud, valoración según el Baremo de Valoración de la Dependencia (BVD) y elaboración de un Programa Individual de Atención (PIA) que determina las prestaciones (servicios de prevención, teleasistencia, ayuda a domicilio, centros de día, residencial, o prestaciones económicas vinculadas al servicio, de cuidados en el entorno familiar o de asistencia personal).</p>\n"}, {"num": 6, "title": "La sociedad de la información. Identidad y firma electrónica. El DNI electrónico. La Agenda Digital para España.", "html": "<p><strong>La sociedad de la información.</strong> Concepto que designa el modelo social basado en las TIC como motor de generación, tratamiento y transmisión de información, regulado en España básicamente por la Ley 34/2002, de 11 de julio, de Servicios de la Sociedad de la Información y de Comercio Electrónico (LSSI-CE), transposición de la Directiva 2000/31/CE, que regula el régimen de los prestadores de servicios (obligación de información general, art. 10), las comunicaciones comerciales electrónicas (prohibición de correo no solicitado sin consentimiento previo, art. 21, salvo relación contractual previa), y la responsabilidad de los prestadores de servicios de intermediación.</p>\n<p><strong>Identidad y firma electrónica.</strong> El Reglamento (UE) n.º 910/2014 (Reglamento eIDAS) establece el marco europeo para la identificación electrónica y los servicios de confianza (firma, sello, sello de tiempo, entrega electrónica certificada, autenticación web) en el mercado interior, reconociendo eficacia jurídica transfronteriza a los medios de identificación electrónica notificados. En España se desarrolla mediante la Ley 6/2020, de 11 de noviembre, reguladora de determinados aspectos de los servicios electrónicos de confianza, que deroga la anterior Ley 59/2003 de firma electrónica. Distingue tres niveles de firma electrónica: simple (datos en forma electrónica asociados a otros datos), avanzada (vinculada al firmante de manera única, permite su identificación, creada con medios bajo su control exclusivo y detecta cualquier modificación posterior) y cualificada (firma avanzada basada en un certificado cualificado y creada mediante dispositivo cualificado de creación de firma), esta última equiparada a la firma manuscrita. Los prestadores cualificados de servicios de confianza están sujetos a supervisión del Ministerio para la Transformación Digital, que gestiona la \"Lista de confianza\" (TSL).</p>\n<p><strong>El DNI electrónico (DNIe).</strong> Regulado por el RD 1553/2005 y modificado por normativa posterior, es el documento que acredita electrónicamente la identidad personal de su titular y permite firmar electrónicamente documentos, incorporando un chip criptográfico con certificados electrónicos de autenticación y de firma, expedido por la Dirección General de la Policía. Desde 2021 se emite el DNIe 4.0, con comunicación NFC (sin necesidad de lector con contacto) y App DNIe para autenticación mediante dispositivo móvil. Su vigencia general es de 10 años para mayores de 30 años, 5 años entre 5 y 30 años, y 2 años para menores de 5 años.</p>\n<p><strong>La Agenda Digital para España.</strong> Aprobada en febrero de 2013 (Consejo de Ministros de 15 de febrero de 2013), fue el marco de referencia para el desarrollo de la economía y sociedad digital, alineado con la Agenda Digital para Europa 2020, articulada en seis grandes objetivos: fomentar el despliegue de redes de banda ancha, desarrollar la economía digital, mejorar la e-Administración, reforzar la confianza en el ámbito digital, impulsar el sistema de I+D+i en TIC y fomentar la inclusión y alfabetización digital. Ha sido sucedida por la Agenda España Digital 2025 y posteriormente por España Digital 2026, que despliegan planes específicos (Plan de Conectividad, Plan de Competencias Digitales, Plan de Digitalización de las Administraciones Públicas, Carta de Derechos Digitales de 2021) coordinados por la Secretaría de Estado de Digitalización e Inteligencia Artificial.</p>\n"}, {"num": 7, "title": "La protección de datos personales y su régimen jurídico. Derechos digitales.", "html": "<p><strong>Marco normativo.</strong> El régimen se articula sobre el Reglamento (UE) 2016/679, General de Protección de Datos (RGPD), de aplicación directa desde el 25 de mayo de 2018, y la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales (LOPDGDD), que lo desarrolla y completa en lo no armonizado.</p>\n<p><strong>Principios (art. 5 RGPD).</strong> Licitud, lealtad y transparencia; limitación de la finalidad; minimización de datos; exactitud; limitación del plazo de conservación; integridad y confidencialidad; y responsabilidad proactiva (accountability), por la cual el responsable debe poder demostrar el cumplimiento. Las bases de licitud del tratamiento (art. 6 RGPD) incluyen: consentimiento del interesado, ejecución de un contrato, cumplimiento de obligación legal, protección de intereses vitales, cumplimiento de misión de interés público o ejercicio de poderes públicos (base habitual para las Administraciones), e interés legítimo del responsable.</p>\n<p><strong>Derechos de los interesados (arts. 15-22 RGPD, desarrollados en Título III LOPDGDD).</strong> Derecho de acceso (art. 15), rectificación (art. 16), supresión o \"derecho al olvido\" (art. 17), limitación del tratamiento (art. 18), portabilidad (art. 20), oposición (art. 21) y a no ser objeto de decisiones basadas únicamente en tratamiento automatizado, incluida la elaboración de perfiles (art. 22). El plazo general de respuesta es de un mes, prorrogable dos meses más en casos complejos (art. 12.3 RGPD).</p>\n<p><strong>Obligaciones del responsable y encargado.</strong> Registro de actividades de tratamiento (art. 30), evaluación de impacto relativa a la protección de datos cuando el tratamiento entrañe alto riesgo (art. 35), designación de Delegado de Protección de Datos —DPO— obligatoria para autoridades y organismos públicos (art. 37.1.a RGPD y art. 34 LOPDGDD), notificación de violaciones de seguridad a la autoridad de control en el plazo de 72 horas (art. 33) y, en su caso, a los interesados (art. 34), privacidad desde el diseño y por defecto (art. 25).</p>\n<p><strong>Régimen sancionador.</strong> El RGPD distingue infracciones sancionables hasta 10 millones de euros o el 2% del volumen de negocio (art. 83.4) y hasta 20 millones o el 4% (art. 83.5, para vulneraciones de principios básicos, derechos de los interesados o transferencias internacionales). La LOPDGDD (arts. 70-76) tipifica las infracciones como muy graves, graves y leves, con plazos de prescripción de 3, 2 y 1 año respectivamente. La autoridad de control estatal es la Agencia Española de Protección de Datos (AEPD), organismo público independiente adscrito al Ministerio de Justicia a efectos presupuestarios pero con plena independencia funcional.</p>\n<p><strong>Derechos digitales (Título X LOPDGDD, arts. 79-97).</strong> Reconoce, entre otros: derecho a la neutralidad de Internet (art. 80), derecho al acceso universal (art. 81), derecho a la seguridad digital (art. 82), derecho a la educación digital (art. 83), protección de menores en Internet (art. 84), derecho a la desconexión digital en el ámbito laboral (art. 88), derecho a la intimidad frente a dispositivos de videovigilancia y grabación de sonidos en el lugar de trabajo (art. 89), derecho a la intimidad ante sistemas de geolocalización (art. 90), derecho al olvido en búsquedas de internet y en redes sociales (arts. 93-94), y derecho al testamento digital (art. 96), que permite designar a un albacea digital para instrucciones sobre el destino de los datos y contenidos tras el fallecimiento.</p>\n"}, {"num": 8, "title": "Acceso electrónico a los servicios públicos. Gestión electrónica de procedimientos. ENS y ENI.", "html": "<p><strong>Marco normativo.</strong> La Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP) y la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público (LRJSP), sustituyeron a la Ley 11/2007, de acceso electrónico de los ciudadanos a los servicios públicos, consagrando el principio de que la tramitación electrónica es la actuación habitual de las Administraciones. Las disposiciones sobre Administración electrónica de la LPACAP entraron en vigor a los dos años de su publicación (2 de octubre de 2018). El desarrollo reglamentario común es el RD 203/2021, de 30 de marzo, por el que se aprueba el Reglamento de actuación y funcionamiento del sector público por medios electrónicos.</p>\n<p><strong>Registros (arts. 16 LPACAP).</strong> Cada Administración dispone de un Registro Electrónico General (o registros electrónicos de cada organismo, plenamente interoperables), que permite presentar documentos todos los días del año durante las 24 horas, emitiendo automáticamente un recibo acreditativo con número de registro, fecha y hora de presentación (con validez de justificante) según el art. 16.3. Se admite el registro presencial en oficinas de asistencia, con digitalización y remisión al registro electrónico; y el Registro Electrónico de Apoderamientos (art. 6).</p>\n<p><strong>Notificaciones (arts. 40-46 LPACAP).</strong> Las notificaciones se practican preferentemente por medios electrónicos, siendo obligatorias por esta vía para las personas jurídicas, entidades sin personalidad, quienes ejerzan actividad profesional colegiada y empleados públicos en actuaciones derivadas de su condición (art. 14.2). Se entienden practicadas en el momento en que se produzca el acceso a su contenido, o transcurridos 10 días naturales desde su puesta a disposición sin haber accedido (rechazo tácito, art. 43). Se realizan a través de la Dirección Electrónica Habilitada única (DEHú) o mediante comparecencia en sede electrónica.</p>\n<p><strong>Uso de medios electrónicos por los interesados (arts. 9-14 LPACAP).</strong> Sistemas de identificación admitidos: certificado electrónico cualificado, sistemas de clave concertada (Cl@ve) y otros sistemas que las Administraciones consideren válidos. El art. 14 fija los sujetos obligados a relacionarse electrónicamente: personas jurídicas, entidades sin personalidad jurídica, quienes ejerzan actividad profesional que requiera colegiación obligatoria, empleados públicos en trámites derivados de su condición, y representantes de un interesado obligado.</p>\n<p><strong>Esquema Nacional de Seguridad (ENS).</strong> Regulado por el Real Decreto 311/2022, de 3 de mayo (que deroga el RD 3/2010), tiene por objeto establecer los principios y requisitos de una política de seguridad en la utilización de medios electrónicos, aplicable a todo el sector público. Establece categorías de sistemas (básica, media, alta) según los criterios de valoración de las dimensiones de seguridad —disponibilidad, autenticidad, integridad, confidencialidad y trazabilidad (conocidas como DAIC+T)—, un conjunto de medidas de seguridad organizadas en marco organizativo, operacional y de protección (Anexo II), auditorías periódicas (cada dos años, o anual en sistemas de categoría alta) y la declaración y certificación de conformidad. El órgano de coordinación es el CCN-CERT (Centro Criptológico Nacional).</p>\n<p><strong>Esquema Nacional de Interoperabilidad (ENI) y Normas Técnicas de Interoperabilidad (NTI).</strong> Aprobado por Real Decreto 4/2010, de 8 de enero, establece los criterios y recomendaciones de seguridad, normalización y conservación de la información, formatos y aplicaciones que las Administraciones deben tener en cuenta para garantizar el ejercicio de derechos y el cumplimiento de deberes por medios electrónicos, en cuatro dimensiones: organizativa, semántica, técnica y temporal. Se desarrolla mediante Normas Técnicas de Interoperabilidad (NTI), aprobadas por resolución de la Secretaría de Estado, que regulan aspectos concretos como el documento electrónico, el expediente electrónico, la digitalización, el catálogo de estándares, la política de firma y sello electrónicos, o el modelo de datos para el intercambio de asientos entre entidades registrales.</p>\n"}, {"num": 9, "title": "Instrumentos para el acceso electrónico. Sedes electrónicas. Infraestructuras y servicios comunes.", "html": "<p><strong>Sedes electrónicas (art. 38 LRJSP, desarrollado por el RD 203/2021).</strong> Se define sede electrónica como la dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones, cuya titularidad, gestión y administración corresponde a una Administración Pública, órgano o entidad administrativa en el ejercicio de sus competencias. Su creación se acuerda mediante resolución u orden publicada en el diario oficial correspondiente. Debe garantizar la identificación del titular, así como la integridad, veracidad y actualización de la información y servicios. Existe también la sede electrónica asociada (para organismos sin sede propia, que se integran en la de un ministerio u organismo). El art. 39 regula el punto de acceso general electrónico de la Administración General del Estado, que actúa como portal de acceso, informativo y transaccional (accesible en administracion.gob.es).</p>\n<p><strong>Canales y puntos de acceso.</strong> La normativa admite el acceso multicanal: canal electrónico (sedes, apps móviles, punto de acceso general), canal presencial (oficinas de asistencia en materia de registros, OAR) y canal telefónico. El RD 203/2021 regula las sedes electrónicas, las sedes asociadas y los canales de acceso a los servicios, así como el Punto de Acceso General de la AGE y los puntos de acceso electrónico de cada organismo.</p>\n<p><strong>Identificación y autenticación.</strong> Se distingue entre identificación (arts. 9 LPACAP) y firma (art. 10 LPACAP) de los interesados, y entre identificación y autenticación de las sedes electrónicas y de las Administraciones actuantes (arts. 40-42 LRJSP, sello electrónico de Administración Pública, órgano, organismo público o entidad de derecho público, y actuación administrativa automatizada). Sistemas de identificación de los interesados admitidos: certificados electrónicos cualificados de firma o de sello, sistemas de clave concertada u otro sistema que las Administraciones consideren válido, siendo el más extendido el sistema Cl@ve (Cl@ve PIN, Cl@ve Permanente y Cl@ve firma), gestionado conjuntamente por la Secretaría de Estado de Digitalización e IA y el Ministerio de Hacienda a través de la Dirección General de la Policía y el Instituto Nacional de Estadística. Para las actuaciones administrativas automatizadas se emplean sistemas de código seguro de verificación (CSV, art. 42.b LRJSP), sello electrónico basado en certificado, o firma del personal al servicio de la Administración (art. 43 LRJSP).</p>\n<p><strong>Infraestructuras y servicios comunes de administración electrónica.</strong> El Ministerio para la Transformación Digital y de la Función Pública, a través de la Secretaría General de Administración Digital (SGAD), presta servicios horizontales compartidos por toda la AGE, entre los que destacan: Cl@ve (identificación y firma), Dirección Electrónica Habilitada única (DEHú, para notificaciones electrónicas), Sistema de Interconexión de Registros (SIR), plataforma de intermediación de datos (PID, que evita aportar documentos ya obrantes en la Administración conforme al art. 28.2 LPACAP), Notific@ (gestión de notificaciones), @Firma (plataforma de validación y verificación de firma electrónica), ARCHIVE (archivo electrónico único), Carpeta Ciudadana (punto único de acceso al estado de trámites del ciudadano con cualquier Administración) e INSIDE (gestor de expedientes electrónicos). Estas infraestructuras comunes, reutilizables por todas las Administraciones conforme al principio de interoperabilidad y cooperación (art. 157 LRJSP), evitan duplicidades y reducen cargas para el ciudadano, materializando el principio de \"solo una vez\" (once-only) y la interoperabilidad entre Administraciones recogida en el ENI.</p>\n"}]}, {"key": "b2", "title": "Bloque II — Tecnología básica", "temas": [{"num": 1, "title": "Informática básica. Representación y comunicación de la información: elementos constitutivos de un sistema de información. Características y funciones. Arquitectura de ordenadores. Componentes internos de los equipos microinformáticos.", "html": "<h3 id=\"representación-de-la-información\">Representación de la información</h3>\n<p>Los sistemas digitales representan cualquier tipo de información mediante dígitos binarios (bits), agrupados en bytes (8 bits). La codificación numérica emplea sistemas posicionales: binario (base 2), octal (base 8) y hexadecimal (base 16), este último muy utilizado para representar direcciones de memoria y valores de color por su correspondencia directa con grupos de 4 bits (nibbles). Para números con signo se emplea habitualmente el complemento a 2, que permite realizar restas mediante sumas y evita la ambigüedad del cero con signo. Los números reales se representan en coma flotante según el estándar IEEE 754, que distingue signo, exponente y mantisa, en precisión simple (32 bits) o doble (64 bits).</p>\n<p>La representación de caracteres ha evolucionado desde ASCII (7 bits, 128 caracteres) hasta Unicode, que asigna un punto de código único a cada carácter de cualquier alfabeto; su codificación más extendida en transmisión y almacenamiento es UTF-8, de longitud variable y compatible con ASCII.</p>\n<h3 id=\"elementos-constitutivos-de-un-sistema-de-información\">Elementos constitutivos de un sistema de información</h3>\n<p>Un sistema de información se compone de: hardware (soporte físico), software (programas de sistema y de aplicación), datos, procedimientos y personas. Sus funciones básicas son entrada, proceso, almacenamiento, salida y comunicación de la información, articuladas para dar soporte a los procesos de una organización, garantizando integridad, disponibilidad y confidencialidad.</p>\n<h3 id=\"arquitectura-de-von-neumann\">Arquitectura de Von Neumann</h3>\n<p>La mayoría de los ordenadores actuales siguen el modelo de Von Neumann, caracterizado por almacenar programa y datos en la misma memoria y ejecutar instrucciones secuencialmente mediante el ciclo de instrucción: captación (fetch), decodificación (decode), ejecución (execute) y, en su caso, escritura del resultado. Este modelo presenta la limitación conocida como \"cuello de botella de Von Neumann\", pues la CPU y la memoria comparten un único bus, limitando el paralelismo. Frente a ella, la arquitectura Harvard emplea memorias y buses separados para instrucciones y datos, habitual en microcontroladores y DSP.</p>\n<h3 id=\"buses-del-sistema\">Buses del sistema</h3>\n<p>El bus es el conjunto de líneas físicas que permiten la comunicación entre componentes. Se distinguen tres tipos funcionales: bus de direcciones (unidireccional, indica la posición de memoria o dispositivo a acceder), bus de datos (bidireccional, transporta la información) y bus de control (señales de sincronización, lectura/escritura, interrupciones). A nivel de expansión, los sistemas actuales usan buses serie de alta velocidad como PCI Express, sustituyendo a los antiguos buses paralelos ISA y PCI.</p>\n<h3 id=\"componentes-internos-de-los-equipos-microinformáticos\">Componentes internos de los equipos microinformáticos</h3>\n<p><strong>CPU (unidad central de proceso):</strong> integra la ALU (unidad aritmético-lógica), la unidad de control y los registros. Los procesadores actuales incorporan varios núcleos, memoria caché (L1, L2, L3) y técnicas de segmentación (pipelining) y ejecución fuera de orden para mejorar el rendimiento.</p>\n<p><strong>Memoria principal:</strong> la RAM (volátil) almacena programas y datos en ejecución; predominan los módulos DDR (Double Data Rate) SDRAM. La ROM y sus variantes (EEPROM, memoria flash) almacenan el firmware, incluida la BIOS/UEFI, encargada del arranque (POST) y la inicialización del hardware.</p>\n<p><strong>Placa base:</strong> integra el chipset (puentes norte y sur o su equivalente unificado en procesadores modernos), los zócalos de CPU y memoria, y los conectores de expansión y almacenamiento (SATA, M.2/NVMe).</p>\n<p><strong>Fuente de alimentación:</strong> convierte corriente alterna en las tensiones continuas requeridas por los componentes (norma ATX).</p>\n<p><strong>Jerarquía de memoria:</strong> se organiza en niveles según velocidad y coste: registros, caché, memoria principal, memoria secundaria (SSD/HDD) y almacenamiento externo, aplicando el principio de localidad temporal y espacial para optimizar el acceso.</p>\n"}, {"num": 2, "title": "Periféricos: conectividad y administración. Elementos de impresión. Elementos de almacenamiento. Elementos de visualización y digitalización.", "html": "<h3 id=\"concepto-y-clasificación-de-periféricos\">Concepto y clasificación de periféricos</h3>\n<p>Los periféricos son dispositivos que permiten la comunicación entre el ordenador y el exterior. Se clasifican en periféricos de entrada (teclado, ratón, escáner), de salida (monitor, impresora), de entrada/salida (pantallas táctiles, módems) y de almacenamiento (discos, unidades flash).</p>\n<h3 id=\"conectividad\">Conectividad</h3>\n<p>La conexión de periféricos se realiza mediante interfaces estandarizadas. USB (Universal Serial Bus) es la más extendida, con versiones que evolucionan en velocidad (USB 2.0 hasta 480 Mbps, USB 3.x por encima de 5 Gbps, USB4 convergiendo con Thunderbolt) y en conector físico (Tipo A, Tipo C, reversible y con capacidad de suministro de energía mediante USB Power Delivery). Para almacenamiento interno se emplean SATA (Serial ATA) y, con mayor ancho de banda, NVMe sobre bus PCIe. En el ámbito inalámbrico destacan Bluetooth (comunicación de corto alcance entre dispositivos personales) y Wi-Fi (conectividad de red local). Para vídeo se usan HDMI y DisplayPort, que integran audio y vídeo digital, sustituyendo a interfaces analógicas como VGA.</p>\n<p>La administración de periféricos en el sistema operativo se realiza mediante controladores (drivers), programas que traducen las órdenes genéricas del sistema a las instrucciones específicas del dispositivo. El sistema Plug and Play permite la detección y configuración automática, y el gestor de dispositivos (Windows) o los subsistemas udev/sysfs (Linux) permiten consultar el estado, actualizar drivers y resolver conflictos de recursos (IRQ, direcciones de E/S).</p>\n<h3 id=\"elementos-de-impresión\">Elementos de impresión</h3>\n<p>Las impresoras se clasifican según su tecnología: de inyección de tinta (proyectan gotas mediante cabezales térmicos o piezoeléctricos, adecuadas para color y bajo volumen), láser (emplean un tambor fotosensible cargado electrostáticamente que fija el tóner mediante calor y presión, con mayor velocidad y coste por copia inferior en grandes volúmenes) y matriciales o de impacto (aún usadas para impresión multicopia). Las impresoras 3D, por adición de material capa a capa (FDM, SLA), constituyen una categoría creciente. Los lenguajes de descripción de página como PostScript o PCL, y el protocolo IPP (Internet Printing Protocol), gestionan la comunicación entre el sistema y el dispositivo en entornos de red.</p>\n<h3 id=\"elementos-de-almacenamiento\">Elementos de almacenamiento</h3>\n<p>Se distingue entre almacenamiento magnético (discos duros HDD, con platos giratorios y cabezales de lectura/escritura), óptico (CD, DVD, Blu-ray, que codifican información mediante variaciones reflectantes leídas por láser) y de estado sólido (SSD, basado en memoria flash NAND, sin partes móviles, con mayor velocidad de acceso aleatorio y menor latencia). Los parámetros técnicos relevantes incluyen capacidad, tiempo de acceso, velocidad de transferencia y tasa de fallos (MTBF). Para configuraciones redundantes se emplean sistemas RAID (0, 1, 5, 6, 10), que combinan discos para mejorar rendimiento, tolerancia a fallos o ambos.</p>\n<h3 id=\"elementos-de-visualización-y-digitalización\">Elementos de visualización y digitalización</h3>\n<p>Los monitores actuales utilizan mayoritariamente tecnología LCD/LED, con variantes IPS (mejor fidelidad de color y ángulo de visión) y OLED (píxeles autoemisivos, mayor contraste). Los parámetros clave son resolución, tasa de refresco, tiempo de respuesta y relación de aspecto. En digitalización, los escáneres (de sobremesa, de rodillo o de mano) capturan imágenes mediante sensores CCD o CIS, convirtiendo la señal analógica en una matriz de píxeles digital, cuya calidad depende de la resolución (ppp) y la profundidad de color. Las cámaras de documentos y los sistemas OCR (reconocimiento óptico de caracteres) complementan la digitalización, transformando imágenes de texto en texto editable, funcionalidad clave en la gestión documental de la Administración.</p>\n"}, {"num": 3, "title": "Tipos abstractos y Estructuras de datos. Organizaciones de ficheros. Algoritmos. Formatos de información y ficheros.", "html": "<h3 id=\"tipos-abstractos-de-datos-tad\">Tipos abstractos de datos (TAD)</h3>\n<p>Un tipo abstracto de datos define un conjunto de valores y las operaciones aplicables sobre ellos, independientemente de su implementación concreta. Esta separación entre interfaz y representación interna constituye la base de la abstracción y el encapsulamiento en programación. Ejemplos clásicos de TAD son pila, cola, lista, conjunto y diccionario (o mapa clave-valor).</p>\n<h3 id=\"estructuras-de-datos-lineales\">Estructuras de datos lineales</h3>\n<p><strong>Pila (stack):</strong> estructura LIFO (Last In, First Out) con operaciones push (inserción) y pop (extracción) restringidas a un extremo. Se emplea en la gestión de llamadas a funciones (pila de ejecución), evaluación de expresiones y algoritmos de recorrido en profundidad.</p>\n<p><strong>Cola (queue):</strong> estructura FIFO (First In, First Out), con inserción por un extremo (encolar) y extracción por el opuesto (desencolar). Variantes destacadas son la cola de prioridad, donde cada elemento se extrae según un valor de prioridad asociado, y la cola circular, que reutiliza el espacio del array de forma eficiente.</p>\n<p><strong>Listas enlazadas:</strong> secuencias de nodos donde cada uno contiene un dato y un puntero al siguiente (y, en listas doblemente enlazadas, al anterior). Frente a los arrays, permiten inserción y borrado en tiempo constante sin desplazamiento de elementos, a costa de un acceso secuencial (no indexado directo).</p>\n<h3 id=\"estructuras-de-datos-no-lineales\">Estructuras de datos no lineales</h3>\n<p><strong>Árboles:</strong> estructuras jerárquicas compuestas por nodos y aristas, con un nodo raíz y ausencia de ciclos. El árbol binario de búsqueda (ABB) mantiene la propiedad de que el subárbol izquierdo contiene valores menores y el derecho valores mayores, permitiendo búsquedas en tiempo logarítmico en el caso medio; los árboles equilibrados (AVL, rojo-negro) garantizan esta complejidad en el peor caso mediante rebalanceo. Los árboles B y B+ son ampliamente usados en índices de bases de datos y sistemas de ficheros por optimizar el acceso a almacenamiento secundario.</p>\n<p><strong>Grafos:</strong> conjuntos de vértices y aristas (dirigidas o no, con o sin peso) que modelan relaciones complejas, recorridos en anchura (BFS) y en profundidad (DFS), y problemas de camino mínimo (algoritmo de Dijkstra).</p>\n<p><strong>Tablas hash:</strong> estructuras que aplican una función hash para mapear claves a posiciones de un array, ofreciendo acceso en tiempo medio constante; requieren estrategias de resolución de colisiones (encadenamiento o direccionamiento abierto).</p>\n<h3 id=\"organización-de-ficheros\">Organización de ficheros</h3>\n<p>La organización secuencial almacena los registros en orden físico consecutivo, adecuada para procesamiento por lotes. La organización indexada mantiene una estructura auxiliar (habitualmente un árbol B+) que relaciona claves con posiciones físicas, permitiendo acceso directo eficiente. La organización directa o relativa (hash) calcula la dirección física a partir de la clave mediante una función de dispersión. La organización indexada-secuencial (ISAM) combina ambos enfoques, permitiendo tanto recorrido ordenado como acceso directo.</p>\n<h3 id=\"algoritmos-y-complejidad\">Algoritmos y complejidad</h3>\n<p>Un algoritmo es una secuencia finita y no ambigua de pasos que resuelve un problema. Su eficiencia se mide mediante la notación asintótica O(n), que expresa el crecimiento del tiempo o espacio en función del tamaño de la entrada. Los algoritmos de ordenación clásicos presentan complejidades características: burbuja e inserción O(n²); mientras que quicksort y mergesort alcanzan O(n log n) en el caso medio. La búsqueda binaria sobre datos ordenados requiere O(log n) frente a la búsqueda lineal O(n).</p>\n<h3 id=\"formatos-de-información-y-ficheros\">Formatos de información y ficheros</h3>\n<p>Los formatos de texto estructurado como XML, JSON y YAML permiten el intercambio de información entre sistemas heterogéneos, con distinto grado de verbosidad y capacidad de tipado. Los formatos binarios (imágenes, audio, vídeo, documentos ofimáticos) incluyen cabeceras con metadatos y, frecuentemente, compresión, que puede ser sin pérdida (ZIP, PNG) o con pérdida (JPEG, MP3), en función del compromiso entre tamaño y fidelidad admisible.</p>\n"}, {"num": 4, "title": "Sistemas operativos. Características y elementos constitutivos. Sistemas Windows. Sistemas Unix y Linux. Sistemas operativos para dispositivos móviles.", "html": "<h3 id=\"concepto-y-funciones-del-sistema-operativo\">Concepto y funciones del sistema operativo</h3>\n<p>El sistema operativo es el software que gestiona los recursos hardware y ofrece una interfaz uniforme a las aplicaciones y al usuario. Sus funciones principales son la gestión de procesos, de memoria, del sistema de archivos, de dispositivos de entrada/salida y la seguridad, además de actuar como máquina virtual que abstrae la complejidad del hardware subyacente.</p>\n<h3 id=\"gestión-de-procesos\">Gestión de procesos</h3>\n<p>Un proceso es un programa en ejecución, con su propio espacio de direcciones, estado y recursos asignados. Puede encontrarse en estados de nuevo, preparado, en ejecución, bloqueado o terminado, transiciones gestionadas por el planificador (scheduler). Los hilos (threads) son unidades de ejecución dentro de un proceso que comparten memoria, permitiendo concurrencia con menor sobrecarga que procesos independientes. Los algoritmos de planificación (round-robin, prioridades, colas multinivel) determinan el orden de acceso a la CPU, buscando equilibrio entre tiempo de respuesta y rendimiento global.</p>\n<h3 id=\"gestión-de-memoria\">Gestión de memoria</h3>\n<p>Los sistemas actuales emplean memoria virtual, que independiza el espacio de direcciones lógico del físico mediante paginación (división en bloques de tamaño fijo, páginas y marcos) o segmentación (bloques de tamaño variable con significado lógico). La MMU (unidad de gestión de memoria) traduce direcciones virtuales a físicas con ayuda de la tabla de páginas y el buffer TLB. Cuando la memoria física es insuficiente, se recurre al intercambio (swapping) con el área de paginación en disco.</p>\n<h3 id=\"sistemas-de-archivos\">Sistemas de archivos</h3>\n<p>El sistema de archivos organiza el almacenamiento persistente en una estructura jerárquica de directorios y ficheros, gestionando metadatos (permisos, fechas, propietario) e implementando mecanismos de asignación de espacio (contigua, enlazada o indexada) y de recuperación ante fallos mediante journaling, que registra las operaciones antes de aplicarlas para garantizar la consistencia.</p>\n<h3 id=\"sistemas-windows\">Sistemas Windows</h3>\n<p>Windows es un sistema operativo propietario de Microsoft con arquitectura híbrida (núcleo con componentes en espacio de kernel y de usuario). Su sistema de archivos principal es NTFS, que soporta permisos ACL, compresión, cifrado (EFS) y journaling. La gestión de usuarios y equipos en entornos corporativos se realiza mediante Active Directory, que centraliza autenticación (Kerberos) y políticas de grupo (GPO). El registro de Windows almacena la configuración del sistema y las aplicaciones en una base de datos jerárquica.</p>\n<h3 id=\"sistemas-unix-y-linux\">Sistemas Unix y Linux</h3>\n<p>Unix, desarrollado en los años setenta, estableció principios como \"todo es un fichero\", la composición de utilidades simples mediante tuberías (pipes) y un sistema de permisos basado en propietario, grupo y otros (rwx). Linux es un núcleo de código abierto inspirado en Unix, sobre el que se construyen distribuciones (Debian, Red Hat, Ubuntu) que integran gestores de paquetes (APT, DNF/YUM), sistemas de ficheros como ext4, XFS o Btrfs, y el sistema de inicio systemd, que gestiona servicios y dependencias de arranque. La administración remota se realiza habitualmente mediante SSH, y la shell (bash u otras) permite la automatización mediante scripts.</p>\n<h3 id=\"sistemas-operativos-para-dispositivos-móviles\">Sistemas operativos para dispositivos móviles</h3>\n<p>Android, basado en el núcleo Linux, emplea la máquina virtual ART para ejecutar aplicaciones y organiza los componentes en actividades, servicios y proveedores de contenido, con un modelo de permisos granular y ciclo de vida de aplicación gestionado por el propio sistema para optimizar batería y memoria. iOS, de Apple, se basa en un núcleo derivado de Unix (Darwin/XNU) y aplica un modelo de aislamiento estricto entre aplicaciones (sandboxing), distribución controlada mediante App Store y una gestión de memoria sin recolector de basura tradicional, basada en conteo automático de referencias (ARC). Ambos sistemas comparten características frente a los de escritorio: mayor restricción de recursos, gestión activa del consumo energético y modelos de permisos orientados a la privacidad del usuario.</p>\n"}, {"num": 5, "title": "Sistemas de gestión de bases de datos relacionales, orientados a objetos y NoSQL: características y componentes.", "html": "<h3 id=\"concepto-y-componentes-de-un-sgbd\">Concepto y componentes de un SGBD</h3>\n<p>Un sistema de gestión de bases de datos (SGBD) es el software que permite definir, crear, mantener y controlar el acceso a una base de datos. Sus componentes principales son el motor de almacenamiento, el procesador de consultas (parser, optimizador y ejecutor), el gestor de transacciones, el catálogo o diccionario de datos (metadatos) y los módulos de seguridad y control de concurrencia. Ofrece independencia entre los datos y las aplicaciones que los utilizan, evitando la redundancia y garantizando su integridad.</p>\n<h3 id=\"modelo-relacional\">Modelo relacional</h3>\n<p>Propuesto por E.F. Codd, organiza los datos en relaciones (tablas), formadas por tuplas (filas) y atributos (columnas), cada uno definido sobre un dominio de valores válidos. La integridad se garantiza mediante claves primarias (identificación única de cada tupla), claves ajenas (referencias entre tablas) y restricciones de dominio. El proceso de normalización, a través de las formas normales (1FN, 2FN, 3FN, entre otras), elimina redundancias y anomalías de actualización, inserción y borrado, descomponiendo las relaciones según las dependencias funcionales existentes entre atributos. El lenguaje estándar de manipulación y definición es SQL, con sentencias DDL (CREATE, ALTER), DML (SELECT, INSERT, UPDATE, DELETE) y DCL (GRANT, REVOKE).</p>\n<h3 id=\"propiedades-acid\">Propiedades ACID</h3>\n<p>Las transacciones en un SGBD relacional cumplen las propiedades ACID: Atomicidad (una transacción se ejecuta completa o no se ejecuta), Consistencia (las restricciones de integridad se mantienen antes y después), Aislamiento (las transacciones concurrentes no interfieren entre sí, con distintos niveles como read committed o serializable) y Durabilidad (los cambios confirmados persisten ante fallos, típicamente mediante un log de transacciones). Ejemplos de SGBD relacionales son Oracle, SQL Server, PostgreSQL y MySQL.</p>\n<h3 id=\"modelo-orientado-a-objetos\">Modelo orientado a objetos</h3>\n<p>Los SGBD orientados a objetos almacenan directamente objetos, con su estado (atributos) y comportamiento (métodos), soportando herencia, encapsulamiento y polimorfismo, evitando el desajuste de impedancia (impedance mismatch) que se produce al mapear objetos de un lenguaje de programación a tablas relacionales. Existe también el enfoque objeto-relacional, que extiende el modelo relacional con tipos de datos complejos, herencia de tablas y métodos almacenados, adoptado parcialmente por motores como PostgreSQL u Oracle.</p>\n<h3 id=\"bases-de-datos-nosql\">Bases de datos NoSQL</h3>\n<p>Surgen para dar respuesta a requisitos de escalabilidad horizontal, esquemas flexibles y grandes volúmenes de datos no necesariamente estructurados (Big Data), habitualmente relajando las garantías ACID a favor del modelo BASE (Basically Available, Soft state, Eventually consistent), que prioriza la disponibilidad y la consistencia eventual frente a la consistencia inmediata, conforme describe el teorema CAP (Consistencia, Disponibilidad y tolerancia a Particiones), según el cual un sistema distribuido solo puede garantizar plenamente dos de esas tres propiedades simultáneamente.</p>\n<p>Se distinguen cuatro categorías principales:</p>\n<p><strong>Clave-valor:</strong> la estructura más simple, almacena pares identificador-valor sin esquema fijo, con acceso muy eficiente por clave (Redis, DynamoDB), habitual en caché y sesiones.</p>\n<p><strong>Documentales:</strong> almacenan documentos semiestructurados, típicamente en formato JSON o BSON, permitiendo estructuras anidadas y esquemas variables entre documentos de una misma colección (MongoDB, CouchDB).</p>\n<p><strong>Orientadas a columnas (columnares):</strong> organizan los datos por familias de columnas en lugar de por filas, optimizando la lectura de grandes volúmenes analíticos y la escalabilidad distribuida (Cassandra, HBase).</p>\n<p><strong>De grafos:</strong> modelan explícitamente entidades (nodos) y sus relaciones (aristas), optimizadas para consultas de recorrido y de relaciones complejas, como redes sociales o sistemas de recomendación (Neo4j).</p>\n<h3 id=\"consideraciones-de-selección\">Consideraciones de selección</h3>\n<p>La elección entre modelo relacional y NoSQL depende de los requisitos del sistema: el modelo relacional resulta idóneo cuando se requiere integridad transaccional estricta y relaciones complejas bien definidas, mientras que las soluciones NoSQL se orientan a escenarios de alta escalabilidad horizontal, esquemas cambiantes o grandes volúmenes de datos semiestructurados, siendo frecuente en arquitecturas actuales la coexistencia de ambos paradigmas (polyglot persistence) según la naturaleza de cada componente del sistema de información.</p>\n"}]}, {"key": "b3", "title": "Bloque III — Desarrollo de sistemas", "temas": [{"num": 1, "title": "Modelado de datos, metodologías y reglas. Entidades, atributos y relaciones. Diseño de bases de datos. Diseño lógico y físico. El modelo lógico relacional. Normalización.", "html": "<p>El modelado de datos es el proceso de representar la información de un dominio de forma abstracta para su posterior implementación en un sistema de bases de datos. Se desarrolla habitualmente en tres niveles: <strong>conceptual</strong>, <strong>lógico</strong> y <strong>físico</strong>.</p>\n<p><strong>Nivel conceptual.</strong> Se emplea el modelo Entidad-Relación (E/R) de Chen, ampliado posteriormente con notación Peter Chen o Crow's Foot. Sus elementos básicos son:</p>\n<ul>\n<li><strong>Entidad</strong>: objeto del mundo real con existencia independiente (EMPLEADO, DEPARTAMENTO).</li>\n<li><strong>Atributo</strong>: propiedad de una entidad (simple, compuesto, monovaluado, multivaluado, derivado).</li>\n<li><strong>Relación</strong>: asociación entre entidades, con cardinalidad (1:1, 1:N, N:M) y grado (binaria, ternaria).</li>\n<li><strong>Clave primaria</strong>: atributo o conjunto de atributos que identifica de forma única cada instancia.</li>\n</ul>\n<p><strong>Diseño lógico.</strong> Se transforma el modelo E/R en un e
